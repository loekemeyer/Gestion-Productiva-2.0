<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<script src="../auth-guard.js?v=20261006b"></script>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Informe Rendimiento x Persona (GP2)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260929a"></script>
<script src="../gp2-ui.js?v=20260930a"></script>
<script src="../gp2-numero.js?v=20260911o"></script>
<link rel="stylesheet" href="../gp2-modulo.css?v=20261008ds">
<style>
  /* Sistema de diseño v2 (gp2-modulo.css). Misma estructura que informe_matriz_GP2.html:
     barra · filtros (.toolbar con .field) · estado · KPIs · tabla (.table-wrap.fix1 > table.t). */
  .toolbar{margin-top:0}
  #result table.t :is(th,td){text-align:center}
  #result table.t th{vertical-align:middle}
  #result table.t td.l{text-align:left}
  #result table.t td.r{text-align:right}
  #result table.t td.b{font-weight:700}
  /* table.t td fija el color de la celda: el verde/rojo del puntaje se repone aca */
  #result table.t td.pos{color:var(--ok)}
  #result table.t td.neg{color:var(--err)}
  #result table.t td:is(.pos,.neg):not(.b){font-weight:inherit}
  .fuente{margin-top:var(--s3)}
</style>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Rendimiento x Persona<small>Informe &middot; puntaje, tiempos y tiempo muerto por empleado</small></h1>
    <div class="hbtns">
      <a href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">
    <div class="toolbar">
      <div class="field"><label for="desde">Desde</label><input type="date" id="desde" value="2026-07-01" /></div>
      <div class="field"><label for="hasta">Hasta</label><input type="date" id="hasta" value="2026-07-31" /></div>
      <button class="btn btn-primary" type="button" id="btn">Generar</button>
    </div>

    <div id="status" class="status"></div>
    <div id="kpis" class="kpis"></div>
    <div id="result"></div>
    <p class="sub fuente">Schema GP2 &middot; RPC <code>informes_bundle(desde,hasta)</code> &middot; agregado desde <code>"GP2".v_produccion_todas</code> (GP2 + Registro Producción 3.0)</p>
  </div>
</div>

<script>
"use strict";
// MIGRADO a schema GP2: los datos salen del RPC "GP2".informes_bundle(p_desde,p_hasta),
// que agrega "GP2".produccion server-side (evita traer 14k filas al front).
// No existe tabla Empleados en GP2: nombre/legajo vienen embebidos en produccion.nombre_empleado.
var SB = GP2_SB();

var $status = document.getElementById('status');
var $result = document.getElementById('result');
var $btn = document.getElementById('btn');
var $kpis = document.getElementById('kpis');

/* ===== Helpers (portados del informes.js viejo) ===== */
function n(v){ var x = Number(v); return Number.isFinite(x) ? x : 0; }
function f(v, d){ return GP2N.fmt(v, d || 0); }   /* la regla de numero de la casa (gp2-numero.js) */
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function hs(seg){ return f(seg / 3600, 1); }          // segundos -> horas
function dias85(seg){ return f(seg / 30600, 1); }      // jornada de 8.5 h
function pct(segT, segH){ return segH > 0 ? f((-(segT / segH - 1)) * 100, 0) + '%' : '-'; }
function ptje(segT, segH){ return segH > 0 ? f((-(segT / segH - 1)) * 10, 1) : '-'; }
function ptjeNum(segT, segH){ return segH > 0 ? (-(segT / segH - 1)) * 10 : 0; }
function sueldoPremio(segT, segH){ var p = ptjeNum(segT, segH); return f(((((p * 10) + 100) - 100) / 2) / 100, 2); }
function cls(v){ return n(v) > 0 ? 'pos' : (n(v) < 0 ? 'neg' : ''); }

/* ===== Render (equivalente a renderPersona del modulo viejo) ===== */
function renderPersona(personas){
  if(!personas.length){ $result.innerHTML = '<div class="empty">No se encontraron registros en el rango.</div>'; return; }

  // Recolectar codigos de Tiempo Muerto (pivot dinamico)
  var tmCodes = {};
  personas.forEach(function(g){ Object.keys(g.tm || {}).forEach(function(k){ tmCodes[k] = 1; }); });
  var tmSorted = Object.keys(tmCodes).sort();

  var html = ''
    + '<h2 class="sec-h title">Rendimiento x Persona</h2>'
    + '<div class="table-wrap fix1 scroll">'
    + '<table class="t">'
    + '<thead><tr>'
    + '<th rowspan="2">Leg</th><th rowspan="2">Empleado</th>'
    + '<th colspan="2">Puntaje</th>'
    + '<th colspan="2">Segundos</th>'
    + tmSorted.map(function(c){ return '<th rowspan="2">' + esc(c) + '</th>'; }).join('')
    + '<th rowspan="2">Seg<br>Anul</th>'
    + '<th rowspan="2">%<br>Puntaje</th>'
    + '<th rowspan="2">Dias</th>'
    + '<th rowspan="2">Horas</th>'
    + '<th rowspan="2">Rot<br>Mat</th>'
    + '</tr><tr><th>Ptos</th><th>%</th><th>Trab</th><th>Prom</th></tr></thead>'
    + '<tbody>';

  personas.forEach(function(g){
    var segTrab = n(g.segTrab), segHist = n(g.segHist);
    var p = ptjeNum(segTrab, segHist);
    var segAnul = n(g.segAnulados), segTotal = n(g.segTotal), rot = n(g.roturas);
    html += '<tr>'
      + '<td class="b">' + esc(g.legajo) + '</td>'
      + '<td class="l">' + esc(g.nombre) + '</td>'
      + '<td class="b ' + cls(p) + '">' + ptje(segTrab, segHist) + '</td>'
      + '<td class="' + cls(p) + '">' + pct(segTrab, segHist) + '</td>'
      + '<td class="r">' + (segTrab > 0 ? f(segTrab) : '-') + '</td>'
      + '<td class="r">' + (segHist > 0 ? f(segHist) : '-') + '</td>'
      + tmSorted.map(function(c){ var s = n((g.tm || {})[c]); return '<td class="r">' + (s > 0 ? hs(s) : '') + '</td>'; }).join('')
      + '<td class="r">' + (segAnul > 0 ? f(segAnul) : '') + '</td>'
      + '<td>' + (segHist > 0 ? sueldoPremio(segTrab, segHist) : '-') + '</td>'
      + '<td class="r">' + (segTotal > 0 ? dias85(segTotal) : '-') + '</td>'
      + '<td class="r">' + (segTotal > 0 ? hs(segTotal) : '-') + '</td>'
      + '<td>' + (rot || '') + '</td>'
      + '</tr>';
  });

  html += '</tbody></table></div>';
  $result.innerHTML = html;
}

/* ===== KPIs (los mismos tres que el informe x matriz: cuantos, cuantos, horas) ===== */
function renderKpis(personas){
  var seg = 0, rot = 0;
  personas.forEach(function(g){ seg += n(g.segTotal); rot += n(g.roturas); });
  $kpis.innerHTML =
      '<div class="kpi pri"><span class="k">Personas</span><span class="v">' + f(personas.length) + '</span></div>'
    + '<div class="kpi"><span class="k">Roturas de matriz</span><span class="v">' + f(rot) + '</span></div>'
    + '<div class="kpi"><span class="k">Horas (total)</span><span class="v">' + hs(seg) + '</span></div>';
}

/* ===== Carga via RPC ===== */
async function __run(){
  var desde = document.getElementById('desde').value || null;
  var hasta = document.getElementById('hasta').value || null;
  $btn.disabled = true;
  $status.className = 'status';
  $status.textContent = 'Cargando...';
  $result.innerHTML = '';
  $kpis.innerHTML = '';
  try {
    var r = await SB.rpc('informes_bundle', { p_desde: desde, p_hasta: hasta });
    if (r.error) throw r.error;
    var personas = (r.data && r.data.personas) || [];
    renderPersona(personas);
    renderKpis(personas);
    $status.textContent = personas.length + ' persona(s) · ' + (desde || 'inicio') + ' a ' + (hasta || 'fin');
  } catch (e) {
    $status.className = 'status err';
    $status.textContent = 'Error: ' + (e.message || e);
    console.error(e);
  } finally {
    $btn.disabled = false;
  }
}

$btn.addEventListener('click', __run);

async function __boot(){ __run(); }
__boot();
</script>
<script src="../gp2-menu.js?v=20261008ds"></script>
<script src="../gp2-nav.js?v=20261008ds"></script>
</body>
</html>
