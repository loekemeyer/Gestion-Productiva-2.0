<!doctype html>
<html lang="es">
<head>
<!-- v1.0.1 — Monitor 2.0: ultimos cajones cerrados del dia con premio + alertas <=-3 / >=3 -->
<meta charset="utf-8"/>
<script src="../auth-guard.js?v=20261006b"></script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cierres del Día · Premios · GP2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260929a"></script>
<script src="../gp2-ui.js?v=20260930a"></script>
<script src="../gp2-numero.js?v=20260911o"></script>
<link rel="stylesheet" href="../gp2-modulo.css?v=20261009ds"/>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
<style>
  /* Solo layout propio: barra, campos, botones, tabla y avisos son gp2-modulo.css. */
  .live{display:inline-flex;align-items:center;gap:6px}
  .live-dot{display:inline-block;width:9px;height:9px;background:var(--err-600);border-radius:50%;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .alertas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 var(--s3)}
  .aviso .tit{font-weight:750;font-size:var(--fs-base);margin-bottom:6px}
  .aviso .item{display:inline-block;background:var(--surface);border:1px solid currentColor;border-radius:var(--r-sm);padding:2px 9px;margin:2px 4px 2px 0;font-weight:600;font-size:var(--fs-sm)}
  .aviso.err .item b{color:var(--err-700)}
  .aviso.ok .item b{color:var(--ok-700)}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Cierres del Día · Premios <small class="live"><span class="live-dot"></span><span id="liveTxt"></span></small></h1>
    <div class="hbtns">
      <a href="monitor_GP2.html">Monitor en Vivo</a>
      <a class="back" href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">
    <div class="toolbar">
      <div class="field"><label for="fDia">Día</label><input type="date" id="fDia"></div>
      <button type="button" class="btn btn-primary push" id="btnRef">↻ Refrescar</button>
      <button type="button" class="btn btn-secondary" id="btnAuto">Auto: ON</button>
    </div>

    <div id="alertas" class="alertas"></div>

    <div class="table-wrap"><table class="t">
      <thead><tr><th>Hora</th><th>Legajo</th><th>Operario</th><th>Matriz</th><th>Descripción</th>
        <th class="num">Uni</th><th class="num">Premio</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <div id="tblEmpty" class="empty hidden">Sin cajones cerrados ese día.</div>
    <div id="status" class="status">Cargando…</div>
  </div>
</div>

<script>
var SB = GP2_SB();
var $ = GP2UI.$;
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function fmt(n,d){ return GP2N.fmt(n, d==null?0:d, '—', true); }   /* decimales fijos; '—' sin valor */
var hoyAR = GP2UI.hoyAR;   /* helper de la casa, gp2-ui.js (2026-09-05): era una copia identica */
function horaAR(iso){
  try{ return new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso)); }
  catch(e){ return ''; }
}

var timer=null, auto=true;

// premio: el que trae la fila (espejo) o calculado como el vecino:
// (-(tiempo_toma / tiempo_historico) + 1) * 10
function premioDe(p){
  if(p.premio!=null && p.premio!=='') return Number(p.premio);
  var tt=Number(p.tiempo_toma), th=Number(p.tiempo_historico);
  if(tt>0 && th>0) return Math.round(((-(tt/th)+1)*10)*100)/100;
  return null;
}

async function cargar(){
  var dia=$('fDia').value||hoyAR();
  var r=await SB.from('v_produccion_todas')   /* GP2 + Registro Produccion 3.0 (2026-10-08) */
    .select('legajo,nombre_empleado,matriz_raw,nombre_matriz,uni,fecha,premio,tiempo_toma,tiempo_historico,eliminar')
    .gte('fecha', dia+'T00:00:00-03:00')
    .lte('fecha', dia+'T23:59:59-03:00')
    .gt('uni', 0)
    .order('fecha',{ascending:false})
    .limit(2000);
  if(r.error){ $('status').textContent='Error: '+r.error.message; return; }
  var filas=(r.data||[]).filter(function(p){ return String(p.eliminar||'').toUpperCase()!=='S'; });

  var malos=[], buenos=[];
  filas.forEach(function(p){
    var pr=premioDe(p);
    p._premio=pr;
    if(pr==null) return;
    var item={ nombre:p.nombre_empleado||p.legajo, matriz:p.matriz_raw, premio:pr };
    if(pr<=-3) malos.push(item);
    else if(pr>=3) buenos.push(item);
  });

  $('alertas').innerHTML=
    (malos.length?('<div class="aviso err"><div class="tit">⚠ Cajones con puntaje ≤ -3 ('+malos.length+')</div>'+
      malos.map(function(b){ return '<span class="item">'+esc(b.nombre)+' · M'+esc(b.matriz)+' <b>'+b.premio.toFixed(1)+'</b></span>'; }).join('')+'</div>'):'')+
    (buenos.length?('<div class="aviso ok"><div class="tit">⭐ Cajones con puntaje ≥ 3 ('+buenos.length+')</div>'+
      buenos.map(function(b){ return '<span class="item">'+esc(b.nombre)+' · M'+esc(b.matriz)+' <b>+'+b.premio.toFixed(1)+'</b></span>'; }).join('')+'</div>'):'');

  $('tbody').innerHTML=filas.slice(0,100).map(function(p){
    var pr=p._premio, cell='—';
    if(pr!=null) cell='<span class="'+(pr>=0?'pos':'neg')+'">'+fmt(pr,1)+'</span>';
    return '<tr><td>'+horaAR(p.fecha)+'</td><td>'+esc(p.legajo)+'</td><td>'+esc(p.nombre_empleado||'')+'</td>'+
      '<td class="cod">'+esc(p.matriz_raw||'—')+'</td><td>'+esc(p.nombre_matriz||'')+'</td>'+
      '<td class="num">'+fmt(p.uni)+'</td><td class="num">'+cell+'</td></tr>';
  }).join('');
  $('tblEmpty').classList.toggle('hidden', filas.length>0);
  $('status').textContent=filas.length+' cajones cerrados';
  $('liveTxt').textContent='actualizado '+horaAR(new Date().toISOString());
}

function setAuto(on){
  auto=on;
  $('btnAuto').textContent='Auto: '+(on?'ON':'OFF');
  if(timer){ clearInterval(timer); timer=null; }
  if(on) timer=setInterval(cargar, 30000);
}

$('btnRef').addEventListener('click', cargar);
$('btnAuto').addEventListener('click', function(){ setAuto(!auto); });
$('fDia').addEventListener('change', cargar);
$('fDia').value=hoyAR();
cargar();
setAuto(true);
</script>
</body>
</html>
