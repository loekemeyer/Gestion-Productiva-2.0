<!DOCTYPE html>
<html lang="es">
<head>
  <script src="../auth-guard.js?v=20261006b"></script>
<script src="../gp2-ui.js?v=20260930a"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maestro Produccion (GP2)</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260929a"></script>
  <link rel="icon" type="image/png" href="../GP2_favicon.png">
  <link rel="apple-touch-icon" href="../GP2_favicon.png">
  <link rel="stylesheet" href="../gp2-modulo.css?v=20261009ds">
  <style>
    /* Solo layout propio: barra, campos, botones, KPIs y tabla son gp2-modulo.css. */
    .toolbar { align-items: flex-end; }
    .toolbar select { min-width: 180px; max-width: 280px; }
    .t td, .t th { white-space: nowrap; }
    .t td { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    .t tbody tr { cursor: pointer; }
    .t td.col-uni-c { font-weight: 700; }
    .table-wrap > .t > tbody > tr.tm-row > td { background: var(--warn-50); }
    .table-wrap > .t > tbody > tr.tm-row:hover > td { background: var(--warn-200); }

    /* detalle (el sistema no trae modal: se arma con sus tokens) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { width: 480px; max-width: 100%; max-height: calc(100dvh - 32px); overflow: auto; box-shadow: var(--sh-2); }
    .modal-box .panel-head .x { margin-left: auto; min-width: var(--touch); }
    .modal-body { padding: 14px 16px; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: var(--fs-td); }
    .modal-body .k { color: var(--ink-500); font-weight: 600; }
    .modal-body .v { color: var(--ink-900); word-break: break-word; font-variant-numeric: tabular-nums; }
    @media (max-width: 640px) {
      .toolbar .field, .toolbar select { flex: 1 1 100%; max-width: none; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Maestro Producción <small>solo lectura</small></h1>
    <div class="hbtns">
      <a class="back" href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">
    <div class="toolbar">
      <div class="field">
        <label for="selOperario">Operario</label>
        <select id="selOperario"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="fechaDesde">Fecha desde</label>
        <input type="date" id="fechaDesde" />
      </div>
      <div class="field">
        <label for="fechaHasta">Fecha hasta</label>
        <input type="date" id="fechaHasta" />
      </div>
      <div class="field">
        <label for="selMatriz">Matriz</label>
        <select id="selMatriz"><option value="">Todas</option></select>
      </div>
      <div class="field">
        <label for="selTM">Tiempo muerto</label>
        <select id="selTM"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="selOrden">Orden</label>
        <select id="selOrden">
          <option value="desc">Mas nuevo primero</option>
          <option value="asc">Mas viejo primero</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnBuscar">Buscar</button>
    </div>

    <div class="kpis" id="rowCount"></div>
    <div class="table-wrap">
      <table class="t">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Legajo</th>
            <th>Operario</th>
            <th>Matriz</th>
            <th>Nombre Matriz</th>
            <th class="num">Uni</th>
            <th>Hora Inicio</th>
            <th>Hora Fin</th>
            <th class="num">Seg. Trabajados</th>
            <th class="num">Seg. TM</th>
            <th class="num">Puntaje</th>
            <th class="num">T. Toma</th>
            <th class="num">T. Historico</th>
          </tr>
        </thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
    <div id="loadingMsg" class="empty hidden">Cargando...</div>
    <div id="emptyMsg" class="empty hidden">Sin resultados</div>
  </div>
</div>

  <div class="modal-overlay hidden" id="detailModal">
    <div class="modal-box panel">
      <div class="panel-head"><span id="detailTitle">Detalle</span><button class="btn btn-ghost btn-icon x" id="detailClose" aria-label="Cerrar">&times;</button></div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // MIGRADO a schema GP2. Todo sale del RPC "GP2".produccion_maestro_bundle(desde, hasta),
  // espejo de la produccion vieja en "GP2".produccion. SOLO LECTURA (sin edicion/carga).
  var sb = GP2_SB();

  // Codigos de Tiempo Muerto (uni=0). El codigo se guarda en matriz_raw.
  var TM_DESC = {
    PB: 'Pare Bano', BC: 'Busque Cajon', MOV: 'Movimiento', LIMP: 'Limpieza',
    Perm: 'Permiso', AL: 'Ayuda Logistica', PR: 'Pare Carga Rollo', PC: 'Pare Comida',
    CM: 'Cambiar Matriz', 'MOV P': 'Movimiento Piedra', RD: 'Rollo Fleje Doblado',
    PM: 'Pare Matriz', RM: 'Rotura Matriz', REM: 'Reparando Matriz',
    LT: 'Limpieza Terminal', Ausencia: 'Ausencia'
  };
  var TM_OPTS = ['PB','BC','MOV','LIMP','Perm','AL','PR','PC','CM','MOV P','RD','PM','RM','REM','LT','Ausencia'];
  var TM_SET = {}; TM_OPTS.forEach(function (c) { TM_SET[c.toUpperCase()] = true; });

  var empleadosMap = {};   // legajo -> nombre
  var currentRows = [];

  var selOperario = document.getElementById('selOperario');
  var fechaDesde  = document.getElementById('fechaDesde');
  var fechaHasta  = document.getElementById('fechaHasta');
  var selMatriz   = document.getElementById('selMatriz');
  var selTM       = document.getElementById('selTM');
  var selOrden    = document.getElementById('selOrden');
  var btnBuscar   = document.getElementById('btnBuscar');
  var tBody       = document.getElementById('tBody');
  var rowCount    = document.getElementById('rowCount');
  var loadingMsg  = document.getElementById('loadingMsg');
  var emptyMsg    = document.getElementById('emptyMsg');
  var detailModal = document.getElementById('detailModal');
  var detailTitle = document.getElementById('detailTitle');
  var detailBody  = document.getElementById('detailBody');

  var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
  function num(v) { return (v == null || v === '' || isNaN(Number(v))) ? '' : Number(v); }
  function fmt(v) { var n = num(v); return n === '' ? '' : n.toFixed(2); }
  function isTM(r) { return Number(r.uni || 0) === 0 || TM_SET[String(r.matriz || '').toUpperCase()]; }
  function fmtDia(r) {
    if (!r.fecha) return '';
    var p = String(r.fecha).substring(0, 10).split('-');
    if (p.length < 3) return String(r.fecha);
    return p[2] + '-' + p[1] + '-' + (p[0] || '').substring(2);
  }

  // ---------- INIT ----------
  (function init() {
    var today = new Date();
    var iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    fechaDesde.value = iso;
    fechaHasta.value = iso;

    TM_OPTS.forEach(function (code) {
      var opt = document.createElement('option');
      opt.value = code;
      opt.textContent = code + ' - ' + (TM_DESC[code] || '');
      selTM.appendChild(opt);
    });

    btnBuscar.addEventListener('click', buscar);
    detailModal.addEventListener('click', function (e) { if (e.target === detailModal) closeDetail(); });
    document.getElementById('detailClose').addEventListener('click', closeDetail);

    buscar();
  })();

  // ---------- SEARCH ----------
  function buscar() {
    tBody.innerHTML = '';
    rowCount.textContent = '';
    emptyMsg.classList.add('hidden');
    loadingMsg.classList.remove('hidden');
    btnBuscar.disabled = true;

    var desde = fechaDesde.value || null;
    var hasta = fechaHasta.value || null;

    sb.rpc('produccion_maestro_bundle', { p_desde: desde, p_hasta: hasta })
      .then(function (res) {
        loadingMsg.classList.add('hidden');
        btnBuscar.disabled = false;
        if (res.error) { alert('Error: ' + res.error.message); return; }
        var bundle = res.data || {};

        // poblar filtros la primera vez (matrices + operarios)
        var emp = bundle.empleados || {};
        if (!Object.keys(empleadosMap).length && Object.keys(emp).length) {
          empleadosMap = emp;
          buildOperarioSelect(emp);
          buildMatrizSelect(bundle.matrices || []);
        }

        currentRows = (bundle.rows || []).slice();
        applyFiltersAndRender();
      });
  }

  function buildOperarioSelect(emp) {
    var legajos = Object.keys(emp).sort(function (a, b) {
      var na = parseInt(String(a).replace(/\D/g, ''), 10), nb = parseInt(String(b).replace(/\D/g, ''), 10);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      return String(a).localeCompare(String(b), 'es');
    });
    legajos.forEach(function (leg) {
      var opt = document.createElement('option');
      opt.value = leg;
      opt.textContent = leg + ' - ' + (emp[leg] || '');
      selOperario.appendChild(opt);
    });
  }

  function buildMatrizSelect(matrices) {
    matrices.slice().sort(function (a, b) {
      var an = String(a.n_matriz), bn = String(b.n_matriz);
      var ax = an.match(/^(\d+)(.*)$/), bx = bn.match(/^(\d+)(.*)$/);
      if (ax && bx) {
        var na = parseInt(ax[1], 10), nb = parseInt(bx[1], 10);
        if (na !== nb) return na - nb;
        return ax[2].localeCompare(bx[2], 'es');
      }
      return an.localeCompare(bn, 'es');
    }).forEach(function (m) {
      var opt = document.createElement('option');
      opt.value = m.n_matriz;
      opt.textContent = m.n_matriz + (m.nombre ? ' - ' + m.nombre : '');
      selMatriz.appendChild(opt);
    });
  }

  // Filtros que no dependen de la fecha se aplican en cliente sobre lo traido por el RPC.
  function applyFiltersAndRender() {
    var op = selOperario.value;
    var mat = selMatriz.value;
    var tm = selTM.value;
    var asc = selOrden.value === 'asc';

    var rows = currentRows.filter(function (r) {
      if (op && String(r.legajo) !== String(op)) return false;
      if (mat && String(r.matriz) !== String(mat)) return false;
      if (tm && String(r.matriz || '').toUpperCase() !== String(tm).toUpperCase()) return false;
      return true;
    });

    rows.sort(function (a, b) {
      var ka = String(a.fecha || '') + (a.hora_inicio || '');
      var kb = String(b.fecha || '') + (b.hora_inicio || '');
      return asc ? ka.localeCompare(kb) : kb.localeCompare(ka);
    });

    renderTable(rows);
  }

  function renderTable(rows) {
    tBody.innerHTML = '';
    window.__lastRendered = rows;
    if (!rows.length) {
      emptyMsg.classList.remove('hidden');
      rowCount.textContent = '';
      return;
    }
    emptyMsg.classList.add('hidden');

    var cajones = 0, sumUni = 0, tms = 0;
    rows.forEach(function (r) {
      if (isTM(r)) { tms++; }
      else { cajones++; sumUni += Number(r.uni || 0); }
    });
    rowCount.innerHTML =
      '<div class="kpi"><div class="k">Registros</div><div class="v">' + rows.length + '</div></div>' +
      '<div class="kpi ok"><div class="k">Cajones</div><div class="v">' + cajones + '</div></div>' +
      '<div class="kpi warn"><div class="k">Tiempos muertos</div><div class="v">' + tms + '</div></div>' +
      '<div class="kpi info"><div class="k">Total Uni</div><div class="v">' + sumUni.toLocaleString('es-AR') + '</div></div>';

    var frag = document.createDocumentFragment();
    rows.forEach(function (r, idx) {
      var tr = document.createElement('tr');
      if (isTM(r)) tr.classList.add('tm-row');
      var matHtml = isTM(r)
        ? '<span class="badge warn">' + esc(r.matriz) + '</span>'
        : esc(r.matriz);
      tr.innerHTML =
        '<td>' + fmtDia(r) + '</td>' +
        '<td>' + esc(r.legajo) + '</td>' +
        '<td>' + esc(r.nombre_empleado || empleadosMap[r.legajo] || '') + '</td>' +
        '<td>' + matHtml + '</td>' +
        '<td>' + esc(r.nombre_matriz) + '</td>' +
        '<td class="num col-uni-c">' + (isTM(r) ? '' : esc(r.uni)) + '</td>' +
        '<td>' + esc(r.hora_inicio) + '</td>' +
        '<td>' + esc(r.hora_fin) + '</td>' +
        '<td class="num">' + esc(r.segundos_trabajados) + '</td>' +
        '<td class="num">' + esc(r.segundos_tiempo_muerto) + '</td>' +
        '<td class="num">' + (isTM(r) ? '' : fmt(r.premio)) + '</td>' +
        '<td class="num">' + (isTM(r) ? '' : fmt(r.tiempo_toma)) + '</td>' +
        '<td class="num">' + (isTM(r) ? '' : fmt(r.tiempo_historico)) + '</td>';
      tr.addEventListener('click', function () { openDetail(r); });
      frag.appendChild(tr);
    });
    tBody.appendChild(frag);
  }

  // ---------- DETAIL (read-only) ----------
  function openDetail(r) {
    detailTitle.textContent = (isTM(r) ? 'Tiempo muerto' : 'Cajon') + ' #' + esc(r.id);
    var pairs = [
      ['Fecha', r.fecha], ['Legajo', r.legajo], ['Operario', r.nombre_empleado],
      ['Matriz', r.matriz], ['Nombre matriz', r.nombre_matriz], ['Uni', r.uni],
      ['Hora inicio', r.hora_inicio], ['Hora fin', r.hora_fin],
      ['Seg. trabajados', r.segundos_trabajados], ['Seg. tiempo muerto', r.segundos_tiempo_muerto],
      ['Puntaje (premio)', r.premio], ['Tiempo toma', r.tiempo_toma],
      ['Tiempo historico', r.tiempo_historico], ['Revisado', r.revisado ? 'Si' : 'No']
    ];
    detailBody.innerHTML = pairs.map(function (p) {
      return '<div class="k">' + esc(p[0]) + '</div><div class="v">' + esc(p[1] == null ? '' : p[1]) + '</div>';
    }).join('');
    detailModal.classList.remove('hidden');
  }
  function closeDetail() { detailModal.classList.add('hidden'); }

  // ---------- CSV EXPORT ----------
  function exportCSV() {
    var rows = window.__lastRendered || [];
    if (!rows.length) { alert('No hay registros para exportar. Busca primero.'); return; }
    var cols = [
      ['fecha', 'Fecha'], ['legajo', 'Legajo'], ['nombre_empleado', 'Operario'],
      ['matriz', 'Matriz'], ['nombre_matriz', 'Nombre Matriz'], ['uni', 'Uni'],
      ['hora_inicio', 'Hora Inicio'], ['hora_fin', 'Hora Fin'],
      ['segundos_trabajados', 'Seg Trabajados'], ['segundos_tiempo_muerto', 'Seg TM'],
      ['premio', 'Puntaje'], ['tiempo_toma', 'T Toma'], ['tiempo_historico', 'T Historico']
    ];
    function cell(v) {
      var s = v == null ? '' : String(v);
      if (/[";\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    var lines = [cols.map(function (c) { return cell(c[1]); }).join(';')];
    rows.forEach(function (r) {
      lines.push(cols.map(function (c) { return cell(r[c[0]]); }).join(';'));
    });
    var csv = '﻿' + lines.join('\r\n'); // BOM para Excel + acentos
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'maestro_produccion_' + (fechaDesde.value || 'x') + '_a_' + (fechaHasta.value || 'x') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // wiring de filtros en cliente (no re-consultan el RPC salvo fecha)
  selOperario.addEventListener('change', applyFiltersAndRender);
  selMatriz.addEventListener('change', applyFiltersAndRender);
  selTM.addEventListener('change', applyFiltersAndRender);
  selOrden.addEventListener('change', applyFiltersAndRender);

  // boton CSV al lado de Buscar
  var btnCsv = document.createElement('button');
  btnCsv.className = 'btn btn-secondary';
  btnCsv.textContent = 'Exportar CSV';
  btnCsv.addEventListener('click', exportCSV);
  btnBuscar.parentNode.appendChild(btnCsv);
})();
</script>
</body>
</html>
