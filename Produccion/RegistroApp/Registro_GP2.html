<!doctype html>
<html lang="es">
<head>
<script src="../../auth-guard.js?v=20261006b"></script>
<script src="../../gp2-ui.js?v=20260930a"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro Producción · GP2</title>
<link rel="icon" type="image/png" href="../../GP2_favicon.png">
<link rel="apple-touch-icon" href="../../GP2_favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase-config.js?v=20260929a"></script>
<link rel="stylesheet" href="../../gp2-modulo.css?v=20261009ds">
<style>
  /* Solo layout propio: barra, campos, botones, avisos y tabla son gp2-modulo.css. */
  /* escritorio: la carga a la izquierda y los ultimos registros a la derecha */
  .reg-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s4);align-items:start}
  @media (min-width:1100px){
    .reg-layout{grid-template-columns:minmax(0,1fr) minmax(400px,640px)}
    .recent{position:sticky;top:calc(var(--bar-h) + 12px)}
  }
  .datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px var(--s3);margin:0 0 var(--s3)}
  .datos input{width:100%}
  .search-box{margin:4px 0 var(--s2)}
  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--s2);margin:0 0 var(--s3);max-height:420px;overflow-y:auto;padding:2px}
  .item-btn{align-items:center;text-align:center;overflow:hidden;min-height:72px}
  .item-btn .code{display:block;font-size:20px;font-weight:800;color:var(--brand-600)}
  .item-btn.active .code{color:var(--brand-200)}
  .item-btn .desc{display:block;font-size:var(--fs-td);margin-top:4px;font-weight:600;line-height:1.2;white-space:normal;overflow-wrap:anywhere}
  .items-grid > .empty{grid-column:1/-1}

  #panel{padding:16px;margin:0 0 var(--s3)}
  #panel .flow{margin:0 0 12px;font-size:var(--fs-base)}
  #panel select{width:100%;margin-bottom:12px}
  .carga{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .carga .field{flex:1 1 180px}
  .carga input{width:100%;font-size:20px}
  #fUni{background:var(--ink-100);font-weight:800}
  .msg{margin-top:10px;font-size:var(--fs-base);min-height:20px}

  .recent .panel-head{position:static}
  .recent .table-wrap{border:0;border-radius:0 0 var(--r-lg) var(--r-lg);max-height:calc(100dvh - var(--bar-h) - 90px)}
  .recent .t td{white-space:nowrap}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Registro Producción <small>carga manual</small></h1>
    <div class="hbtns">
      <a class="back" href="../../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps reg-layout">
    <div class="cargar">
      <div class="datos">
        <div class="field"><label for="fFecha">Fecha</label><input type="date" id="fFecha"></div>
        <div class="field"><label for="fLegajo">Legajo</label><input type="text" id="fLegajo" inputmode="numeric" placeholder="Legajo del operario"></div>
        <div class="field"><label for="fNombre">Nombre (opcional)</label><input type="text" id="fNombre" placeholder="Nombre"></div>
      </div>

      <div class="field search-box"><label for="q">Matriz</label><input type="search" class="search" id="q" placeholder="Buscar matriz por N° o nombre…" oninput="renderMats()"></div>
      <div class="items-grid" id="matGrid"></div>

      <div id="panel" class="panel" style="display:none">
        <div id="flow" class="aviso info flow"></div>
        <div id="salidaWrap"></div>
        <div class="carga">
          <div class="field"><label for="fGolpes">Golpes del contador</label><input inputmode="numeric" type="number" id="fGolpes" min="1" step="1" placeholder="0" oninput="pintarUni()"></div>
          <div class="field"><label for="fUni">Unidades producidas</label><input inputmode="numeric" type="number" id="fUni" min="1" step="1" placeholder="0" readonly></div>
          <button class="btn btn-primary btn-lg" id="btnGuardar" onclick="guardar()">Guardar producción</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <div class="recent panel">
      <div class="panel-head">Últimos registros</div>
      <div id="tabla"><p class="empty">—</p></div>
    </div>
  </div>
</div>

<script>
const SB=GP2_SB();
var $ = GP2UI.$;
let D=null, matSel=null, matKeys=[];
/* HOY es el de ARGENTINA (GP2UI.hoyAR), no el del aparato. Tenia su propio hoy() con
   getFullYear/getMonth/getDate, que lee la zona del dispositivo: en una tablet o un celular en
   UTC, despues de las 21:00 de Argentina devolvia el DIA SIGUIENTE, y con eso se precarga la
   fecha del registro de produccion. [2026-09-12, hallazgo 14c del informe de logica duplicada] */
var hoy = GP2UI.hoyAR;
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function cById(cid){return (D&&D.comp[String(cid)])||{cod:'?',d:''};}
/* El contador de la matriz cuenta GOLPES; cuantas piezas salen por golpe lo dice la
   base (GP2.matriz.uni_x_golpe), no el operario. Asi el dia que cambia la matriz se
   toca un solo numero y nadie tiene que recordar el factor. */
function uniXGolpe(){var v=Number((D&&D.mat[matSel]||{}).uxg);return v>0?v:1;}
function pintarUni(){
  var g=Number($('fGolpes').value)||0;
  $('fUni').value = g>0 ? g*uniXGolpe() : '';
}
function paresMatriz(mid){var set={};for(var rid in D.rp)D.rp[rid].forEach(p=>{if(p.tipo==='matriz'&&p.mat==mid&&p.ce&&p.cs)set[p.ce+'>'+p.cs]=[p.ce,p.cs];});return Object.values(set);}

function renderMats(){
  if(!D)return;
  var q=norm($('q').value.trim());
  var keys=matKeys.filter(k=>{var m=D.mat[k];
    if(m.act===false) return false;               // matriz dada de baja: no se ofrece
    return !q||norm('N°'+m.n+' '+(m.d||'')).indexOf(q)>=0;});
  var g=$('matGrid'); g.innerHTML='';
  keys.slice(0,300).forEach(k=>{
    var m=D.mat[k];
    var b=document.createElement('button'); b.className='prov-btn item-btn'+(String(matSel)===String(k)?' active':'');
    b.innerHTML='<span class="code">N°'+esc(m.n)+'</span><span class="desc">'+esc(m.d||'')+'</span>';
    b.addEventListener('click',()=>selMat(k));
    g.appendChild(b);
  });
}
function selMat(k){
  matSel=k; renderMats();
  var mid=parseInt(k), mat=D.mat[k]||{}, pares=paresMatriz(mid);
  var flow=$('flow'), sw=$('salidaWrap');
  sw.innerHTML='';
  if(pares.length===0){
    flow.innerHTML='<b>Esta matriz no tiene entrada→salida en las rutas.</b> Se registra la producción pero <b>no mueve stock</b>.';
  } else if(pares.length===1){
    var ce=cById(pares[0][0]), cs=cById(pares[0][1]);
    flow.innerHTML='<b>Entrada:</b> '+esc(ce.cod)+' — '+esc(ce.d)+'<br><b>Salida:</b> '+esc(cs.cod)+' — '+esc(cs.d);
    sw.innerHTML='<input type="hidden" id="fSalida" value="'+pares[0][1]+'">';
  } else {
    flow.innerHTML='<b>Elegí qué pieza produjo:</b>';
    var h='<select id="fSalida"><option value="">— Elegí pieza —</option>';
    pares.forEach(par=>{var ce=cById(par[0]),cs=cById(par[1]);h+='<option value="'+par[1]+'">'+esc(cs.cod)+' — '+esc((cs.d||'').substring(0,40))+'  (de '+esc(ce.cod)+')</option>';});
    h+='</select>'; sw.innerHTML=h;
  }
  if(mat.ppk) flow.innerHTML+='<br><span class="hint">Rendimiento: '+mat.ppk+' uni/kg de fleje (primer corte).</span>';
  var uxg=uniXGolpe();
  flow.innerHTML+='<br><span class="hint">'+(mat.maq?esc(mat.maq).toUpperCase()+' · ':'')+
    (uxg===1?'1 golpe = 1 unidad.':'cada golpe saca <b>'+uxg+'</b> unidades.')+'</span>';
  $('fGolpes').value=''; pintarUni();
  $('panel').style.display=''; $('msg').textContent=''; $('msg').className='msg';
}

async function cargarMatrices(){
  var res=await SB.rpc('movimientos_bundle');
  if(res.error){$('matGrid').innerHTML='<p class="empty">Error: '+esc(res.error.message)+'</p>';return;}
  D=res.data; for(var r in D.rp)D.rp[r].sort((a,b)=>a.o-b.o);
  matKeys=Object.keys(D.mat).sort((a,b)=>String(D.mat[a].n).localeCompare(String(D.mat[b].n),undefined,{numeric:true}));
  renderMats();
}
async function cargarUltimos(){
  var res=await SB.from('produccion').select('fecha,legajo,nombre_empleado,matriz_raw,nombre_matriz,uni,golpes').order('id',{ascending:false}).limit(30);
  var t=$('tabla');
  if(res.error){t.innerHTML='<p class="empty">Error cargando</p>';return;}
  var data=res.data||[];
  if(!data.length){t.innerHTML='<p class="empty">Sin registros todavía</p>';return;}
  t.innerHTML='<div class="table-wrap"><table class="t rec"><thead><tr><th>Fecha</th><th>Legajo</th><th>Nombre</th><th>Matriz</th><th class="num">Golpes</th><th class="num">Uni</th></tr></thead><tbody>'+
    data.map(r=>{var f=r.fecha?new Date(r.fecha).toLocaleDateString('es-AR'):'';
      return '<tr><td>'+f+'</td><td>'+esc(r.legajo||'')+'</td><td>'+esc(r.nombre_empleado||'')+'</td><td>'+esc(r.matriz_raw||'')+' · '+esc(r.nombre_matriz||'')+'</td><td class="num">'+(r.golpes==null?'—':r.golpes)+'</td><td class="num">'+(r.uni==null?'':r.uni)+'</td></tr>';}).join('')+
    '</tbody></table></div>';
}
async function guardar(){
  var m=$('msg'); m.className='msg'; m.textContent='';
  var golpes=parseFloat($('fGolpes').value);
  if(!matSel){m.className='msg err';m.textContent='Elegí una matriz.';return;}
  if(!golpes||golpes<=0){m.className='msg err';m.textContent='Ingresá los golpes del contador (> 0).';return;}
  var uxg=uniXGolpe(), uni=golpes*uxg;
  if(uxg>1 && !confirm('Matriz '+((D.mat[matSel]||{}).n)+': '+golpes+' GOLPES x '+uxg+' = '+uni+' unidades.\n\n¿Los '+golpes+' son golpes del contador (no unidades)?')) return;
  var matN=(D.mat[matSel]||{}).n;
  var salEl=$('fSalida'); var salida=salEl?(salEl.value||null):null;
  var pares=paresMatriz(parseInt(matSel));
  if(pares.length>1 && !salida){m.className='msg err';m.textContent='Elegí qué pieza produjo.';return;}
  $('btnGuardar').disabled=true;
  try{
    var fiso=$('fFecha').value?($('fFecha').value+'T12:00:00'):null;
    var res=await SB.rpc('registrar_produccion',{p_legajo:$('fLegajo').value||null,p_matriz:String(matN),
      p_golpes:golpes,p_fecha:fiso,p_nombre:$('fNombre').value||null,p_comp_salida_id:salida?Number(salida):null});
    if(res.error) throw res.error;
    var d=res.data||{};
    if(d.aviso){ m.className='msg warn'; m.textContent='✓ Registrado (id '+d.id+'). '+d.aviso; }
    else { m.className='msg ok'; m.textContent='✓ Guardado (id '+d.id+') — '+(d.nombre_matriz||matN)+' · '+golpes+' golpes x '+uxg+' = '+(d.uni||uni)+' uni. Stock actualizado (mov '+d.movimiento_id+').'; }
    $('fGolpes').value=''; $('fUni').value='';
    await cargarUltimos();
  }catch(e){ m.className='msg err'; m.textContent='Error: '+(e.message||e); }
  finally{ $('btnGuardar').disabled=false; }
}
$('fFecha').value=hoy();
cargarMatrices(); cargarUltimos();
</script>
</body></html>
