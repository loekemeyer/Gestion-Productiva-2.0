<!doctype html><html lang="es"><head>
<script src="../../auth-guard.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro Producción · GP2</title>
<link rel="icon" type="image/png" href="../../GP2_favicon.png">
<link rel="apple-touch-icon" href="../../GP2_favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#0a0e13;color:#e6ecf3;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
 .hero{display:flex;justify-content:center;padding:8px 0;border-bottom:1px solid #1c2836;background:#0b1220}
 .hero img{height:40px}
 .wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
 h1{font-size:18px;margin:0 0 4px}
 .sub{color:#8aa0b6;font-size:13px;margin:0 0 18px}
 .card{background:#111823;border:1px solid #1c2836;border-radius:12px;padding:16px 18px;margin-bottom:16px}
 .row{display:flex;gap:12px;flex-wrap:wrap}
 .fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
 .fld.grow{flex:1 1 180px}
 label{font-size:12px;color:#9fc0e0;text-transform:uppercase;letter-spacing:.03em}
 input,select{background:#0b1119;color:#e6ecf3;border:1px solid #2a4a6e;border-radius:8px;padding:9px 11px;font:14px inherit}
 input:focus,select:focus{outline:none;border-color:#2f6fb0}
 .btn{background:#1f6fce;color:#fff;border:none;border-radius:9px;padding:11px 20px;font:600 14px inherit;cursor:pointer}
 .btn:hover{background:#2f80d6} .btn:disabled{opacity:.5;cursor:default}
 .msg{margin-top:10px;font-size:13px;min-height:18px}
 .msg.ok{color:#4bc394} .msg.err{color:#f0736d} .msg.warn{color:#e0a95a}
 .autoinfo{background:#0f2337;border:1px solid #3a5068;border-radius:8px;padding:9px 11px;font-size:12px;color:#8fc4f0;margin-bottom:12px}
 .autoinfo b{color:#c9d6e3}
 table{width:100%;border-collapse:collapse;font-size:13px}
 th{color:#7a92a8;text-transform:uppercase;font-size:10px;letter-spacing:.4px;text-align:left;padding:6px 8px;border-bottom:1px solid #1c2836}
 td{padding:7px 8px;border-bottom:1px solid #141d29}
 td.n{text-align:right;font-variant-numeric:tabular-nums}
 .empty{color:#6b7f93;padding:14px;text-align:center}
 .hint{font-size:11px;color:#7a92a8;font-style:italic;margin-top:4px}
</style></head><body>
<div class="hero"><a href="../../Inicio/index.html"><img src="../../GP2_logo.png" alt="GP2"></a></div>
<div class="wrap">
 <h1>Registro de Producción · GP2</h1>
 <p class="sub">Registrás la producción del operario por matriz. Mueve el stock: consume la entrada (fleje en kg / pieza en uni) y produce la pieza de salida.</p>

 <div class="card">
   <div class="row">
     <div class="fld grow"><label>Fecha</label><input type="date" id="fFecha"></div>
     <div class="fld grow"><label>Legajo</label><input type="text" id="fLegajo" placeholder="Legajo del operario"></div>
     <div class="fld grow"><label>Nombre (opcional)</label><input type="text" id="fNombre" placeholder="Nombre"></div>
   </div>
   <div class="row">
     <div class="fld grow" style="flex:2 1 320px"><label>Matriz</label>
       <select id="fMatriz" onchange="onMat()"><option value="">Cargando…</option></select></div>
     <div class="fld grow"><label>Unidades producidas</label><input type="number" id="fUni" min="1" step="1" placeholder="0"></div>
   </div>
   <div id="matInfo"></div>
   <button class="btn" id="btnGuardar" onclick="guardar()">Guardar producción</button>
   <div class="msg" id="msg"></div>
 </div>

 <div class="card">
   <h1 style="font-size:15px">Últimos registros</h1>
   <div id="tabla"><p class="empty">—</p></div>
 </div>
</div>

<script>
const SB_URL="https://hrxfctzncixxqmpfhskv.supabase.co";
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs";
const SB=window.supabase.createClient(SB_URL,SB_ANON,{db:{schema:'GP2'}});
const $=id=>document.getElementById(id);
let D=null;
function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cById(cid){return (D&&D.comp[String(cid)])||{cod:'?',d:''};}
function paresMatriz(mid){var set={};for(var rid in D.rp)D.rp[rid].forEach(p=>{if(p.tipo==='matriz'&&p.mat==mid&&p.ce&&p.cs)set[p.ce+'>'+p.cs]=[p.ce,p.cs];});return Object.values(set);}

function onMat(){
 var info=$('matInfo'); info.innerHTML='';
 var mid=parseInt($('fMatriz').value); if(!mid){return;}
 var mat=D.mat[mid]||{}; var pares=paresMatriz(mid);
 var css='width:100%;padding:6px;margin:4px 0;background:#0b1119;color:#e6ecf3;border:1px solid #2a4a6e;border-radius:6px';
 var h='<div class="autoinfo">';
 if(pares.length===0){
   h+='<b>Esta matriz no tiene entrada→salida en las rutas.</b> Se registra la producción del operario pero <b>no mueve stock</b>.<input type="hidden" id="fSalida" value="">';
 } else if(pares.length===1){
   var ce=cById(pares[0][0]), cs=cById(pares[0][1]);
   h+='<b>Entrada:</b> '+esc(ce.cod)+' — '+esc(ce.d)+'<br><b>Salida:</b> '+esc(cs.cod)+' — '+esc(cs.d);
   h+='<input type="hidden" id="fSalida" value="'+pares[0][1]+'">';
 } else {
   h+='<b>Elegí qué pieza produjo:</b><br><select id="fSalida" style="'+css+'"><option value="">— Elegí —</option>';
   pares.forEach(par=>{var ce=cById(par[0]),cs=cById(par[1]);h+='<option value="'+par[1]+'">'+esc(cs.cod)+' — '+esc((cs.d||'').substring(0,32))+'  (de '+esc(ce.cod)+')</option>';});
   h+='</select>';
 }
 if(mat.ppk) h+='<br><span class="hint">Rendimiento: '+mat.ppk+' uni/kg de fleje (para matrices de primer corte).</span>';
 h+='</div>';
 info.innerHTML=h;
}

async function cargarMatrices(){
 var res=await SB.rpc('movimientos_bundle');
 if(res.error){$('fMatriz').innerHTML='<option value="">Error</option>';return;}
 D=res.data; for(var r in D.rp)D.rp[r].sort((a,b)=>a.o-b.o);
 var keys=Object.keys(D.mat).sort((a,b)=>String(D.mat[a].n).localeCompare(String(D.mat[b].n),undefined,{numeric:true}));
 $('fMatriz').innerHTML='<option value="">— Elegí matriz —</option>'+keys.map(k=>{var m=D.mat[k];return '<option value="'+k+'">N°'+esc(m.n)+' — '+esc(m.d||'')+'</option>';}).join('');
}
async function cargarUltimos(){
 var res=await SB.from('produccion').select('fecha,legajo,nombre_empleado,matriz_raw,nombre_matriz,uni').order('id',{ascending:false}).limit(30);
 var t=$('tabla');
 if(res.error){t.innerHTML='<p class="empty">Error cargando</p>';return;}
 var data=res.data||[];
 if(!data.length){t.innerHTML='<p class="empty">Sin registros todavía</p>';return;}
 t.innerHTML='<table><thead><tr><th>Fecha</th><th>Legajo</th><th>Nombre</th><th>Matriz</th><th>Uni</th></tr></thead><tbody>'+
   data.map(r=>{var f=r.fecha?new Date(r.fecha).toLocaleDateString('es-AR'):'';
     return '<tr><td>'+f+'</td><td>'+esc(r.legajo||'')+'</td><td>'+esc(r.nombre_empleado||'')+'</td><td>'+esc(r.matriz_raw||'')+' · '+esc(r.nombre_matriz||'')+'</td><td class="n">'+(r.uni==null?'':r.uni)+'</td></tr>';}).join('')+
   '</tbody></table>';
}
async function guardar(){
 var m=$('msg'); m.className='msg'; m.textContent='';
 var matSel=$('fMatriz').value, uni=parseFloat($('fUni').value);
 var matN = matSel ? (D.mat[matSel]||{}).n : null;
 var salEl=$('fSalida'); var salida = salEl ? (salEl.value||null) : null;
 if(!matSel){m.className='msg err';m.textContent='Elegí una matriz.';return;}
 if(!uni||uni<=0){m.className='msg err';m.textContent='Ingresá unidades (> 0).';return;}
 var pares=paresMatriz(parseInt(matSel));
 if(pares.length>1 && !salida){m.className='msg err';m.textContent='Elegí qué pieza produjo.';return;}
 $('btnGuardar').disabled=true;
 try{
   var fiso=$('fFecha').value?($('fFecha').value+'T12:00:00'):null;
   var res=await SB.rpc('registrar_produccion',{p_legajo:$('fLegajo').value||null,p_matriz:String(matN),
     p_uni:uni,p_fecha:fiso,p_nombre:$('fNombre').value||null,p_comp_salida_id:salida?Number(salida):null});
   if(res.error) throw res.error;
   var d=res.data||{};
   if(d.aviso){ m.className='msg warn'; m.textContent='✓ Registrado (id '+d.id+'). '+d.aviso; }
   else { m.className='msg ok'; m.textContent='✓ Guardado (id '+d.id+') — '+(d.nombre_matriz||matN)+' · '+uni+' uni. Stock actualizado (mov '+d.movimiento_id+').'; }
   $('fUni').value='';
   await cargarUltimos();
 }catch(e){ m.className='msg err'; m.textContent='Error: '+(e.message||e); }
 finally{ $('btnGuardar').disabled=false; }
}
$('fFecha').value=hoy();
cargarMatrices(); cargarUltimos();
</script>
</body></html>
