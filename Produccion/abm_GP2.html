<!doctype html>
<html lang="es">
<head>
  <script src="../auth-guard.js?v=20261006b"></script>
<script src="../gp2-ui.js?v=20260930a"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ABM Operarios · GP2</title>
  <link rel="icon" type="image/png" href="../GP2_favicon.png">
  <link rel="apple-touch-icon" href="../GP2_favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260929a"></script>
  <link rel="stylesheet" href="../gp2-modulo.css?v=20261008ds">
<style>
    /* ABM Operarios: lo propio de esta pantalla (el resto lo da gp2-modulo.css) */
    .toolbar .search-box { flex: 1 1 280px; margin: 0; }
    .toolbar .chips { margin: 0; }
    table.t tr.inactivo td { color: var(--ink-3); }
    table.t td.acciones { white-space: nowrap; text-align: right; }
    .row-btn + .row-btn { margin-left: 6px; }
    .row-btn.baja { color: var(--err); border-color: var(--err-line); }
    .row-btn.baja:hover { background: var(--err-soft); border-color: var(--err); color: var(--err); }
    .topmsg { display: none; }
    .topmsg.aviso { display: block; }
    /* el modal: mostrar/ocultar lo maneja la pantalla (.open) */
    .overlay { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: var(--s4); }
    .overlay.open { display: flex; }
    .modal { width: 100%; max-width: 440px; padding: var(--s5); }
    .modal h3 { margin-bottom: var(--s4); }
    .modal .campos { display: grid; gap: var(--s3); }
    .modal .campos input, .modal .campos select { width: 100%; }
    .modal .actions { margin-top: var(--s4); }
    .nota-pie { margin-top: var(--s3); }
    #mErr { min-height: 20px; margin: var(--s2) 0 0; font-weight: 600; }
  </style>
</head>
<body>

<div class="card medio">
  <div class="header">
    <h1>ABM Operarios<small>Operarios de GP2</small></h1>
    <div class="hbtns">
      <a href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>
  <div class="steps">
    <div id="topmsg" class="topmsg"></div>

    <div class="toolbar mt0">
      <div class="search-box"><input type="text" id="fBuscar" placeholder="Buscar por nombre o legajo..."></div>
      <div class="chips" id="segEstado">
        <button type="button" class="chip active" data-v="activos">Activos</button>
        <button type="button" class="chip" data-v="inactivos">Inactivos</button>
        <button type="button" class="chip" data-v="todos">Todos</button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary" id="btnNuevo">+ Nuevo operario</button>
    </div>

    <div class="table-wrap fix1">
      <table class="t">
        <thead>
          <tr>
            <th>Legajo</th><th>Nombre</th><th>Tipo</th><th>Hora entrada</th><th>Estado</th><th></th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="6" class="msg empty">Cargando...</td></tr></tbody>
      </table>
    </div>
    <p class="hint nota-pie">Escribe directo en <b>GP2.empleado</b>. La baja es lógica: el operario queda inactivo (no se borra) para no romper el historial de <code>GP2.produccion</code>, que guarda el legajo.</p>
  </div>
</div>

<div class="overlay" id="ovl">
  <div class="modal" role="dialog" aria-labelledby="mHead">
    <h3 id="mHead">Nuevo operario</h3>
    <div class="campos">
      <div class="field"><label for="mLegajo">Legajo *</label><input type="text" id="mLegajo" inputmode="numeric" autocomplete="off"></div>
      <div class="field"><label for="mNombre">Nombre *</label><input type="text" id="mNombre" autocomplete="off"></div>
      <div class="field"><label for="mTipo">Tipo</label><input type="text" id="mTipo" autocomplete="off" placeholder="ej. operario"></div>
      <div class="field"><label for="mHora">Hora de entrada</label><input type="time" id="mHora"></div>
      <div class="field"><label for="mActivo">Estado</label><select id="mActivo"><option value="true">Activo</option><option value="false">Inactivo</option></select></div>
    </div>
    <div id="mErr" class="err-txt"></div>
    <div class="actions">
      <button type="button" class="btn btn-secondary" id="mCancel">Cancelar</button>
      <button type="button" class="btn btn-primary" id="mSave">Guardar</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var sb = GP2_SB();

  var $ = GP2UI.$;
  var ROWS = [], estado = 'activos', editId = null;

  var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
  function topmsg(txt, ok) {
    var el = $('topmsg');
    el.className = 'topmsg aviso ' + (ok ? 'ok' : 'err');
    el.textContent = txt;
    if (ok) setTimeout(function () { el.className = 'topmsg'; }, 4000);
  }

  async function cargar() {
    var r = await sb.from('empleado').select('id,legajo,nombre,activo,tipo,hora_entrada').order('nombre');
    if (r.error) { $('tbody').innerHTML = '<tr><td colspan="6" class="msg empty err-txt">Error: ' + esc(r.error.message) + '</td></tr>'; return; }
    ROWS = r.data || [];
    render();
  }

  function render() {
    var q = $('fBuscar').value.trim().toLowerCase();
    var rows = ROWS.filter(function (e) {
      if (estado === 'activos' && e.activo === false) return false;
      if (estado === 'inactivos' && e.activo !== false) return false;
      if (!q) return true;
      return String(e.nombre || '').toLowerCase().indexOf(q) >= 0 || String(e.legajo || '').toLowerCase().indexOf(q) >= 0;
    });

    var tb = $('tbody');
    if (!rows.length) { tb.innerHTML = '<tr><td colspan="6" class="msg empty">Sin operarios para ese filtro.</td></tr>'; return; }

    tb.innerHTML = rows.map(function (e) {
      var act = e.activo !== false;
      return '<tr class="' + (act ? '' : 'inactivo') + '">' +
        '<td class="cod">' + esc(e.legajo) + '</td>' +
        '<td>' + esc(e.nombre) + '</td>' +
        '<td>' + esc(e.tipo || '—') + '</td>' +
        '<td>' + esc(e.hora_entrada ? String(e.hora_entrada).slice(0, 5) : '—') + '</td>' +
        '<td><span class="pill ' + (act ? 'si ok' : 'no') + '">' + (act ? 'Activo' : 'Inactivo') + '</span></td>' +
        '<td class="acciones">' +
          '<button type="button" class="btn btn-secondary btn-sm row-btn" data-edit="' + e.id + '">Editar</button>' +
          '<button type="button" class="btn btn-secondary btn-sm row-btn ' + (act ? 'baja' : '') + '" data-toggle="' + e.id + '">' + (act ? 'Dar de baja' : 'Reactivar') + '</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function abrirModal(emp) {
    editId = emp ? emp.id : null;
    $('mHead').textContent = emp ? 'Editar operario' : 'Nuevo operario';
    $('mLegajo').value = emp ? (emp.legajo || '') : '';
    $('mNombre').value = emp ? (emp.nombre || '') : '';
    $('mTipo').value   = emp ? (emp.tipo || '') : '';
    $('mHora').value   = emp && emp.hora_entrada ? String(emp.hora_entrada).slice(0, 5) : '';
    $('mActivo').value = emp && emp.activo === false ? 'false' : 'true';
    $('mErr').textContent = '';
    $('ovl').classList.add('open');
    setTimeout(function () { $(emp ? 'mNombre' : 'mLegajo').focus(); }, 50);
  }

  function cerrarModal() { $('ovl').classList.remove('open'); editId = null; }

  async function guardar() {
    var legajo = $('mLegajo').value.trim();
    var nombre = $('mNombre').value.trim();
    if (!legajo) { $('mErr').textContent = 'Falta el legajo.'; return; }
    if (!nombre) { $('mErr').textContent = 'Falta el nombre.'; return; }

    var dup = ROWS.some(function (e) { return String(e.legajo).trim() === legajo && e.id !== editId; });
    if (dup) { $('mErr').textContent = 'Ya existe un operario con el legajo ' + legajo + '.'; return; }

    var payload = {
      legajo: legajo,
      nombre: nombre,
      tipo: $('mTipo').value.trim() || null,
      hora_entrada: $('mHora').value || null,
      activo: $('mActivo').value === 'true'
    };

    if (editId) payload.id = editId;

    $('mSave').disabled = true;
    // La escritura pasa por RPC SECURITY DEFINER: anon no escribe empleado directo
    // (el legajo cruza con la produccion, ver AUDITORIA_GP2_2026-08-31.md).
    var r = await sb.rpc('empleado_guardar', { p: payload });
    $('mSave').disabled = false;

    if (r.error) { $('mErr').textContent = r.error.message; return; }
    topmsg(editId ? 'Operario actualizado.' : 'Operario creado.', true);
    cerrarModal();
    cargar();
  }

  async function toggleActivo(id) {
    var emp = ROWS.find(function (e) { return e.id === id; });
    if (!emp) return;
    var nuevo = emp.activo === false;
    if (!nuevo && !confirm('¿Dar de baja a ' + emp.nombre + '? Queda inactivo, no se borra el historial.')) return;
    var r = await sb.rpc('empleado_activar', { p_id: id, p_activo: nuevo });
    if (r.error) { topmsg('Error: ' + r.error.message, false); return; }
    topmsg(nuevo ? 'Operario reactivado.' : 'Operario dado de baja.', true);
    cargar();
  }

  document.addEventListener('DOMContentLoaded', function () {
    $('fBuscar').addEventListener('input', render);
    $('btnNuevo').addEventListener('click', function () { abrirModal(null); });
    $('mCancel').addEventListener('click', cerrarModal);
    $('mSave').addEventListener('click', guardar);
    $('ovl').addEventListener('click', function (e) { if (e.target === $('ovl')) cerrarModal(); });

    $('segEstado').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-v]');
      if (!b) return;
      estado = b.dataset.v;
      $('segEstado').querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
      render();
    });

    $('tbody').addEventListener('click', function (e) {
      var ed = e.target.closest('button[data-edit]');
      if (ed) { abrirModal(ROWS.find(function (x) { return x.id === Number(ed.dataset.edit); })); return; }
      var tg = e.target.closest('button[data-toggle]');
      if (tg) toggleActivo(Number(tg.dataset.toggle));
    });

    cargar();
  });
})();
</script>
<script src="../gp2-menu.js?v=20261008ds"></script>
<script src="../gp2-nav.js?v=20261008ds"></script>
</body>
</html>
