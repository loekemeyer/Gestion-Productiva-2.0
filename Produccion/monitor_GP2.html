<!doctype html>
<html lang="es">
<head>
  <script src="../auth-guard.js?v=20261006b"></script>
<script src="../gp2-ui.js?v=20260930a"></script>
<script src="../gp2-numero.js?v=20260911o"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Monitor en Vivo · Operarios · GP2</title>
  <link rel="icon" type="image/png" href="../GP2_favicon.png">
  <link rel="apple-touch-icon" href="../GP2_favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260929a"></script>
  <link rel="stylesheet" href="../gp2-modulo.css?v=20261009ds">
  <style>
    /* Solo layout propio: todo lo demas (barra, campos, botones, KPIs, badges) es gp2-modulo.css. */
    .live { display: inline-flex; align-items: center; gap: 6px; }
    .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok-600); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .chk { display: inline-flex; align-items: center; gap: 8px; min-height: var(--touch); font-size: var(--fs-sm); font-weight: 600; color: var(--ink-600); cursor: pointer; align-self: flex-end; }
    /* tarjetas de operario: rejilla que llena el ancho */
    .ops-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s2); }
    .ops-grid > .empty, .ops-grid > .aviso { grid-column: 1 / -1; }
    .op-card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line-strong); border-radius: var(--r-lg); padding: 12px 14px; box-shadow: var(--sh-1); }
    .op-card.produccion { border-left-color: var(--ok-600); }
    .op-card.tm        { border-left-color: var(--warn-600); }
    .op-card.issue     { border-left-color: var(--err-600); }
    .op-card.idle      { border-left-color: var(--ink-400); opacity: .75; }
    .op-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .op-nombre { font-size: var(--fs-base); font-weight: 700; color: var(--ink-900); }
    .op-legajo { font-size: var(--fs-cap); color: var(--ink-500); font-weight: 600; }
    .badge.pulse { animation: pulse 1.6s infinite; }
    .op-line { font-size: var(--fs-td); color: var(--ink-700); margin-top: 3px; }
    .op-line b { color: var(--brand-600); }
    .op-line.off { color: var(--ink-500); }
    .op-meta { font-size: var(--fs-sm); color: var(--ink-500); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .op-kpis { display: flex; gap: 18px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
    .op-kpi { font-size: var(--fs-cap); color: var(--ink-500); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .op-kpi span { display: block; font-size: 17px; color: var(--ink-900); font-weight: 750; font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0; }
    .note { margin-top: var(--s4); }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Monitor en Vivo · Operarios <small class="live"><span class="live-dot"></span><span id="liveTxt">en vivo</span></small></h1>
    <div class="hbtns">
      <a href="monitor2_GP2.html">Cierres del día</a>
      <a class="back" href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">
    <div class="toolbar">
      <div class="field"><label for="fDia">Día</label><input type="date" id="fDia"></div>
      <label class="chk"><input type="checkbox" id="soloActivos" checked> Solo con movimiento hoy</label>
      <button class="btn btn-primary push" id="btnRefrescar">Refrescar</button>
      <button class="btn btn-secondary" id="btnAuto">Auto: ON</button>
    </div>

    <div class="kpis" id="stats"></div>
    <div class="ops-grid" id="grid"><div class="empty">Cargando...</div></div>

    <p class="sub note">Lee <b>GP2.produccion</b> del día elegido. El estado sale del último evento de cada operario: unidades &gt; 0 = produciendo, código de tiempo muerto = parado, RM/PM/RD = problema con la matriz. Refresco automático cada 30 segundos.</p>
  </div>
</div>

<script>
(function () {
  "use strict";
  var sb = GP2_SB();

  var $ = GP2UI.$;
  var TM_DESC = {
    PB: 'Paré Baño', BC: 'Busqué Cajón', MOV: 'Movimiento', LIMP: 'Limpieza', Perm: 'Permiso',
    AL: 'Ayuda Logística', PR: 'Paré Carga Rollo', PC: 'Paré Comida', 'MOV P': 'Movimiento Piedra',
    CM: 'Cambiar Matriz', REM: 'Reparando Matriz', Ausencia: 'Ausencia',
    LT: 'Llegada Tarde', FJ: 'Fin Jornada'
  };
  var ISSUE = { RM: 'Rotura Matriz', PM: 'Paré Matriz', RD: 'Rollo Fleje Doblado' };
  var EMP = {}, timer = null, auto = true;
  /* estado -> variante de .badge del sistema (gp2-modulo.css) */
  var BADGE = { produccion: 'ok', tm: 'warn', issue: 'err pulse', idle: '' };

  var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
  function n0(v) { return GP2N.fmt(v, 0); }   /* la regla de numero de la casa (gp2-numero.js) */
  var hoy = GP2UI.hoyAR;   /* era una copia a mano de hoyAR: misma cuenta, otro lugar donde arreglarla */
  function horaAR(iso) {
    try {
      return new Intl.DateTimeFormat('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));
    } catch (e) { return ''; }
  }
  function haceCuanto(iso) {
    var min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return 'recién';
    if (min < 60) return 'hace ' + min + ' min';
    return 'hace ' + Math.floor(min / 60) + ' h ' + (min % 60) + ' min';
  }

  async function cargarEmpleados() {
    var r = await sb.from('empleado').select('legajo,nombre,activo');
    if (r.error) { console.warn('empleado:', r.error); return; }
    (r.data || []).forEach(function (e) { EMP[String(e.legajo)] = e; });
  }

  function estadoDe(ev) {
    var code = String(ev.matriz_raw || '').trim();
    if (Number(ev.uni) > 0) return { k: 'produccion', label: 'Produciendo' };
    if (ISSUE[code]) return { k: 'issue', label: ISSUE[code] };
    if (TM_DESC[code]) return { k: code === 'FJ' ? 'idle' : 'tm', label: TM_DESC[code] };
    return { k: 'produccion', label: 'En matriz ' + code };
  }

  async function cargar() {
    var dia = $('fDia').value || hoy();
    var r = await sb.from('v_produccion_todas')   /* GP2 + Registro Produccion 3.0 (2026-10-08) */
      .select('legajo,nombre_empleado,matriz_raw,nombre_matriz,uni,fecha,eliminar')
      .gte('fecha', dia + 'T00:00:00-03:00')
      .lte('fecha', dia + 'T23:59:59-03:00')
      .order('fecha', { ascending: true })
      .limit(10000);

    var grid = $('grid');
    if (r.error) { grid.innerHTML = '<div class="aviso err">Error: ' + esc(r.error.message) + '</div>'; return; }

    var porLegajo = {};
    (r.data || []).forEach(function (p) {
      if (String(p.eliminar || '').toUpperCase() === 'S') return;
      var leg = String(p.legajo || '').trim();
      if (!leg) return;
      if (!porLegajo[leg]) porLegajo[leg] = { legajo: leg, nombre: p.nombre_empleado || '', eventos: 0, uni: 0, ultimo: null };
      var o = porLegajo[leg];
      o.eventos++;
      o.uni += Number(p.uni) || 0;
      o.ultimo = p;
      if (!o.nombre && p.nombre_empleado) o.nombre = p.nombre_empleado;
    });

    var lista = Object.keys(porLegajo).map(function (k) { return porLegajo[k]; });

    if (!$('soloActivos').checked) {
      Object.keys(EMP).forEach(function (leg) {
        if (!porLegajo[leg] && EMP[leg].activo !== false) {
          lista.push({ legajo: leg, nombre: EMP[leg].nombre, eventos: 0, uni: 0, ultimo: null });
        }
      });
    }

    lista.forEach(function (o) {
      if (!o.nombre && EMP[o.legajo]) o.nombre = EMP[o.legajo].nombre;
      o.estado = o.ultimo ? estadoDe(o.ultimo) : { k: 'idle', label: 'Sin movimiento' };
    });
    var orden = { produccion: 0, issue: 1, tm: 2, idle: 3 };
    lista.sort(function (a, b) {
      var d = orden[a.estado.k] - orden[b.estado.k];
      return d !== 0 ? d : String(a.nombre).localeCompare(String(b.nombre));
    });

    var c = { produccion: 0, tm: 0, issue: 0, idle: 0 }, totUni = 0;
    lista.forEach(function (o) { c[o.estado.k]++; totUni += o.uni; });

    $('stats').innerHTML =
      card('Operarios', n0(lista.length)) +
      card('Produciendo', n0(c.produccion), 'ok') +
      card('Tiempo muerto', n0(c.tm), 'warn') +
      card('Problema matriz', n0(c.issue), 'err') +
      card('Unidades del día', n0(totUni), 'info');

    if (!lista.length) { grid.innerHTML = '<div class="empty">Sin movimiento registrado para ese día.</div>'; return; }

    grid.innerHTML = lista.map(function (o) {
      var u = o.ultimo;
      return '<div class="op-card ' + o.estado.k + '">' +
        '<div class="op-head">' +
          '<div><div class="op-nombre">' + esc(o.nombre || '(sin nombre)') + '</div>' +
          '<div class="op-legajo">Legajo ' + esc(o.legajo) + '</div></div>' +
          '<span class="badge ' + BADGE[o.estado.k] + '">' + esc(o.estado.label) + '</span>' +
        '</div>' +
        (u ? '<div class="op-line">Matriz <b>' + esc(u.matriz_raw || '—') + '</b>' + (u.nombre_matriz ? ' · ' + esc(u.nombre_matriz) : '') + '</div>' +
             '<div class="op-meta">Último evento ' + horaAR(u.fecha) + ' · ' + haceCuanto(u.fecha) + '</div>'
           : '<div class="op-line off">Sin eventos hoy</div>') +
        '<div class="op-kpis">' +
          '<div class="op-kpi">Eventos<span>' + n0(o.eventos) + '</span></div>' +
          '<div class="op-kpi">Unidades<span>' + n0(o.uni) + '</span></div>' +
        '</div>' +
      '</div>';
    }).join('');

    $('liveTxt').textContent = 'actualizado ' + horaAR(new Date().toISOString());
  }

  function card(label, value, cls) {
    return '<div class="kpi ' + (cls || '') + '"><div class="k">' + label + '</div><div class="v">' + value + '</div></div>';
  }

  function setAuto(on) {
    auto = on;
    $('btnAuto').textContent = 'Auto: ' + (on ? 'ON' : 'OFF');
    if (timer) { clearInterval(timer); timer = null; }
    if (on) timer = setInterval(cargar, 30000);
  }

  document.addEventListener('DOMContentLoaded', async function () {
    $('fDia').value = hoy();
    $('btnRefrescar').addEventListener('click', cargar);
    $('btnAuto').addEventListener('click', function () { setAuto(!auto); });
    $('fDia').addEventListener('change', cargar);
    $('soloActivos').addEventListener('change', cargar);
    await cargarEmpleados();
    await cargar();
    setAuto(true);
  });
})();
</script>
</body>
</html>
