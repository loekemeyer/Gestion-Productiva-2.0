<!doctype html>
<html lang="es">
<head>
<!-- v1.5.0 (2026-10-09) — ENTRAN SC Y SP, CON EL STOCK DE HOY [Thomas 09/10: "Agregame al módulo
     de conteo de versión tablet logística, sc y sp. Quiero que en ese módulo aparezca el stock de
     hoy ... registrar a la derecha ... cuántos cajones hay realmente ... me calcule cuántos kilos
     hay y cuántas unidades ... y que yo pueda modificar ... cuántos kilos hay ... me debe corregir
     a cuántas unidades hay realmente, pero mantener la cantidad de cajones como un dato fijo"].
     Sector Crudo y Sector Procesado salen arriba de todo, SIN cronograma ("a demanda": se cuentan
     cuando se quiere). Su planilla es otra: a la izquierda el STOCK DE HOY (cajones · kg · uni,
     del programa) y a la derecha el CONTEO REAL: Cajones -> Kg (calculado = cajones × uni_x_cajon
     × kg_x_uni) -> Uni. El Kg se puede pisar (se pesó): entonces las uni salen del kg y los cajones
     quedan como se cargaron. "↺" vuelve al kg calculado. La base guarda el kg SOLO si se pesó
     (relevamiento_item.kg NULL = calculado) y es la que calcula las uni (relev_total_uni).
     db/migracion_relev_sc_sp_cajones_kg_20261009.sql, CONOCIMIENTO §4kj.
     Mismo día [Thomas: "Agregar también sector movimiento ... cuando termino de cargar el conteo
     que lo mande a validación stock para poner si quiero que siga el stock del sistema o quede el
     del conteo"]: entra Sector Movimiento con la misma planilla (sin pesos: se cuenta en uni), y
     "Completar conteo" abre Validación de Stock con ESE conteo (?id=); el rol "envios" no tiene
     esa pantalla, así que a él se le sigue diciendo "Queda para validar". -->
<!-- v1.4.0 (2026-09-14) — ESTE ES EL "CONTEO" DE LA TABLET [usuario 2026-09-14: "dentro del
     módulo conteo tendría que aparecer lo del módulo de relevamientos. Es esa lógica"]. La
     Versión Tablet dejó de tener su propia tabla de conteo con CSV y abre esta pantalla con
     ?volver=tablet; lo único que cambia acá es que el "Atrás" devuelve a la tablet. -->
<!-- v1.3.0 (2026-09-04) — ELIMINAR VUELVE AFUERA, Y SIN FACTOR SE CUENTA SUELTO
     [usuario 2026-09-04]. (a) "que no me aparezca el eliminar cuando estoy haciendo el conteo
     adentro de la pagina ... porque no tiene sentido poder ir para atras, sino que me
     aparezca afuera": el boton sale de la barra de carga y vuelve a la linea del cronograma
     (en "Seguir cargando" y en "Contado"). Mientras se cuenta no se ofrece tirar todo por la
     borda. En "Hecho" no va: ese ya toco el stock.
     (b) "con respecto a todos los que falta factor, dejame cargar uni sueltas y elimina el
     boton, ya sea bolsa, cajon, lo que fuere": cuando no hay factor ya no se muestra el campo
     de envase deshabilitado con el cartel rojo -- era un callejon, pedia un dato que no esta.
     Ahora dice "solo sueltas" y se cuenta directo en unidades. Son 15 componentes.

     v1.2.0 (2026-09-04) — LA COMPARACION SE VA A OTRO MODULO, Y EL ELIMINAR SALE DEL
     CRONOGRAMA [usuario 2026-09-04: "que no me aparezca aca el eliminar, solo adentro" +
     "no quiero que me aparezca despues de hacer el relevamiento en el mismo modulo, porque
     eso lo van a hacer los operarios, y el operador de aca del sistema va a hacer el
     chequeo"]. Esta pantalla queda SOLO para el OPERARIO: contar y cerrar. Al completar el
     conteo vuelve al cronograma con el tilde; la comparacion conteo-vs-programa vive ahora
     en Relevamiento/Validacion_Stock.html. Eliminar quedo ADENTRO de la pantalla de carga.
     Ademas, un componente puede marcarse relev_solo_sueltas (hoy GRJ13 Bowls 330ml): no se
     cuenta por envase, solo por unidades sueltas. Es DISTINTO de "falta el factor" -- ahi el
     dato existe y no lo tenemos; aca el envase no aplica -- por eso se ve distinto y no en rojo.

     v1.1.0 (2026-09-04) — TILDE AL TERMINAR, NO SE DEJA RASTRO SI SE ENTRA A MIRAR, Y
     SIN "Bolsa Plast" [usuario 2026-09-04]. (a) Al tocar Volver, si NO se cargo nada el
     conteo se DESCARTA (relevamiento_descartar_si_vacio): entrar a mirar no es empezar a
     contar, y ya no aparece "Seguir cargando" por una prueba. Si hay aunque sea un dato se
     guarda y queda para seguir. (b) Terminado = TILDE: "Contado" o "Hecho" en verde.
     (c) Los tipos sin sector no se listan (Bolsa Plast). (d) El modulo viejo salio del menu.

     v1.0.0 (2026-09-04) — RELEVAMIENTO GP2 NATIVO.
     Pantalla nueva. NO reemplaza a Relevamiento/relevamiento.html todavia: ese lee del
     schema VIEJO (relevamiento_cervantes via public.rc_*) y esta armado sobre "plantas"
     (Cervantes/Virgilio). Este esta armado sobre SECTOR + ubicacion de GP2. Se miro la
     LOGICA del vecino (como cuenta cada tipo, envases + sueltas), no se copio su casa.

     SOLO CERVANTES [usuario 2026-09-04: "todo lo que es relevamiento de virgilio por ahora
     no, solo cervantes"]. Sale gratis: el backend filtra ubicacion.tipo='sector' y esos son
     los 11 sectores fisicos de Cervantes; Virgilio es otro tipo (ubicacion.tipo='virgilio',
     una sola fila "Virgilio (Distribucion)"). Nunca se lo toca.

     TRES PASOS [usuario 2026-09-04]:
       1) Cronograma: el proximo conteo POR SECTOR, solo fechas futuras.
       2) Cargar: TODOS los componentes del sector, para completar.
       3) Comparar: lo que dice el programa vs lo que dice el conteo; se elige cual gana,
          y por DEFAULT gana el conteo. Al aplicar, el stock queda igual al conteo.

     El total NO se calcula aca: lo calcula la base (GP2.relev_total_uni). El JS solo
     muestra. Los numeros se formatean con GP2N (gp2-numero.js), nunca a mano. -->

<style>
  /* sistema GP2 v2.0 (2026-10-09): look de gp2-modulo.css; acá sólo layout. El ancho legible lo da
     .page-mid (regla del usuario: no ocupar el 100% sin necesidad, sin huecos vacíos). */
  /* ---- lo común de Relevamiento / Validación (layout + colores del sistema) ---- */
  .leyenda{font-size:var(--fs-sm);color:var(--ink-600);margin:0 0 10px;line-height:1.5}
  .status.bad{color:var(--err-700);font-weight:600}
  .lista,.crono{display:flex;flex-direction:column;gap:var(--s2)}
  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0;
         padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
  .barra .info{font-size:var(--fs-h3);font-weight:700;color:var(--ink-900)}
  .btn.del{background:var(--surface);color:var(--err-700);border-color:var(--err-200)}
  .btn.del:hover{background:var(--err-50)}
  .desc{color:var(--ink-500);font-size:var(--fs-sm)}
  .dif{font-weight:750;font-variant-numeric:tabular-nums}
  .dif.mas{color:var(--ok-700)}
  .dif.menos{color:var(--err-700)}
  tr.igual td,.table-wrap > table.t > tbody > tr.igual > td:first-child{background:var(--surface-2);color:var(--ink-500)}
  /* Elegir quien vale: dos botones pegados, no un select (se toca con el dedo). Elegido = tinta 900. */
  .pick{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
  .pick button{min-height:44px;padding:0 14px;font-size:15px;font-weight:650;border:none;background:var(--surface);cursor:pointer;color:var(--ink-700)}
  .pick button + button{border-left:1px solid var(--line-strong)}
  .pick button.act{background:var(--ink-900);color:#fff}
  .pick button:disabled{opacity:.4;cursor:not-allowed}
  /* tarjeta-renglón (una por sector / por recepción) */
  .li,.cl{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 14px;
      background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
  .li-acts,.cl-acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;font-size:var(--fs-cap);font-weight:700;padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap;border:1px solid transparent}

  /* ---- Cronograma: una línea por sector, no una tabla ---- */
  .cl-tipo{font-size:var(--fs-h3);font-weight:700;color:var(--ink-900);min-width:150px}
  .cl-fecha{display:flex;flex-direction:column;line-height:1.15;min-width:120px}
  .cl-fecha .d{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .cl-fecha .lb{font-size:11px;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:.04em}
  .cl-comp{font-size:var(--fs-sm);color:var(--ink-600);min-width:120px}
  /* Cuánto falta: gris lejos, ámbar cerca, naranja ya casi, rojo vencido. */
  .dias{font-size:var(--fs-sm);font-weight:700;padding:4px 12px;border-radius:var(--r-pill);white-space:nowrap}
  .dias.lejos{background:var(--ink-100);color:var(--ink-700)}
  .dias.cerca{background:var(--warn-50);color:var(--warn-700);border:1px solid var(--warn-200)}
  .dias.ya{background:var(--warn-200);color:var(--warn-700)}
  .dias.vencido{background:var(--err-50);color:var(--err-700);border:1px solid var(--err-200)}
  /* Terminado: verde y con tilde, para que se vea de un golpe cuál ya está. */
  .cl.hecho{border-color:var(--ok-200);background:var(--ok-50)}
  .tilde{font-size:15px;font-weight:700;color:var(--ok-700);background:var(--surface);border:1px solid var(--ok-200);
         border-radius:var(--r-pill);padding:0 14px;min-height:36px;display:inline-flex;align-items:center;white-space:nowrap}

  /* ---- Carga ---- */
  /* Campos GRANDES: quien ve mal tiene que poder cargar sin equivocarse (regla de la casa). */
  .in-num{width:104px;min-height:50px;text-align:right;font-size:20px;font-weight:700;padding:0 10px}
  td.tot{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}
  /* NO es un error: esta pieza no se cuenta por envase. Por eso no va en rojo. */
  .solo-sueltas{font-size:var(--fs-sm);color:var(--ink-500);font-style:italic}
  tr.cargado td,.table-wrap > table.t > tbody > tr.cargado > td:first-child{background:var(--ok-50)}
  /* Bloque por envase (Remache: Bolsas / Cajones). El título se distingue del encabezado. */
  table.t tr.grupo th{font-size:var(--fs-h3);text-transform:none;letter-spacing:0;background:var(--ink-150);color:var(--ink-900);padding:10px}
  table.t tr.sub th{font-size:var(--fs-cap)}

  /* ---- SC / SP: stock de hoy | conteo real (2026-10-09) ---- */
  table.t tr.sup th{font-size:var(--fs-cap);text-align:center;background:var(--ink-150);color:var(--ink-900);padding:8px 6px}
  table.t th.hoy, td.hoy{background:var(--surface-2);color:var(--ink-600)}
  td.hoy{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  td.sep, th.sep{border-left:2px solid var(--line-strong)}
  .in-num.kg{width:120px}
  /* kg pesado a mano: se distingue del calculado */
  .in-num.kg.manual{border-color:var(--brand-500);background:var(--brand-50)}
  .kg-cel{display:inline-flex;align-items:center;gap:6px}
  .kg-reset{min-width:44px;min-height:44px;border:1.5px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);
            font-size:18px;font-weight:700;cursor:pointer;color:var(--brand-600)}
  .env-nom{display:block;font-size:var(--fs-cap);color:var(--ink-500)}
  .falta{font-size:var(--fs-sm);color:var(--ink-500);font-style:italic}
  .dias.demanda{background:var(--brand-50);color:var(--brand-700)}

  @media(max-width:430px){
    .cl-acts{margin-left:0;width:100%}
    .cl-tipo,.cl-fecha,.cl-comp{min-width:0}
    .barra .btn{flex:1;min-width:140px}
  }
</style>

<body>

<div class="card">
  <div class="header">
    <h1>📋 Relevamiento</h1>
    <div class="hbtns"><a class="back" id="btnAtrasHeader" href="../GP2_MODULOS.html">Atrás</a></div>
  </div>
  <!-- Si se entró desde la Versión Tablet (modo Conteo), el "Atrás" devuelve a la tablet
       en vez de al menú: para el operario del galpón la tablet es la casa. -->
  <script>
  (function(){
    try {
      if (new URLSearchParams(location.search).get("volver") !== "tablet") return;
      var a = document.getElementById("btnAtrasHeader");
      if (a) a.href = "../Tablet/Tablet_GP2.html";
    } catch(e){}
  })();
  </script>

  <div class="steps page-mid">

    <!-- ============ PASO 1: CRONOGRAMA ============ -->
    <div id="panCrono">
      <div class="leyenda">Próximo conteo de cada sector. Tocá <b>Contar</b> y se abre la
        planilla con <b>todos los componentes</b> de ese sector.</div>
      <div class="crono" id="crono"></div>
    </div>

    <!-- ============ PASO 2: CARGA ============ -->
    <div id="panCarga" class="hidden">
      <div class="barra">
        <button type="button" class="btn btn-secondary" id="btnVolver">← Volver</button>
        <span class="info" id="cargaTitulo"></span>
        <span class="info" id="cargaProg"></span>
      </div>
      <div class="leyenda" id="cargaAyuda"></div>
      <div class="table-wrap">
        <table class="t">
          <thead><tr id="cargaHead"></tr></thead>
          <tbody id="cargaBody"></tbody>
        </table>
      </div>
      <div class="barra">
        <button type="button" class="btn btn-secondary" id="btnGuardar">Guardar</button>
        <button type="button" class="btn btn-primary" id="btnCompletar">Completar conteo →</button>
      </div>
    </div>

    <div id="status" class="status">Cargando…</div>
  </div>
</div>

<script>
var SB = GP2_SB();
var $ = GP2UI.$;
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
/* Formato de numero: la regla es una sola y vive en gp2-numero.js. Nunca uno propio. */
function fmt(n,d){ return GP2N.fmt(n, d==null?0:d, '—'); }   /* la regla de numero de la casa; '—' sin valor */
function num(s){ return GP2N.num(s); }
/* La fecha en dd/mm/aaaa es la de la casa: GP2UI.fechaAR (gp2-ui.js). Esta pantalla tenia
   su propia copia, identica, como otras dos. Se deja el nombre local para no tocar las llamadas. */
var fmtFecha = GP2UI.fechaAR;
function msg(t, malo){
  $('status').className = 'status' + (malo?' bad':(t?' ok':''));
  $('status').textContent = t||'';
  if(t) setTimeout(function(){ if($('status').textContent===t){ $('status').textContent=''; $('status').className='status'; } }, 6000);
}

var CRONO=[], REL=null, ITEMS=[];
var CAJKG = false;   // SC / SP: se cuenta en cajones + kg (lo dice la base: relevamiento_detalle.caj_kg)

/* ---------------- PASO 1: cronograma ---------------- */
async function boot(){
  var r = await SB.rpc('relevamiento_bundle');
  if(r.error){ msg('Error: '+r.error.message, true); return; }
  CRONO = (r.data && r.data.cronograma) || [];
  pintarCrono();
  $('status').textContent='';
}

// Cuanto falta, en palabras. El color acompaña: cuanto mas cerca, mas fuerte.
function claseDias(d){
  if(d < 0)  return 'vencido';
  if(d <= 3) return 'ya';
  if(d <= 10) return 'cerca';
  return 'lejos';
}
function textoDias(d){
  if(d < 0)  return 'Vencido hace '+Math.abs(d)+(Math.abs(d)===1?' día':' días');
  if(d === 0) return 'Es hoy';
  if(d === 1) return 'Falta 1 día';
  return 'Faltan '+d+' días';
}

function pintarCrono(){
  $('crono').innerHTML = CRONO.map(function(c){
    var rel = c.relevamiento;
    var estado = rel ? rel.estado : null;
    var acts, hecho = false;
    /* Eliminar va AFUERA, en el cronograma, NO adentro de la carga [usuario 2026-09-04:
       "que no me aparezca el eliminar cuando estoy haciendo el conteo adentro de la pagina
       ... porque no tiene sentido poder ir para atras, sino que me aparezca afuera"].
       Mientras se cuenta no se ofrece tirar todo por la borda; se decide desde la lista.
       La comparacion no esta aca: vive en Validacion de Stock, que lo maneja el operador
       del sistema, no el operario. */
    var btnDel = rel ? ('<button type="button" class="btn btn-secondary del" data-del="'+rel.id+
                        '" title="Borrar el conteo y volver a empezar">Eliminar</button>') : '';
    if(estado === 'aplicado'){
      hecho = true;
      acts = '<span class="tilde">✓ Hecho</span>';   // ya toco el stock: no se borra
    } else if(estado === 'contado'){
      // El operario ya termino: tilde y listo. La validacion no es cosa suya.
      hecho = true;
      acts = '<span class="tilde">✓ Contado</span>' + btnDel;
    } else if(estado === 'en_curso' && rel.contados > 0){
      // Solo se ofrece seguir si HAY algo cargado. Un conteo abierto y vacio se descarta
      // al salir (ver salirDeCarga), asi que este caso no aparece por haber entrado a mirar.
      acts = '<button type="button" class="btn btn-primary" data-abrir="'+c.sector_id+'" data-crono="'+c.crono_id+'">'+
             'Seguir cargando ('+rel.contados+'/'+rel.items+')</button>' + btnDel;
    } else {
      acts = '<button type="button" class="btn btn-primary" data-abrir="'+c.sector_id+'" data-crono="'+c.crono_id+'">Contar</button>';
    }
    /* SC / SP / Movimiento no tienen cronograma ni fecha [Thomas 09/10: "No es Hoy. Estos stocks no
       tienen fecha"]: se cuentan cuando se quiere, contra el stock del sistema. */
    var fecha = c.a_demanda
      ? ''
      : '<span class="cl-fecha"><span class="lb">Próximo</span><span class="d">'+fmtFecha(c.fecha)+'</span></span>'+
        '<span class="dias '+claseDias(c.dias)+'">'+textoDias(c.dias)+'</span>';
    return '<div class="cl'+(hecho?' hecho':'')+'">'+
      '<span class="cl-tipo">'+esc(c.tipo)+'</span>'+
      fecha+
      '<span class="cl-comp">'+fmt(c.componentes)+' componentes</span>'+
      '<span class="cl-acts">'+acts+'</span>'+
    '</div>';
  }).join('') || '<div class="empty">No hay conteos programados.</div>';

  document.querySelectorAll('[data-abrir]').forEach(function(b){
    // sin cronograma (SC/SP) el data-crono dice "null": se manda null, no NaN
    var k = Number(b.dataset.crono);
    b.addEventListener('click', function(){ abrir(Number(b.dataset.abrir), isFinite(k) && k > 0 ? k : null); });
  });
  document.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click', function(){ eliminar(Number(b.dataset.del)); });
  });
}

/* Borrar un conteo y volver a empezar. Solo se puede mientras el stock NO se toco
   (en_curso o contado); si ya se aplico, la base lo rechaza y se avisa. */
async function eliminar(relId){
  if(!confirm('Se borra el conteo entero y el sector vuelve a quedar como antes, para contarlo de nuevo.\n\n¿Eliminar?')) return;
  var r = await SB.rpc('relevamiento_eliminar', { p_id: relId });
  if(r.error){ msg('No se pudo eliminar: '+r.error.message, true); return; }
  msg('✓ Conteo eliminado');
  await boot();
  mostrar('crono');
}

/* ---------------- PASO 2: carga ---------------- */
async function abrir(sectorId, cronoId){
  msg('Abriendo…');
  var r = await SB.rpc('relevamiento_abrir', { p_sector_id:sectorId, p_crono_id:cronoId, p_encargado:null });
  if(r.error){ msg('Error: '+r.error.message, true); return; }
  await cargarDetalle(Number(r.data));
}

async function cargarDetalle(relId){
  var r = await SB.rpc('relevamiento_detalle', { p_id: relId });
  if(r.error){ msg('Error: '+r.error.message, true); return; }
  REL = r.data.relevamiento; REL.sector = r.data.sector;
  CAJKG = !!r.data.caj_kg;
  /* Orden alfanumerico natural (GRJ2 antes que GRJ10) [usuario 2026-10-08: "Ordename
     alfanumericamente ... Todos los relevamientos"]. La base ordena por codigo como texto. */
  ITEMS = (r.data.items || []).sort(function(a,b){
    return String(a.codigo||'').localeCompare(String(b.codigo||''), 'es', { numeric:true });
  });
  pintarCarga();
  mostrar('carga');
  $('status').textContent='';
}

// El fleje se cuenta en KILOS; el resto en envases + sueltas. El encabezado cambia solo.
function cuentaKg(){ return ITEMS.length>0 && ITEMS[0].cuenta_kg; }
function nombreEnvase(){ return (ITEMS[0] && ITEMS[0].envase) || 'Envases'; }

/* Un sector puede mezclar envases: Remache se cuenta en BOLSAS (V sin SE y W1P..W9P) y en
   CAJONES el resto [usuario 2026-10-08: "Dividí en 2. 1) Bolsas ... 2) Cajones para todo el
   resto"]. El envase lo decide la base (relev_factor / componente.relev_envase); la pantalla
   solo agrupa: con 2+ envases la tabla se parte en un bloque por envase, cada uno con su
   encabezado. Con uno solo queda como siempre. Lo que no tiene envase va con el primer bloque. */
function gruposEnvase(){
  var nombres = [];
  ITEMS.forEach(function(i){ if(i.envase && nombres.indexOf(i.envase)<0) nombres.push(i.envase); });
  if(nombres.length < 2) return null;
  nombres.sort(function(a,b){ return a.localeCompare(b, 'es'); });
  return nombres.map(function(n, k){
    return { envase:n, items: ITEMS.filter(function(i){ return i.envase===n || (k===0 && !i.envase); }) };
  });
}
function encabezado(envase){
  return '<th>Insumo</th><th class="num">'+esc(envase)+'</th><th class="num">Sueltas</th><th class="num">Total</th>';
}

function pintarCarga(){
  if(CAJKG) return pintarCargaCajKg();
  var grupos = cuentaKg() ? null : gruposEnvase();
  $('cargaTitulo').textContent = REL.sector + ' · ' + fmtFecha(REL.fecha);
  $('cargaAyuda').innerHTML = cuentaKg()
    ? 'Cargá el <b>total de kilos</b> de cada fleje.'
    : 'Cargá <b>'+(grupos
        ? grupos.map(function(g){ return esc(g.envase.toLowerCase()); }).join('</b> o <b>')
        : esc(nombreEnvase().toLowerCase()))+'</b> y las <b>unidades sueltas</b>. El total lo calcula el sistema.';

  $('cargaHead').innerHTML = cuentaKg()
    ? '<th>Insumo</th><th class="num">Total Kg</th><th class="num">Total</th>'
    : (grupos ? '' : encabezado(nombreEnvase()));

  $('cargaBody').innerHTML = grupos
    ? grupos.map(function(g){
        return '<tr class="grupo"><th colspan="4">'+esc(g.envase)+' · '+g.items.length+'</th></tr>'+
               '<tr class="sub">'+encabezado(g.envase)+'</tr>'+
               g.items.map(filaCarga).join('');
      }).join('')
    : ITEMS.map(filaCarga).join('');

  document.querySelectorAll('.in-num').forEach(function(inp){
    inp.addEventListener('input', function(){ recalcularFila(Number(inp.dataset.id)); });
  });
  progreso();
}

/* ---------------- SC / SP: cajones -> kg -> uni (2026-10-09) ----------------
   Izquierda el STOCK DE HOY (lo que dice el programa), derecha el CONTEO REAL. El kg arranca
   calculado de los cajones; si se pesa y se corrige, las uni salen del kg y los cajones quedan
   como se cargaron. Lo que la pieza no permite (sin uni_x_cajon, sin kg_x_uni) no se inventa. */
function tieneF(i){ return i.factor!=null && Number(i.factor)>0; }
function tieneKxu(i){ return i.kg_x_uni!=null && Number(i.kg_x_uni)>0; }
function soloUni(i){ return !tieneF(i) && !tieneKxu(i); }
function kgCalc(i, caj){
  if(caj==null || !tieneF(i) || !tieneKxu(i)) return null;
  return GP2N.aKg(i.kg_x_uni, Math.round(caj*Number(i.factor)));
}

function pintarCargaCajKg(){
  $('cargaTitulo').textContent = REL.sector + ' · ' + fmtFecha(REL.fecha);
  $('cargaAyuda').innerHTML = 'A la izquierda, el <b>stock del sistema</b>. A la derecha cargá los '+
    '<b>cajones</b> que hay realmente: los kilos y las unidades se calculan solos. Si pesaste, '+
    '<b>corregí los kilos</b> y las unidades se ajustan (los cajones quedan como los cargaste).';
  $('cargaHead').innerHTML = '';
  $('cargaBody').innerHTML =
    '<tr class="sup"><th></th><th class="hoy" colspan="3">Stock del sistema</th>'+
    '<th class="sep" colspan="3">Conteo real</th></tr>'+
    '<tr class="sub"><th>Insumo</th><th class="num hoy">Cajones</th><th class="num hoy">Kg</th><th class="num hoy">Uni</th>'+
    '<th class="num sep">Cajones</th><th class="num">Kg</th><th class="num">Uni</th></tr>'+
    ITEMS.map(filaCajKg).join('');

  document.querySelectorAll('.in-num').forEach(function(inp){
    inp.addEventListener('input', function(){
      var id = Number(inp.dataset.id);
      // tocar el kg = se peso: deja de seguir a los cajones
      if(inp.dataset.k==='kg') inp.classList.add('manual');
      recalcularCajKg(id);
    });
    // kg borrado y abandonado = no se peso: vuelve al calculado (sin rellenar mientras se tipea)
    if(inp.dataset.k==='kg') inp.addEventListener('change', function(){
      if(inp.value.trim()===''){ inp.classList.remove('manual'); recalcularCajKg(Number(inp.dataset.id)); }
    });
  });
  document.querySelectorAll('[data-reset]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = Number(b.dataset.reset);
      var el = document.querySelector('.in-num[data-id="'+id+'"][data-k="kg"]');
      if(el) el.classList.remove('manual');
      recalcularCajKg(id);
    });
  });
  progreso();
}

function filaCajKg(i){
  var st = Number(i.stock_programa)||0;
  var hoyCaj = tieneF(i) ? fmt(st/Number(i.factor), 1) : '—';
  var hoyKg  = tieneKxu(i) ? fmt(GP2N.aKg(i.kg_x_uni, st), 1) : '—';
  var envNom = (i.envase && i.envase!=='Cajones') ? '<span class="env-nom">'+esc(i.envase)+' de '+fmt(i.factor)+'</span>' : '';
  var manual = i.kg!=null;
  var kgVal = manual ? i.kg : kgCalc(i, i.envases);
  var celCaj = tieneF(i)
    ? '<input class="in-num" inputmode="decimal" data-k="envases" data-id="'+i.item_id+'" value="'+
        (i.envases!=null ? fmt(i.envases, 2) : '')+'">'+envNom
    : '<span class="falta">sin uni × cajón</span>';
  var celKg = tieneKxu(i)
    ? '<span class="kg-cel"><input class="in-num kg'+(manual?' manual':'')+'" inputmode="decimal" data-k="kg" data-id="'+i.item_id+'"'+
        ' value="'+(kgVal!=null ? fmt(kgVal, 2) : '')+'">'+
        '<button type="button" class="kg-reset" data-reset="'+i.item_id+'" title="Volver al kg calculado de los cajones"'+
        (manual?'':' style="visibility:hidden"')+'>↺</button></span>'
    : '<span class="falta">sin kg × uni</span>';
  // sin uni_x_cajon ni kg_x_uni no hay de donde calcular: se cargan las uni directo
  var celUni = soloUni(i)
    ? '<input class="in-num" inputmode="numeric" data-k="sueltas" data-id="'+i.item_id+'" value="'+(i.sueltas!=null?fmt(i.sueltas):'')+'">'
    : fmt(i.total_uni);
  var cargado = (i.envases!=null || i.sueltas!=null || i.kg!=null);
  return '<tr'+(cargado?' class="cargado"':'')+' data-row="'+i.item_id+'">'+
    '<td><span class="cod">'+esc(i.codigo)+'</span><br><span class="desc">'+esc(i.descripcion||'')+'</span></td>'+
    '<td class="hoy">'+hoyCaj+'</td><td class="hoy">'+hoyKg+'</td><td class="hoy">'+fmt(st)+'</td>'+
    '<td class="num sep">'+celCaj+'</td>'+
    '<td class="num">'+celKg+'</td>'+
    '<td class="tot num" data-tot="'+i.item_id+'">'+celUni+'</td>'+
  '</tr>';
}

function kgManual(id){
  var el = document.querySelector('.in-num[data-id="'+id+'"][data-k="kg"]');
  return !!(el && el.classList.contains('manual'));
}

/* Espejo de GP2.relev_total_uni para SC/SP, solo para ver el numero al tipear. */
function recalcularCajKg(id){
  var i = itemDe(id); if(!i) return;
  var caj = valorDe(id,'envases');
  var kgEl = document.querySelector('.in-num[data-id="'+id+'"][data-k="kg"]');
  var manual = kgManual(id);
  if(kgEl && !manual){
    var kc = kgCalc(i, caj);
    kgEl.value = kc!=null ? fmt(kc, 2) : '';
  }
  var rb = document.querySelector('[data-reset="'+id+'"]');
  if(rb) rb.style.visibility = manual ? '' : 'hidden';
  var t = null;
  if(soloUni(i)) t = valorDe(id,'sueltas');
  else if(manual){ var kg = valorDe(id,'kg'); if(kg!=null){ var u = GP2N.aUni(i.kg_x_uni, kg); t = u===null ? null : Math.round(u); } }
  else if(caj!=null && tieneF(i)) t = Math.round(caj*Number(i.factor));
  if(!soloUni(i)){ var td = document.querySelector('[data-tot="'+id+'"]'); if(td) td.textContent = fmt(t); }
  var tr = document.querySelector('[data-row="'+id+'"]');
  if(tr) tr.classList.toggle('cargado', t!=null || caj!=null);
  progreso();
}

function filaCarga(i){
    var cargado = (i.envases!=null || i.sueltas!=null || i.kg!=null);
    var celdas;
    if(i.cuenta_kg){
      celdas = '<td class="num"><input class="in-num" inputmode="decimal" data-k="kg" data-id="'+i.item_id+'" value="'+(i.kg!=null?String(i.kg).replace('.',','):'')+'"></td>';
    } else {
      /* No se pide envase en dos casos, y en los dos se carga DIRECTO en uni sueltas
         [usuario 2026-09-04: "con respecto a todos los que falta factor, dejame cargar uni
         sueltas y elimina el boton, ya sea bolsa, cajon, lo que fuere"]:
           - envase NULL -> la pieza no se cuenta por envase (ej. GRJ13 Bowls 330ml)
           - factor NULL -> no sabemos cuantas unidades entran en el envase
         Antes el campo quedaba deshabilitado con un cartel rojo, y era un callejon: pedia
         un dato que no esta. Ahora simplemente no aparece y se cuenta suelto. */
      var sinEnvase = (i.envase==null) || (i.factor==null);
      celdas =
        '<td class="num">'+
          (sinEnvase
            ? '<span class="solo-sueltas">solo sueltas</span>'
            : '<input class="in-num" inputmode="numeric" data-k="envases" data-id="'+i.item_id+'"'+
              ' value="'+(i.envases!=null?i.envases:'')+'">')+
        '</td>'+
        '<td class="num"><input class="in-num" inputmode="numeric" data-k="sueltas" data-id="'+i.item_id+'" value="'+(i.sueltas!=null?i.sueltas:'')+'"></td>';
    }
    return '<tr'+(cargado?' class="cargado"':'')+' data-row="'+i.item_id+'">'+
      '<td><span class="cod">'+esc(i.codigo)+'</span><br><span class="desc">'+esc(i.descripcion||'')+'</span></td>'+
      celdas+
      '<td class="tot num" data-tot="'+i.item_id+'">'+fmt(i.total_uni)+'</td>'+
    '</tr>';
}

function itemDe(id){ return ITEMS.filter(function(x){ return x.item_id===id; })[0]; }
function valorDe(id, k){
  var el = document.querySelector('.in-num[data-id="'+id+'"][data-k="'+k+'"]');
  if(!el || el.value.trim()==='') return null;
  return num(el.value);
}

/* Espejo del calculo de la base (GP2.relev_total_uni), SOLO para que el numero se vea al
   instante mientras se tipea. La verdad la sigue diciendo la base al guardar. */
function recalcularFila(id){
  var i = itemDe(id); if(!i) return;
  var t = null;
  if(i.cuenta_kg){
    var kg = valorDe(id,'kg');
    // regla de la casa (GP2N.aUni): sin kg_x_uni no hay conversion, y eso se dice con null
    if(kg!=null){ var u = GP2N.aUni(i.kg_x_uni, kg); t = (i.unidad==='kg') ? kg : (u===null ? null : Math.round(u)); }
  } else if(i.envase==null || i.factor==null){
    t = valorDe(id,'sueltas');            // sin envase: el total ES lo suelto
  } else {
    var e = valorDe(id,'envases'), s = valorDe(id,'sueltas');
    if(e==null && s==null) t = null;
    else if(!e) t = s||0;
    else t = (i.factor!=null) ? (e*Number(i.factor) + (s||0)) : null;
  }
  var td = document.querySelector('[data-tot="'+id+'"]');
  if(td) td.textContent = fmt(t);
  var tr = document.querySelector('[data-row="'+id+'"]');
  if(tr) tr.classList.toggle('cargado', t!=null || valorDe(id,'sueltas')!=null);
  progreso();
}

function filasCargadas(){
  return ITEMS.filter(function(i){
    return valorDe(i.item_id,'envases')!=null || valorDe(i.item_id,'sueltas')!=null || valorDe(i.item_id,'kg')!=null;
  }).length;
}
function progreso(){
  $('cargaProg').textContent = filasCargadas()+' de '+ITEMS.length+' cargados';
}

function payloadCarga(){
  // SC / SP: el kg viaja SOLO si se peso a mano; si no, la base calcula de los cajones
  if(CAJKG) return ITEMS.map(function(i){
    return { item_id:i.item_id,
             envases: valorDe(i.item_id,'envases'),
             sueltas: valorDe(i.item_id,'sueltas'),
             kg:      kgManual(i.item_id) ? valorDe(i.item_id,'kg') : null };
  });
  return ITEMS.map(function(i){
    return { item_id:i.item_id,
             envases: i.cuenta_kg ? null : valorDe(i.item_id,'envases'),
             sueltas: i.cuenta_kg ? null : valorDe(i.item_id,'sueltas'),
             kg:      i.cuenta_kg ? valorDe(i.item_id,'kg') : null };
  });
}

async function guardar(silencioso){
  var r = await SB.rpc('relevamiento_guardar', { p_id: REL.id, p_items: payloadCarga() });
  if(r.error){ msg('Error al guardar: '+r.error.message, true); return false; }
  if(!silencioso) msg('✓ Guardado');
  return true;
}

$('btnGuardar').addEventListener('click', function(){ guardar(false); });

$('btnCompletar').addEventListener('click', async function(){
  var n = filasCargadas();
  if(n === 0){ msg('No cargaste ningún conteo todavía.', true); return; }
  if(n < ITEMS.length &&
     !confirm('Cargaste '+n+' de '+ITEMS.length+'.\n\nLo que no contaste NO se toca: queda con el stock del programa.\n\n¿Completar el conteo?')) return;
  $('btnCompletar').disabled = true;
  try{
    if(!(await guardar(true))) return;
    var r = await SB.rpc('relevamiento_cerrar', { p_id: REL.id });
    if(r.error) throw r.error;
    /* Terminado el conteo se va DERECHO a Validacion de Stock con ese conteo abierto, para
       elegir sistema o conteo [Thomas 2026-10-09]. El rol "envios" no tiene esa pantalla
       (auth-guard): ahi termina como antes y lo valida el operador del sistema. */
    if((sessionStorage.getItem('gp_role') || 'admin') !== 'envios'){
      var deTablet = new URLSearchParams(location.search).get('volver') === 'tablet';
      location.href = 'Validacion_Stock.html?id=' + REL.id + (deTablet ? '&volver=tablet' : '');
      return;
    }
    msg('✓ Conteo completado. Queda para validar.');
    REL=null; ITEMS=[];
    await boot();
    mostrar('crono');
  }catch(e){ msg('Error: '+(e.message||e), true); }
  finally{ $('btnCompletar').disabled = false; }
});

/* ---------------- navegacion ---------------- */
function mostrar(p){
  $('panCrono').classList.toggle('hidden', p!=='crono');
  $('panCarga').classList.toggle('hidden', p!=='carga');
}
/* Salir de la carga. Si se entro y no se cargo NADA, el conteo se descarta: entrar a mirar
   no es empezar a contar [usuario 2026-09-04: "que si salgo, despues de haber puesto contar,
   no me aparezca seguir cargando, porque lo estoy usando como prueba"].
   Si hay aunque sea un dato, se guarda y queda para seguir: eso NO se pierde. */
async function salirDeCarga(){
  try{
    if(REL && REL.id){
      if(filasCargadas() > 0) await guardar(true);
      else await SB.rpc('relevamiento_descartar_si_vacio', { p_id: REL.id });
    }
  }catch(e){ /* si falla, igual se vuelve al cronograma */ }
  REL = null; ITEMS = []; CAJKG = false;
  await boot();
  mostrar('crono');
}
$('btnVolver').addEventListener('click', salirDeCarga);

boot();
</script>
