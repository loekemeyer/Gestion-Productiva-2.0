<!doctype html>
<html lang="es">
<head>
<script src="../auth-guard.js?v=20261006b"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Control Cajas · GP2</title>
<link rel="icon" href="../GP2_favicon.png"/>
<link rel="stylesheet" href="../gp2-modulo.css?v=20261008ds">
<style>
  /* Lo generico (barra, campos, botones, badge, aviso, vacio, aspecto del popup) es de
     gp2-modulo.css. Aca solo lo propio: los remitos con sus tarjetas y el popup de conteo
     (tablet del galpon: numeros grandes). Virgilio lleva su color de DOMINIO (naranja). */
  :root{--virg:#9a3412;--virg-soft:#fff7ed;--virg-line:#fdba74}
  .status.bad,.msg.bad{color:var(--err)}

  .toolbar .cta-count{margin-left:auto;align-self:center;height:auto;padding:6px 12px;font-size:14px}
  .cta-count.done{background:var(--ok-soft);color:var(--ok)}

  /* un remito = un bloque con sus cajas */
  .rem-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--s3);overflow:hidden}
  .rem-hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .rem-hdr .rem-title{font-weight:700;color:var(--ink);font-size:17px}
  .rem-hdr .rem-meta{color:var(--ink-3);font-size:var(--fs-sm)}
  .rem-hdr .rem-badge{padding:4px 10px;border-radius:var(--r-pill);font-weight:700;font-size:var(--fs-sm);white-space:nowrap;background:var(--pri-soft);color:var(--pri-h)}
  .rem-hdr .rem-badge.done{background:var(--ok-soft);color:var(--ok)}

  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s3);padding:var(--s3)}
  .item-btn{position:relative;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);padding:12px 10px;cursor:pointer;text-align:center;font-weight:600;transition:border-color .12s,background .12s}
  .item-btn:hover{border-color:var(--pri)}
  .item-btn.done{border-color:var(--ok-line);background:var(--ok-soft)}
  .item-btn .cod{display:block;font-size:24px;font-weight:800}
  .item-btn .desc{display:block;font-size:16px;color:var(--ink);margin-top:4px;font-weight:650}
  .item-btn .decl{display:block;margin-top:10px;font-size:15px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-sm);padding:6px}
  .item-btn .decl b{color:var(--pri-ink);font-size:17px}
  .item-btn .decl.virg,.item-btn .decl.virg b{color:var(--virg)}
  .item-btn .decl.virg{background:var(--virg-soft)}
  .item-btn .ctrl{display:block;margin-top:6px;font-size:14px;color:var(--ok);font-weight:700}
  .item-btn .ctrl small{display:block;color:var(--ink-3);font-weight:500;font-size:12px}
  .item-btn .diff{display:block;margin-top:2px;font-size:13px;font-weight:700}
  .item-btn .diff.dif{color:var(--err)}
  .item-btn .diff.ok{color:var(--ok)}
  .item-btn .tilde{position:absolute;top:6px;right:8px;color:var(--ok);font-size:22px;font-weight:800;display:none}
  .item-btn.done .tilde{display:block}

  /* Popup: mostrar/ocultar es de la pantalla (.open); fondo y tarjeta, del sistema */
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:var(--s4);z-index:100}
  .overlay.open{display:flex}
  .modal{width:min(560px,100%);max-height:94vh;overflow-y:auto;padding:var(--s5)}
  .modal h3{font-size:var(--fs-xl);margin-bottom:10px}
  .modal .item-info{background:var(--surface-2);border:1px solid var(--line);padding:12px;border-radius:var(--r-sm);margin-bottom:12px;font-size:16px;line-height:1.45}

  /* conteo: base x pisos + sueltas, numeros grandes */
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);align-items:end}
  .grid3 .fld label{display:block;font-size:15px;font-weight:700;margin-bottom:4px;color:var(--ink-2);text-align:center}
  .grid3 .fld input{width:100%;min-height:60px;padding:0 6px;font-size:28px;text-align:center;font-weight:800}

  .paq-line{margin-top:14px;padding:10px 12px;background:var(--pri-soft);border:1px solid var(--pri-line);border-radius:var(--r-sm);font-size:18px;font-weight:700;color:var(--ink-2);text-align:center}
  .paq-line b{color:var(--ink)}
  .total-line{margin-top:10px;padding:14px;background:var(--bar);color:#fff;border-radius:var(--r-sm);font-size:24px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
  .diff-line{margin-top:8px;padding:10px 12px;border-radius:var(--r-sm);font-size:16px;font-weight:700;text-align:center}
  .diff-line.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
  .diff-line.bad{background:var(--err-soft);color:var(--err);border:1px solid var(--err-line)}

  /* A Virgilio: lo que no entro a Cervantes y se bajo directo a Virgilio */
  .virg-line{margin-top:8px;padding:10px 12px;border-radius:var(--r-sm);font-size:16px;font-weight:700;text-align:center;background:var(--virg-soft);color:var(--virg);border:1px solid var(--virg-line)}
  .virg-box{margin-top:10px;padding:12px;background:var(--virg-soft);border:1px solid var(--virg-line);border-radius:var(--r-sm);display:flex;flex-wrap:wrap;gap:10px;align-items:end}
  .virg-box label{display:block;font-size:15px;font-weight:700;color:var(--virg);width:100%}
  .virg-box input{flex:1;min-width:120px;min-height:52px;padding:0 8px;font-size:24px;text-align:center;font-weight:800;border-color:var(--virg-line)}
  .virg-box .btn,.virg-box .btn:hover{flex:0 0 auto;background:var(--virg);border-color:var(--virg);color:#fff}
  /* "→ Virgilio" arriba [Thomas 2026-10-02]: boton al tope del popup que despliega el input. */
  .btn.btn-virg-top{margin:0 0 12px;background:var(--virg-soft);color:var(--virg);border-color:var(--virg-line)}
  .btn.btn-virg-top:hover{background:#ffedd5;border-color:var(--virg)}
  .btn.btn-virg-top.on{background:var(--virg);color:#fff;border-color:var(--virg)}

  .modal .actions{margin-top:16px;justify-content:stretch}
  .modal .actions .btn{flex:1 1 110px;min-height:52px;font-size:18px}
  .msg{margin-top:10px;font-size:15px}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Control Cajas</h1>
    <!-- "Atrás" vuelve a donde se vino (la tablet o la recepcion); sin historial, al menu -->
    <div class="hbtns"><a href="../GP2_MODULOS.html" onclick="if(history.length>1){history.back();return false}">Atrás</a></div>
  </div>
  <div class="steps">
    <div class="toolbar">
      <div class="field">
        <label for="selEstado">Estado</label>
        <select id="selEstado">
          <option value="pendientes" selected>Pendientes</option>
          <option value="controladas">Controladas</option>
          <option value="todas">Todas</option>
        </select>
      </div>
      <div class="field">
        <label for="selProv">Proveedor</label>
        <select id="selProv"><option value="todos">Todos</option></select>
      </div>
      <span id="ctaCount" class="cta-count badge pri">0 items</span>
    </div>

    <div id="statusMsg" class="status"></div>
    <div id="lista"></div>
  </div>
</div>

<!-- Popup control por item -->
<div id="ovCtrl" class="overlay">
  <div class="modal">
    <h3 id="ctrlTitle">Control caja</h3>
    <div class="item-info" id="ctrlInfo"></div>

    <!-- A Virgilio ARRIBA [Thomas 2026-10-02: "que sea un botón arriba"]: lo que no entró a Cervantes
         y se bajó directo a Virgilio. El botón despliega el input. -->
    <button class="btn btn-virg-top" id="btnVirgilio" type="button" title="Mandar a Virgilio lo que no entró a Cervantes">→ Virgilio</button>
    <div class="virg-line" id="virgLine" style="display:none"></div>
    <div class="virg-box" id="virgBox" style="display:none">
      <label for="inVirg">Enviar a Virgilio (uni)</label>
      <input type="text" id="inVirg" inputmode="numeric" placeholder="0" />
      <button class="btn btn-secondary" id="btnVirgSave">Guardar envío</button>
    </div>

    <div class="grid3">
      <div class="fld">
        <label>Base</label>
        <input type="text" id="inBase" inputmode="numeric" placeholder="0" />
      </div>
      <div class="fld">
        <label>Pisos</label>
        <input type="text" id="inPisos" inputmode="numeric" placeholder="0" />
      </div>
      <div class="fld">
        <label>Sueltas</label>
        <input type="text" id="inSueltas" inputmode="numeric" placeholder="0" />
      </div>
    </div>

    <div class="paq-line">Paquetes: <b id="lblPaq">0</b> &nbsp;·&nbsp; Cajas por paquete: <b id="lblUpp">25</b></div>
    <div class="total-line" id="lblTotal">Total: 0 cajas</div>
    <div class="diff-line" id="lblDiff" style="display:none"></div>

    <div class="actions">
      <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
      <button class="btn btn-danger" id="btnDesmarcar" style="display:none">Desmarcar</button>
      <button class="btn btn-primary" id="btnConfirm" disabled>Confirmar control</button>
    </div>
    <div class="msg" id="ctrlMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js?v=20260929a"></script>
<script src="control-cajas.js?v=20261008dsD"></script>
<script src="../gp2-menu.js?v=20261008ds"></script>
<script src="../gp2-nav.js?v=20261008ds"></script>
</body>
</html>
