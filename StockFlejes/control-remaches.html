<!doctype html>
<html lang="es">
<head>
<script src="../auth-guard.js?v=20261006b"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Control Remaches · GP2</title>
<link rel="icon" href="../GP2_favicon.png"/>
<link rel="stylesheet" href="../gp2-modulo.css?v=20261008ds">
<style>
  /* Lo generico (barra, campos, botones, badge, vacio, aspecto del popup) es de gp2-modulo.css.
     Aca solo lo propio: los remitos con sus tarjetas y el popup del control en kg (tablet del
     galpon: numeros grandes). Misma forma que control-cajas.html. */
  .status.bad,.msg.bad{color:var(--err)}

  .toolbar .cta-count{margin-left:auto;align-self:center;height:auto;padding:6px 12px;font-size:14px}
  .cta-count.done{background:var(--ok-soft);color:var(--ok)}

  /* un remito = un bloque con sus items */
  .rem-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--s3);overflow:hidden}
  .rem-hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .rem-hdr .rem-title{font-weight:700;color:var(--ink);font-size:17px}
  .rem-hdr .rem-meta{color:var(--ink-3);font-size:var(--fs-sm)}
  .rem-hdr .rem-badge{padding:4px 10px;border-radius:var(--r-pill);font-weight:700;font-size:var(--fs-sm);white-space:nowrap;background:var(--pri-soft);color:var(--pri-h)}
  .rem-hdr .rem-badge.done{background:var(--ok-soft);color:var(--ok)}

  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s3);padding:var(--s3)}
  .item-btn{position:relative;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);padding:12px 10px;cursor:pointer;text-align:center;font-weight:600;transition:border-color .12s,background .12s}
  .item-btn:hover{border-color:var(--pri)}
  .item-btn.done{border-color:var(--ok-line);background:var(--ok-soft)}
  .item-btn .cod{display:block;font-size:24px;font-weight:800}
  .item-btn .desc{display:block;font-size:16px;color:var(--ink);margin-top:4px;font-weight:650}
  .item-btn .decl{display:block;margin-top:10px;font-size:15px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-sm);padding:6px}
  .item-btn .decl b{color:var(--pri-ink);font-size:17px}
  .item-btn .ctrl{display:block;margin-top:6px;font-size:14px;color:var(--ok);font-weight:700}
  .item-btn .diff{display:block;margin-top:2px;font-size:13px;font-weight:700}
  .item-btn .diff.dif{color:var(--err)}
  .item-btn .diff.ok{color:var(--ok)}
  .item-btn .tilde{position:absolute;top:6px;right:8px;color:var(--ok);font-size:22px;font-weight:800;display:none}
  .item-btn.done .tilde{display:block}

  /* Popup: mostrar/ocultar es de la pantalla (.open); fondo y tarjeta, del sistema */
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:var(--s4);z-index:100}
  .overlay.open{display:flex}
  .modal{width:min(520px,100%);max-height:94vh;overflow-y:auto;padding:var(--s5)}
  .modal h3{font-size:var(--fs-xl);margin-bottom:10px}
  .modal .item-info{background:var(--surface-2);border:1px solid var(--line);padding:12px;border-radius:var(--r-sm);margin-bottom:12px;font-size:16px;line-height:1.45}

  /* Cajas x kg por caja: solo para los insumos que el proveedor entrega en
     cajas pesadas (componente.recibe_en_cajas). Dos campos al lado del otro,
     que llenan solos los kg controlados. */
  .cajas-box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-bottom:12px}
  .cajas-2{display:flex;gap:10px;flex-wrap:wrap}
  .cajas-2 > div{flex:1 1 130px}
  .cajas-2 label{display:block;font-size:16px;font-weight:700;margin-bottom:6px;color:var(--ink-2)}
  .cajas-2 input{width:100%;min-height:56px;padding:0 10px;font-size:24px;text-align:center;font-weight:800}
  .cajas-calc{margin-top:10px;font-size:17px;font-weight:700;color:var(--ink-2);text-align:center}

  .fld label{display:block;font-size:16px;font-weight:700;margin-bottom:6px;color:var(--ink-2)}
  .fld input{width:100%;min-height:64px;padding:0 12px;font-size:30px;text-align:center;font-weight:800}

  .uni-line{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);font-size:17px;font-weight:700;text-align:center;background:var(--pri-soft);color:var(--ink-2);border:1px solid var(--pri-line)}
  .uni-line b{font-size:20px;color:var(--ink)}
  .uni-line .uni-nota{font-weight:600;font-size:14px;color:var(--ink-3)}

  .diff-line{margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);font-size:16px;font-weight:700;text-align:center}
  .diff-line.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
  .diff-line.bad{background:var(--err-soft);color:var(--err);border:1px solid var(--err-line)}

  .modal .actions{margin-top:16px}
  .modal .actions .btn{flex:1 1 110px;min-height:52px;font-size:18px}
  .msg{margin-top:10px;font-size:15px}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <!-- El titulo lo pisa el JS con el sector que llega en ?sector= (default 8,
         Remaches). Sirve tambien para Plasticos (?sector=6). -->
    <h1 id="pageTitle">Control Remaches</h1>
    <!-- "Atrás" vuelve a donde se vino (la tablet o la recepcion); sin historial, al menu -->
    <div class="hbtns"><a href="../GP2_MODULOS.html" onclick="if(history.length>1){history.back();return false}">Atrás</a></div>
  </div>
  <div class="steps">
    <div class="toolbar">
      <div class="field">
        <label for="selEstado">Estado</label>
        <select id="selEstado">
          <option value="pendientes" selected>Pendientes</option>
          <option value="controladas">Controladas</option>
          <option value="todas">Todas</option>
        </select>
      </div>
      <div class="field">
        <label for="selProv">Proveedor</label>
        <select id="selProv"><option value="todos">Todos</option></select>
      </div>
      <span id="ctaCount" class="cta-count badge pri">0 items</span>
    </div>

    <div id="statusMsg" class="status"></div>
    <div id="lista"></div>
  </div>
</div>

<!-- Popup control por item -->
<div id="ovCtrl" class="overlay">
  <div class="modal">
    <h3 id="ctrlTitle">Control remache</h3>
    <div class="item-info" id="ctrlInfo"></div>

    <!-- Se muestra solo si el insumo viene en cajas pesadas: el operario cuenta
         cajas y pesa una, y los kg controlados salen de la multiplicacion
         [usuario 2026-09-03: "en el caso del control de este componente que me
         deje poner cant de cajas y kg por caja"]. -->
    <div class="cajas-box" id="cajasBox" style="display:none">
      <div class="cajas-2">
        <div>
          <label for="inCajas">Cajas</label>
          <input type="text" id="inCajas" inputmode="numeric" placeholder="0" />
        </div>
        <div>
          <label for="inKgCaja">Kg por caja</label>
          <input type="text" id="inKgCaja" inputmode="decimal" placeholder="0,0" />
        </div>
      </div>
      <div class="cajas-calc" id="lblCajas"></div>
    </div>

    <div class="fld">
      <!-- El texto y el teclado los pone el JS segun la unidad de la recepcion:
           kg cuando se pesa (con o sin pasaje a unidades) y unidades cuando el
           componente no tiene kg_x_uni y hay que contarlas. -->
      <label id="lblKg" for="inKg">Kg controlados (pesados)</label>
      <input type="text" id="inKg" inputmode="decimal" placeholder="0,0" />
    </div>

    <!-- Pasaje a unidades: aparece solo si el insumo tiene kg por unidad. -->
    <div class="uni-line" id="lblUni" style="display:none"></div>

    <div class="diff-line" id="lblDiff" style="display:none"></div>

    <div class="actions">
      <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
      <button class="btn btn-danger" id="btnDesmarcar" style="display:none">Desmarcar</button>
      <button class="btn btn-primary" id="btnConfirm" disabled>Confirmar control</button>
    </div>
    <div class="msg" id="ctrlMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js?v=20260929a"></script>
<!-- La regla de numero de la casa (punto = miles, coma = decimales): con esto
     los campos se formatean solos y nadie escribe su propio parser. -->
<script src="../gp2-numero.js?v=20260911o"></script>
<script src="control-remaches.js?v=20261008dsD"></script>
<script src="../gp2-menu.js?v=20261008ds"></script>
<script src="../gp2-nav.js?v=20261008ds"></script>
</body>
</html>
