<!doctype html>
<html lang="es">
<head>
<script src="../auth-guard.js?v=20261006b"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Control Remaches · GP2</title>
<link rel="icon" href="../GP2_favicon.png"/>
<link rel="stylesheet" href="../gp2-modulo.css?v=20261009ds">
<style>
  /* Rediseño 2026-10-09 (sistema GP2 v2.0): tipografía, botones, campos y barra salen de
     gp2-modulo.css. Acá queda el LAYOUT propio: filtros, remitos agrupados, tarjetas y el popup.
     (El display de .overlay queda acá a propósito: los tests stubean el CSS del sistema.) */
  .ok{color:var(--ok-700)}
  .bad{color:var(--err-700)}

  .filtros{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:flex-end;padding:12px 14px;margin:0 0 var(--s3)}
  .filtros .field select{min-width:180px}
  .filtros .cta-count{margin-left:auto;align-self:center;font-size:var(--fs-sm);padding:4px 12px}

  .rem-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);margin:0 0 var(--s3);overflow:clip}
  .rem-hdr{position:sticky;top:var(--bar-h);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .rem-hdr .rem-title{font-weight:700;color:var(--ink-900);font-size:var(--fs-h3)}
  .rem-hdr .rem-meta{color:var(--ink-500);font-size:var(--fs-sm)}
  .rem-badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--r-pill);font-size:var(--fs-cap);font-weight:700;white-space:nowrap;
    background:var(--brand-50);color:var(--brand-700);border:1px solid var(--brand-200)}
  .rem-badge.done{background:var(--ok-50);color:var(--ok-700);border-color:var(--ok-200)}

  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s2);padding:12px}
  .item-btn{position:relative;display:flex;flex-direction:column;gap:2px;min-height:var(--touch);background:var(--surface);
    border:1px solid var(--line-strong);border-radius:var(--r-md);padding:10px 12px;cursor:pointer;transition:border-color .12s,background .12s}
  .item-btn:hover{border-color:var(--brand-500);background:var(--brand-50)}
  .item-btn.done{border-color:var(--ok-200);background:var(--ok-50)}
  .item-btn .cod{font-size:20px;line-height:1.15;padding-right:24px}
  .item-btn .desc{font-size:var(--fs-td);color:var(--ink-900);font-weight:600;line-height:1.25}
  .item-btn .decl{margin-top:6px;font-size:var(--fs-sm);color:var(--ink-700);background:var(--ink-50);border-radius:var(--r-sm);padding:4px 8px}
  .item-btn .decl b{color:var(--ink-900);font-size:var(--fs-td)}
  .item-btn .decl.virg{background:var(--warn-50);color:var(--warn-700)}
  .item-btn .ctrl{margin-top:4px;font-size:var(--fs-sm);color:var(--ok-700);font-weight:700}
  .item-btn .ctrl small{display:block;color:var(--ink-500);font-weight:500;font-size:var(--fs-cap)}
  .item-btn .diff{font-size:var(--fs-sm);font-weight:700}
  .item-btn .diff.dif{color:var(--err-700)}
  .item-btn .diff.ok{color:var(--ok-700)}
  .item-btn .tilde{position:absolute;top:6px;right:10px;color:var(--ok-700);font-size:20px;font-weight:800;display:none}
  .item-btn.done .tilde{display:block}

  /* popup de control */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
  .overlay.open{display:flex}
  .modal{width:min(560px,100%);max-height:94vh;overflow-y:auto;background:var(--surface);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sh-2)}
  .modal h3{font-size:var(--fs-h2);margin-bottom:10px;color:var(--ink-900)}
  .modal .item-info{background:var(--surface-2);border:1px solid var(--line);padding:10px 12px;border-radius:var(--r-md);margin-bottom:12px;line-height:1.45}
  .modal .item-info b{color:var(--ink-900)}
  /* campos de conteo: número protagonista (se carga parado, con la tablet en la mano) */
  .fld label{display:block;font-size:var(--fs-sm);font-weight:600;margin-bottom:4px;color:var(--ink-600)}
  .fld input{width:100%;min-height:56px;font-size:28px;font-weight:750;text-align:center}
  .diff-line{margin-top:10px;padding:10px 12px;border-radius:var(--r-md);font-weight:700;text-align:center}
  .diff-line.ok{background:var(--ok-50);color:var(--ok-700);border:1px solid var(--ok-200)}
  .diff-line.bad{background:var(--err-50);color:var(--err-700);border:1px solid var(--err-200)}

  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .actions .btn{flex:1;min-width:110px}
  .btn-danger{background:var(--surface);color:var(--err-700);border-color:var(--err-200)}
  .btn-danger:hover{background:var(--err-50)}
  .msg{margin-top:10px;font-size:var(--fs-sm)}

  /* Cajas x kg por caja: solo para los insumos que el proveedor entrega en
     cajas pesadas (componente.recibe_en_cajas). Dos campos al lado del otro,
     que llenan solos los kg controlados. */
  .cajas-box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-bottom:12px}
  .cajas-2{display:flex;gap:10px;flex-wrap:wrap}
  .cajas-2 > div{flex:1 1 130px}
  .cajas-2 label{display:block;font-size:var(--fs-sm);font-weight:600;margin-bottom:4px;color:var(--ink-600)}
  .cajas-2 input{width:100%;min-height:52px;font-size:24px;font-weight:750;text-align:center}
  .cajas-calc{margin-top:10px;font-weight:700;color:var(--brand-800);text-align:center}
  .uni-line{margin-top:10px;padding:10px 12px;border-radius:var(--r-md);font-weight:700;text-align:center;background:var(--brand-50);color:var(--brand-800);border:1px solid var(--brand-200)}
  .uni-line b{font-size:20px}
  .uni-line .uni-nota{font-weight:600;font-size:var(--fs-sm);color:var(--ink-600)}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <!-- El titulo lo pisa el JS con el sector que llega en ?sector= (default 8,
         Remaches). Sirve tambien para Plasticos (?sector=6). -->
    <h1 id="pageTitle">Control Remaches</h1>
    <div class="hbtns">
      <a class="back" href="../GP2_MODULOS.html" onclick="if(history.length>1){history.back();return false;}">Atrás</a>
    </div>
  </div>
  <div class="steps">
    <div class="panel filtros">
      <div class="field"><label for="selEstado">Estado</label>
        <select id="selEstado">
          <option value="pendientes" selected>Pendientes</option>
          <option value="controladas">Controladas</option>
          <option value="todas">Todas</option>
        </select></div>
      <div class="field"><label for="selProv">Proveedor</label>
        <select id="selProv"><option value="todos">Todos</option></select></div>
      <span id="ctaCount" class="cta-count rem-badge">0 items</span>
    </div>

    <div id="statusMsg" class="status"></div>
    <div id="lista"></div>
  </div>
</div>

<!-- Popup control por item -->
<div id="ovCtrl" class="overlay">
  <div class="modal">
    <h3 id="ctrlTitle">Control remache</h3>
    <div class="item-info" id="ctrlInfo"></div>

    <!-- Se muestra solo si el insumo viene en cajas pesadas: el operario cuenta
         cajas y pesa una, y los kg controlados salen de la multiplicacion
         [usuario 2026-09-03: "en el caso del control de este componente que me
         deje poner cant de cajas y kg por caja"]. -->
    <div class="cajas-box" id="cajasBox" style="display:none">
      <div class="cajas-2">
        <div>
          <label>Cajas</label>
          <input type="text" id="inCajas" inputmode="numeric" placeholder="0" />
        </div>
        <div>
          <label>Kg por caja</label>
          <input type="text" id="inKgCaja" inputmode="decimal" placeholder="0,0" />
        </div>
      </div>
      <div class="cajas-calc" id="lblCajas"></div>
    </div>

    <div class="fld">
      <!-- El texto y el teclado los pone el JS segun la unidad de la recepcion:
           kg cuando se pesa (con o sin pasaje a unidades) y unidades cuando el
           componente no tiene kg_x_uni y hay que contarlas. -->
      <label id="lblKg">Kg controlados (pesados)</label>
      <input type="text" id="inKg" inputmode="decimal" placeholder="0,0" />
    </div>

    <!-- Pasaje a unidades: aparece solo si el insumo tiene kg por unidad. -->
    <div class="uni-line" id="lblUni" style="display:none"></div>

    <div class="diff-line" id="lblDiff" style="display:none"></div>

    <div class="actions">
      <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
      <button class="btn btn-danger" id="btnDesmarcar" style="display:none">Desmarcar</button>
      <button class="btn btn-primary" id="btnConfirm" disabled>Confirmar control</button>
    </div>
    <div class="msg" id="ctrlMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js?v=20260929a"></script>
<!-- La regla de numero de la casa (punto = miles, coma = decimales): con esto
     los campos se formatean solos y nadie escribe su propio parser. -->
<script src="../gp2-numero.js?v=20260911o"></script>
<script src="control-remaches.js?v=20261009c"></script>
</body>
</html>
