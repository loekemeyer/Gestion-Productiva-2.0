/* ============================================================
   REMITO EN CURSO + PASO 2: el paso 1 es anotar TODOS los items
   del remito (si vienen 5, se anotan los 5). Recien con
   "Terminé de pasar remito" se pasa al paso 2: el pesaje en
   balanza de todos los pallets. La recepcion no esta terminada
   hasta ahi. Lo que quedo sin pesar (Pesar despues, o de otro
   dia) aparece en la misma barra: el modulo Control ya no existe,
   todo vive integrado aca.
   ============================================================ */
var PES = null;   // {items:[{recId,codigo,desc,pallets,blocks:{nro:{peso,rollos:[{c,k}]}}}]}
var CTL = null;   // {items:[{recId,codigo,desc,declaradoPaq,base,pisos,sueltas}]}  fase 2 de cartones

/* Vuelve el popup al estado inicial (paso 1: Cancelar / Confirmar). */
function resetPiePopup(){
  PES = null; CTL = null;
  $('cargaWrap').classList.remove('hidden');
  $('pesajeWrap').classList.add('hidden');
  $('pesajeWrap').innerHTML='';
  $('kgConfirm').classList.remove('hidden'); $('kgConfirm').disabled=false;
  $('kgCancel').classList.remove('hidden');
  $('kgPesajeOk').classList.add('hidden'); $('kgPesajeOk').textContent='✓ Guardar pesaje';
  $('kgPesajeSalir').classList.add('hidden');
  if (typeof syncExits === 'function') syncExits();
}

function cerrarPopup(){
  $('kgPopup').classList.remove('open');
  itemSel=null;
  resetPiePopup();
  $('kgMsg').textContent=''; $('kgMsg').className='status';
}
$('kgCancel').addEventListener('click',cerrarPopup);

/* SALIDA DEL PASO 2 (pesaje). Antes no habia ninguna: se ocultaba Cancelar y el
   click en el fondo estaba bloqueado, asi que el unico camino era guardar — y si
   el usuario abria el pesaje por error quedaba encerrado.
   Se puede salir sin perder nada: los items YA estan guardados en la BD desde el
   paso 1 (cargar_recepcion). Lo unico que falta es el pesaje, y la recepcion sin
   pesar reaparece sola en la barra de arriba para retomarla. El confirm esta para
   que quede claro que queda pendiente, no para trabar. */
async function salirDelPesaje(){
  var esCtl = !!CTL;
  var msg = esCtl
    ? 'Salir del control.\n\nLo que anotaste del remito YA está guardado: no se pierde.\n'+
      'Lo que falta es el conteo físico, así que la recepción queda SIN TERMINAR y '+
      'reaparece arriba como "sin controlar" para retomarla cuando quieras.\n\n¿Salir igual?'
    : 'Salir del pesaje.\n\nLo que anotaste del remito YA está guardado: no se pierde.\n'+
      'Lo que falta es el peso de balanza, así que la recepción queda SIN TERMINAR y '+
      'reaparece arriba como "sin pesar" para retomarla cuando quieras.\n\n¿Salir igual?';
  if(!confirm(msg)) return;
  var pend= PES ? PES.items.length : (CTL ? CTL.items.length : 0);
  cerrarPopup();
  REMITO=[];              // el remito en curso ya vive en la BD como pendiente
  // El aviso va DESPUES de recargar: cargar() termina limpiando statusMsg, asi que
  // ponerlo antes lo borraba y el usuario salia sin entender que quedo pendiente.
  await cargar();
  $('statusMsg').className='status';
  $('statusMsg').textContent='Saliste del '+(esCtl?'control':'pesaje')+': '+pend+' ítem'+(pend===1?'':'s')+
    (pend===1?' quedó':' quedaron')+' sin '+(esCtl?'controlar':'pesar')+'. Se retoma desde la barra de arriba.';
}
$('kgPesajeSalir').addEventListener('click',salirDelPesaje);

/* Escape: en paso 1 cierra el popup; en paso 2 (pesaje/control) queda
   trabado (el control es obligatorio). La X del popup se saco por pedido
   del usuario (2026-09-01: "saca la X no se va a usar") — la salida vive
   en Cancelar del paso 1. */
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape' || !$('kgPopup').classList.contains('open')) return;
  if(PES||CTL){ $('kgMsg').className='status bad'; $('kgMsg').textContent='Terminá el control para salir.'; return; }
  cerrarPopup();
});

/* Recepciones de la base que quedaron sin pesar (Pesar despues / dias
   anteriores). El modulo Control se fue: se retoman desde la misma barra. */
function pendientesDePesaje(){
  return RECS.filter(function(r){
    if (REMITO.some(function(x){ return x.recId===r.recepcion_id; })) return false;
    return Number(r.pallets_sin_pesar)>0 || r.estado==='sin controlar';
  });
}

/* Con REMITO en curso o control activo, el control es obligatorio: se
   ocultan las salidas (Atrás del header y ← Volver del paso 2). Se
   restauran al terminar (successBox) o al hacer "Nueva recepción". */
function syncExits(){
  var lock = REMITO.length>0 || !!PES || !!CTL;
  var a=$('btnAtrasHeader'); if(a) a.style.display = lock ? 'none' : '';
  var v=$('btnVolver1'); if(v) v.style.display = lock ? 'none' : '';
}
/* Aviso al cerrar la pestaña/navegar afuera si hay REMITO en curso. La
   recepcion queda como "sin controlar" igual y aparece en la barra al
   volver — pero el aviso empuja a terminar antes. */
window.addEventListener('beforeunload',function(e){
  if(REMITO.length>0 || PES || CTL){ e.preventDefault(); e.returnValue=''; return ''; }
});

function renderRemitoBar(){
  var bar=$('remitoBar'); if(!bar) return;
  var pend=pendientesDePesaje();
  syncExits();
  // v3.23.0: refrescar las tarjetas del listado para que las que ya se
  // pasaron al remito se vean con el "✓ cargado ..." abajo.
  if (typeof filtrarItems === 'function' && document.getElementById('itemsGrid')) {
    try { filtrarItems(); } catch(_){ }
  }
  if(!REMITO.length && !pend.length){ bar.classList.add('hidden'); bar.innerHTML=''; return; }
  var h='';
  if(REMITO.length){
    // Cartones vs flejes: si TODO el remito es de cartones, la fase 2 es el
    // control fisico (base x pisos + sueltas), no el pesaje en balanza.
    var todosCarton = REMITO.every(function(x){ return x.modo==='carton'; });
    h+='<b>📋 Remito en curso · '+REMITO.length+' ítem'+(REMITO.length===1?'':'s')+'</b>'+
       '<div class="rb-items">'+REMITO.map(function(x){
         if (x.modo==='carton') return '<b style="color:#0066cc">'+esc(x.codigo)+'</b> '+fmt(x.paquetes)+' paq';
         return '<b style="color:#0066cc">'+esc(x.codigo)+'</b> '+fmt(x.cant)+' '+esc(x.unidad)+
           (x.pallets?(' ('+x.pallets+' pallet'+(x.pallets===1?'':'s')+')'):'');
       }).join(' · ')+'</div>'+
       '<button class="btn btn-primary" id="btnFinRemito" type="button">✓ Terminé de pasar remito</button>'+
       ' <small style="color:#555">'+(todosCarton
         ? 'La recepción se termina contando los paquetes reales.'
         : 'La recepción se termina con el pesaje en balanza.')+'</small>';
  }
  if(pend.length){
    h+='<div class="rb-pend">⚠ '+pend.length+' recepción'+(pend.length===1?'':'es')+
       (REMITO.length?(pend.length===1?' anterior':' anteriores'):'')+' sin pesar '+
       '<button class="btn btn-secondary" id="btnPesarPend" type="button" style="font-size:16px;padding:6px 12px">⚖ Pesar ahora</button></div>';
  }
  bar.innerHTML=h;
  bar.classList.remove('hidden');
  var f=$('btnFinRemito');
  if(f) f.onclick=function(){
    // Cartones: fase 2 es el control fisico (base x pisos + sueltas en paquetes).
    // Si el remito es TODO cartones se abre montarControlCartones; si es todo flejes
    // se abre montarPesaje. Un mix (no deberia pasar en la practica pero por si acaso)
    // resuelve como pesaje y los cartones quedan sin control (aparecen como pendientes).
    var todosCarton = REMITO.every(function(x){ return x.modo==='carton'; });
    if (todosCarton) {
      montarControlCartones(REMITO.map(function(x){
        return { recId:x.recId, codigo:x.codigo, desc:x.desc,
                 declaradoPaq: Number(x.paquetes)||0, controlado:'',
                 carton_formato: x.carton_formato||null };
      }));
      return;
    }
    montarPesaje(REMITO.filter(function(x){ return x.modo!=='carton'; }).map(function(x){
      return { recId:x.recId, codigo:x.codigo, desc:x.desc, pallets:x.pallets,
               modo:x.modo||'rollos',
               remitoKg:(x.unidad==='kg'?x.cant:null),
               blocks:(x.modo==='peso'?{1:{peso:'',rollos:[]}}:bloquesVacios(x.pallets)) };
    }));
  };
  var pd=$('btnPesarPend');
  if(pd) pd.onclick=function(){ abrirPesajePendientes(pend); };
}

function abrirPesajePendientes(pend){
  montarPesaje(pend.map(function(r){
    var modo = provModo(r.proveedor)==='peso_total' ? 'peso' : 'rollos';
    return { recId:r.recepcion_id, codigo:r.codigo, desc:r.descripcion||'',
             pallets:r.pallets_remito, modo:modo,
             remitoKg:Number(r.kg_remito)||null,
             blocks:(modo==='peso'
               ? {1:{peso:String(r.peso_balanza_total||''),rollos:[]}}
               : bloquesPrefill(r)) };
  }));
}

/* La misma info, pero en la PORTADA: se ve sin entrar a ningun rubro. */
function renderPendPortada(){
  var bar=$('pendBar'); if(!bar) return;
  var pend=pendientesDePesaje();
  if(!pend.length){ bar.classList.add('hidden'); bar.innerHTML=''; return; }
  var det=pend.slice(0,4).map(function(r){
    return '<b style="color:#0066cc">'+esc(r.codigo)+'</b>'+
           (r.proveedor?(' <span style="color:#555">('+esc(r.proveedor)+')</span>'):'');
  }).join(' · ')+(pend.length>4?(' · y '+(pend.length-4)+' más'):'');
  bar.innerHTML='<div class="rb-pend" style="margin-top:0">⚖ <b>'+pend.length+
    (pend.length===1?' recepción':' recepciones')+' sin pesar</b></div>'+
    '<div class="rb-items">'+det+'</div>'+
    '<button class="btn btn-primary" id="btnPesarPortada" type="button">⚖ Pesar ahora</button>';
  bar.classList.remove('hidden');
  $('btnPesarPortada').onclick=function(){ abrirPesajePendientes(pendientesDePesaje()); };
}

function bloquesVacios(n){
  var b={}, tot=Math.max(1, Number(n)||1);
  for(var i=1;i<=tot;i++) b[i]={peso:'',rollos:[{c:'1',k:''}]};
  return b;
}
/* Para pendientes de la base: pre-carga los pallets ya pesados (editables). */
function bloquesPrefill(rec){
  var b={}, guard=palletsDe(rec.recepcion_id);
  var tot=Math.max(Number(rec.pallets_remito)||1, guard.length||1);
  for(var i=1;i<=tot;i++){
    var g=guard.find(function(p){ return p.nro_pallet===i; });
    b[i]= g
      ? { peso:String(g.peso_balanza), rollos: rollosDe(g.control_id).map(function(r){ return {c:String(r.cantidad),k:String(r.kg_por_rollo)}; }) }
      : { peso:'', rollos:[{c:'1',k:''}] };
    if(!b[i].rollos.length) b[i].rollos=[{c:'',k:''}];
  }
  return b;
}

/* Abre el paso 2 con TODOS los items a pesar. */
function montarPesaje(items){
  if(!items || !items.length) return;
  PES = { items: items, cur: 0 };
  syncExits();
  var totPall=items.reduce(function(t,it){ return t+Object.keys(it.blocks).length; },0);
  $('kgTitle').textContent = 'Pesaje en balanza · paso 2 de 2';
  $('kgItemInfo').innerHTML = '<b>'+items.length+' ítem'+(items.length===1?'':'s')+'</b> · '+
    totPall+' pallet'+(totPall===1?'':'s')+
    (provSel?(' · '+esc(provSel)):'')+($('txtRemito').value?(' · remito '+esc($('txtRemito').value)):'');
  $('cargaWrap').classList.add('hidden');
  $('kgConfirm').classList.add('hidden');
  $('kgCancel').classList.add('hidden');
  $('kgPesajeSalir').classList.add('hidden');
  $('kgPesajeOk').classList.remove('hidden');
  $('kgMsg').className='status';
  $('kgMsg').innerHTML='Por cada pallet: el peso de balanza y las líneas de rollos. Recién ahí la recepción queda completa.';
  $('pesajeWrap').classList.remove('hidden');
  pintarPesaje();
  $('kgPopup').classList.add('open');
  $('kgPopup').scrollTop=0;   // arrancar arriba: el pesaje largo abria scrolleado
}

function calcLinea(k){
  return k.sob!=null
    ? ('Rollos <b>'+k.rollos+'</b> · suma <b>'+fmt(k.kg)+' kg</b> · sobrante '+
       '<span class="'+(k.estado==='ok'?'okc':'warnc')+'">'+fmt(k.sob)+' kg</span> (esperado '+k.tmin+'–'+k.tmax+')')
    : 'Completá el peso de balanza y al menos una línea de rollos.';
}

/* La balanza pesa fleje + pallet: el total del item tiene que dar SIEMPRE
   mas que los kg del remito (salvo que hayan entregado diferente). */
function calcItem(it){
  var tot=0, n=0;
  Object.keys(it.blocks).forEach(function(nro){
    var w=pnum(it.blocks[nro].peso); if(w>0){ tot+=w; n++; }
  });
  return { tot:tot, n:n };
}
function tolKg(kg){ return Math.max(kg*(Number(TARA.tol_ctrl_peso_pct)||2)/100, 0.5); }
function itemLinea(it){
  if(!it.remitoKg) return '';
  var c=calcItem(it);
  if(it.modo==='peso'){
    if(!c.n) return 'Remito: <b>'+fmt(it.remitoKg)+' kg</b> · pesá lo que llegó: la balanza tiene que dar aproximado a eso.';
    var d=c.tot-it.remitoKg, okp=Math.abs(d)<=tolKg(it.remitoKg);
    return 'Remito: <b>'+fmt(it.remitoKg)+' kg</b> · balanza: <b>'+fmt(c.tot)+' kg</b> · dif '+
      '<span class="'+(okp?'okc':'warnc')+'">'+(d>0?'+':'')+fmt(d)+' kg</span>'+
      (okp?'':' ⚠ no coincide con el remito (¿entregaron diferente?)');
  }
  if(!c.n) return 'Remito: <b>'+fmt(it.remitoKg)+' kg</b> · la balanza tiene que dar MÁS que eso (se pesa el pallet).';
  // La balanza pesa producto + PALLET, asi que compararla cruda contra el remito siempre
  // miente. Se descuenta la tara (la aprendida del proveedor) y recien ahi se compara,
  // con la misma tolerancia que el control por peso total. Antes era binario dif>0: con
  // la balanza dando JUSTO el remito marcaba rojo y decia "dio menos", que ademas de
  // asustar al pesador era falso — 0 no es menos. [usuario 2026-08-31]
  var tara=taraPallet()*c.n, neto=c.tot-tara, dif=neto-it.remitoKg, tol=tolKg(it.remitoKg);
  var ok=Math.abs(dif)<=tol;
  return 'Remito: <b>'+fmt(it.remitoKg)+' kg</b> · balanza: <b>'+fmt(c.tot)+' kg</b>'+
    ' − '+c.n+' pallet'+(c.n===1?'':'s')+' ('+fmt(tara)+' kg) = <b>'+fmt(neto)+' kg</b> · dif '+
    '<span class="'+(ok?'okc':'warnc')+'">'+(dif>0?'+':'')+fmt(dif)+' kg</span>'+
    (ok ? ''
        : dif<0 ? ' ⚠ dio menos que el remito: revisá antes de guardar (¿entregaron diferente?)'
                : ' ⚠ dio más que el remito (¿entregaron de más?)');
}

/* Un item esta "listo" cuando todos sus pallets tienen peso (y rollos, si aplica).
   Solo pinta el chip de verde: la validacion de verdad sigue en Guardar. */
function itemListo(it){
  var nros=Object.keys(it.blocks); if(!nros.length) return false;
  return nros.every(function(nro){
    var p=it.blocks[nro];
    if(!(pnum(p.peso)>0)) return false;
    if(it.modo==='peso') return true;
    return p.rollos.some(function(l){ return pint(l.c)>0 && pnum(l.k)>0; });
  });
}

/* Pesaje POR ETAPAS (pedido del usuario): un item por vez — 1ro, 2do, 3ro —
   en vez de todo el remito en un chorizo hacia abajo. Chips arriba para ver
   el progreso y saltar; Anterior/Siguiente abajo. Guardar aparece al final. */
function pintarPesaje(){
  var w=$('pesajeWrap'), n=PES.items.length, i=PES.cur, it=PES.items[i];

  var chips = n>1
    ? '<div class="pes-chips">'+PES.items.map(function(x,j){
        // Error grave (sobrante negativo) manda: chip rojo con ⚠, sin done ni
        // check verde, aunque itemListo diga que si. Antes quedaba ✓ verde
        // aunque el mensaje bloqueara el paso [usuario 2026-09-01: "algo no
        // cuadra"].
        var err = itemConErrorGrave(x);
        var done = !err && itemListo(x);
        var cls = 'pes-chip'+(j===i?' act':'')+(err?' err':'')+(done?' done':'');
        var pre = err ? '⚠ ' : (done ? '✓ ' : '');
        return '<button type="button" class="'+cls+'" data-nav="'+j+'">'+pre+esc(x.codigo)+'</button>';
      }).join('')+'</div>'
    : '';

  var head=(n>1?('<div class="pes-paso">Ítem '+(i+1)+' de '+n+'</div>'):'')+
    '<div class="pes-item-h" style="margin-top:0"><span class="cod">'+esc(it.codigo)+'</span> '+esc(it.desc||'')+'</div>'+
    (it.remitoKg?('<div class="pes-calc" data-itemcalc="'+i+'">'+itemLinea(it)+'</div>'):'');

  var cuerpo;
  if(it.modo==='peso'){
    var pp=it.blocks[1]||{peso:'',rollos:[]};
    cuerpo='<div class="pes-pallet" data-i="'+i+'" data-p="1">'+
      '<div class="peso-row"><span class="plbl">Balanza total</span>'+
      '<input inputmode="decimal" data-f="peso" value="'+esc(pp.peso)+'" placeholder="0,0">'+
      '<span class="punit">kg</span></div>'+
    '</div>';
  }else{
    cuerpo=Object.keys(it.blocks).sort((a,b)=>a-b).map(function(nro){
      var p=it.blocks[nro];
      // La PRIMERA linea de rollos va pegada a la balanza, en el mismo renglon;
      // las de otro peso (raras) caen abajo. El data-l no cambia: los handlers
      // y el auto-calculo siguen ubicando la linea por ahi.
      var linea=function(l,idx){
        return '<div class="pes-linea" data-l="'+idx+'">'+
          '<span class="lbl">Rollos</span>'+
          '<div class="stp"><button type="button" class="stb" data-step="-1">−</button>'+
          '<input inputmode="numeric" data-f="c" value="'+esc(l.c)+'">'+
          '<button type="button" class="stb" data-step="1">+</button></div>'+
          '<span class="lbl">×</span>'+
          '<div class="kgw"><input inputmode="decimal" data-f="k" class="'+(l._auto?'auto':'')+'" value="'+esc(l.k)+'" placeholder="0,0"><span>kg</span></div>'+
          (p.rollos.length>1?'<span class="x" data-del="1" title="Quitar línea">✕</span>':'')+
        '</div>';
      };
      return '<div class="pes-pallet" data-i="'+i+'" data-p="'+nro+'">'+
        '<div class="ph"><span>'+esc(it.codigo)+' · Pallet '+nro+'</span></div>'+
        '<div class="pes-fila1">'+
          '<div class="peso-row"><span class="plbl">Balanza</span>'+
          '<input inputmode="decimal" data-f="peso" value="'+esc(p.peso)+'" placeholder="0,0">'+
          '<span class="punit">kg</span></div>'+
          '<div class="pes-rollos">'+p.rollos.map(linea).join('')+'</div>'+
        '</div>'+
        '<button type="button" class="pes-add" data-addl="1">+ rollos de otro peso</button>'+
        '<div class="pes-calc">'+calcLinea(calcPallet(p))+'</div>'+
      '</div>';
    }).join('')+'<button type="button" class="pes-add" data-addp="'+i+'">+ pallet en '+esc(it.codigo)+'</button>';
  }

  var nav = n>1
    ? '<div class="pes-nav">'+
        (i>0?'<button type="button" class="ant" data-nav="'+(i-1)+'">← '+esc(PES.items[i-1].codigo)+'</button>':'')+
        (i<n-1?'<button type="button" class="sig" data-nav="'+(i+1)+'">Siguiente: '+esc(PES.items[i+1].codigo)+' →</button>':'')+
      '</div>'
    : '';

  w.innerHTML = chips + head + cuerpo + nav;
  // Guardar recien en el ultimo item: primero se controla 1ro -> 2do -> 3ro.
  $('kgPesajeOk').classList.toggle('hidden', i<n-1);
}

function bloqueDeFila(pb){
  var it=PES.items[Number(pb.dataset.i)];
  return it ? it.blocks[pb.dataset.p] : null;
}

/* Validacion del item CURRENT al navegar (chip / Anterior / Siguiente):
   [usuario 2026-09-01: "cuando tenes 2 flejes en vez de guardar pasas al
   siguiente, que eso tambien te tire el mensaje de guardar, para que
   continuar si pusiste mal la informacion anterior"]. Devuelve HTML con
   los errores o null si OK. Solo bloquea los ERRORES duros (sobrante
   negativo, balanza<=remito): un item vacio o a medias deja pasar (el
   operario todavia lo esta cargando).
   NOTA: mismos chequeos que kgPesajeOk pero acotados al item — mantener
   sincronizados si cambian los criterios. */
/* Detalle de UN pallet como una linea HTML con estilo. Marca la clase segun
   el estado del sobrante: `err` (rojo, es el que dispara el bloqueo por
   negativo) u `ok` (gris, esta bien) — asi el operario ve rapido cual es
   el pallet que no cuadra dentro de un item con varios. */
function palletLinea(nro, p){
  var c=calcPallet(p);
  if (c.peso==null && !(c.rollos>0)) return '';
  var lineas=(p.rollos||[]).filter(function(l){return pint(l.c)>0 && pnum(l.k)>0;})
    .map(function(l){return pint(l.c)+' × '+fmt(pnum(l.k))+' kg';}).join(' + ') || 'sin rollos';
  var suma=c.kg||0, sob=(c.peso!=null && c.rollos>0) ? (c.peso-suma) : null;
  var cls = (sob!=null && sob<0) ? 'err' : (sob!=null ? 'ok' : '');
  var flag = (sob!=null && sob<0) ? '⚠ ' : '';
  return '<div class="err-plt '+cls+'">'+flag+'Pallet <b>'+nro+'</b>: '+esc(lineas)+' = <b>'+fmt(suma)+' kg</b>'+
    (c.peso!=null ? (' · balanza <b>'+fmt(c.peso)+' kg</b>') : '')+
    (sob!=null ? (' · sobrante <b>'+fmt(sob)+' kg</b>') : '')+
    '</div>';
}
/* True si el item tiene ALGUN pallet con sobrante negativo — el chip pasa a
   rojo (clase `err`) y NO recibe la clase `done` aunque itemListo diga que
   si. Un item con error grave no puede estar "listo". */
function itemConErrorGrave(it){
  return Object.keys(it.blocks).some(function(nro){
    var c=calcPallet(it.blocks[nro]);
    return c.sob!=null && c.sob<0;
  });
}
function palletsDeItemHTML(it){
  return Object.keys(it.blocks).sort(function(a,b){return a-b;})
    .map(function(nro){ return palletLinea(nro, it.blocks[nro]); }).join('');
}
/* Un "item block" del error card: codigo + descripcion + (opcional) remito
   vs balanza + detalle de sus pallets. */
function itemErrBlock(it, extra){
  return '<div class="err-item">'+
    '<div><span class="err-cod">'+esc(it.codigo)+'</span> <span class="err-desc">'+esc(it.desc||'')+'</span></div>'+
    (extra||'')+
    palletsDeItemHTML(it)+
  '</div>';
}

function validarItemPesaje(it){
  if(!it) return null;
  // Al navegar entre items SOLO se valida el sobrante negativo — es un error
  // puntual del pallet ya cargado (un rollo pesa mas que la balanza es
  // imposible, hay que corregirlo ya). La comparacion balanza<remito NO
  // aplica aca porque el operario puede estar cargando los pallets del item
  // de a uno por vez: con 1 pallet cargado, la suma es solo la parte, no el
  // total. Bloquear ahi impediria pasar al siguiente item para volver
  // despues [usuario 2026-09-01: "saque uno de los rollos y igualmente no
  // me deja seguir" — el bloqueo era balanza<remito, valido en Guardar
  // pero no en Nav].
  var neg=false;
  Object.keys(it.blocks).forEach(function(nro){
    var p=it.blocks[nro], c=calcPallet(p);
    if(c.sob!=null && c.sob<0) neg=true;
  });
  if(neg){
    return '<div class="err-card">'+
      '<div class="err-title">No se puede continuar: sobrante negativo</div>'+
      '<div class="err-sub">Los rollos pesan mas que la balanza.</div>'+
      itemErrBlock(it, '')+
      '<div class="err-fix">Corregi algun rollo mal anotado o el peso de balanza antes de pasar al proximo item.</div>'+
    '</div>';
  }
  return null;
}

/* Delegación: inputs y botones del paso 2 (el DOM se re-arma seguido). */
$('pesajeWrap').addEventListener('input', function(e){
  var pb=e.target.closest('.pes-pallet'); if(!pb||!PES) return;
  var p=bloqueDeFila(pb); if(!p) return;
  var f=e.target.dataset.f;
  // Sanear ANTES de guardar: peso y kg-por-rollo son decimales (coma->punto),
  // c (cantidad de rollos) es entero. Rechaza letras y todo lo que no sea el
  // formato valido [usuario 2026-09-01].
  var val = (f==='c') ? sanInput(e.target, sanInt) : sanInput(e.target, sanDec);
  if(f==='peso') p.peso=val;
  else{
    var ln=e.target.closest('.pes-linea'); if(!ln) return;
    var lx=p.rollos[Number(ln.dataset.l)];
    lx[f]=val;
    if(f==='k'){ lx._auto=false; e.target.classList.remove('auto'); }  // correccion manual: manda la persona
  }
  autoKg(p, pb);
  // refrescar solo la línea de cálculo (sin re-render, para no perder el foco)
  var cl=pb.querySelector('.pes-calc');
  if(cl) cl.innerHTML=calcLinea(calcPallet(p));
  var ic=$('pesajeWrap').querySelector('[data-itemcalc="'+pb.dataset.i+'"]');
  if(ic) ic.innerHTML=itemLinea(PES.items[Number(pb.dataset.i)]);
});
$('pesajeWrap').addEventListener('click', function(e){
  if(!PES) return;
  if(e.target.dataset.nav!==undefined && e.target.dataset.nav!==''){
    var destino=Number(e.target.dataset.nav);
    // No sirve avanzar/saltar si el item actual esta mal cargado — el operario
    // tiene que arreglarlo antes de tocar otro. Retroceder al mismo item o al
    // que ya se paso NO valida (deja mover libre) — solo aplica cuando el
    // destino es OTRO item. [usuario 2026-09-01: "para que continuar si
    // pusiste mal la informacion anterior"]
    if(destino!==PES.cur){
      var err=validarItemPesaje(PES.items[PES.cur]);
      if(err){
        var m=$('kgMsg'); m.className='status bad'; m.innerHTML=err;
        // que el operario vea el mensaje: bajar hasta el pie del popup
        $('kgPopup').scrollTop=$('kgPopup').scrollHeight;
        return;
      }
    }
    PES.cur=destino;
    pintarPesaje();
    $('kgPopup').scrollTop=0;   // cada etapa arranca arriba
    $('kgMsg').textContent=''; $('kgMsg').className='status';   // limpia error viejo
    return;
  }
  if(e.target.dataset.addp!==undefined && e.target.dataset.addp!==''){
    var it=PES.items[Number(e.target.dataset.addp)]; if(!it) return;
    var ns=Object.keys(it.blocks).map(Number);
    it.blocks[Math.max.apply(null,ns.concat([0]))+1]={peso:'',rollos:[{c:'1',k:''}]};
    pintarPesaje(); return;
  }
  var pb=e.target.closest('.pes-pallet'); if(!pb) return;
  var p=bloqueDeFila(pb); if(!p) return;
  if(e.target.dataset.step){
    var ln0=e.target.closest('.pes-linea'); if(!ln0) return;
    var l0=p.rollos[Number(ln0.dataset.l)];
    l0.c=String(Math.max(0, pint(l0.c)+Number(e.target.dataset.step)));
    autoKg(p);
    pintarPesaje(); return;
  }
  // la linea nueva arranca en 1 rollo; casi siempre es "el mismo peso que el anterior no"
  if(e.target.dataset.addl){ p.rollos.push({c:'1',k:''}); pintarPesaje(); return; }
  if(e.target.dataset.del){
    var ln=e.target.closest('.pes-linea');
    p.rollos.splice(Number(ln.dataset.l),1);
    if(!p.rollos.length) p.rollos=[{c:'',k:''}];
    pintarPesaje(); return;
  }
});

/* ============================================================
   CARTONES — FASE 2: CONTROL FISICO
   Mismo esqueleto que montarPesaje (un item por vez, chips de
   progreso, Anterior/Siguiente, "Guardar control" al final),
   pero UN SOLO input por item: "Paquetes controlados" (el operario
   cuenta paquetes y ya, sin base×pisos+sueltas). Total uni =
   paquetes * carton_uni_x_paquete (250). Al guardar llama la RPC
   guardar_control_cartones que hace UPDATE cantidad + rollos_json
   + sincroniza el movimiento (triggers recalculan inventario).
   ============================================================ */
function montarControlCartones(items){
  if(!items || !items.length) return;
  CTL = { items: items, cur: 0 };
  syncExits();
  var totPaqDecl = items.reduce(function(t,it){ return t+(Number(it.declaradoPaq)||0); },0);
  $('kgTitle').textContent = 'Control · paso 2 de 2';
  $('kgItemInfo').innerHTML = '<b>'+items.length+' cartón'+(items.length===1?'':'es')+'</b> · '+
    fmt(totPaqDecl)+' paquete'+(totPaqDecl===1?'':'s')+' declarados'+
    (provSel?(' · '+esc(provSel)):'')+($('txtRemito').value?(' · remito '+esc($('txtRemito').value)):'');
  $('cargaWrap').classList.add('hidden');
  $('kgConfirm').classList.add('hidden');
  $('kgCancel').classList.add('hidden');
  $('kgPesajeSalir').classList.add('hidden');
  $('kgPesajeOk').classList.remove('hidden');
  $('kgPesajeOk').textContent='✓ Guardar control';
  $('kgMsg').className='status';
  $('kgMsg').innerHTML='Por cada cartón: cuántas <b>bolsas</b> contaste (Huevo=2000, 8=3000, C=1000, LOKE=1000 uni/bolsa). Pliego/Bolsa siguen en paquetes.';
  $('pesajeWrap').classList.remove('hidden');
  pintarControlCartones();
  $('kgPopup').classList.add('open');
  $('kgPopup').scrollTop=0;
}

function ctlListo(it){ return (pint(it.controlado)||0) > 0; }
/* Decide por formato: si tiene bolsa -> control en BOLSAS; si no (Pliego/Bolsa/formato desconocido)
   -> control en PAQUETES. Devuelve unidad_ctl='bolsa'|'paq', paq (paquetes equivalentes) y uni. */
function ctlTotales(it){
  var raw = pint(it.controlado)||0, upp = PAQ();
  var uxb = uniXBolsaDeFormato(it.carton_formato);
  if (uxb){
    var pxb = paqXBolsaDeFormato(it.carton_formato)||Math.round(uxb/upp);
    return { unidad_ctl:'bolsa', bolsas:raw, uni_x_bolsa:uxb, paq_x_bolsa:pxb,
             paq: raw*pxb, uni: raw*uxb, upp:upp };
  }
  return { unidad_ctl:'paq', bolsas:null, uni_x_bolsa:null, paq_x_bolsa:null,
           paq:raw, uni:raw*upp, upp:upp };
}
function ctlLinea(it){
  var t = ctlTotales(it), decl = Number(it.declaradoPaq)||0;
  var enBolsas = (t.unidad_ctl==='bolsa');
  if(t.paq<=0){
    if(enBolsas){
      return 'Declarado: <b>'+fmt(decl)+' paq</b> · 1 bolsa = <b>'+t.paq_x_bolsa+' paq</b> = <b>'+fmt(t.uni_x_bolsa)+' uni</b>. Contá las bolsas.';
    }
    return 'Declarado: <b>'+fmt(decl)+' paq</b> · cargá los paquetes que contaste.';
  }
  var dif = t.paq - decl, pct = decl>0 ? Math.abs(dif)*100/decl : 0;
  var color = (dif===0 ? '#0a7a2f' : (pct<=10 ? '#b45309' : '#b42318'));
  var izq = 'Declarado: <b>'+fmt(decl)+' paq</b>';
  var ctr = enBolsas
    ? ('controlado: <b>'+fmt(t.bolsas)+' bolsa'+(t.bolsas===1?'':'s')+'</b> = <b>'+fmt(t.paq)+' paq</b> = <b>'+fmt(t.uni)+' uni</b>')
    : ('controlado: <b>'+fmt(t.paq)+' paq</b> = <b>'+fmt(t.uni)+' uni</b>');
  return izq+' · '+ctr+
    ' · dif <span style="color:'+color+';font-weight:800">'+(dif>0?'+':'')+fmt(dif)+' paq</span>'+
    (pct>10 ? ' ⚠ diferencia mayor al 10%' : '');
}

function pintarControlCartones(){
  var w=$('pesajeWrap'), n=CTL.items.length, i=CTL.cur, it=CTL.items[i];

  var chips = n>1
    ? '<div class="pes-chips">'+CTL.items.map(function(x,j){
        return '<button type="button" class="pes-chip'+(j===i?' act':'')+(ctlListo(x)?' done':'')+
               '" data-cnav="'+j+'">'+(ctlListo(x)?'✓ ':'')+esc(x.codigo)+'</button>';
      }).join('')+'</div>'
    : '';

  var head=(n>1?('<div class="pes-paso">Ítem '+(i+1)+' de '+n+'</div>'):'')+
    '<div class="pes-item-h" style="margin-top:0"><span class="cod">'+esc(it.codigo)+'</span> '+esc(it.desc||'')+'</div>'+
    '<div class="pes-calc" data-ctlcalc="'+i+'">'+ctlLinea(it)+'</div>';

  // UN SOLO input por item. Segun formato:
  //  - Huevo/8/C/LOKE: BOLSAS (uno cuenta bolsas, mas facil que paquetes).
  //  - Pliego/Bolsa/sin formato: PAQUETES como antes.
  // inputmode="numeric" para el teclado numerico del celular.
  var uxb = uniXBolsaDeFormato(it.carton_formato);
  var enBolsas = !!uxb;
  var pxb = enBolsas ? (paqXBolsaDeFormato(it.carton_formato)||Math.round(uxb/PAQ())) : null;
  var titInp = enBolsas ? 'Bolsas controladas' : 'Paquetes controlados';
  var subH   = enBolsas
    ? ('1 bolsa = <b>'+pxb+' paq</b> = <b>'+fmt(uxb)+' uni</b> (formato '+esc(it.carton_formato)+')')
    : (it.carton_formato ? ('Formato '+esc(it.carton_formato)+' · sin bolsa: se cuenta en paquetes') : 'Sin formato: se cuenta en paquetes');
  var lblInp = enBolsas ? 'Bolsas' : 'Paquetes';
  var uniInp = enBolsas ? 'bolsas' : 'paq';
  var cuerpo='<div class="pes-pallet" data-ci="'+i+'">'+
    '<div class="ph"><span>'+esc(it.codigo)+' · '+titInp+'</span></div>'+
    '<div class="pes-sub" style="margin:2px 0 8px;color:#475569;font-size:14px">'+subH+'</div>'+
    '<div class="peso-row" style="justify-content:center">'+
      '<span class="plbl">'+lblInp+'</span>'+
      '<input inputmode="numeric" data-cf="controlado" value="'+esc(it.controlado)+'" placeholder="0" style="width:120px !important;flex:0 0 120px">'+
      '<span class="punit">'+uniInp+'</span>'+
    '</div>'+
  '</div>';

  var nav = n>1
    ? '<div class="pes-nav">'+
        (i>0?'<button type="button" class="ant" data-cnav="'+(i-1)+'">← '+esc(CTL.items[i-1].codigo)+'</button>':'')+
        (i<n-1?'<button type="button" class="sig" data-cnav="'+(i+1)+'">Siguiente: '+esc(CTL.items[i+1].codigo)+' →</button>':'')+
      '</div>'
    : '';

  w.innerHTML = chips + head + cuerpo + nav;
  // Guardar recien en el ultimo item.
  $('kgPesajeOk').classList.toggle('hidden', i<n-1);
}

// Delegacion CTL: inputs y navegacion del control de cartones.
$('pesajeWrap').addEventListener('input', function(e){
  if(!CTL) return;
  var pb=e.target.closest('.pes-pallet[data-ci]'); if(!pb) return;
  var it=CTL.items[Number(pb.dataset.ci)]; if(!it) return;
  var f=e.target.dataset.cf; if(!f) return;
  it[f]=e.target.value;
  // solo re-pinta la linea de calculo (sin re-render para no perder el foco)
  var cl=pb.parentNode.querySelector('[data-ctlcalc="'+pb.dataset.ci+'"]');
  if(cl) cl.innerHTML=ctlLinea(it);
});
$('pesajeWrap').addEventListener('click', function(e){
  if(!CTL) return;
  if(e.target.dataset.cnav!==undefined && e.target.dataset.cnav!==''){
    CTL.cur=Number(e.target.dataset.cnav);
    pintarControlCartones();
    $('kgPopup').scrollTop=0;
  }
});

/* "Pesar después" se eliminó (regla usuario 2026-08-29): la carga y el control
   son UN solo proceso — la recepción no se termina hasta pesar. Si la pantalla
   se cierra a mitad de camino, la recepción reaparece en la barra de arriba
   como "sin pesar" y hay que terminarla. */

/* Guardar pesaje de TODO el remito: cierra la recepción. Alerta si algún
   sobrante se va de 4–8, pero deja guardar igual (queda marcado). */
$('kgPesajeOk').addEventListener('click', async function(){
  if(CTL) return guardarControlCartones();
  if(!PES) return;
  var m=$('kgMsg');

  var listos=[];   // {recId, codigo, nro, peso, lineas}
  var incompletos=[];  // pallets a medias (peso sin rollos, o rollos sin peso): avisar, no saltear en silencio
  PES.items.forEach(function(it){
    Object.keys(it.blocks).sort((a,b)=>a-b).forEach(function(nro){
      var p=it.blocks[nro];
      var lineas=p.rollos.map(function(l){ return {cantidad:pint(l.c),kg_por_rollo:pnum(l.k)}; })
                         .filter(function(l){ return l.cantidad>0 && l.kg_por_rollo>0; });
      if(pnum(p.peso)>0 && (lineas.length || it.modo==='peso'))
        listos.push({recId:it.recId, codigo:it.codigo, nro:Number(nro), peso:pnum(p.peso), lineas:lineas, calc:calcPallet(p)});
      else if(pnum(p.peso)>0 || lineas.length)
        incompletos.push(it.codigo+' · Pallet '+nro);
    });
  });
  if(!listos.length){ m.className='status bad'; m.textContent='Cargá al menos un pallet: peso de balanza + rollos.'; return; }
  if(incompletos.length && !confirm(
      '⚠ Pallets a medias (falta el peso de balanza o las líneas de rollos):\n\n'+incompletos.join('\n')+
      '\n\nSolo se guardan los pallets completos y la recepción queda SIN TERMINAR (reaparece como pendiente).\n\n¿Guardar igual?')) return;

  /* Los mensajes de bloqueo usan la misma card visual que la validacion de
     nav (validarItemPesaje) — un solo layout para no tener 2 estilos
     distintos. Se agrupa por codigo de item y se reusa itemErrBlock. */
  function itemsPorCodigo(pred){
    var set={}; listos.forEach(function(x){ if(pred(x)) set[x.codigo]=true; });
    return Object.keys(set).map(function(c){ return PES.items.find(function(i){ return i.codigo===c; }); }).filter(Boolean);
  }

  // Sobrante negativo (los rollos pesan mas que la balanza) BLOQUEA el guardar:
  // no puede pasar en la realidad, es un error de carga.
  var itsNeg = itemsPorCodigo(function(x){ return x.calc.sob!=null && x.calc.sob<0; });
  if(itsNeg.length){
    m.className='status bad';
    m.innerHTML='<div class="err-card">'+
      '<div class="err-title">No se puede guardar: sobrante negativo</div>'+
      '<div class="err-sub">Los rollos pesan mas que la balanza.</div>'+
      itsNeg.map(function(it){ return itemErrBlock(it, ''); }).join('')+
      '<div class="err-fix">Corregi algun rollo mal anotado o el peso de balanza.</div>'+
    '</div>';
    return;
  }

  // La balanza pesa fleje + pallet: por item tiene que dar MAS que el remito.
  // Si dio menos, o entregaron diferente o hay un error de carga.
  var itsMenores=PES.items.filter(function(it){ return it.modo!=='peso'; })
    .map(function(it){ return { it:it, c:calcItem(it) }; })
    .filter(function(x){ return x.it.remitoKg>0 && x.c.n>0 && x.c.tot<=x.it.remitoKg; });
  if(itsMenores.length){
    m.className='status bad';
    m.innerHTML='<div class="err-card">'+
      '<div class="err-title">No se puede guardar: la balanza dio MENOS (o igual) que el remito</div>'+
      '<div class="err-sub">Con el peso del pallet la balanza siempre tiene que dar mas que el remito.</div>'+
      itsMenores.map(function(x){
        var extra = '<div class="err-remito">Remito <b>'+fmt(x.it.remitoKg)+' kg</b> · balanza <b>'+fmt(x.c.tot)+' kg</b> · dif <b>'+fmt(x.c.tot-x.it.remitoKg)+' kg</b></div>';
        return itemErrBlock(x.it, extra);
      }).join('')+
      '<div class="err-fix">Revisa el remito, algun rollo mal anotado o el peso de balanza.</div>'+
    '</div>';
    return;
  }

  // Sobrante bajo/alto (>=0) sigue siendo confirm: puede ser un rollo con un
  // peso raro y no siempre es error. Confirm nativo -> texto plano.
  function detallePlano(it){
    return Object.keys(it.blocks).sort(function(a,b){return a-b;}).map(function(nro){
      var p=it.blocks[nro], c=calcPallet(p);
      if (c.peso==null && !(c.rollos>0)) return null;
      var lineas=(p.rollos||[]).filter(function(l){return pint(l.c)>0 && pnum(l.k)>0;})
        .map(function(l){return pint(l.c)+' × '+fmt(pnum(l.k))+' kg';}).join(' + ') || 'sin rollos';
      var suma=c.kg||0, sob=(c.peso!=null && c.rollos>0) ? (c.peso-suma) : null;
      return '   Pallet '+nro+': '+lineas+' = '+fmt(suma)+' kg'+
        (c.peso!=null ? (' · balanza '+fmt(c.peso)+' kg') : '')+
        (sob!=null ? (' · sobrante '+fmt(sob)+' kg') : '');
    }).filter(Boolean).join('\n');
  }
  var itsFuera = itemsPorCodigo(function(x){ return x.calc.sob!=null && x.calc.estado!=='ok' && x.calc.sob>=0; });
  if(itsFuera.length && !confirm(
      '⚠ El sobrante no da el peso de un pallet en:\n\n'+
      itsFuera.map(function(it){ return it.codigo+' '+(it.desc||'')+'\n'+detallePlano(it); }).join('\n\n')+
      '\n\nEsperado sobrante entre '+(TARA.tara_pallet_min||4)+' y '+(TARA.tara_pallet_max||8)+' kg (el peso del pallet).\n'+
      'Puede ser un rollo mal anotado o un error de balanza.\n\n¿Guardar así?')) return;

  // Control por peso (Bella Vista): la balanza tiene que coincidir con el remito.
  var nocoinc=PES.items.filter(function(it){ return it.modo==='peso'; })
    .map(function(it){ return { it:it, c:calcItem(it) }; })
    .filter(function(x){ return x.it.remitoKg>0 && x.c.n>0 && Math.abs(x.c.tot-x.it.remitoKg)>tolKg(x.it.remitoKg); })
    .map(function(x){ return x.it.codigo+': remito '+fmt(x.it.remitoKg)+' kg · balanza '+fmt(x.c.tot)+' kg'; });
  if(nocoinc.length && !confirm(
      '⚠ El peso no coincide con el remito en:\n\n'+nocoinc.join('\n')+
      '\n\n¿Entregaron diferente a lo facturado?\n\n¿Guardar así?')) return;

  $('kgPesajeOk').disabled=true;
  m.className='status'; m.textContent='Guardando pesaje…';
  var errs=[], ok=0;
  for (var i=0;i<listos.length;i++){
    var x=listos[i];
    try{
      var r=await SB.rpc('pesar_pallet',{p_recepcion_id:x.recId,p_nro_pallet:x.nro,
        p_peso_balanza:x.peso,p_rollos:x.lineas,p_usuario:null});
      if(r.error) throw r.error;
      ok++;
    }catch(e){ errs.push(x.codigo+' · Pallet '+x.nro+': '+(e.message||e)); }
  }
  $('kgPesajeOk').disabled=false;
  if(errs.length){ m.className='status bad'; m.textContent=errs.join(' · '); return; }

  // Recién acá la recepción está TERMINADA (remito anotado + todo pesado).
  var nItems=PES.items.length;
  var sb=$('successBox'); sb.style.display='block';
  $('successBox').querySelector('.title').textContent = incompletos.length ? '✓ Pesaje guardado (recepción SIN terminar)' : '✓ Recepción completa';
  $('successDetail').innerHTML=nItems+' ítem'+(nItems===1?'':'s')+' · '+ok+' pallet'+(ok===1?'':'s')+' pesado'+(ok===1?'':'s')+
    (incompletos.length?(' · <b style="color:#b42318">'+incompletos.length+' pallet'+(incompletos.length===1?'':'s')+' a medias sin guardar: queda pendiente</b>'):'')+
    (fuera.length?(' · <b style="color:#b45309">'+fuera.length+' con sobrante fuera de rango (a revisar)</b>'):'')+'.';
  cerrarPopup();
  REMITO=[];
  setTimeout(function(){ sb.style.display='none'; },7000);
  await cargar();
});

/* Guardar control fisico de cartones: llama a la RPC en lote (todos los items
   del remito en una sola llamada). Al ok, cierra y muestra la caja verde con
   "Nueva recepcion" (mismo cierre que la carga simple). */
async function guardarControlCartones(){
  if(!CTL) return;
  var m=$('kgMsg');
  var faltan = CTL.items.filter(function(it){ return !ctlListo(it); }).map(function(it){ return it.codigo; });
  if(faltan.length){
    m.className='status bad';
    m.textContent='Faltan cargar: '+faltan.join(', ')+'. Bolsas/paquetes controlados debe ser > 0.';
    return;
  }
  var alertas = CTL.items.filter(function(it){
    var decl=Number(it.declaradoPaq)||0, paq=ctlTotales(it).paq;
    return decl>0 && Math.abs(paq-decl)*100/decl > 10;
  }).map(function(it){
    var t=ctlTotales(it), d=t.paq-(Number(it.declaradoPaq)||0);
    return it.codigo+': declarado '+fmt(it.declaradoPaq)+' paq · contado '+fmt(t.paq)+' paq · dif '+(d>0?'+':'')+fmt(d);
  });
  if(alertas.length && !confirm(
    '⚠ Diferencia mayor al 10% en:\n\n'+alertas.join('\n')+
    '\n\n¿Guardar así? La cantidad final será la contada.')) return;

  // Segun formato: bolsas para Huevo/8/C/LOKE, paquetes para Pliego/Bolsa (o sin formato).
  var payload = CTL.items.map(function(it){
    var raw = pint(it.controlado)||0;
    var uxb = uniXBolsaDeFormato(it.carton_formato);
    return uxb
      ? { recepcion_id: it.recId, bolsas: raw }
      : { recepcion_id: it.recId, paquetes: raw };
  });
  $('kgPesajeOk').disabled=true;
  m.className='status'; m.textContent='Guardando control…';
  try{
    var usuario = (window.sessionStorage && sessionStorage.getItem('usuario')) || null;
    var r = await SB.rpc('guardar_control_cartones', { p_items: payload, p_usuario: usuario });
    if(r.error) throw r.error;
    var nItems = CTL.items.length;
    var totPaq = CTL.items.reduce(function(t,it){ return t+ctlTotales(it).paq; },0);
    var totUni = CTL.items.reduce(function(t,it){ return t+ctlTotales(it).uni; },0);
    var totBol = CTL.items.reduce(function(t,it){ var x=ctlTotales(it); return t+(x.bolsas||0); },0);
    var sb=$('successBox'); sb.style.display='block';
    $('successBox').querySelector('.title').textContent='✓ Recepción completa';
    $('successDetail').innerHTML=nItems+' cartón'+(nItems===1?'':'es')+' controlado'+(nItems===1?'':'s')+
      (totBol>0 ? (' · <b>'+fmt(totBol)+' bolsa'+(totBol===1?'':'s')+'</b>') : '')+
      ' · <b>'+fmt(totPaq)+' paquete'+(totPaq===1?'':'s')+'</b> = <b>'+fmt(totUni)+' unidad'+(totUni===1?'':'es')+'</b>.';
    cerrarPopup();
    REMITO=[];
    await cargar();
  }catch(e){ m.className='status bad'; m.textContent='Error: '+(e.message||e); }
  finally{ $('kgPesajeOk').disabled=false; }
}

// En el paso 2 el click en el fondo sigue SIN cerrar: scrolleando un pesaje largo
// en la tablet es facil pegarle sin querer y perder lo cargado en pantalla. Para
// salir estan la X, "Salir sin pesar" y Escape, que avisan antes.
$('kgPopup').addEventListener('click',e=>{ if(e.target===$('kgPopup') && !PES && !CTL) cerrarPopup(); });
$('kgConfirm').addEventListener('click',guardar);

async function guardar(){
  var m=$('kgMsg'); m.className='status'; m.textContent='';
  if(!itemSel){cerrarPopup();return;}
  var cantRaw=parseNum($('kgValue').value);
  if(!cantRaw||cantRaw<=0){m.className='status bad';m.textContent='Ingresá una cantidad (> 0).';return;}
  // Si el usuario ingresó unidades y el componente tiene kg_x_uni, auto-convertir a kg.
  // Cartones: paquetes de 250 -> unidades.
  var kx=KGXUNI[itemSel.comp_id];
  var cant=cantRaw, uReal=unitSel;
  if(unitSel==='paq'){ cant=cantRaw*PAQ(); uReal='uni'; }
  else if(unitSel==='uni'&&kx){ cant=cantRaw*kx; uReal='kg'; }
  $('kgConfirm').disabled=true;
  try{
    var fiso=$('txtFecha').value?($('txtFecha').value+'T12:00:00'):null;
    var modoCtl = esFleje(itemSel) ? provModo(provSel) : 'ninguno';
    // Campos por proveedor (2026-09-01). Rollos: input directo. KgxRollo
    // (Basconia): se guarda el rollos computado = round(kg / kg_por_rollo)
    // asi el pesaje del paso 2 tiene con que armarse. Pallets ya no se pide
    // en el remito: default null (el paso 2 arma 1 pallet y el operario
    // suma con "+ pallet" si hace falta).
    var flds = esFleje(itemSel) ? fieldsFleje(provSel) : {};
    var rll=null, pll=null, kpr=null;
    if (flds.rollos){
      rll = parseInt(($('kgRollos').value||'').replace(/\D/g,''),10)||null;
      if(!rll){ m.className='status bad'; m.textContent='Cargá los rollos totales del remito.'; $('kgConfirm').disabled=false; return; }
    }
    if (flds.kgPorRollo){
      kpr = parseNum($('kgKgPorRollo').value);
      if(!(kpr>0)){ m.className='status bad'; m.textContent='Cargá los kg x rollo del remito.'; $('kgConfirm').disabled=false; return; }
      // cant ya esta en kg (uReal='kg' abajo). Rollos derivados: se guarda
      // p_rollos para que el paso 2 sepa cuantos hay que pesar.
      rll = Math.max(1, Math.round(cant / kpr));
    }
    var res=await SB.rpc('cargar_recepcion',{
      p_comp_id:itemSel.comp_id, p_proveedor:provSel||null,
      p_cantidad:cant, p_unidad:uReal, p_remito:$('txtRemito').value||null,
      p_rollos:rll, p_pallets:pll, p_fecha:fiso});
    if(res.error) throw res.error;
    // Con proveedor que informa rollos, el item queda ANOTADO en el remito en
    // curso y se sigue con el proximo. El pesaje es de TODO el remito junto,
    // cuando el usuario toca "Terminé de pasar remito".
    // Cruce con las ordenes de compra abiertas (lo hace la BD y devuelve el detalle)
    var ocTxt='';
    var ocs=(res.data&&res.data.oc_cruzada)||[];
    if(ocs.length){
      ocTxt=ocs.map(function(o){
        return o.completa ? ('OC N° '+o.numero+' <b>COMPLETA</b>') :
          ('OC N° '+o.numero+': '+fmt(o.aplicado)+' '+esc(o.unidad||'')+' aplicados');
      }).join(' · ');
    } else {
      ocTxt='sin OC pendiente para este insumo';
    }

    var recId = res.data && res.data.recepcion_id;
    // Cartones: se anota el remito en PAQUETES y despues se cuenta fisicamente
    // (fase 2 con base x pisos + sueltas). Igual esqueleto que flejes, con
    // "Terminé de pasar remito" -> montarControlCartones. cantRaw es lo que
    // dijo el proveedor (paquetes), cant es en unidades (cantRaw * 250).
    if (itemSel.sector_id===10 && recId){
      REMITO.push({ recId: recId, codigo: itemSel.codigo, desc: itemSel.descripcion||'',
                    cant: cant, unidad: uReal, paquetes: cantRaw, modo: 'carton',
                    carton_formato: itemSel.carton_formato||null });
      var codSelC=itemSel.codigo;
      cerrarPopup();
      renderRemitoBar();
      $('statusMsg').className='status';
      $('statusMsg').innerHTML=esc(codSelC)+': '+fmt(cantRaw)+' paquete'+(cantRaw===1?'':'s')+' anotados. '+ocTxt+'.';
      setTimeout(function(){ if($('statusMsg').innerHTML.indexOf('paquete')>=0) $('statusMsg').textContent=''; },7000);
      return;
    }
    if (modoCtl!=='ninguno' && modoCtl!=='pendiente' && recId){
      REMITO.push({ recId: recId, codigo: itemSel.codigo, desc: itemSel.descripcion||'',
                    cant: cant, unidad: uReal, rollos: rll, pallets: pll,
                    modo: (modoCtl==='peso_total' ? 'peso' : 'rollos') });
      var codSel=itemSel.codigo;   // cerrarPopup() pone itemSel=null: capturar antes
      cerrarPopup();
      renderRemitoBar();
      $('statusMsg').className='status';
      $('statusMsg').innerHTML=esc(codSel)+': '+ocTxt+'.';
      setTimeout(function(){ if($('statusMsg').innerHTML.indexOf('OC')>=0||$('statusMsg').innerHTML.indexOf('sin OC')>=0) $('statusMsg').textContent=''; },7000);
      return;
    }

    // Sin rollos (cajas, remaches, plásticos, etc.): la carga sola completa la
    // recepción. Cajas (sector 11) y Remaches (sector 8) quedan PENDIENTES de
    // control: se guarda cantidad_declarada para comparar despues declarado vs
    // controlado, y se ofrece el link al modulo de control correspondiente.
    var esCaja = (itemSel.sector_id === 11);
    var esRemache = (itemSel.sector_id === 8);
    var pideControl = esCaja || esRemache;
    if (pideControl && recId) {
      try { await SB.from('recepcion_insumo').update({ cantidad_declarada: cant }).eq('id', recId); } catch(e){ console.warn('cantidad_declarada:', e); }
    }
    var sb=$('successBox'); sb.style.display='block';
    $('successBox').querySelector('.title').textContent='✓ Recepción registrada';
    var detUni= (unitSel==='paq') ? (fmt(cantRaw)+' paquetes = <b>'+fmt(cant)+' uni</b>') : ((uReal==='kg'&&kx&&unitSel==='uni') ? (fmt(cantRaw)+' uni = <b>'+fmt(cant)+' kg</b>') : '<b>'+fmt(cant)+' '+esc(uReal)+'</b>');
    var extraCtrl = '';
    if (esCaja) {
      extraCtrl = '<br><br><b style="color:#0b5cad">Pendiente de control físico</b> (base × pisos + sueltas)<br>' +
        '<a href="control-cajas.html" style="display:inline-block;margin-top:8px;padding:12px 22px;background:#0b5cad;color:#fff;border-radius:8px;text-decoration:none;font-weight:900;font-size:18px">Ir a Control Cajas →</a>';
    } else if (esRemache) {
      extraCtrl = '<br><br><b style="color:#0b5cad">Pendiente de control</b> (pesar y anotar los kg)<br>' +
        '<a href="control-remaches.html" style="display:inline-block;margin-top:8px;padding:12px 22px;background:#0b5cad;color:#fff;border-radius:8px;text-decoration:none;font-weight:900;font-size:18px">Ir a Control Remaches →</a>';
    }
    $('successDetail').innerHTML=esc(itemSel.codigo)+' — '+esc(itemSel.descripcion||'')+' · '+detUni+(provSel?(' ('+esc(provSel)+')'):'')+'. Stock actualizado. Mov '+(res.data&&res.data.movimiento_id)+'. '+ocTxt+'.'+extraCtrl;
    // Cajas/Remaches: el control es OBLIGATORIO despues de recibir, asi que se
    // ocultan las salidas (Atrás del header y Volver del paso 2) para que la
    // unica via sea "Ir a Control ..." o "Nueva recepción" (que recarga y las restaura).
    if (pideControl) {
      var _atras=$('btnAtrasHeader'); if(_atras) _atras.style.display='none';
      var _volver=$('btnVolver1'); if(_volver) _volver.style.display='none';
    }
    cerrarPopup();
    // el box queda visible; el usuario cierra con 'Nueva recepcion' (reset)
  }catch(e){ m.className='status bad'; m.textContent='Error: '+(e.message||e); }
  finally{ $('kgConfirm').disabled=false; }
}

async function cargar(){
  $('statusMsg').textContent='Cargando insumos…';
  var res=await SB.rpc('recepcion_bundle');
  if(res.error){$('statusMsg').className='status bad';$('statusMsg').textContent='Error: '+res.error.message;return;}
  var d=res.data||{};
  INS=d.insumos||[]; UMBY={}; INS.forEach(i=>UMBY[i.comp_id]=i.um);
  PROVFLAGS={}; (d.proveedores||[]).forEach(p=>PROVFLAGS[p.nombre]=p);
  RECS=d.recepciones||[]; PALL=d.pallets||[]; ROLL=d.rollos||[];
  if(d.tara) TARA=d.tara;
  // Cargar factores de conversión kg/uni para componentes de sectores insumo
  var kxRes=await SB.from('componente').select('id,kg_x_uni').in('sector_id',[5,6,7,8,9,10,11]);
  if(!kxRes.error){KGXUNI={};(kxRes.data||[]).forEach(c=>{if(c.kg_x_uni) KGXUNI[c.id]=c.kg_x_uni;});}
  $('statusMsg').textContent='';
  renderRemitoBar();
  renderPendPortada();
}

// ================= Control en balanza (paso 2 del proceso real) =================
// Un pallet por pesada. Chequeos: pallets sin pesar = 0, rollos sin clasificar = 0,
// y el sobrante de CADA pallet (peso - suma rollos) entre tara_pallet_min y max.
function badge(e){
  var c = e==='ok'?'b-ok' : e==='sin controlar'?'b-pend' : (e&&e.indexOf('sobrante')>=0)?'b-warn':'b-mal';
  return '<span class="badge '+c+'">'+esc(e||'')+'</span>';
}
function palletsDe(rid){ return PALL.filter(p=>p.recepcion_id===rid); }
function rollosDe(cid){ return ROLL.filter(r=>r.control_id===cid); }
function pint(v){var x=parseInt(String(v==null?'':v).replace(/\D/g,''),10);return isNaN(x)?null:x;}
function pnum(v){var x=parseFloat(String(v==null?'':v).trim().replace(',','.'));return isNaN(x)?null:x;}
/* AUTO-CALCULO del kg por rollo (pedido del usuario): balanza y cantidad alcanzan —
   kg/rollo = (peso de balanza - tara media del pallet) / rollos. Solo cuando el pallet
   tiene UNA linea de rollos y el campo esta vacio o ya era automatico: apenas el
   operario lo corrige a mano, el auto deja de pisarlo. Redondeo a 0,1 kg. */
/* Que tara descontar, de mejor a peor dato [usuario 2026-08-30: "cuando tengamos
   datos de carga de cuanto pesa cada pallet, asumirlo para calcular mejor"]:
   1. promedio REAL de los pallets ya pesados de ESTE proveedor (n>=5, lo trae la BD),
   2. promedio real global (n>=5),
   3. punto medio del parametro tara_pallet_min/max (arranque, sin datos). */
function taraPallet(){
  var pp=(TARA.tara_por_proveedor||{})[provSel];
  if(pp && Number(pp.tara)>0) return Number(pp.tara);
  if(Number(TARA.tara_estimada)>0) return Number(TARA.tara_estimada);
  return (Number(TARA.tara_pallet_min||4)+Number(TARA.tara_pallet_max||8))/2;
}

function autoKg(p, pb){
  if(!p || (p.rollos||[]).length!==1) return;
  var l=p.rollos[0];
  if(l.k!=='' && !l._auto) return;             // lo escribio la persona: no tocar
  var peso=pnum(p.peso), c=pint(l.c);
  if(!(peso>0) || !(c>0)) return;
  var k=Math.round((peso-taraPallet())/c*10)/10;
  if(!(k>0)) return;
  l.k=String(k).replace('.',',');
  l._auto=true;
  if(pb){
    var ki=pb.querySelector('.kgw input');
    if(ki && ki!==document.activeElement){ ki.value=l.k; ki.classList.add('auto'); }
  }
}

function calcPallet(p){
  var peso=pnum(p.peso), kg=0, rollos=0, algo=false;
  (p.rollos||[]).forEach(l=>{var c=pint(l.c),k=pnum(l.k); if(c&&k){kg+=c*k;rollos+=c;algo=true;}});
  if(peso==null||!algo) return {peso:peso,kg:kg,rollos:rollos,sob:null,estado:null};
  var sob=peso-kg, tmin=Number(TARA.tara_pallet_min||4), tmax=Number(TARA.tara_pallet_max||8);
  return {peso:peso,kg:kg,rollos:rollos,sob:sob,tmin:tmin,tmax:tmax,
          estado: sob<tmin?'sobrante bajo':sob>tmax?'sobrante alto':'ok'};
}
/* (el modulo Control en balanza se elimino: el pesaje vive en el flujo del remito) */
/* Paso 1: sanitizar kgValue (rechazar letras + normalizar coma->punto) antes
   del updateConv, si no la conversion en pantalla lee basura. Los enteros
   (paquetes/unidades) van con sanInt; kg y decimales con sanDec. */
$('kgValue').addEventListener('input', function(){
  var esDec = (unitSel==='kg' || unitSel==='paq') ? true : (unitSel==='kg');
  // paq son enteros (paquetes), uni son enteros (unidades del remito), kg decimal.
  var entero = (unitSel==='uni' || unitSel==='paq');
  sanInput($('kgValue'), entero ? sanInt : sanDec);
  updateConv();
});
/* Delegacion en rolloPallRow: los inputs kgRollos y kgKgPorRollo se crean
   dinamicamente por proveedor (fieldsFleje). kgRollos siempre entero,
   kgKgPorRollo siempre decimal. */
$('rolloPallRow').addEventListener('input', function(e){
  if(e.target.id==='kgRollos')      sanInput(e.target, sanInt);
  else if(e.target.id==='kgKgPorRollo') sanInput(e.target, sanDec);
});
$('txtFecha').value=hoy();
cargar();

document.addEventListener('click', function(ev){
  var b=ev.target && ev.target.closest && ev.target.closest('#btnNuevaRec');
  if(!b) return;
  // reset completo al paso 1 (rubro/proveedor). Recargar es lo mas fiel al vecino
  // (limpia REMITO, popups en curso, inputs y refresca las OCs abiertas).
  location.reload();
});
</script>
