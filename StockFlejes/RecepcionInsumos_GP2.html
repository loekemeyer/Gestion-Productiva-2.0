<!-- v3.25.0 — CONTROL DE CARTONES POR BOLSAS (pedido usuario 2026-09-01, textual: "quiero que el control sea de bolsas, no de paquetes. el remito si en paquetes. huevo, 2000. ocho, 3000. c, 1000. loke, 1000. uni por paquete todos 250"). El remito (fase 1) sigue en PAQUETES. El control (fase 2) pasa a BOLSAS para los formatos que van embolsados: Huevo=2000 uni/bolsa (8 paq), 8=3000 uni/bolsa (12 paq), C=1000 uni/bolsa (4 paq), LOKE=1000 uni/bolsa (4 paq). Pliego y Bolsa (formatos "nuevos" que no son carton formal) NO llevan bolsa: el control queda en paquetes como estaba. Frontend: montarControlCartones ahora arrastra carton_formato desde INS y calcula uni_x_bolsa con UNI_X_BOLSA (mapa js con fallback a paquetes). El input pasa a "Bolsas controladas" cuando aplica, con etiqueta "1 bolsa = N paq = M uni" y linea de calculo "declarado X paq · Y bolsas = Z paq = W uni · dif ±N paq" con colores (verde 0, ambar chico, rojo >10%). Al guardar se envia {bolsas:...} para los que tienen bolsa y {paquetes:...} para Pliego/Bolsa. Backend (GP2.guardar_control_cartones) acepta ambos y guarda uni_x_bolsa en rollos_json. Nueva columna GP2.carton_formato.uni_x_bolsa (Huevo=2000, 8=3000, C=1000, LOKE=1000, Pliego/Bolsa=NULL). v3.24.7 — CHIP EN ROJO CUANDO EL ITEM TIENE SOBRANTE NEGATIVO + DESTACAR EL PALLET CON EL ERROR (usuario 2026-09-01, con foto de item con Pallet 1 OK sob 1kg + Pallet 2 sob -0.2kg, chip ✓ verde y el mensaje "no se puede continuar: sobrante negativo": "algo no cuadra"). Antes el chip quedaba ✓ verde porque itemListo mira solo peso+rollos, no valida sobrante — contradiccion visual con el mensaje de bloqueo. Ahora: (a) nueva itemConErrorGrave(it) chequea sob<0 en algun pallet; el chip pasa a clase `err` (rojo con ⚠), sin done, aunque itemListo diga que si. (b) En el detalle del mensaje, cada palletLinea recibe clase `err` (rojo, ⚠) si el sobrante es negativo o `ok` (gris) si esta bien — asi se ve rapido cual es el pallet que no cuadra dentro de un item con varios. CSS nueva .pes-chip.err/.err.act y .err-plt.err/.ok. v3.24.6 — FIX UX: la nav entre items YA NO valida balanza<remito, solo sobrante negativo (usuario 2026-09-01, con foto: "esta bugeado, saque uno de los rollos y igualmente no me deja seguir"). El bloqueo balanza<remito al navegar era incorrecto: el operario carga los pallets de un item de a uno por vez, y con solo 1 pallet cargado la suma parcial casi siempre es menor que el remito TOTAL — ahi bloqueabamos el paso al siguiente item cuando el flujo esperado es "cargo lo que tengo, paso al proximo, vuelvo despues a completar". Ahora validarItemPesaje solo mira sobrante negativo (que es error puntual del pallet ya cargado, no del avance del flujo). En Guardar (kgPesajeOk) balanza<remito SIGUE siendo bloqueo duro — ahi ya no hay mas pallets por venir y el numero final tiene que dar bien. v3.24.5 — BOTON SIGUIENTE LEGIBLE + LAYOUT DE ERROR EN CARD (usuario 2026-09-01, con foto del bloqueo activo: "el mensaje del palet puede ser mejor y el boton no se ve bien. x mas que este bloqueado tiene que ser legible"). (1) .pes-nav .sig pasa de color:#fff sobre #e7eff8 (texto invisible cuando el pallet esta bloqueado o no) a azul oscuro sobre celeste — mismo bug que arreglamos en chips. (2) Los 3 mensajes (nav bloqueado, guardar sobrante negativo, guardar balanza<remito) comparten ahora un solo layout tipo card: fondo rojo suave, titulo destacado, sub-linea explicativa, un item-card blanco por fleje con codigo + descripcion + (opcional) remito vs balanza + pallets indentados con "Pallet N: c × kg = suma kg · balanza X · sobrante Y", y una linea de "que hacer" al pie. Nuevas helpers palletLinea / palletsDeItemHTML / itemErrBlock / itemsPorCodigo unifican la construccion; el confirm de sobrante fuera de rango >=0 sigue en texto plano (es alert nativo). v3.24.4 — VALIDAR AL NAVEGAR ENTRE ITEMS DEL PESAJE (usuario 2026-09-01, con foto de mensaje de bloqueo mostrando 2 items A4+A8 con sobrante negativo, y el pedido "cuando tenes 2 flejes en vez de guardar pasas al siguiente, que eso tambien te tire el mensaje de guardar, para que continuar si pusiste mal la informacion anterior"). Antes solo se validaba en el submit del Guardar pesaje (con TODOS los items juntos), asi que el operario podia pasar por chip o Siguiente a otro item con el actual mal cargado. Ahora los mismos bloqueos duros (sobrante negativo y balanza<=remito) tambien se disparan cuando se intenta cambiar de item — corta la nav y baja el scroll al mensaje. Retroceder al mismo item no valida. Nuevas helpers detallePalletsIt(it) y validarItemPesaje(it) reusan la misma logica de kgPesajeOk pero acotada a un item. v3.24.3 — BALANZA<REMITO BLOQUEA GUARDAR + DETALLE POR PALLET EN EL MENSAJE (usuario 2026-09-01, con foto del confirm A4/A8 con balanza menor al remito y el pedido "en el mensaje tambien tiene que mostrar el resumen de pallet (kg x rollo) y del fleje. no esta mostrando actualmente el kg x rollo de los rollos del palet y esta dejando apretar guardar pesaje cuando kg x rollo es menor a la balanza"). (1) El confirm de "la balanza dio MENOS (o igual) que el remito" pasa a BLOQUEO duro: no deja guardar, mismo trato que el sobrante negativo (que ya era hard block desde v3.24.2). Corresponde: con el pallet la balanza SIEMPRE tiene que dar mas que el remito. (2) Los dos mensajes (balanza<remito y sobrante negativo) muestran ahora el detalle por pallet: "Pallet N: c × kg_por_rollo = suma kg · balanza X kg · sobrante Y kg", con el codigo y descripcion del fleje arriba. El confirm de sobrante fuera de rango >=0 (bajo/alto tolerable) tambien muestra el mismo detalle. Nueva helper interna detallePallets(cod) arma la linea desde el arreglo listos. v3.24.2 — SOBRANTE NEGATIVO BLOQUEA GUARDAR + INPUTS NUMERICOS QUE RECHAZAN LETRAS Y NORMALIZAN COMA A PUNTO (usuario 2026-09-01, con foto del paso 2 con sobrante -1,5 kg pudiendo guardar y el pedido "sobrante negativo no debe poder permitirte guardar y los inputs que sean solo numericos con coma o punto que ambos pongan punto. actualmente puedo escribir letras"). (1) En kgPesajeOk se agrega chequeo pre-confirm: si algun pallet tiene calc.sob < 0 (los rollos pesan mas que la balanza) NO se puede guardar — mensaje rojo y corto, sin confirm. El operario tiene que corregir un rollo o el peso de balanza. El confirm de sobrante fuera de rango sigue pero solo para sobrante >= 0 (bajo/alto tolerable). (2) Nuevas utilidades JS sanDec / sanInt / sanInput que sanitizan los inputs numericos: dec permite un solo punto y digitos (coma tipeada se convierte a punto en pantalla), int solo digitos. Aplicadas a kgValue (paso 1), kgRollos y kgKgPorRollo (paso 1 dinamicos, delegacion en rolloPallRow) y a los inputs de peso/c/k del paso 2 (dentro del listener de pesajeWrap). (3) parseNum se hace tolerante: si el string tiene coma sigue siendo formato AR (miles con punto, decimal con coma), sin coma un solo punto es decimal y varios puntos son miles — asi el punto de los inputs saneados se lee bien y el formato AR viejo tambien. v3.24.1 — JL METALES CONFIRMADO SOLO KG + FUERA ESTAMETAL (usuario 2026-09-01: "KG totales jl metales" + "y saca EstaMetal"). JL Metales queda en el default (solo Kg total, sin campos extra) — se anota en el comentario del fieldsFleje. EstaMetal deja de aparecer en la seleccion de proveedores y sus insumos se ocultan del listado: nuevo ocultarProv(nom) filtra en insumosDelRubro. La data cruda del componente sigue en la BD para no perder historial; si el usuario decide purgarla pasa por gp2-cirujano. v3.24.0 — CAMPOS DE RECEPCION DE FLEJES POR PROVEEDOR + SACA X + FIX CHIPS (pedido usuario 2026-09-01, con fotos). (1) El popup de recepcion de flejes agrega los datos que informa cada proveedor aparte del KG total: Basconia → Kg x Rollo (no piden por cada rollo, un promedio), Altrak y Hermac → Rollos totales, Aperam / Brawin / Szapiro → solo KG total (sin extras), JL Metales → pendiente de definir (por ahora igual que Aperam). Nueva funcion fieldsFleje(prov) mapea proveedor → {rollos?, kgPorRollo?}, y pintarFieldsFleje construye la fila del popup en abrirPopup. En guardar(): si kgPorRollo, se computa rollos = round(kg_total / kg_por_rollo) y se guarda como p_rollos para que el pesaje del paso 2 tenga la cuenta; el input Pallets se saca del remito (default null → paso 2 arma 1 pallet, el operario suma con "+ pallet" si hace falta). (2) Se saca la X del popup: el usuario dijo "el funcionamiento de no poder salir esta bien pero saca la X no se va a usar" — quedaba pegada arriba a la derecha y no funcionaba en paso 2, ahora se sale por Cancelar (paso 1) o por Guardar (paso 2). (3) Fix chips del pesaje que mostraban letra blanca sobre fondo pastel (usuario: "sectores que no se ven, letra blanca?"): .pes-chip.act pasa a azul oscuro sobre celeste y .pes-chip.done.act a verde oscuro sobre verde palido — contraste real. v3.23.0 — LA TARJETA DEL ITEM MUESTRA LO QUE YA SE CARGO AL REMITO (pedido usuario 2026-09-01, con foto: "si cargue que entrega. ahi abajo que figure lo que estoy cargando"). Antes lo cargado solo aparecia en la barra "Remito en curso" arriba; ahora tambien en la propia tarjeta del listado abajo: borde y fondo verdes + pastilla "✓ cargado 360 kg (1 pallet)" o "✓ cargado 12 paq" segun sea fleje/cartón. Nueva CSS .item-btn.cargado + .item-btn .cargado-info, nueva funcion resumenCargadoRemito(cod) que suma por codigo desde REMITO, y renderRemitoBar dispara filtrarItems() en cada cambio para que la tarjeta se refresque sola cuando se agrega/borra un item del remito. v3.22.0 — NO SE PUEDE SALIR SIN CONTROLAR (pedido usuario 2026-08-31: "No se puede salir sin controlar de ningún modulo"). Se extiende a todos los rubros la barrera de salida que antes era solo Cajas/Remaches. Nueva syncExits() oculta Atrás del header (btnAtrasHeader) y ← Volver del paso 2 (btnVolver1) cuando REMITO.length>0 || PES || CTL. Se llama desde renderRemitoBar, montarPesaje, montarControlCartones y resetPiePopup. El boton "Salir sin pesar" (kgPesajeSalir) queda oculto (los classList.remove('hidden') pasaron a add('hidden')); la X y Escape durante PES/CTL ya no salen, muestran "Terminá el control para salir" en kgMsg (antes llamaban a salirDelPesaje). Click en el fondo ya estaba bloqueado durante PES/CTL. Se agrega window beforeunload que avisa si el operario intenta cerrar pestaña/navegar afuera con REMITO en curso o control activo. La funcion salirDelPesaje sigue definida pero no se llama desde ningun boton: queda para uso interno / debug. v3.21.0 — CARTONES EN 2 FASES (pedido del usuario, textual: "cuando voy a recepcionar cartones quiero primero cargar remito y despues hacer el control: como en flejes. pero en el caso de cartones: cuando voy a cargar el remito tengo que poner paquetes y despues en el control tambien paquetes" + aclaracion: "al igual que en cajas y flejes"). Ahora los cartones (sector_id=10) usan el mismo esqueleto que flejes: el popup de carga anota el remito en PAQUETES (los que dice el proveedor) y suma el ítem al REMITO; con "Terminé de pasar remito" arranca la fase 2 (montarControlCartones) — un ítem por vez, chips de progreso + Anterior/Siguiente + "Guardar control" recien en el ultimo. El control es UN SOLO input por ítem: "Paquetes controlados" (numerico, entero); total_uni = paquetes * carton_uni_x_paquete (250 por defecto). Diff vs declarado con color (verde 0, ámbar chico, rojo >10%). Al guardar llama RPC guardar_control_cartones que hace UPDATE cantidad (unidades reales) + rollos_json + sincroniza el movimiento (los triggers recalculan inventario). No se toca la RPC cargar_recepcion. v3.20.0 — LA TARJETA SOLO MUESTRA LA OC (pedido del usuario, con foto: "no quiero el stock, solo la OC. Si no hay OC, nada ahi abajo"). Se saca la linea verde de stock que habia entrado en v3.19.0: la tarjeta queda codigo + descripcion + medida + la OC abierta (si hay); sin OC no hay nada abajo de la medida. El bundle sigue mandando 'stock' y 'ultima' por si hacen falta, pero la tarjeta no pinta ninguno de los dos. v3.19.0 — LA TARJETA MUESTRA EL STOCK, NO LA ULTIMA CARGA (pedido del usuario, con foto: "esta mostrando lo ultimo que recibi, esta mal"). El numero verde de la tarjeta era la ULTIMA RECEPCION del insumo (A1 decia "280 kg" = lo recibido hoy) y sin etiqueta se leia como stock — y el stock real de A1 era ~959 kg. Ahora el verde es el STOCK ACTUAL del insumo (GP2.inventario en la ubicacion de su sector, lo trae recepcion_bundle en la clave nueva 'stock'); sin stock queda "sin stock" en gris. Tras confirmar una recepcion la tarjeta suma lo recibido al stock en el acto, sin recargar. La 'ultima' carga sigue viniendo en el bundle por si hace falta, pero ya no se muestra. v3.18.0 — EL CONTROL DEL REMITO DESCUENTA EL PALLET (pedido del usuario: "esto parece que lo muestra como mal pero esta bien si descontas el pallet"). La balanza pesa producto + pallet, asi que compararla CRUDA contra el remito siempre miente: con balanza 1.200 y remito 1.200 marcaba ROJO y decia "dio menos que el remito", que ademas de asustar al pesador es falso (0 no es menos). Ahora se descuenta la tara (la aprendida del proveedor, la misma que usa el auto-calculo del kg por rollo) y se compara el NETO contra el remito con la tolerancia que ya estaba configurada (tol_ctrl_peso_pct, 2%). La linea muestra la cuenta entera: "balanza 1.200 kg - 1 pallet (5 kg) = 1.195 kg - dif -5 kg". El aviso ahora distingue de menos y de mas. v3.17.0 — EL PALLET ENTRA EN UNA FILA (pedido del usuario: "toda esta info esta ancha al pedo, ponela en una fila sola de ancho"). Balanza y la primera linea de rollos dejan de ser dos bloques apilados y quedan en el MISMO renglon: "Balanza [450] kg   Rollos [- 5 +] x [88,5] kg". Los inputs dejan de ir con flex:1 (un numero de 3 digitos ocupaba 400px de ancho) y pasan a medir lo que tienen que medir: 96px la balanza, 84px el kg por rollo. Las lineas de OTRO peso (raras) siguen abajo. En celular la parte de rollos baja sola por flex-wrap. v3.16.0 — PENDIENTES DE PESAJE EN LA PORTADA (pedido del usuario: "si hay pendientes de pesaje, que aparezcan sin que tenga que entrar a un modulo"). La barra "N recepciones sin pesar + Pesar ahora" ahora tambien vive ARRIBA del selector de rubro, apenas se abre la pantalla, con el detalle de codigos y proveedores (hasta 4, despues "y N mas"); un toque abre el pesaje directo, sin pasar por rubro/proveedor. La barra del paso 2 sigue igual. v3.15.0 — LA TARA SE APRENDE DE LOS PESAJES REALES (pedido del usuario): el auto-calculo del kg por rollo descuenta, en orden de mejor dato, (1) el promedio real de los pallets ya pesados de ESE proveedor, (2) el promedio real global, (3) el punto medio 4-8 del parametro (solo mientras no hay datos). La BD lo calcula sola (v_tara_pallet_real = balanza - suma de rollos de cada pesaje guardado; recepcion_tara() lo agrega al bundle con n>=5 y taras sanas 1-15 kg): a medida que se pesa, el calculo mejora sin tocar nada. v3.14.0 — KG POR ROLLO AUTOMATICO (pedido del usuario): con el peso de balanza y la cantidad de rollos, el kg c/u se calcula solo = (balanza - tara media del pallet, los 4-8 kg configurados) / rollos, redondeado a 0,1. Se muestra en azul mientras es automatico; apenas el operario lo corrige a mano queda en negro y el auto no lo pisa mas. Solo aplica con UNA linea de rollos (con varias de distinto peso no hay forma de repartir). v3.13.0 — PESAJE COMPACTO (pedido del usuario: "tengo que scrollear mucho" + el numero del stepper descentrado). La etiqueta "Peso de balanza (kg)" deja de ser un bloque arriba del campo: fila inline "Balanza [450] kg". La linea de rollos entra en UNA fila "[- 5 +] rollos x [88,5] kg" (kg alineado a la derecha como la balanza); en celular el popup pierde el aire de 34px (18/12) y gana ancho util. El input del stepper queda con flex fijo y centrado real entre - y +. Cada pallet pasa de ~700px a ~230px de alto. v3.12.0 — PORTADA CON LA ESTETICA GP2 COMPARTIDA (panel de diseno, gana sobriedad): la pantalla era la UNICA de su familia con copia propia y desviada del esqueleto — ahora linkea gp2-modulo.css como OC/Pintores y queda identica al resto; los 6 rubros pasan de chips sueltos a baldosas parejas en grilla (3 col, 2 en celular, 56px); titulos de seccion en mayuscula chica; "Ver stock" AFUERA (sin referencias en JS ni tests, redundante con el menu); "Atras" queda con la pastilla estandar. Paso 2 y popup sin cambios. v3.11.0 — CARGA DE ROLLOS MAS CLARA (pedido del usuario): cada linea se lee como una frase "[- 3 +] rollos de [65] kg" — la cantidad tiene stepper -/+ (tocable con guantes, 44px) ademas de poder tipearse, el kg lleva su unidad al lado, la linea nace con 1 rollo, el boton pasa a decir "+ rollos de otro peso" y la cruz de borrar solo aparece cuando hay mas de una linea. La suma y el sobrante siguen en vivo abajo del pallet. v3.10.0 — PESAJE POR ETAPAS (pedido del usuario): el paso 2 deja de ser todos los items en un chorizo hacia abajo y pasa a UN ITEM POR VEZ (1ro -> 2do -> 3ro), con chips de progreso arriba (verde = completo, saltan al item) y Anterior/Siguiente abajo; "Guardar pesaje" aparece recien en el ultimo item. Con un solo item no hay chips ni navegacion, queda como antes. v3.9.1 — la tarjeta muestra la ultima carga sin la palabra "ult." (pedido del usuario): queda solo el numero en verde, ej. "360 kg". v3.9.0 — POPUP DE CARGA REORDENADO (pedido del usuario): Rollos y Pallets pasan a estar pegados debajo de Cantidad, que es el orden en que se lee el remito; el toggle Kg/Unidades deja de ser dos botonazos a todo el ancho y queda como dos pastillas discretas al pie (la unidad casi nunca se cambia, cada insumo trae la suya); y se saca el parrafo que explicaba que el proveedor informa rollos — la fila ya solo aparece cuando corresponde. El aviso al confirmar sin cargar rollos/pallets NO se toco. v3.8.0 — SALIDA DEL PESAJE: del paso 2 no se podia salir (Cancelar oculto + fondo bloqueado) y ademas el popup no scrolleaba hasta arriba, asi que quien lo abria por error /* ============================================================
   Lo visual BASE (card blanca + header negro, chips .prov-btn,
   botones .btn, .row, .search-box, .status, .empty, .hidden)
   viene de ../gp2-modulo.css — el MISMO esqueleto que usan
   OC_GP2 y Pintores_GP2. Aca abajo va SOLO lo propio de esta
   pantalla. (Requiere el <link> a gp2-modulo.css ANTES de este
   bloque: sin el, la pagina queda sin base.)
   ============================================================ */

/* pantalla de carga, no de tablas anchas: mas angosta que el esqueleto */
.card{max-width:820px}
.steps{padding:16px 18px 24px}

/* ---------- PASO 1 (portada): Rubro -> Proveedor -> Remito ---------- */
/* titulo de seccion: la voz chica en mayusculas que ya usan los KPI del
   esqueleto (.kpi .k) — ordena la jerarquia sin competir con las baldosas */
.sec-t{font-size:14px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:24px 0 8px}
#step1 .sec-t:first-child{margin-top:0}
#step1 .row{margin:8px 0}

/* los 6 rubros como baldosas parejas (mismo gesto que el menu GP2):
   3 columnas, 2 en celular; activo = negro, como todo chip GP2 */
#rubroGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
#rubroGrid .prov-btn{min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:8px 10px}

/* proveedores: chips estandar del esqueleto, altura tocable */
#provGrid .prov-btn{min-height:48px}

/* inputs: base historica de la pantalla. OJO ORDEN: misma especificidad
   que ".kg-modal input" — esta regla debe ir ANTES para que el popup
   conserve su input grande centrado. */
input[type="text"],input[type="date"]{height:40px;border:2px solid #d0d7de;border-radius:8px;padding:0 10px;font-size:21px}
input[type="text"]{width:200px}
/* en el paso 1 los campos suben a 48px (touch comodo) y el N° de remito
   se acomoda al ancho sin desbordar en 390px */
#step1 input[type="text"],#step1 input[type="date"]{height:48px;padding:0 12px;font-size:20px}
#step1 input[type="text"]{width:auto;flex:1 1 140px;min-width:140px;max-width:240px}

#btnContinuarRow{margin:24px 0 0}
#btnContinuar{min-height:48px;padding:12px 24px}

@media(max-width:480px){
  #rubroGrid{grid-template-columns:1fr 1fr}
  #btnContinuar{width:100%}
}

/* kgConfirm / kgPesajeOk llevan .btn-primary SIN .btn: el .btn:disabled
   del esqueleto no los alcanza */
.btn-primary:disabled{opacity:.45;cursor:not-allowed}

/* estados de mensajes (el JS setea 'status ok' / 'status bad') */
.ok{color:#0a7a2f}
.bad{color:#b42318}

/* ---------- PASO 2 y popup: SIN CAMBIOS (verbatim de v3.11.0) ---------- */
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:12px 0}
.item-btn{padding:16px 8px;background:#fff;border:2px solid #d0d7de;border-radius:8px;cursor:pointer;text-align:center;font-weight:600;transition:all .15s;overflow:hidden}
.item-btn:hover{border-color:#111;background:#f6f8fa}
.item-btn .code{display:block;font-size:24px;font-weight:800;color:#0066cc}
.item-btn .desc{display:block;font-size:19px;color:#111;margin-top:8px;font-weight:700;line-height:1.2;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.item-btn .sect{display:block;font-size:15px;color:#888;margin-top:8px;font-weight:700}
/* OC abierta esperando este insumo: es lo UNICO que va abajo de la medida
   (usuario 2026-08-31: "no quiero el stock, solo la OC. Si no hay OC, nada
   ahi abajo"). Antes fue la ultima carga y despues el stock: los dos se
   leian como algo que no eran, asi que la tarjeta quedo solo con la OC. */
.item-btn .oc-pend{display:block;font-size:15px;font-weight:800;line-height:1.25;margin-top:6px;
                   color:#7c2d12;background:#fef3c7;border-radius:8px;padding:5px 8px}
/* v3.23.0: cuando el ítem ya se pasó al remito, la tarjeta se ve "cargado"
   (pedido usuario "si cargué que entrega ahí abajo que figure lo que estoy
   cargando"): borde y fondo verde, y una pastilla abajo con lo cargado. */
.item-btn.cargado{border-color:#0a7a2f;background:#eefbf1}
.item-btn.cargado:hover{border-color:#075a24;background:#dcfae4}
.item-btn .cargado-info{display:block;font-size:15px;font-weight:800;line-height:1.25;margin-top:6px;
                        color:#0a7a2f;background:#dcfae4;border-radius:8px;padding:5px 8px}

/* el exito arranca oculto: el JS lo muestra con style.display */
.successBox{display:none;margin:12px 0;border:2px solid #c7e8d1;background:#f3fbf6;border-radius:12px;padding:16px;text-align:center}
.successBox .title{font-weight:900;font-size:23px;margin-bottom:4px;color:#0a7a2f}

/* El popup scrollea DESDE ARRIBA: con align-items:center un pesaje largo
   (varios items x varios pallets) desbordaba para los dos lados y la parte
   de arriba quedaba fuera de alcance — no habia forma de volver al titulo. */
.input-kg-popup{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.input-kg-popup.open{display:flex}
.kg-modal{background:#fff;border-radius:16px;padding:34px;width:96%;max-width:620px;box-shadow:0 10px 40px rgba(0,0,0,.3);margin:auto;position:relative}
@media(max-width:480px){
  .input-kg-popup{padding:8px}
  .kg-modal{padding:18px 12px;width:100%}
  .kg-modal h3{font-size:24px;margin-bottom:12px}
}
.kg-modal h3{margin-bottom:20px;font-size:32px;font-weight:700}
/* La X del popup se saco por pedido del usuario (2026-09-01): "el
   funcionamiento de no poder salir esta bien pero saca la X no se va a usar".
   La salida real del popup ahora vive en Cancelar (paso 1) o en el flujo del
   pesaje (paso 2 — Guardar). Escape sigue funcionando en paso 1. */
.kg-modal .item-info{background:#f6f8fa;padding:16px;border-radius:10px;margin-bottom:20px;font-size:22px}
.kg-modal input{width:100%;padding:14px;font-size:28px;border:2px solid #d0d7de;border-radius:8px;margin-bottom:16px;text-align:center}
.kg-modal .unit-row{display:flex;gap:8px;margin-bottom:20px;justify-content:center}
.kg-modal .unit-btn{padding:8px 18px;min-height:44px;font-size:16px;font-weight:700;border:1.5px solid #d0d7de;border-radius:999px;background:#fff;cursor:pointer;color:#555}
.kg-modal .unit-btn.active{background:#111;color:#fff;border-color:#111}   /* sigue clarisimo cual esta elegida */
.kg-modal .actions{display:flex;gap:12px;align-items:stretch}
.kg-modal .actions button{flex:1;padding:16px;font-size:24px;font-weight:700;border:none;border-radius:8px;cursor:pointer}
/* el border:none de arriba se comia el borde del secundario y "Salir sin pesar"
   quedaba como texto suelto, sin parecer un boton */
.kg-modal .actions .btn-secondary{border:2px solid #d0d7de;background:#fff}
/* la salida no compite con Guardar: mas chica y sin robarle lugar */
.kg-modal .actions #kgPesajeSalir{flex:0 1 auto;font-size:18px;padding:16px 14px;color:#475569}

/* Control en balanza */
.ctl-card{border:2px solid #d0d7de;border-radius:10px;padding:14px;margin:12px 0;background:#fff}
.ctl-card .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:20px}
.ctl-card .ch b{font-size:22px}
.badge{display:inline-block;padding:3px 12px;border-radius:12px;font-weight:800;font-size:16px;border:2px solid}
.b-ok{color:#0a7a2f;border-color:#cdead6;background:#f3fbf6}
.b-mal{color:#b42318;border-color:#eacfcd;background:#fdf3f2}
.b-warn{color:#9a6700;border-color:#eae0cd;background:#fff8e5}
.b-pend{color:#666;border-color:#d0d7de;background:#f6f8fa}
.pallet-box{border:2px solid #e3e7ec;border-radius:8px;padding:12px;margin:10px 0;background:#fafbfc}
.pallet-box .ph{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:19px;font-weight:800}
.pallet-box input{height:40px;border:2px solid #d0d7de;border-radius:8px;padding:0 10px;font-size:21px;text-align:right}
.inp-peso{width:120px}.inp-r{width:90px}
.rollo-line{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:19px}
.rollo-line .x{background:none;border:none;font-size:24px;color:#888;cursor:pointer}
.rollo-line .x:hover{color:#b42318}
.calc-line{font-size:18px;color:#444;margin-top:8px}
.kg-conv{font-size:21px;color:#0b3b73;font-weight:700;text-align:center;padding:6px 0;min-height:28px;letter-spacing:.3px}
.remito-bar{border:2px solid #cddaea;background:#eef4fb;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:17px}
.remito-bar .rb-items{margin:4px 0 8px;color:#333}
.remito-bar .rb-pend{color:#b42318;font-weight:700;margin-top:6px}
.pes-item-h{font-size:19px;font-weight:900;margin:14px 0 6px;color:#0b3b73}
.pes-item-h .cod{color:#0066cc}
/* paso 2 anidado: pesaje dentro del mismo popup */
/* pallet COMPACTO: filas de una linea, sin etiquetas en bloque, para que
   un remito de varios pallets no obligue a scrollear media pantalla por pallet */
.pes-pallet{border:2px solid #d0d7de;border-radius:10px;padding:10px;margin-bottom:10px;background:#fafbfc}
.pes-pallet .ph{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;margin-bottom:8px}
/* margin:0 a proposito: los inputs del pesaje heredaban el margin-bottom:16px
   de '.kg-modal input' (misma especificidad, declarado antes) y ese aire fantasma
   estiraba el stepper a 64px contra los 44 de la balanza — con los dos campos en
   el mismo renglon el escalon se veia. */
.pes-pallet input{border:2px solid #d0d7de;border-radius:8px;padding:8px 10px;font-size:19px;text-align:center;width:100%;margin:0}
/* TODO EL PALLET EN UNA FILA (pedido del usuario 2026-08-31: "toda esta info
   esta ancha al pedo, ponela en una fila sola de ancho"):
       Balanza [450] kg   Rollos [- 5 +] x [88,5] kg
   Antes la balanza y los rollos eran dos bloques apilados y sus inputs iban con
   flex:1, asi que un numero de 3 digitos ocupaba 400px de ancho. Ahora cada
   campo mide lo que tiene que medir y las dos cosas entran en el mismo renglon;
   en celular la parte de rollos baja sola (flex-wrap). */
.pes-fila1{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
/* fila de balanza: etiqueta al lado, no arriba */
.peso-row{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.peso-row .plbl{font-size:15px;font-weight:700;color:#555;flex:0 0 auto}
.peso-row input{flex:0 0 96px;width:96px !important;min-height:44px;text-align:right;font-size:20px !important;font-weight:700}
.peso-row .punit{font-size:15px;font-weight:700;color:#555;flex:0 0 auto}
.pes-linea{display:flex;gap:6px;align-items:center;flex:0 0 auto}
/* las lineas de OTRO peso (raras) se apilan en columna al lado de la balanza,
   asi todas arrancan en la misma x en vez de quedar escalonadas */
.pes-rollos{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.pes-linea .x{cursor:pointer;font-size:18px;color:#b42318;font-weight:800;padding:0 4px;flex:0 0 auto}
/* la linea entra en UNA fila: Rollos [- 5 +] x [88,5] kg */
.stp{display:flex;align-items:center;border:2px solid #d0d7de;border-radius:8px;overflow:hidden;background:#fff;flex:0 0 auto}
/* altura FIJA de 44: el stepper comparte renglon con la balanza y si crece
   queda un escalon entre los dos campos */
.stp .stb{width:36px;height:44px;min-height:44px;border:0;background:#f1f5f9;font-size:22px;font-weight:800;color:#0b3b73;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.stp .stb:active{background:#dbe4ee}
.stp input{border:0 !important;width:38px !important;height:44px;min-height:44px;font-size:20px !important;font-weight:800;text-align:center;padding:0 !important;flex:0 0 38px}
.pes-linea .lbl{font-size:14px;font-weight:700;color:#555;white-space:nowrap;flex:0 0 auto}
.kgw{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.kgw input{flex:0 0 84px;width:84px !important;font-size:18px !important;padding:8px 6px !important;min-height:44px;text-align:right}
.kgw span{font-size:15px;font-weight:700;color:#555;flex:0 0 auto}
/* valor calculado solo (balanza - tara / rollos): azul hasta que lo corrijan */
.kgw input.auto{color:#1d4ed8;font-weight:700}
.pes-calc{font-size:15px;margin-top:8px;color:#555}
.pes-calc .okc{color:#0a7a2f;font-weight:800} .pes-calc .warnc{color:#b45309;font-weight:800}
.pes-add{font-size:15px;font-weight:700;color:#1d4ed8;cursor:pointer;background:none;border:1px dashed #cddbea;border-radius:8px;padding:6px 10px;margin-top:8px}
/* pesaje por etapas: un item por vez, con chips de progreso y Anterior/Siguiente */
.pes-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pes-chip{padding:6px 12px;border-radius:16px;border:2px solid #d0d7de;background:#fff;font-weight:800;font-size:14px;cursor:pointer;color:#334155}
/* chip activo/done: el color:#fff sobre fondo pastel dejaba invisible el
   codigo del sector (usuario 2026-09-01, con foto: "sectores que no se ven,
   letra blanca?"). El activo pasa a texto azul oscuro sobre celeste; el
   done+act, verde oscuro sobre verde palido. Contraste real. */
.pes-chip.act{background:#cddaea;border-color:#7ea3c7;color:#0b3b73}
.pes-chip.done{border-color:#cdead6;color:#0a7a2f;background:#eefaf1}
.pes-chip.done.act{background:#cdead6;border-color:#68b183;color:#0a7a2f}
/* Chip en ERROR: rojo (fondo rojo suave + texto vino). Se aplica cuando el
   item tiene sobrante negativo — la clase `done` NO se agrega en ese caso.
   Antes el chip quedaba verde ✓ aunque el bloqueo estaba activo: al operario
   le "no cuadraba" [usuario 2026-09-01: "algo no cuadra"]. */
.pes-chip.err{background:#fdf3f2;border-color:#eacfcd;color:#b42318}
.pes-chip.err.act{background:#f7d7d3;border-color:#c47a72;color:#7a1a10}
.pes-nav{display:flex;gap:10px;margin-top:14px}
.pes-nav button{flex:1;padding:14px;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
/* Siguiente: texto azul oscuro sobre celeste (usuario 2026-09-01: "el boton
   no se ve bien, x mas que este bloqueado tiene que ser legible"). Antes
   color:#fff sobre #e7eff8 = invisible. Mismo bug que arreglamos en chips. */
.pes-nav .sig{background:#cddaea;color:#0b3b73;border:2px solid #7ea3c7}
.pes-nav .ant{background:#fff;color:#0b3b73;border:2px solid #d0d7de}
.pes-paso{font-size:14px;font-weight:800;color:#555;margin-bottom:4px}

/* Mensaje del bloqueo (sobrante negativo, balanza<remito) — layout limpio
   con card, titulo destacado y detalle indentado por pallet (usuario
   2026-09-01: "el mensaje del palet puede ser mejor"). */
.err-card{background:#fdf3f2;border:2px solid #eacfcd;border-radius:10px;padding:12px 14px;margin-top:10px;color:#111;font-size:15px;line-height:1.45}
.err-card .err-title{font-size:17px;font-weight:900;color:#b42318;margin-bottom:6px}
.err-card .err-sub{color:#555;margin-bottom:10px}
.err-card .err-item{background:#fff;border:1px solid #eacfcd;border-radius:8px;padding:10px 12px;margin-top:8px}
.err-card .err-item + .err-item{margin-top:8px}
.err-card .err-cod{font-weight:900;color:#0b3b73;font-size:16px}
.err-card .err-desc{color:#555;font-weight:600}
.err-card .err-remito{margin-top:4px;font-size:15px}
.err-card .err-remito b{color:#0b3b73}
.err-card .err-plt{margin:6px 0 0 12px;font-size:14px;color:#333;font-variant-numeric:tabular-nums}
.err-card .err-plt b{color:#0b3b73}
/* Pallet CON el error (sobrante negativo): resaltado en rojo con "⚠" al lado
   para que se vea CUAL es el que no cuadra dentro de un item con varios
   pallets [usuario 2026-09-01, con foto: "algo no cuadra"]. Los OK quedan
   en gris — la vista lee "solo este es el problema". */
.err-card .err-plt.err{color:#b42318;font-weight:700;background:#fdf3f2;border-left:3px solid #b42318;padding:4px 8px;border-radius:4px}
.err-card .err-plt.err b{color:#b42318}
.err-card .err-plt.ok{color:#666}
.err-card .err-plt.ok b{color:#555}
.err-card .err-fix{margin-top:10px;font-weight:700;color:#7c2d12}
</style>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Recepción Insumos</h1>
    <div class="hbtns"><a id="btnAtrasHeader" href="../GP2_MODULOS.html">Atrás</a></div>
  </div>

  <div class="steps">
    <!-- Paso 1 -->
    <div id="step1">
      <!-- Pendientes de pesaje a la vista APENAS se abre la pantalla (pedido del
           usuario): antes solo aparecian adentro del paso 2, despues de elegir
           rubro y proveedor. Un toque y va directo a la balanza. -->
      <div id="pendBar" class="remito-bar hidden" style="margin:0 0 16px"></div>
      <div class="sec-t">Rubro</div>
      <div class="provs-grid" id="rubroGrid">
        <button class="prov-btn" data-rubro="Flejes"    data-sid="5">Flejes</button>
        <button class="prov-btn" data-rubro="Cajas"     data-sid="11">Cajas</button>
        <button class="prov-btn" data-rubro="Plasticos" data-sid="6">Plásticos</button>
        <button class="prov-btn" data-rubro="Cartones"  data-sid="10">Cartones</button>
        <button class="prov-btn" data-rubro="Remaches"  data-sid="8">Remaches</button>
        <button class="prov-btn" data-rubro="Bombillas" data-sid="7">Bombillas</button>
      </div>

      <div id="provSection" class="hidden">
        <div class="sec-t">Proveedor</div>
        <div class="provs-grid" id="provGrid"></div>
      </div>

      <div id="remitoSection" class="hidden">
        <div class="sec-t">Remito</div>
        <div class="row">
          <label class="lbl" for="txtRemito">N°</label>
          <input type="text" id="txtRemito" placeholder="Opcional">
          <label class="lbl" for="txtFecha">Fecha</label>
          <input type="date" id="txtFecha">
        </div>
      </div>

      <div class="row" id="btnContinuarRow" style="display:none">
        <button id="btnContinuar" class="btn btn-primary" disabled>Cargar artículos</button>
      </div>
    </div>

    <!-- Paso 2 -->
    <div id="step2" class="hidden">
      <div class="row">
        <button class="btn btn-secondary" id="btnVolver1">← Volver</button>
        <div id="step2Title" style="font-size:22px;font-weight:900;color:#0b3b73"></div>
      </div>
      <!-- Marca (solo Cartones): LOEKE / CHEF -->
      <div id="marcaWrap" class="hidden" style="margin:8px 0">
        <div style="font-weight:800;color:#475569;font-size:14px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Marca</div>
        <div class="provs-grid" id="marcaChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
      <!-- Formato (solo Cartones, tras marca): LOEKE={C,8,Huevo} / CHEF={LOKE,8,Huevo} -->
      <div id="formatoWrap" class="hidden" style="margin:8px 0">
        <div style="font-weight:800;color:#475569;font-size:14px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Formato</div>
        <div class="provs-grid" id="formatoChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
      <!-- Remito en curso: los items anotados esperan el pesaje de TODO el remito -->
      <div id="remitoBar" class="remito-bar hidden"></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por código o descripción…" oninput="filtrarItems()">
      </div>
      <div class="items-grid" id="itemsGrid"></div>
      <div id="itemsEmpty" class="empty hidden">No hay insumos en este rubro.</div>
    </div>

    <div id="statusMsg" class="status"></div>

    <div id="successBox" class="successBox"><div class="title">✓ Recepción registrada</div><div id="successDetail"></div><div style="margin-top:12px"><button class="btn btn-primary" id="btnNuevaRec" type="button">Nueva recepción</button></div></div>

  </div>
</div>

<!-- Popup cantidad -->
<div id="kgPopup" class="input-kg-popup">
  <div class="kg-modal">
    <h3 id="kgTitle">Cantidad</h3>
    <div class="item-info" id="kgItemInfo"></div>

    <!-- Paso 1 de la recepción: lo que dice el remito -->
    <div id="cargaWrap">
      <label style="display:block;margin-bottom:8px;font-size:18px;font-weight:700">Cantidad</label>
      <input type="text" id="kgValue" inputmode="decimal" placeholder="0,0">
      <div id="kgConvDisplay" class="kg-conv"></div>
      <!-- Campos extra POR PROVEEDOR de flejes (usuario 2026-09-01):
             Basconia: KG x Rollo
             Altrak / Hermac: Rollos totales
             Aperam / Brawin / Szapiro / JL Metales (pend): solo KG total
           El HTML se construye desde JS en abrirPopup segun fieldsFleje(prov).
           Los inputs generados usan los ids conservados (kgRollos, kgKgPorRollo)
           para que guardar() los lea sin ramas nuevas. -->
      <div id="rolloPallRow" class="hidden" style="margin-bottom:16px"></div>
      <!-- La unidad casi nunca se cambia (cada insumo ya viene con la suya), asi
           que va discreta y al pie: se sigue viendo cual esta elegida, pero no
           compite con la cantidad, que es el dato que se carga. -->
      <div class="unit-row" id="unitRow">
        <button class="unit-btn" id="unitKg" data-u="kg">Kg</button>
        <button class="unit-btn" id="unitUni" data-u="uni">Unidades</button>
      </div>
    </div>

    <!-- Paso 2 de la MISMA recepción: el pesaje en balanza. La recepción no
         está terminada hasta guardar esto. -->
    <div id="pesajeWrap" class="hidden"></div>

    <div class="actions">
      <button class="btn-secondary" id="kgCancel">Cancelar</button>
      <button class="btn-secondary hidden" id="kgPesajeSalir">Salir sin pesar</button>
      <button class="btn-primary" id="kgConfirm">Confirmar</button>
      <button class="btn-primary hidden" id="kgPesajeOk">✓ Guardar pesaje</button>
    </div>
    <div id="kgMsg" class="status" style="font-size:16px"></div>
  </div>
</div>

<script>
const SB=window.supabase.createClient(SB_URL,SB_ANON,{db:{schema:'GP2'}});
const $=id=>document.getElementById(id);

// Unidad default por rubro (kg / uni). Los flejes y remaches se compran en kg.
const RUBRO_UM={Flejes:"kg",Remaches:"kg",Cajas:"uni",Plasticos:"uni",Cartones:"uni",Bombillas:"uni"};

let INS=[], UMBY={}, KGXUNI={}, PROVFLAGS={}, RECS=[], PALL=[], ROLL=[], TARA={tara_pallet_min:4,tara_pallet_max:8};
let REMITO=[];    // items anotados del remito en curso, esperando el pesaje: {recId,codigo,desc,cant,unidad,rollos,pallets}
let rubroSel="", sidSel=0, provSel="", provsRubro=[], marcaSel="", formatoSel="";
// modo de control del proveedor (parametrizado en proveedor_insumo.modo_control):
//   rollos_remito: remito con rollos+pallets (Basconia, Aperam)
//   pesaje:        remito solo kg, mismo pesaje por pallet (resto de flejeros)
//   peso_total:    factura en uni, se pesa el total (Bella Vista)
function provModo(nom){ var f=PROVFLAGS[nom]; return (f&&f.modo_control)||'ninguno'; }
function provPideRollos(nom){ return provModo(nom)==='rollos_remito'; }
/* Campos extra en el popup de recepcion segun proveedor de flejes (usuario
   2026-09-01): "añadir los datos en los que tienen mas datos aparte de KG
   total (KG total ya aparece)". Retorno: {rollos, kgPorRollo}. Si el prov
   no matchea, no se agrega ningun campo extra (solo KG total, como Aperam/
   Brawin/Szapiro/JL Metales — este ultimo pendiente de definir por el
   usuario, hoy queda como los demas). */
function fieldsFleje(nom){
  var p = String(nom||'').trim().toLowerCase();
  if (p==='basconia') return { kgPorRollo:true };
  if (p==='hermac') return { rollos:true };
  // Aperam / Brawin / Szapiro / JL Metales / Altrak: sin campos extra ademas
  // del Kg total. Altrak fuerza kg en abrirPopup (junto con Basconia); los
  // demas respetan la UM canonica del fleje [usuario 2026-09-01: "altrack es
  // en KG totales" — flip respecto al mensaje anterior que decia unidades].
  return {};
}
// EstaMetal salio de circulacion (usuario 2026-09-01: "y saca EstaMetal") — se

// cajas/plasticos/cartones/remaches/bombillas la recepcion es simple

function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(n){var x=Number(n)||0;return Number.isInteger(x)?x.toLocaleString('es-AR'):x.toLocaleString('es-AR',{maximumFractionDigits:2});}
/* parseNum tolera coma o punto como decimal (usuario 2026-09-01: "los inputs
   numericos con coma o punto que ambos pongan punto"). Con coma presente se
   usa formato AR (miles con punto, decimal con coma); sin coma, un solo punto
   es decimal y dos o mas son miles. */
function parseNum(s){
  var str=String(s==null?'':s).trim(); if(!str) return NaN;
  if(str.indexOf(',')>=0) return parseFloat(str.replace(/\./g,'').replace(',','.'));
  var puntos=(str.match(/\./g)||[]).length;
  return puntos<=1 ? parseFloat(str) : parseFloat(str.replace(/\./g,''));
}
/* Sanitizadores para los inputs numericos del popup (usuario 2026-09-01:
   "actualmente puedo escribir letras"). Rechazan todo lo que no sea digito
   (y punto para decimales), y convierten coma a punto sobre la marcha para
   que la pantalla siempre muestre punto. */
function sanDec(v){
  return String(v==null?'':v).replace(',','.').replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1');
}
function sanInt(v){ return String(v==null?'':v).replace(/\D/g,''); }
/* Aplica un sanitizador al input y sincroniza el caret (mantiene la posicion
   despues de tipear un caracter invalido que se elimino). */
function sanInput(el, fn){
  var pos=el.selectionStart, ori=el.value, out=fn(ori);
  if(out===ori) return out;
  el.value=out;
  try{ el.setSelectionRange(Math.max(0,pos-(ori.length-out.length)), Math.max(0,pos-(ori.length-out.length))); }catch(_){}
  return out;
}

/* Lo que SI importa al recibir: si hay una OC abierta esperando este insumo,
   cuanto FALTA recibir (pedido - recibido). Sale de recepcion_bundle (OCs en
   borrador o enviada). Formato: "OC: 640 kg". La unidad va porque los flejes vienen
   en kg y los cartones en unidades: sin ella el numero no dice de que habla. Si la
   misma parte estuviera pedida en dos unidades distintas se omite, para no mentir. */
function resumenOC(oc){
  if(!oc || !(Number(oc.pendiente)>0)) return '';
  var u = oc.unidades_mezcladas ? '' : (oc.unidad || '');
  return '<span class="oc-pend">OC: '+fmt(oc.pendiente)+(u?(' '+esc(u)):'')+'</span>';
}

/* v3.23.0: si el codigo ya se cargo al REMITO en curso, junto lo que hay para
   mostrarlo abajo en la tarjeta ("cargando 360 kg · 1 pallet" o para cartones
   "cargando 12 paq"). Suma por si se cargo mas de una vez el mismo item. */
function resumenCargadoRemito(cod){
  if(!Array.isArray(REMITO) || !REMITO.length) return '';
  var items = REMITO.filter(function(x){ return x && x.codigo === cod; });
  if(!items.length) return '';
  if(items.every(function(x){ return x.modo === 'carton'; })){
    var paq = items.reduce(function(a,x){ return a + (Number(x.paquetes)||0); }, 0);
    return '<span class="cargado-info">✓ cargado '+fmt(paq)+' paq</span>';
  }
  // flejes (o mix con al menos una linea de kg/uni)
  var porUnidad = {};
  var pallets = 0;
  items.forEach(function(x){
    if(x.modo === 'carton') return;
    var u = x.unidad || 'uni';
    porUnidad[u] = (porUnidad[u]||0) + (Number(x.cant)||0);
    pallets += Number(x.pallets)||0;
  });
  var partes = Object.keys(porUnidad).map(function(u){ return fmt(porUnidad[u])+' '+esc(u); });
  var txt = '✓ cargado '+partes.join(' + ');
  if(pallets>0) txt += ' ('+pallets+' pallet'+(pallets===1?'':'s')+')';
  return '<span class="cargado-info">'+txt+'</span>';
}

    b.innerHTML='<span class="code">'+esc(i.codigo)+'</span>'+

function PAQ(){ return Number(TARA.carton_uni_x_paquete)||250; }
/* Uni x bolsa por carton_formato (regla del negocio 2026-09-01).
   Espejo del uni_x_bolsa que vive en GP2.carton_formato. Pliego y Bolsa
   NO llevan bolsa (no son carton formal): quedan como null y el control
   se hace en paquetes como antes. */
var UNI_X_BOLSA = { Huevo:2000, '8':3000, C:1000, LOKE:1000, Pliego:null, Bolsa:null };
function uniXBolsaDeFormato(f){ if(!f) return null; return UNI_X_BOLSA[f]==null?null:UNI_X_BOLSA[f]; }
function paqXBolsaDeFormato(f){ var u=uniXBolsaDeFormato(f); return u?Math.round(u/PAQ()):null; }

function abrirPopup(i){

  $('kgItemInfo').innerHTML='<b>'+esc(i.codigo)+'</b> — '+esc(i.descripcion||'')+(i.medida?(' · '+esc(i.medida)+' mm'):'')+convHint+'<br><small style="color:#666">'+esc(i.sector)+(provSel?(' · '+esc(provSel)):'')+'</small>';
  $('kgValue').value=''; $('kgMsg').textContent=''; $('kgConvDisplay').textContent='';
  // Cartones: el proveedor entrega PAQUETES (alturas de 250 unidades siempre).

  if(i.sector_id===10){
    unitSel='paq';
    $('unitRow').classList.add('hidden');
    $('kgValue').placeholder='paquetes de '+PAQ();
    updateConv();
  } else if (i.sector_id===11) {
    // Cajas: recepcion rapida en UNIDADES del remito (sin toggle Kg/Uni).
    // El control fisico (base x pisos + sueltas) se hace despues en Control Cajas.
    $('unitRow').classList.add('hidden');
    $('kgValue').placeholder='unidades del remito';
    setUnit('uni');
  } else if (i.sector_id===8) {
    // Remaches: recepcion en KG del remito (sin toggle). El control (pesar y
    // anotar los kg controlados) se hace despues en Control Remaches.
    $('unitRow').classList.add('hidden');
    $('kgValue').placeholder='kg del remito';
    setUnit('kg');
  } else if (esFleje(i)) {
    // Flejes: cada fleje tiene su UM canonica fija (46 en kg, 7 en unidad
    // como F12/E13/Z19A/E4/E5/E1/C3). El toggle Kg/Uni solo confunde. Se
    // oculta y se fuerza la UM del componente. Basconia siempre kg (no entrega
    // unidades). [usuario 2026-08-31]
    $('unitRow').classList.add('hidden');
    // Proveedores que SIEMPRE cargan en kg (aunque el fleje tenga UM 'unidad'
    // en el componente): Basconia y Altrak. El resto respeta la UM canonica
    // del fleje. [usuario 2026-09-01: "altrack es en KG totales" — flip
    // respecto al mensaje anterior que decia unidades].
    var provLC = String(provSel).toLowerCase();
    var provForzaKg = provLC==='basconia' || provLC==='altrak' || provLC==='altrack';
    var uFleje = provForzaKg ? 'kg' : (UMBY[i.comp_id]==='unidad' ? 'uni' : 'kg');
    $('kgValue').placeholder = uFleje==='kg' ? 'kg' : 'unidades';
    setUnit(uFleje);
  } else {
    $('unitRow').classList.remove('hidden');
    $('kgValue').placeholder='';
    // unidad default: la canónica del insumo, si no la del rubro
    var u = (UMBY[i.comp_id]==='kg') ? 'kg' : (UMBY[i.comp_id]==='unidad' ? 'uni' : (RUBRO_UM[rubroSel]||'uni'));
    setUnit(u);
  }
  // Campos extra por proveedor (Basconia Kg x Rollo, Altrak/Hermac Rollos):
  // el rolloPallRow se re-construye desde JS y arranca vacio. Fuera de flejes
  // no se muestra nada.
  var flds = esFleje(i) ? fieldsFleje(provSel) : {};
  pintarFieldsFleje(flds);
  $('kgPopup').classList.add('open');
  setTimeout(()=>$('kgValue').focus(),50);
