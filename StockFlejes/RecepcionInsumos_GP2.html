<!doctype html>
<html lang="es">
<head>
<!-- v2.0.0 — pesaje anidado en el popup de carga (bump por regla de Versionado en CLAUDE.md) -->
<script src="../auth-guard.js?v=2.0.0"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recepción de Insumos · GP2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f5f6f8;padding:12px;color:#111}
  .card{max-width:820px;margin:auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
  .header{background:#1a1a1a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .header h1{font-size:24px;font-weight:700;letter-spacing:.3px}
  .header .hbtns{display:flex;gap:8px}
  .header button,.header a{background:#fff;color:#111;border:none;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:18px;text-decoration:none}

  .steps{padding:14px 18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}
  label.lbl{font-weight:800;font-size:20px;min-width:80px}
  input[type="text"],input[type="date"]{height:40px;border:2px solid #d0d7de;border-radius:8px;padding:0 10px;font-size:21px}
  input[type="text"]{width:200px}

  .btn{padding:10px 16px;border-radius:8px;border:none;font-weight:800;cursor:pointer;font-size:20px}
  .btn-primary{background:#111;color:#fff}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-secondary{background:#fff;border:2px solid #d0d7de;color:#111}

  .status{margin:8px 0;font-size:20px;padding:6px 0;min-height:10px}
  .ok{color:#0a7a2f}
  .bad{color:#b42318}

  .hidden{display:none}
  .provs-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .prov-btn{padding:8px 14px;border-radius:8px;border:2px solid #d0d7de;background:#fff;font-weight:700;cursor:pointer;font-size:20px;color:#111}
  .prov-btn.active{background:#111;color:#fff;border-color:#111}

  .search-box{margin:12px 0;padding:12px;background:#f6f8fa;border-radius:8px}
  .search-box input{width:100%;padding:10px;font-size:18px;border:2px solid #d0d7de;border-radius:6px}

  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:12px 0}
  .item-btn{padding:16px 8px;background:#fff;border:2px solid #d0d7de;border-radius:8px;cursor:pointer;text-align:center;font-weight:600;transition:all .15s;overflow:hidden}
  .item-btn:hover{border-color:#111;background:#f6f8fa}
  .item-btn .code{display:block;font-size:24px;font-weight:800;color:#0066cc}
  .item-btn .desc{display:block;font-size:19px;color:#111;margin-top:8px;font-weight:700;line-height:1.2;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
  .item-btn .sect{display:block;font-size:15px;color:#888;margin-top:8px;font-weight:700}
  .item-btn .ultima{display:block;font-size:15px;color:#0a7a2f;margin-top:8px;font-weight:800;line-height:1.25}
  .item-btn .ultima.sin{color:#b0b0b0;font-weight:700;font-style:italic}

  .successBox{display:none;margin:12px 0;border:2px solid #c7e8d1;background:#f3fbf6;border-radius:12px;padding:16px;text-align:center}
  .successBox .title{font-weight:900;font-size:23px;margin-bottom:4px;color:#0a7a2f}

  .input-kg-popup{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
  .input-kg-popup.open{display:flex}
  .kg-modal{background:#fff;border-radius:16px;padding:34px;width:96%;max-width:620px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .kg-modal h3{margin-bottom:20px;font-size:32px;font-weight:700}
  .kg-modal .item-info{background:#f6f8fa;padding:16px;border-radius:10px;margin-bottom:20px;font-size:22px}
  .kg-modal input{width:100%;padding:14px;font-size:28px;border:2px solid #d0d7de;border-radius:8px;margin-bottom:16px;text-align:center}
  .kg-modal .unit-row{display:flex;gap:10px;margin-bottom:20px}
  .kg-modal .unit-btn{flex:1;padding:14px;font-size:22px;font-weight:800;border:2px solid #d0d7de;border-radius:8px;background:#fff;cursor:pointer;color:#111}
  .kg-modal .unit-btn.active{background:#111;color:#fff;border-color:#111}
  .kg-modal .actions{display:flex;gap:12px}
  .kg-modal .actions button{flex:1;padding:16px;font-size:24px;font-weight:700;border:none;border-radius:8px;cursor:pointer}

  .empty{color:#888;padding:12px;text-align:center;font-style:italic}

  /* Control en balanza */
  .ctl-card{border:2px solid #d0d7de;border-radius:10px;padding:14px;margin:12px 0;background:#fff}
  .ctl-card .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:20px}
  .ctl-card .ch b{font-size:22px}
  .badge{display:inline-block;padding:3px 12px;border-radius:12px;font-weight:800;font-size:16px;border:2px solid}
  .b-ok{color:#0a7a2f;border-color:#0a7a2f;background:#f3fbf6}
  .b-mal{color:#b42318;border-color:#b42318;background:#fdf3f2}
  .b-warn{color:#9a6700;border-color:#9a6700;background:#fff8e5}
  .b-pend{color:#666;border-color:#d0d7de;background:#f6f8fa}
  .pallet-box{border:2px solid #e3e7ec;border-radius:8px;padding:12px;margin:10px 0;background:#fafbfc}
  .pallet-box .ph{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:19px;font-weight:800}
  .pallet-box input{height:40px;border:2px solid #d0d7de;border-radius:8px;padding:0 10px;font-size:21px;text-align:right}
  .inp-peso{width:120px}.inp-r{width:90px}
  .rollo-line{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:19px}
  .rollo-line .x{background:none;border:none;font-size:24px;color:#888;cursor:pointer}
  .rollo-line .x:hover{color:#b42318}
  .calc-line{font-size:18px;color:#444;margin-top:8px}
  .kg-conv{font-size:21px;color:#0b3b73;font-weight:700;text-align:center;padding:6px 0;min-height:28px;letter-spacing:.3px}
  /* paso 2 anidado: pesaje dentro del mismo popup */
  .pes-pallet{border:2px solid #d0d7de;border-radius:10px;padding:12px;margin-bottom:12px;background:#fafbfc}
  .pes-pallet .ph{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;margin-bottom:8px}
  .pes-pallet input{border:2px solid #d0d7de;border-radius:8px;padding:8px 10px;font-size:19px;text-align:center;width:100%}
  .pes-linea{display:flex;gap:8px;align-items:center;margin-top:6px}
  .pes-linea .x{cursor:pointer;font-size:18px;color:#b42318;font-weight:800;padding:0 6px}
  .pes-calc{font-size:15px;margin-top:8px;color:#555}
  .pes-calc .okc{color:#0a7a2f;font-weight:800} .pes-calc .warnc{color:#b45309;font-weight:800}
  .pes-add{font-size:15px;font-weight:700;color:#1d4ed8;cursor:pointer;background:none;border:1px dashed #93b4d8;border-radius:8px;padding:6px 10px;margin-top:8px}
</style>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Recepción Insumos</h1>
    <div class="hbtns">
      <button id="btnCtl" style="background:#f0c040">⚖ Control</button>
      <a href="../Stocks General/StockGeneral_GP2.html">Ver stock</a>
      <a href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">
    <!-- Paso 1 -->
    <div id="step1">
      <div class="row"><label class="lbl">Rubro</label></div>
      <div class="provs-grid" id="rubroGrid">
        <button class="prov-btn" data-rubro="Flejes"    data-sid="5">Flejes</button>
        <button class="prov-btn" data-rubro="Cajas"     data-sid="11">Cajas</button>
        <button class="prov-btn" data-rubro="Plasticos" data-sid="6">Plásticos</button>
        <button class="prov-btn" data-rubro="Cartones"  data-sid="10">Cartones</button>
        <button class="prov-btn" data-rubro="Remaches"  data-sid="8">Remaches</button>
        <button class="prov-btn" data-rubro="Bombillas" data-sid="7">Bombillas</button>
      </div>

      <div id="provSection" class="hidden">
        <div class="row"><label class="lbl">Proveedor</label></div>
        <div class="provs-grid" id="provGrid"></div>
      </div>

      <div id="remitoSection" class="hidden">
        <div class="row">
          <label class="lbl">N° Remito</label>
          <input type="text" id="txtRemito" placeholder="Opcional">
          <label class="lbl" style="min-width:auto">Fecha</label>
          <input type="date" id="txtFecha">
        </div>
      </div>

      <div class="row" id="btnContinuarRow" style="display:none">
        <button id="btnContinuar" class="btn btn-primary" disabled>Cargar artículos</button>
      </div>
    </div>

    <!-- Paso 2 -->
    <div id="step2" class="hidden">
      <div class="row">
        <button class="btn btn-secondary" id="btnVolver1">← Volver</button>
        <div id="step2Title" style="font-size:22px;font-weight:900;color:#0b3b73"></div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por código o descripción…" oninput="filtrarItems()">
      </div>
      <div class="items-grid" id="itemsGrid"></div>
      <div id="itemsEmpty" class="empty hidden">No hay insumos en este rubro.</div>
    </div>

    <!-- Control en balanza (paso 2 del proceso real) -->
    <div id="step3" class="hidden">
      <div class="row">
        <button class="btn btn-secondary" id="btnVolverCtl">← Volver</button>
        <div style="font-size:22px;font-weight:900;color:#0b3b73">⚖ Control en balanza</div>
        <select id="ctlFiltro" style="height:40px;border:2px solid #d0d7de;border-radius:8px;font-size:19px;padding:0 8px">
          <option value="pend">Pendientes</option>
          <option value="prob">Con problema</option>
          <option value="">Todas</option>
        </select>
      </div>
      <div id="ctlLista"></div>
    </div>

    <div id="statusMsg" class="status"></div>

    <div id="successBox" class="successBox">
      <div class="title">✓ Recepción registrada</div>
      <div id="successDetail"></div>
    </div>

  </div>
</div>

<!-- Popup cantidad -->
<div id="kgPopup" class="input-kg-popup">
  <div class="kg-modal">
    <h3 id="kgTitle">Cantidad</h3>
    <div class="item-info" id="kgItemInfo"></div>

    <!-- Paso 1 de la recepción: lo que dice el remito -->
    <div id="cargaWrap">
      <label style="display:block;margin-bottom:8px;font-size:18px;font-weight:700">Cantidad</label>
      <input type="text" id="kgValue" inputmode="decimal" placeholder="0,0">
      <div id="kgConvDisplay" class="kg-conv"></div>
      <div class="unit-row">
        <button class="unit-btn" id="unitKg" data-u="kg">Kg</button>
        <button class="unit-btn" id="unitUni" data-u="uni">Unidades</button>
      </div>
      <div id="rolloPallRow" class="hidden" style="margin-bottom:16px">
        <div style="font-size:17px;color:#555;margin-bottom:8px">Este proveedor informa rollos. Anotá lo que dice el remito — el pesaje en balanza es el paso siguiente de esta misma carga:</div>
        <div style="display:flex;gap:12px">
          <div style="flex:1"><label style="font-size:17px;font-weight:700">Rollos</label>
            <input type="text" id="kgRollos" inputmode="numeric" placeholder="—" style="text-align:center;font-size:24px;padding:10px"></div>
          <div style="flex:1"><label style="font-size:17px;font-weight:700">Pallets</label>
            <input type="text" id="kgPallets" inputmode="numeric" placeholder="—" style="text-align:center;font-size:24px;padding:10px"></div>
        </div>
      </div>
    </div>

    <!-- Paso 2 de la MISMA recepción: el pesaje en balanza. La recepción no
         está terminada hasta guardar esto. -->
    <div id="pesajeWrap" class="hidden"></div>

    <div class="actions">
      <button class="btn-secondary" id="kgCancel">Cancelar</button>
      <button class="btn-primary" id="kgConfirm">Confirmar</button>
      <button class="btn-secondary hidden" id="kgDespues">Pesar después</button>
      <button class="btn-primary hidden" id="kgPesajeOk">✓ Guardar pesaje</button>
    </div>
    <div id="kgMsg" class="status" style="font-size:16px"></div>
  </div>
</div>

<script>
const SB_URL="https://hrxfctzncixxqmpfhskv.supabase.co";
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs";
const SB=window.supabase.createClient(SB_URL,SB_ANON,{db:{schema:'GP2'}});
const $=id=>document.getElementById(id);

// Unidad default por rubro (kg / uni). Los flejes y remaches se compran en kg.
const RUBRO_UM={Flejes:"kg",Remaches:"kg",Cajas:"uni",Plasticos:"uni",Cartones:"uni",Bombillas:"uni"};

let INS=[], UMBY={}, KGXUNI={}, PROVFLAGS={}, RECS=[], PALL=[], ROLL=[], TARA={tara_pallet_min:4,tara_pallet_max:8};
let editCtl={};   // recepcion_id -> {pallets:{nro:{peso, rollos:[{c,k}]}}}
let rubroSel="", sidSel=0, provSel="", provsRubro=[];
let itemSel=null, unitSel="uni";

function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(n){var x=Number(n)||0;return Number.isInteger(x)?x.toLocaleString('es-AR'):x.toLocaleString('es-AR',{maximumFractionDigits:2});}
function parseNum(s){return parseFloat(String(s||'').replace(/\./g,'').replace(',','.'));}

// ---- Paso 1: rubro / proveedor ----
document.querySelectorAll('#rubroGrid .prov-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    rubroSel=btn.dataset.rubro; sidSel=parseInt(btn.dataset.sid); provSel="";
    document.querySelectorAll('#rubroGrid .prov-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    // Proveedores REALES de GP2 para este rubro (los que figuran en las tablas)
    provsRubro=[...new Set(insumosDelRubro().map(i=>i.proveedor).filter(Boolean))].sort();
    if(provsRubro.length){ pintarProvs(); $('provSection').classList.remove('hidden'); }
    else { $('provGrid').innerHTML=''; $('provSection').classList.add('hidden'); }
    $('remitoSection').classList.remove('hidden');
    $('btnContinuarRow').style.display='flex';
    $('btnContinuar').textContent = provsRubro.length ? 'Cargar artículos' : 'Ver artículos';
    refreshContinuar();
  });
});
function pintarProvs(){
  var g=$('provGrid'); g.innerHTML='';
  provsRubro.forEach(p=>{
    var n=insumosDelRubro().filter(i=>i.proveedor===p).length;
    var b=document.createElement('button'); b.className='prov-btn'; b.innerHTML=esc(p)+' <span style="opacity:.6;font-weight:600">('+n+')</span>';
    b.addEventListener('click',()=>{
      provSel=p;
      g.querySelectorAll('.prov-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      refreshContinuar();
    });
    g.appendChild(b);
  });
}
// Habilitar "Cargar": si el rubro tiene proveedores en GP2, exige elegir uno; si no, alcanza el rubro.
function refreshContinuar(){ $('btnContinuar').disabled = !rubroSel || (provsRubro.length>0 && !provSel); }
$('btnContinuar').addEventListener('click',irStep2);

// ---- Paso 2: grilla de insumos del rubro (+ proveedor si aplica) ----
function insumosDelRubro(){ return INS.filter(i=>i.sector_id===sidSel); }
function insumosVista(){
  var l=insumosDelRubro();
  if(provSel) l=l.filter(i=>i.proveedor===provSel);
  return l;
}
function irStep2(){
  $('step1').classList.add('hidden');
  $('step2').classList.remove('hidden');
  $('step2Title').textContent=rubroSel+(provSel?(' · '+provSel):'');
  $('searchInput').value='';
  pintarItems(insumosVista());
}
$('btnVolver1').addEventListener('click',()=>{
  $('step2').classList.add('hidden');
  $('step1').classList.remove('hidden');
});
/* Resumen de la ultima carga del insumo: "2 pallets · 630 kg · 12 rollos".
   Va en el boton en lugar del sector, que no aporta nada estando la grilla ya
   filtrada por rubro. Solo se arman las partes que el proveedor informa. */
function resumenUltima(u){
  if(!u) return '';
  var p=[];
  if(Number(u.pallets)>0) p.push(fmt(u.pallets)+' pallet'+(Number(u.pallets)===1?'':'s'));
  if(Number(u.cantidad)>0) p.push(fmt(u.cantidad)+' '+esc(u.unidad||''));
  if(Number(u.rollos)>0)  p.push(fmt(u.rollos)+' rollo'+(Number(u.rollos)===1?'':'s'));
  if(!p.length) return '';
  return p.join(' · ');
}
function fechaCorta(f){
  if(!f) return '';
  try{ return new Date(f).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}); }
  catch(e){ return ''; }
}

function pintarItems(list){
  var g=$('itemsGrid'); g.innerHTML='';
  $('itemsEmpty').classList.toggle('hidden', list.length>0);
  list.forEach(i=>{
    var med = i.medida ? ('<span class="sect" style="color:#0b3b73;font-size:17px">'+esc(i.medida)+' mm</span>') : '';
    var res = resumenUltima(i.ultima);
    var ult = res
      ? '<span class="ultima">últ. '+esc(fechaCorta(i.ultima.fecha))+': '+res+'</span>'
      : '<span class="ultima sin">sin cargas</span>';
    var b=document.createElement('button'); b.className='item-btn';
    b.innerHTML='<span class="code">'+esc(i.codigo)+'</span>'+
      '<span class="desc">'+esc(i.descripcion||'')+'</span>'+ med + ult;
    b.addEventListener('click',()=>abrirPopup(i));
    g.appendChild(b);
  });
}
function filtrarItems(){
  var q=($('searchInput').value||'').trim().toLowerCase();
  var list=insumosVista();
  if(q) list=list.filter(i=>((i.codigo||'')+' '+(i.descripcion||'')+' '+(i.medida||'')).toLowerCase().indexOf(q)>=0);
  pintarItems(list);
}

// ---- Popup cantidad ----
function setUnit(u){
  unitSel=u;
  $('unitKg').classList.toggle('active',u==='kg');
  $('unitUni').classList.toggle('active',u==='uni');
  updateConv();
}
function updateConv(){
  var d=$('kgConvDisplay'); if(!d) return;
  var kx=itemSel&&KGXUNI[itemSel.comp_id];
  if(unitSel==='uni'&&kx){
    var v=parseNum($('kgValue').value);
    d.textContent=v>0?('= '+fmt(v*kx)+' kg'):'';
  } else { d.textContent=''; }
}
$('unitKg').addEventListener('click',()=>setUnit('kg'));
$('unitUni').addEventListener('click',()=>setUnit('uni'));
function abrirPopup(i){
  itemSel=i;
  resetPiePopup();
  $('kgTitle').textContent='Recepción · '+rubroSel;
  var kx=KGXUNI[i.comp_id];
  var convHint=kx?' <small style="color:#9a6700;font-weight:600">(1 uni = '+fmt(kx)+' kg)</small>':'';
  $('kgItemInfo').innerHTML='<b>'+esc(i.codigo)+'</b> — '+esc(i.descripcion||'')+(i.medida?(' · '+esc(i.medida)+' mm'):'')+convHint+'<br><small style="color:#666">'+esc(i.sector)+(provSel?(' · '+esc(provSel)):'')+'</small>';
  $('kgValue').value=''; $('kgMsg').textContent=''; $('kgConvDisplay').textContent='';
  // unidad default: la canónica del insumo, si no la del rubro
  var u = (UMBY[i.comp_id]==='kg') ? 'kg' : (UMBY[i.comp_id]==='unidad' ? 'uni' : (RUBRO_UM[rubroSel]||'uni'));
  setUnit(u);
  var pide = !!PROVFLAGS[provSel];
  $('rolloPallRow').classList.toggle('hidden', !pide);
  $('kgRollos').value=''; $('kgPallets').value='';
  $('kgPopup').classList.add('open');
  setTimeout(()=>$('kgValue').focus(),50);
}
/* ============================================================
   PASO 2 ANIDADO: el pesaje en balanza dentro del mismo popup.
   Carga y pesaje son UNA sola tarea: la recepción no está
   terminada hasta guardar el pesaje. "Pesar después" la deja
   explícitamente PENDIENTE (se retoma en ⚖ Control).
   ============================================================ */
var PES = null;   // {recId, pallets:{nro:{peso, rollos:[{c,k}]}}}

/* Vuelve el popup al estado inicial (paso 1: Cancelar / Confirmar). */
function resetPiePopup(){
  PES = null;
  $('cargaWrap').classList.remove('hidden');
  $('pesajeWrap').classList.add('hidden');
  $('pesajeWrap').innerHTML='';
  $('kgConfirm').classList.remove('hidden'); $('kgConfirm').disabled=false;
  $('kgCancel').classList.remove('hidden');
  $('kgDespues').classList.add('hidden');
  $('kgPesajeOk').classList.add('hidden');
}

function cerrarPopup(){
  $('kgPopup').classList.remove('open');
  itemSel=null;
  resetPiePopup();
  $('kgMsg').textContent=''; $('kgMsg').className='status';
}
$('kgCancel').addEventListener('click',cerrarPopup);

/* Arma el paso 2 con los pallets declarados en el remito (o 1 si no dijo). */
function montarPesaje(recId, nPallets){
  PES = { recId: recId, pallets: {} };
  var n = Math.max(1, nPallets||1);
  for (var i=1; i<=n; i++) PES.pallets[i] = { peso:'', rollos:[{c:'',k:''}] };
  $('kgTitle').textContent = 'Pesaje en balanza · paso 2 de 2';
  $('cargaWrap').classList.add('hidden');
  $('kgConfirm').classList.add('hidden');
  $('kgCancel').classList.add('hidden');
  $('kgDespues').classList.remove('hidden');
  $('kgPesajeOk').classList.remove('hidden');
  $('kgMsg').className='status';
  $('kgMsg').innerHTML='<span style="color:#0a7a2f;font-weight:800">✓ Remito cargado.</span> '+
    'La recepción se termina con el pesaje: por cada pallet, el peso de balanza y las líneas de rollos.';
  $('pesajeWrap').classList.remove('hidden');
  pintarPesaje();
}

function pintarPesaje(){
  var w=$('pesajeWrap');
  w.innerHTML = Object.keys(PES.pallets).sort((a,b)=>a-b).map(function(nro){
    var p=PES.pallets[nro];
    var k=calcPallet(p);
    var calcTxt = k.sob!=null
      ? ('Rollos <b>'+k.rollos+'</b> · suma <b>'+fmt(k.kg)+' kg</b> · sobrante '+
         '<span class="'+(k.estado==='ok'?'okc':'warnc')+'">'+fmt(k.sob)+' kg</span> (esperado '+k.tmin+'–'+k.tmax+')')
      : 'Completá el peso de balanza y al menos una línea de rollos.';
    return '<div class="pes-pallet" data-p="'+nro+'">'+
      '<div class="ph"><span>Pallet '+nro+'</span></div>'+
      '<label style="font-size:15px;font-weight:700">Peso de balanza (kg)</label>'+
      '<input inputmode="decimal" data-f="peso" value="'+esc(p.peso)+'" placeholder="0,0">'+
      p.rollos.map(function(l,idx){
        return '<div class="pes-linea" data-l="'+idx+'">'+
          '<input inputmode="numeric" data-f="c" value="'+esc(l.c)+'" placeholder="rollos" style="flex:1">'+
          '<span style="font-weight:800">×</span>'+
          '<input inputmode="decimal" data-f="k" value="'+esc(l.k)+'" placeholder="kg/rollo" style="flex:1">'+
          '<span class="x" data-del="1" title="Quitar línea">✕</span></div>';
      }).join('')+
      '<button type="button" class="pes-add" data-addl="1">+ línea de rollos</button>'+
      '<div class="pes-calc">'+calcTxt+'</div>'+
    '</div>';
  }).join('')+
  '<button type="button" class="pes-add" data-addp="1">+ pallet</button>';
}

/* Delegación: inputs y botones del paso 2 (el DOM se re-arma seguido). */
$('pesajeWrap').addEventListener('input', function(e){
  var pb=e.target.closest('.pes-pallet'); if(!pb||!PES) return;
  var p=PES.pallets[pb.dataset.p]; if(!p) return;
  var f=e.target.dataset.f;
  if(f==='peso') p.peso=e.target.value;
  else{
    var ln=e.target.closest('.pes-linea'); if(!ln) return;
    p.rollos[Number(ln.dataset.l)][f]=e.target.value;
  }
  // refrescar solo la línea de cálculo (sin re-render, para no perder el foco)
  var k=calcPallet(p);
  pb.querySelector('.pes-calc').innerHTML = k.sob!=null
    ? ('Rollos <b>'+k.rollos+'</b> · suma <b>'+fmt(k.kg)+' kg</b> · sobrante '+
       '<span class="'+(k.estado==='ok'?'okc':'warnc')+'">'+fmt(k.sob)+' kg</span> (esperado '+k.tmin+'–'+k.tmax+')')
    : 'Completá el peso de balanza y al menos una línea de rollos.';
});
$('pesajeWrap').addEventListener('click', function(e){
  if(!PES) return;
  if(e.target.dataset.addp){
    var ns=Object.keys(PES.pallets).map(Number);
    PES.pallets[Math.max.apply(null,ns.concat([0]))+1]={peso:'',rollos:[{c:'',k:''}]};
    pintarPesaje(); return;
  }
  var pb=e.target.closest('.pes-pallet'); if(!pb) return;
  var p=PES.pallets[pb.dataset.p]; if(!p) return;
  if(e.target.dataset.addl){ p.rollos.push({c:'',k:''}); pintarPesaje(); return; }
  if(e.target.dataset.del){
    var ln=e.target.closest('.pes-linea');
    p.rollos.splice(Number(ln.dataset.l),1);
    if(!p.rollos.length) p.rollos=[{c:'',k:''}];
    pintarPesaje(); return;
  }
});

/* Dejar pendiente: la recepción queda SIN terminar, se retoma en ⚖ Control. */
$('kgDespues').addEventListener('click', function(){
  cerrarPopup();
  var m=$('statusMsg');
  m.className='status bad';
  m.textContent='⚠ Recepción cargada pero SIN pesaje: queda pendiente. Se termina en ⚖ Control.';
  setTimeout(function(){ m.textContent=''; m.className='status'; }, 8000);
});

/* Guardar pesaje: cierra la recepción. Alerta si el sobrante se va de 4–8,
   pero deja guardar igual (queda marcado para revisar). */
$('kgPesajeOk').addEventListener('click', async function(){
  if(!PES) return;
  var m=$('kgMsg');
  var nros=Object.keys(PES.pallets).sort((a,b)=>a-b);
  var listos=nros.filter(function(nro){
    var p=PES.pallets[nro];
    return pnum(p.peso)>0 && p.rollos.some(function(l){ return pint(l.c)>0 && pnum(l.k)>0; });
  });
  if(!listos.length){ m.className='status bad'; m.textContent='Cargá al menos un pallet: peso de balanza + rollos.'; return; }

  var fuera=[];
  listos.forEach(function(nro){
    var k=calcPallet(PES.pallets[nro]);
    if(k.sob!=null && k.estado!=='ok')
      fuera.push('Pallet '+nro+': sobrante '+fmt(k.sob)+' kg ('+k.estado+', esperado '+k.tmin+'–'+k.tmax+')');
  });
  if(fuera.length && !confirm(
      '⚠ El sobrante no da el peso de un pallet en:\n\n'+fuera.join('\n')+
      '\n\nPuede ser un rollo mal anotado o un error de balanza.\nSe puede guardar igual y corregirlo después.\n\n¿Guardar así?')) return;

  $('kgPesajeOk').disabled=true;
  m.className='status'; m.textContent='Guardando pesaje…';
  var errs=[], ok=0;
  for (var i=0;i<listos.length;i++){
    var nro=listos[i], p=PES.pallets[nro];
    var lineas=p.rollos.map(function(l){ return {cantidad:pint(l.c),kg_por_rollo:pnum(l.k)}; })
                       .filter(function(l){ return l.cantidad>0 && l.kg_por_rollo>0; });
    try{
      var r=await SB.rpc('pesar_pallet',{p_recepcion_id:PES.recId,p_nro_pallet:Number(nro),
        p_peso_balanza:pnum(p.peso),p_rollos:lineas,p_usuario:null});
      if(r.error) throw r.error;
      ok++;
    }catch(e){ errs.push('Pallet '+nro+': '+(e.message||e)); }
  }
  $('kgPesajeOk').disabled=false;
  if(errs.length){ m.className='status bad'; m.textContent=errs.join(' · '); return; }

  // Recién acá la recepción está TERMINADA (paso 1 + paso 2).
  var sb=$('successBox'); sb.style.display='block';
  $('successBox').querySelector('.title').textContent='✓ Recepción completa';
  $('successDetail').innerHTML='Remito cargado y '+ok+' pallet'+(ok===1?'':'s')+' pesado'+(ok===1?'':'s')+
    (fuera.length?(' · <b style="color:#b45309">'+fuera.length+' con sobrante fuera de rango (a revisar)</b>'):'')+'.';
  cerrarPopup();
  setTimeout(function(){ sb.style.display='none'; },7000);
  await cargar();
});
// En el paso 2 el click en el fondo NO cierra: la recepción quedaría a medias
// sin que el usuario lo note. Ahí se sale solo con "Pesar después" o guardando.
$('kgPopup').addEventListener('click',e=>{ if(e.target===$('kgPopup') && !PES) cerrarPopup(); });
$('kgConfirm').addEventListener('click',guardar);

async function guardar(){
  var m=$('kgMsg'); m.className='status'; m.textContent='';
  if(!itemSel){cerrarPopup();return;}
  var cantRaw=parseNum($('kgValue').value);
  if(!cantRaw||cantRaw<=0){m.className='status bad';m.textContent='Ingresá una cantidad (> 0).';return;}
  // Si el usuario ingresó unidades y el componente tiene kg_x_uni, auto-convertir a kg
  var kx=KGXUNI[itemSel.comp_id];
  var cant=cantRaw, uReal=unitSel;
  if(unitSel==='uni'&&kx){ cant=cantRaw*kx; uReal='kg'; }
  $('kgConfirm').disabled=true;
  try{
    var fiso=$('txtFecha').value?($('txtFecha').value+'T12:00:00'):null;
    var pide = !!PROVFLAGS[provSel];
    var rll = pide ? (parseInt(($('kgRollos').value||'').replace(/\D/g,''),10)||null) : null;
    var pll = pide ? (parseInt(($('kgPallets').value||'').replace(/\D/g,''),10)||null) : null;
    if(pide && (!rll||!pll) && !confirm('Este proveedor informa rollos, pero no cargaste '+(!rll?'rollos':'')+((!rll&&!pll)?' ni ':'')+(!pll?'pallets':'')+'.\nSe puede completar despues, pero el control no va a poder cerrar.\n\n¿Guardar igual?')) { $('kgConfirm').disabled=false; return; }
    var res=await SB.rpc('cargar_recepcion',{
      p_comp_id:itemSel.comp_id, p_proveedor:provSel||null,
      p_cantidad:cant, p_unidad:uReal, p_remito:$('txtRemito').value||null,
      p_rollos:rll, p_pallets:pll, p_fecha:fiso});
    if(res.error) throw res.error;
    // Actualizar en el acto la última carga del insumo, así el botón la muestra
    // sin tener que recargar la pantalla.
    itemSel.ultima = { fecha:(fiso||new Date().toISOString()), cantidad:cant, unidad:uReal,
                       rollos:rll, pallets:pll, remito:$('txtRemito').value||null, proveedor:provSel||null };
    var ref = INS.filter(function(x){ return x.comp_id===itemSel.comp_id; })[0];
    if (ref) ref.ultima = itemSel.ultima;
    filtrarItems();

    // Con proveedor que informa rollos, la recepción NO termina acá: el mismo
    // popup pasa al paso 2 (pesaje en balanza). El éxito recién se muestra
    // cuando el pesaje quedó guardado.
    var recId = res.data && res.data.recepcion_id;
    if (pide && recId){
      montarPesaje(recId, pll);
      return;
    }

    // Sin rollos (cajas, plásticos, etc.): la carga sola completa la recepción.
    var sb=$('successBox'); sb.style.display='block';
    $('successBox').querySelector('.title').textContent='✓ Recepción registrada';
    var detUni= (uReal==='kg'&&kx&&unitSel==='uni') ? (fmt(cantRaw)+' uni = <b>'+fmt(cant)+' kg</b>') : '<b>'+fmt(cant)+' '+esc(uReal)+'</b>';
    $('successDetail').innerHTML=esc(itemSel.codigo)+' — '+esc(itemSel.descripcion||'')+' · '+detUni+(provSel?(' ('+esc(provSel)+')'):'')+'. Stock actualizado. Mov '+(res.data&&res.data.movimiento_id)+'.';
    cerrarPopup();
    setTimeout(()=>{sb.style.display='none';},6000);
  }catch(e){ m.className='status bad'; m.textContent='Error: '+(e.message||e); }
  finally{ $('kgConfirm').disabled=false; }
}

async function cargar(){
  $('statusMsg').textContent='Cargando insumos…';
  var res=await SB.rpc('recepcion_bundle');
  if(res.error){$('statusMsg').className='status bad';$('statusMsg').textContent='Error: '+res.error.message;return;}
  var d=res.data||{};
  INS=d.insumos||[]; UMBY={}; INS.forEach(i=>UMBY[i.comp_id]=i.um);
  PROVFLAGS={}; (d.proveedores||[]).forEach(p=>PROVFLAGS[p.nombre]=!!p.informa_rollos);
  RECS=d.recepciones||[]; PALL=d.pallets||[]; ROLL=d.rollos||[];
  if(d.tara) TARA=d.tara;
  // Cargar factores de conversión kg/uni para componentes de sectores insumo
  var kxRes=await SB.from('componente').select('id,kg_x_uni').in('sector_id',[5,6,7,8,9,10,11]);
  if(!kxRes.error){KGXUNI={};(kxRes.data||[]).forEach(c=>{if(c.kg_x_uni) KGXUNI[c.id]=c.kg_x_uni;});}
  $('statusMsg').textContent='';
  if(!$('step3').classList.contains('hidden')) pintarControl();
}

// ================= Control en balanza (paso 2 del proceso real) =================
// Un pallet por pesada. Chequeos: pallets sin pesar = 0, rollos sin clasificar = 0,
// y el sobrante de CADA pallet (peso - suma rollos) entre tara_pallet_min y max.
function badge(e){
  var c = e==='ok'?'b-ok' : e==='sin controlar'?'b-pend' : (e&&e.indexOf('sobrante')>=0)?'b-warn':'b-mal';
  return '<span class="badge '+c+'">'+esc(e||'')+'</span>';
}
function palletsDe(rid){ return PALL.filter(p=>p.recepcion_id===rid); }
function rollosDe(cid){ return ROLL.filter(r=>r.control_id===cid); }
function pint(v){var x=parseInt(String(v==null?'':v).replace(/\D/g,''),10);return isNaN(x)?null:x;}
function pnum(v){var x=parseFloat(String(v==null?'':v).trim().replace(',','.'));return isNaN(x)?null:x;}
function calcPallet(p){
  var peso=pnum(p.peso), kg=0, rollos=0, algo=false;
  (p.rollos||[]).forEach(l=>{var c=pint(l.c),k=pnum(l.k); if(c&&k){kg+=c*k;rollos+=c;algo=true;}});
  if(peso==null||!algo) return {peso:peso,kg:kg,rollos:rollos,sob:null,estado:null};
  var sob=peso-kg, tmin=Number(TARA.tara_pallet_min||4), tmax=Number(TARA.tara_pallet_max||8);
  return {peso:peso,kg:kg,rollos:rollos,sob:sob,tmin:tmin,tmax:tmax,
          estado: sob<tmin?'sobrante bajo':sob>tmax?'sobrante alto':'ok'};
}
function abrirEdicionCtl(rec){
  var st={pallets:{}}, n=rec.pallets_remito||1, guard=palletsDe(rec.recepcion_id);
  for(var i=1;i<=Math.max(n,guard.length||1);i++){
    var g=guard.find(p=>p.nro_pallet===i);
    st.pallets[i]= g
      ? {peso:String(g.peso_balanza), rollos:rollosDe(g.control_id).map(r=>({c:String(r.cantidad),k:String(r.kg_por_rollo)}))}
      : {peso:'', rollos:[{c:'',k:''}]};
    if(!st.pallets[i].rollos.length) st.pallets[i].rollos=[{c:'',k:''}];
  }
  editCtl[rec.recepcion_id]=st; pintarControl();
}
function pintarControl(){
  var f=$('ctlFiltro').value;
  var lista=RECS.filter(r=>{
    if(f==='pend') return r.estado==='sin controlar'||r.estado==='faltan pallets por pesar';
    if(f==='prob') return r.estado!=='ok'&&r.estado!=='sin controlar';
    return true;
  });
  var c=$('ctlLista');
  if(!lista.length){ c.innerHTML='<div class="empty">No hay recepciones con ese filtro.</div>'; return; }
  c.innerHTML=lista.map(r=>{
    var abierto=!!editCtl[r.recepcion_id];
    return '<div class="ctl-card" data-r="'+r.recepcion_id+'">'+
      '<div class="ch"><span><b style="color:#0066cc">'+esc(r.codigo)+'</b> '+esc(r.descripcion||'')+
        ' <span style="color:#666">— '+esc(r.proveedor||'sin proveedor')+(r.remito?(' · remito '+esc(r.remito)):'')+'</span></span>'+
        badge(r.estado)+'</div>'+
      '<div style="font-size:18px;color:#444;margin-top:6px">Remito: <b>'+fmt(r.kg_remito)+' kg</b>'+
        (r.rollos_remito!=null?(' · <b>'+r.rollos_remito+'</b> rollos'):'')+
        (r.pallets_remito!=null?(' · <b>'+r.pallets_remito+'</b> pallets'):'')+
        (r.pallets_pesados?(' &nbsp;|&nbsp; pesados '+r.pallets_pesados+' · sin clasificar '+fmt(r.rollos_sin_clasificar)):'')+
      '</div>'+
      (abierto? edCtlHTML(r) : '<div style="margin-top:10px"><button class="btn btn-primary" onclick="window.__abrirCtl('+r.recepcion_id+')">'+(r.pallets_pesados?'Revisar':'Controlar')+'</button></div>')+
    '</div>';
  }).join('');
  lista.filter(r=>editCtl[r.recepcion_id]).forEach(engancharCtl);
}
function edCtlHTML(r){
  var st=editCtl[r.recepcion_id];
  return Object.keys(st.pallets).sort((a,b)=>a-b).map(nro=>{
    var p=st.pallets[nro], k=calcPallet(p);
    return '<div class="pallet-box" data-p="'+nro+'">'+
      '<div class="ph">Pallet '+nro+
        ' <span style="font-weight:600;font-size:17px">Peso balanza</span> <input class="inp-peso p-peso" inputmode="decimal" value="'+esc(p.peso)+'"> kg '+
        (k.estado?badge(k.estado):'')+
      '</div>'+
      p.rollos.map((l,i)=>'<div class="rollo-line" data-i="'+i+'">'+
        '<input class="inp-r r-c" inputmode="numeric" value="'+esc(l.c)+'" placeholder="rollos"> rollos × '+
        '<input class="inp-r r-k" inputmode="decimal" value="'+esc(l.k)+'" placeholder="kg"> kg'+
        (p.rollos.length>1?'<button class="x" data-rm="'+i+'">×</button>':'')+
      '</div>').join('')+
      '<button class="btn btn-secondary" data-add="'+nro+'" style="font-size:16px;padding:6px 12px">+ otro peso de rollo</button>'+
      '<div class="calc-line">'+
        (k.sob!=null
          ? ('Rollos <b>'+k.rollos+'</b> · suma <b>'+fmt(k.kg)+' kg</b> · sobrante <b style="color:'+(k.estado==='ok'?'#0a7a2f':'#b42318')+'">'+fmt(k.sob)+' kg</b> (esperado '+k.tmin+'–'+k.tmax+')')
          : 'Completá el peso de balanza y al menos una línea de rollos.')+
      '</div></div>';
  }).join('')+
  '<div class="row"><button class="btn btn-primary" data-save="'+r.recepcion_id+'">Guardar control</button>'+
  '<button class="btn btn-secondary" data-close="'+r.recepcion_id+'">Cancelar</button>'+
  '<button class="btn btn-secondary" data-addp="'+r.recepcion_id+'" style="font-size:16px">+ pallet</button>'+
  '<span class="status" id="ctlMsg-'+r.recepcion_id+'" style="font-size:17px"></span></div>';
}
function engancharCtl(rec){
  var card=$('ctlLista').querySelector('.ctl-card[data-r="'+rec.recepcion_id+'"]');
  var st=editCtl[rec.recepcion_id]; if(!card||!st) return;
  card.querySelectorAll('.pallet-box').forEach(pb=>{
    var nro=pb.dataset.p, p=st.pallets[nro];
    var peso=pb.querySelector('.p-peso');
    peso.addEventListener('input',()=>{ peso.value=peso.value.replace(/[^0-9.,]/g,'').replace(/([.,].*)[.,]/g,'$1'); p.peso=peso.value; refresCtl(card,rec,nro); });
    pb.querySelectorAll('.rollo-line').forEach(rl=>{
      var i=Number(rl.dataset.i);
      var c=rl.querySelector('.r-c'), k=rl.querySelector('.r-k');
      c.addEventListener('input',()=>{ c.value=c.value.replace(/\D/g,''); p.rollos[i].c=c.value; refresCtl(card,rec,nro); });
      k.addEventListener('input',()=>{ k.value=k.value.replace(/[^0-9.,]/g,'').replace(/([.,].*)[.,]/g,'$1'); p.rollos[i].k=k.value; refresCtl(card,rec,nro); });
      var rm=rl.querySelector('[data-rm]');
      // borrar una linea NO toca las demas
      if(rm) rm.onclick=()=>{ p.rollos.splice(i,1); if(!p.rollos.length)p.rollos=[{c:'',k:''}]; pintarControl(); };
    });
    // el "+" solo agrega una linea vacia: los numeros ya cargados quedan FIJOS
    var add=pb.querySelector('[data-add]');
    if(add) add.onclick=()=>{ p.rollos.push({c:'',k:''}); pintarControl(); };
  });
  var addp=card.querySelector('[data-addp]');
  if(addp) addp.onclick=()=>{ var ns=Object.keys(st.pallets).map(Number); st.pallets[Math.max.apply(null,ns.concat([0]))+1]={peso:'',rollos:[{c:'',k:''}]}; pintarControl(); };
  var cl=card.querySelector('[data-close]');
  if(cl) cl.onclick=()=>{ delete editCtl[rec.recepcion_id]; pintarControl(); };
  var sv=card.querySelector('[data-save]');
  if(sv) sv.onclick=()=>guardarCtl(rec);
}
function refresCtl(card,rec,nro){
  var pb=card.querySelector('.pallet-box[data-p="'+nro+'"]'); if(!pb) return;
  var k=calcPallet(editCtl[rec.recepcion_id].pallets[nro]);
  pb.querySelector('.calc-line').innerHTML = k.sob!=null
    ? ('Rollos <b>'+k.rollos+'</b> · suma <b>'+fmt(k.kg)+' kg</b> · sobrante <b style="color:'+(k.estado==='ok'?'#0a7a2f':'#b42318')+'">'+fmt(k.sob)+' kg</b> (esperado '+k.tmin+'–'+k.tmax+')')
    : 'Completá el peso de balanza y al menos una línea de rollos.';
  var b=pb.querySelector('.badge');
  if(k.estado){ if(b){b.className='badge '+(k.estado==='ok'?'b-ok':'b-warn');b.textContent=k.estado;} else pb.querySelector('.ph').insertAdjacentHTML('beforeend',badge(k.estado)); }
}
async function guardarCtl(rec){
  var st=editCtl[rec.recepcion_id], m=$('ctlMsg-'+rec.recepcion_id);

  /* El sobrante (peso de balanza − suma de los rollos) tiene que dar el peso
     del pallet: entre tara_pallet_min y max (4–8 kg). Si se va de ahí, se avisa
     con el detalle pero NO se bloquea: el dato se guarda igual y la vista
     v_control_pallet lo deja marcado como "sobrante bajo/alto". */
  var fuera=[];
  Object.keys(st.pallets).sort((a,b)=>a-b).forEach(function(nro){
    var k=calcPallet(st.pallets[nro]);
    if(k.sob!=null && k.estado && k.estado!=='ok')
      fuera.push('Pallet '+nro+': sobrante '+fmt(k.sob)+' kg ('+k.estado+', esperado '+k.tmin+'–'+k.tmax+')');
  });
  if(fuera.length && !confirm(
      '⚠ El sobrante no da el peso de un pallet en:\n\n'+fuera.join('\n')+
      '\n\nPuede ser un rollo mal anotado o un error de balanza.\n'+
      'Se puede guardar igual y corregirlo después.\n\n¿Guardar así?')) return;

  m.className='status'; m.textContent='Guardando…';
  var errs=[], ok=0;
  for(var nro of Object.keys(st.pallets).sort((a,b)=>a-b)){
    var p=st.pallets[nro], peso=pnum(p.peso);
    var lineas=(p.rollos||[]).map(l=>({cantidad:pint(l.c),kg_por_rollo:pnum(l.k)})).filter(l=>l.cantidad>0&&l.kg_por_rollo>0);
    if(peso==null||peso<=0){ if(lineas.length) errs.push('Pallet '+nro+': falta el peso'); continue; }
    try{
      var r=await SB.rpc('pesar_pallet',{p_recepcion_id:rec.recepcion_id,p_nro_pallet:Number(nro),
        p_peso_balanza:peso,p_rollos:lineas,p_usuario:null});
      if(r.error) throw r.error;
      ok++;
    }catch(e){ errs.push('Pallet '+nro+': '+(e.message||e)); }
  }
  if(errs.length){ m.className='status bad'; m.textContent=errs.join(' · '); }
  else delete editCtl[rec.recepcion_id];
  if(ok) await cargar();
}
window.__abrirCtl=function(rid){ var r=RECS.find(x=>x.recepcion_id===rid); if(r) abrirEdicionCtl(r); };
$('btnCtl').addEventListener('click',()=>{
  $('step1').classList.add('hidden'); $('step2').classList.add('hidden');
  $('step3').classList.remove('hidden'); pintarControl();
});
$('btnVolverCtl').addEventListener('click',()=>{
  $('step3').classList.add('hidden'); $('step1').classList.remove('hidden');
});
$('ctlFiltro').addEventListener('change',pintarControl);
$('kgValue').addEventListener('input',updateConv);
$('txtFecha').value=hoy();
cargar();
</script>
