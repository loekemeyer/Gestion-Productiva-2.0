<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Gestión Productiva — Ingresar</title>
  <!-- PWA: el SW lo registra pwa.js al final del body. -->
  <link rel="manifest" href="manifest.json?v=20260930a">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260829j">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="GP2_favicon.png?v=1.2.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gp2-modulo.css?v=20261008ds">
  <style>
    /* Login · Sistema de diseño v2 (2026-10-08): mismo azul marino y la misma linea electrica
       que la barra de todas las pantallas y la portada. Tokens en gp2-modulo.css. */
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      background: radial-gradient(1000px 420px at 20% -10%, rgba(47,140,255,.30), transparent 70%),
                  radial-gradient(700px 360px at 110% 110%, rgba(70,182,255,.16), transparent 70%), var(--bar);
    }
    .login-card {
      width: 100%; max-width: 420px; background: var(--surface); border-radius: var(--r-lg);
      box-shadow: 0 24px 70px rgba(0,0,0,.45); overflow: hidden;
    }
    .logo { position: relative; background: var(--bar); text-align: center; padding: 22px 20px 20px; }
    .logo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), #46b6ff 45%, rgba(70,182,255,0) 90%); }
    .logo img { width: 100%; max-width: 300px; height: auto; border-radius: 10px; display: block; margin: 0 auto; }
    .cuerpo { padding: 26px 30px 28px; }
    h1 { font-size: var(--fs-xl); font-weight: 750; color: var(--ink); text-align: center; }
    .subtitle { font-size: 15px; color: var(--ink-3); margin-top: 4px; text-align: center; }
    .version { text-align: center; font-size: 13px; color: var(--ink-3); margin: 10px 0 22px; font-variant-numeric: tabular-nums; }
    .version b { color: var(--ink); }
    .btn-google {
      width: 100%; min-height: 54px; padding: 0 16px; background: var(--surface); color: var(--ink);
      border: 1px solid var(--line-2); border-radius: var(--r-sm); font: 650 17px var(--font);
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
      transition: background .12s, border-color .12s, box-shadow .12s;
    }
    .btn-google:hover { background: var(--surface-2); border-color: var(--pri); box-shadow: 0 4px 14px rgba(31,91,216,.14); }
    .btn-google:focus-visible { outline: none; box-shadow: var(--focus); }
    .btn-google:active { transform: translateY(1px); }
    .btn-google:disabled { opacity: .5; cursor: not-allowed; }
    .btn-google svg { width: 22px; height: 22px; }
    .error-msg { display: none; margin-top: 16px; text-align: center; }
    .error-msg.visible { display: block; }
    .spinner-wrap { display: none; text-align: center; margin-top: 18px; }
    .spinner-wrap.visible { display: block; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--pri);
      border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-text { font-size: 14px; color: var(--ink-3); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <img src="GP2_logo.png?v=1.2.0" alt="GP2 · Gestión Productiva — Loekemeyer">
    </div>
    <div class="cuerpo">
    <div class="titulo">
      <h1>Gestión Productiva</h1>
      <div class="subtitle">Ingresá con tu cuenta de Google</div>
    </div>
    <div class="version">Versión <b id="appVersion">2.0</b></div>
    <script src="version.js?v=20261008k"></script>

    <button id="btnGoogle" class="btn-google" onclick="loginGoogle()">
      <svg viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8c1.8-4.4 6.1-7.5 11.1-7.5 3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2L31 33c-1.9 1.4-4.4 2.3-7 2.3-5.3 0-9.7-3.3-11.3-7.9l-6.5 5C9.5 39.4 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.4 5.4c-.5.4 6.4-4.7 6.4-14.4 0-1.3-.1-2.4-.4-3.5z"/>
      </svg>
      <span>Continuar con Google</span>
    </button>

    <div id="spinnerWrap" class="spinner-wrap">
      <div class="spinner"></div>
      <div class="spinner-text">Verificando acceso...</div>
    </div>

    <div id="errorMsg" class="error-msg aviso err"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260929a"></script>
  <script>
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const btnGoogle = document.getElementById("btnGoogle");
    const errorMsg = document.getElementById("errorMsg");
    const spinnerWrap = document.getElementById("spinnerWrap");

    function showError(msg){
      errorMsg.textContent = msg;
      errorMsg.classList.add("visible");
      spinnerWrap.classList.remove("visible");
      btnGoogle.disabled = false;
    }

    async function loginGoogle(){
      btnGoogle.disabled = true;
      errorMsg.classList.remove("visible");
      spinnerWrap.classList.add("visible");
      try{
        // Importante: usar origin+pathname (sin query ni hash) para evitar
        // doble-encoding del redirect_to en Google.
        const redirectTo = window.location.origin + window.location.pathname;
        const { error } = await sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo }
        });
        if (error) showError("Error al iniciar Google: " + error.message);
      }catch(e){
        showError("Error: " + (e.message || e));
      }
    }

    // Si el usuario vuelve con Atras desde Google, el browser restaura la pagina
    // desde bfcache con el boton deshabilitado y el spinner girando: resetear.
    window.addEventListener("pageshow", (e) => {
      if (e.persisted) {
        btnGoogle.disabled = false;
        btnGoogle.style.display = "";
        spinnerWrap.classList.remove("visible");
      }
    });

    let _handled = false;
    // Si vinimos con ?logout=1 marcamos esto desde el inicio para que ningun
    // SIGNED_IN/INITIAL_SESSION de supabase-js (leido del localStorage cacheado)
    // dispare procesarSesion antes de que termine el signOut.
    const _isLogout = new URL(window.location.href).searchParams.get("logout") === "1";
    if (_isLogout) _handled = true;

    async function procesarSesion(session, origen){
      if (_handled) return;
      if (!session) return;
      _handled = true;

      spinnerWrap.classList.add("visible");
      btnGoogle.style.display = "none";
      errorMsg.classList.remove("visible");

      const email = session.user?.email || "";
      // Chequear whitelist via RPC (pasamos email explicito desde el JWT verificado de Google)
      // Auth compartida con el vecino: se llama al puente GP2.get_role_for_email
      // (SECURITY DEFINER) que delega en public.get_role_for_email para no acoplar
      // el frontend GP2 al schema public (Auditoria 2026-08-31, Alta 3).
      const { data: role, error } = await sb.schema('GP2').rpc("get_role_for_email", { p_email: email });
      if (error) {
        // Fallo transitorio del RPC (red caida, timeout, 5xx): NO cerrar la sesion
        // ni acusar "no autorizado" — dejar reintentar.
        showError("No se pudo verificar el acceso (problema de conexión). Reintentá en unos segundos.");
        btnGoogle.style.display = "";
        _handled = false; // permitir otro intento
        return;
      }
      if (!role) {
        await sb.auth.signOut();
        sessionStorage.clear();
        showError("Tu cuenta (" + email + ") no está autorizada para usar esta aplicación. Para solicitar acceso comunicate con loekemeyer.n8n@gmail.com");
        btnGoogle.style.display = "";
        _handled = false; // permitir otro intento
        return;
      }
      sessionStorage.setItem("gp_auth", "ok");
      sessionStorage.setItem("gp_role", role);
      sessionStorage.setItem("gp_email", email);
      // Volver a la pantalla que mando al login (?next=, lo pone auth-guard.js). Solo
      // rutas propias: empieza con "/" y no con "//", sin "://" ni "\\" -> nada de
      // redirigir a otro sitio. Si la pantalla no es para su rol, el guard la corrige.
      var next = new URL(window.location.href).searchParams.get("next") || "";
      var nextOk = /^\/(?!\/)/.test(next) && next.indexOf("://") === -1 && next.indexOf("\\") === -1;
      window.location.href = nextOk ? next : ((role === "envios") ? "envios-only.html" : "GP2_MODULOS.html");
    }

    // Escuchar el evento SIGNED_IN — dispara cuando supabase-js termina de procesar
    // el token de la URL OAuth callback.
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" && session) procesarSesion(session, "event");
    });

    (async function(){
      const url = new URL(window.location.href);
      // Si vienen con ?logout=1 → cerrar sesion de Supabase antes de mostrar el boton.
      if (_isLogout){
        try { await sb.auth.signOut(); } catch(e){}
        sessionStorage.clear();
        // Limpiar keys de Supabase en localStorage tambien
        try {
          for (let i = localStorage.length - 1; i >= 0; i--){
            const k = localStorage.key(i);
            if (k && (k.indexOf('sb-') === 0 || k.indexOf('supabase') !== -1)) {
              localStorage.removeItem(k);
            }
          }
        } catch(e){}
        // Strip query AND hash (replaceState con solo pathname limpia ambos)
        window.history.replaceState({}, "", url.pathname);
        // Permitir login posterior
        _handled = false;
        return;
      }
      // Limpiar hash residual si el browser dejo un fragmento del OAuth previo sin token valido.
      if (window.location.hash && !window.location.hash.includes("access_token=")) {
        window.history.replaceState({}, "", url.pathname + (url.search || ""));
      }
      // Tambien chequear inmediatamente por si ya hay sesion (auto-login).
      const { data: { session } } = await sb.auth.getSession();
      if (session) procesarSesion(session, "initial");
    })();
  </script>
  <script src="pwa.js?v=20260830e"></script>
</body>
</html>
