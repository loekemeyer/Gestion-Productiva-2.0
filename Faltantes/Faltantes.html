<script>var D={};</script>
<script>

var SB=window.supabase.createClient('https://hrxfctzncixxqmpfhskv.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs',{db:{schema:'GP2'}});
function __run(){
// Ordenar rp
for(var _rid in D.rp)D.rp[_rid].sort(function(a,b){return a.o-b.o;});

// art.cod → cid (art terminado sector 12)
var codToComp={};
for(var cid in D.comp){var c=D.comp[cid];if(c.s===12&&c.cod)codToComp[c.cod]=cid;}

// art.id → art_data
var artById={};
D.art.forEach(function(a){artById[a.id]=a;});

// art del último paso con art asignado en una ruta
function artDeRuta(pasos){
  for(var i=pasos.length-1;i>=0;i--){if(pasos[i].art!=null)return pasos[i].art;}
  return null;
}

// Comps requeridos por cada art: (bom_art + bom_comp recursivo + ruta_paso.ce/cs/flje + expandir bom_comp de esos)
function compsDeArt(aid){
  var acc={};
  // 1) BOM directo con qty acumulada
  var bom=D.bom_art[String(aid)]||[];
  bom.forEach(function(it){acc[it.c]=(acc[it.c]||0)+it.q;});
  // 2) Sub-BOM recursivo SOLO desde BOM directo (evita doble contar via rutas)
  var pending=Object.keys(acc).slice();
  var visited={};
  while(pending.length){
    var cid=pending.shift();
    if(visited[cid])continue;
    visited[cid]=1;
    var qbase=acc[cid];
    (D.bom_comp[cid]||[]).forEach(function(h){
      var newq=qbase*h.q;
      if(!acc[h.c]){acc[h.c]=newq;pending.push(String(h.c));}
      else acc[h.c]+=newq;
    });
  }
  // 3) Comps intermedios de rutas del art (no en BOM ni sub-BOM) con qty=1
  for(var rid in D.rp){
    var pasos=D.rp[rid];
    if(artDeRuta(pasos)!==aid)continue;
    pasos.forEach(function(p){
      ['ce','cs','flje'].forEach(function(k){
        var c=p[k];
        if(c!=null&&!acc[c])acc[c]=1;
      });
    });
  }
  // 4) Art terminado
  var artCid=codToComp[artById[aid]&&artById[aid].cod];
  if(artCid&&!acc[artCid])acc[artCid]=1;
  return acc;
}

// Precomputar comps por art
var compsArt={};
D.art.forEach(function(a){compsArt[a.id]=compsDeArt(a.id);});

// cid → [aids que lo usan]
var compUsadoPor={};
D.art.forEach(function(a){
  Object.keys(compsArt[a.id]).forEach(function(cid){
    (compUsadoPor[cid]=compUsadoPor[cid]||[]).push(a.id);
  });
});

// Índice: (aid, cid) → set de "tall_REF" y "prov_REF" válidos
// Un tall/prov es válido para (aid,cid) si:
//   (a) hay paso en ruta del art con ese tall/prov Y ce=cid o cs=cid
//   (b) es tall final del art Y cid está en BOM (recibe partes para armar)
var __validPares={};
function _keyAC(aid,cid){return aid+':'+cid;}
(function(){
  // BOM expandido por art
  var bomsArt={};
  D.art.forEach(function(a){bomsArt[a.id]=compsArt[a.id];});
  // Tall final por art
  var tallFinalArt={};
  for(var rid in D.rp){
    var pasos=D.rp[rid];
    var aid=artDeRuta(pasos);
    if(aid==null)continue;
    var last=null;
    pasos.forEach(function(p){if(p.tall!=null)last=p.tall;});
    if(last!=null){(tallFinalArt[aid]=tallFinalArt[aid]||{})[last]=1;}
  }
  // Registrar pares (aid, ce/cs) → tall/prov de ese paso
  // Además: si cs es sub-conjunto (con bom_comp), asociar hijos también al tall que lo arma
  function _hijosBOM(cid){
    var acc={};
    (function rec(c,vis){
      if(vis[c])return;var v=Object.assign({},vis);v[c]=1;
      (D.bom_comp[c]||[]).forEach(function(h){acc[h.c]=1;rec(h.c,v);});
    })(cid,{});
    return Object.keys(acc).map(Number);
  }
  for(var rid in D.rp){
    var pasos=D.rp[rid];
    var aid=artDeRuta(pasos);
    if(aid==null)continue;
    pasos.forEach(function(p){
      if(p.tall==null&&p.prov==null)return;
      [p.ce,p.cs].forEach(function(c){
        if(c==null)return;
        var k=_keyAC(aid,c);
        __validPares[k]=__validPares[k]||{};
        if(p.tall!=null)__validPares[k]['tall_'+p.tall]=1;
        if(p.prov!=null)__validPares[k]['prov_'+p.prov]=1;
      });
      // Si cs es sub-conjunto (tiene bom_comp), asociar el tall/prov a todos los hijos
      if(p.cs!=null&&D.bom_comp[String(p.cs)]){
        _hijosBOM(p.cs).forEach(function(hCid){
          var k=_keyAC(aid,hCid);
          __validPares[k]=__validPares[k]||{};
          if(p.tall!=null)__validPares[k]['tall_'+p.tall]=1;
          if(p.prov!=null)__validPares[k]['prov_'+p.prov]=1;
        });
      }
    });
  }
  // Tall final: SOLO comps del BOM directo (articulo_componente).
  // No sub-BOM ni intermedios: los talls arman con los comps que reciben, no con crudos aguas arriba.
  Object.keys(tallFinalArt).forEach(function(aid){
    var bomDirecto=D.bom_art[String(aid)]||[];
    bomDirecto.forEach(function(it){
      var k=_keyAC(aid,+it.c);
      __validPares[k]=__validPares[k]||{};
      Object.keys(tallFinalArt[aid]).forEach(function(tid){
        __validPares[k]['tall_'+tid]=1;
      });
    });
  });
})();

function esValidoParCompUbic(aid,cid,u){
  if(u.tipo!=='tallerista'&&u.tipo!=='proveedor_servicio')return true;
  var k=_keyAC(aid,cid);
  var s=__validPares[k];
  if(!s)return false;
  return !!s[(u.tipo==='tallerista'?'tall_':'prov_')+u.ref];
}

// Talls finales por art (para 50/50 en armado final)
var __tallsFinalArt={};
for(var __rid in D.rp){
  var __ps=D.rp[__rid];var __aid=artDeRuta(__ps);if(__aid==null)continue;
  var __last=null;__ps.forEach(function(p){if(p.tall!=null)__last=p.tall;});
  if(__last!=null){(__tallsFinalArt[__aid]=__tallsFinalArt[__aid]||{})[__last]=1;}
}

// Talls por armado de sub-conjunto: (aid, cid_subconj) → set talls
var __tallsPorArmado={};
for(var __rid3 in D.rp){
  var __ps3=D.rp[__rid3];var __aid3=artDeRuta(__ps3);if(__aid3==null)continue;
  __ps3.forEach(function(p){
    if(p.tall!=null&&p.cs!=null&&D.bom_comp[String(p.cs)]){
      var kk=__aid3+':'+p.cs;
      __tallsPorArmado[kk]=__tallsPorArmado[kk]||{};
      __tallsPorArmado[kk][p.tall]=1;
    }
  });
}

// Comp → padre sub-conj (para saber a qué armado pertenece un hijo BOM)
var __padreSubConj={};
for(var __pc in D.bom_comp){
  (D.bom_comp[__pc]||[]).forEach(function(h){
    (__padreSubConj[h.c]=__padreSubConj[h.c]||[]).push(+__pc);
  });
}

// Aporte kg de fleje por (aid, fleje_cid): dem_uni / ppk
// FIX aud4-p1: dedup por firma (art+fleje+matrices+provs+ce/cs) ignorando tall_id → evita duplicar rutas alternativas
// FIX aud4-p2: sin fallback ppk=1; si no hay conversión, marcar SIN_FACTOR y no computar
var __flejeKg={};window.__flejeSinFactor={};
var __rutasVistas={};
for(var __rid2 in D.rp){
  var __ps2=D.rp[__rid2];
  var __aid2=artDeRuta(__ps2);if(__aid2==null)continue;
  var __a=artById[__aid2];if(!__a||!__a.est)continue;
  var __flje=null;
  for(var __i=0;__i<__ps2.length;__i++){if(__ps2[__i].flje){__flje=__ps2[__i].flje;break;}}
  if(!__flje)continue;
  // Firma ignorando tallerista
  var __sig=__aid2+'|'+__flje+'|'+__ps2.map(function(p){return p.tipo+':'+(p.mat||'')+':'+(p.prov||'')+':'+(p.ce||'')+':'+(p.cs||'')+':'+(p.flje||'');}).join('>');
  if(__rutasVistas[__sig])continue;
  __rutasVistas[__sig]=1;
  var __ppk=null,__csP=null;
  for(var __j=0;__j<__ps2.length;__j++){
    var __p=__ps2[__j];
    if(__p.mat){var __m=D.mat[String(__p.mat)]||{};if(__m.primera&&__m.ppk>0){__ppk=__m.ppk;__csP=__p.cs;break;}}
  }
  if(!__ppk){
    for(var __j=0;__j<__ps2.length;__j++){
      var __p=__ps2[__j];
      if(__p.mat){var __m=D.mat[String(__p.mat)]||{};if(__m.ppk>0){__ppk=__m.ppk;__csP=__p.cs;break;}}
    }
  }
  if(!__ppk){
    // Sin matriz → registrar como sin factor y no computar kg
    window.__flejeSinFactor[__aid2+':'+__flje]=1;
    continue;
  }
  var __qBom=1;var __bomA=D.bom_art[String(__aid2)]||[];
  __bomA.forEach(function(it){if(it.c===__csP)__qBom=it.q;});
  var __key=__aid2+':'+__flje;
  __flejeKg[__key]=(__flejeKg[__key]||0)+__a.est*__qBom/__ppk;
}

// Calcula el min-aporte de un art a (comp,ubic): aplica a sectores, tall y prov (uniforme)
function minAporteArt(aid,cid,uid){
  var a=artById[aid];if(!a||!a.est)return 0;
  var u=D.ubic[String(uid)];if(!u||!u.meses)return 0;
  var bom=compsArt[aid]||{};
  var qty=bom[cid];if(qty==null)return 0;
  var c=D.comp[String(cid)]||{};
  var base;
  if(c.um==='kg'){
    // Fleje: usar kg via primera matriz
    var kg=__flejeKg[aid+':'+cid]||0;
    base=kg*u.meses;
  }else{
    base=a.est*qty*u.meses;
  }
  // Reparto ÷ N si tall final compartido, o si tall arma un sub-conj compartido con otros talls
  if(u.tipo==='tallerista'){
    var tf=__tallsFinalArt[aid]||{};
    if(tf[u.ref]){
      var n=Object.keys(tf).length;
      base=base/n;
    }else{
      // Sub-conjunto: buscar si este cid es hijo de algún sub-conj armado por este tall (con otros)
      var padres=__padreSubConj[cid]||[];
      for(var i=0;i<padres.length;i++){
        var arm=__tallsPorArmado[aid+':'+padres[i]];
        if(arm&&arm[u.ref]){
          var nn=Object.keys(arm).length;
          if(nn>1){base=base/nn;break;}
        }
      }
    }
  }
  return c.um==='kg'?Math.round(base*100)/100:Math.round(base);
}

// Total aportes por (cid, uid) = suma minAporteArt sobre todos los arts que aportan
var __totalAporte={};
D.art.forEach(function(a){
  var bom=compsArt[a.id]||{};
  Object.keys(bom).forEach(function(cid){
    for(var k in D.inv){
      var pt=k.split(':');
      if(pt[0]!==String(cid))continue;
      var uid=+pt[1];
      var u=D.ubic[String(uid)];if(!u||!u.meses)continue;
      if(!esValidoParCompUbic(a.id,+cid,u))continue;
      var ap=minAporteArt(a.id,+cid,uid);
      if(ap>0){
        var tk=cid+':'+uid;
        __totalAporte[tk]=(__totalAporte[tk]||0)+ap;
      }
    }
  });
});

function ubicsDeComp(cid,aid){
  var out=[];
  for(var k in D.inv){
    var pt=k.split(':');
    if(pt[0]===String(cid)){
      var minTotal=D.inv[k].min||0;
      if(minTotal<=0)continue;
      var u=D.ubic[String(pt[1])]||{};
      if(!esValidoParCompUbic(aid,+cid,u))continue;
      var mAporte=minAporteArt(aid,+cid,+pt[1]);
      if(mAporte<=0)continue;
      var stock=D.inv[k].cant||0;
      var faltaGlobal=Math.max(0,minTotal-stock);
      // Proporción del aporte del art vs total
      var tk=cid+':'+pt[1];
      var totalAp=__totalAporte[tk]||mAporte;
      var faltaArt=totalAp>0?faltaGlobal*(mAporte/totalAp):0;
      out.push({
        uid:pt[1],
        min:mAporte,
        minTotal:minTotal,
        cant:stock,
        faltaGlobal:faltaGlobal,
        faltaArt:mAporte>0&&D.comp[String(cid)].um==='kg'?Math.round(faltaArt*100)/100:Math.round(faltaArt)
      });
    }
  }
  return out;
}

function stockCid(cid){
  var s=0;
  for(var k in D.inv){if(k.split(':')[0]===String(cid))s+=D.inv[k].cant||0;}
  return s;
}

// Buscar productor de un comp en cualquier ruta (primero rutas del art actual, luego cualquier)
function _buscarProductor(cid,aid){
  var tryAids=[aid,null];
  for(var ti=0;ti<tryAids.length;ti++){
    var reqA=tryAids[ti];
    for(var rid in D.rp){
      var pasos=D.rp[rid];
      if(reqA!=null&&artDeRuta(pasos)!==reqA)continue;
      for(var i=0;i<pasos.length;i++){
        var p=pasos[i];
        if(String(p.cs)===String(cid)&&(p.mat||p.tall||p.prov)){
          var ceC=p.ce?(D.comp[String(p.ce)]||{}).cod:null;
          var salC=(D.comp[String(cid)]||{}).cod;
          // Si el cs es sub-conjunto (tiene bom_comp), no detallar insumo específico (hay varios)
          var esSubConj=!!D.bom_comp[String(cid)];
          var insumo=(!esSubConj&&ceC&&ceC!==salC)?' con '+ceC:'';
          if(p.mat){var m=D.mat[String(p.mat)]||{};return {tipo:'PRODUCIR',cls:'t-producir',det:'Matriz '+(m.n||'')+insumo};}
          if(p.tall){var t=D.tall[String(p.tall)]||{};
            if(esSubConj)return {tipo:'ENV TALL',cls:'t-tall',det:'Enviar a '+(t.nom||('tall '+p.tall))};
            return {tipo:'ENV TALL',cls:'t-tall',det:(t.nom||('tall '+p.tall))+' arma'+insumo+' → '+salC};
          }
          if(p.prov){var v=D.prov_serv[String(p.prov)]||{};
            if(esSubConj)return {tipo:'ENV PROV',cls:'t-prov',det:'Enviar a '+(v.nom||('prov '+p.prov))};
            return {tipo:'ENV PROV',cls:'t-prov',det:(v.nom||('prov '+p.prov))+' procesa'+insumo+' → '+salC};
          }
        }
      }
    }
  }
  return null;
}

// Acción por (comp, uid_actual, aid)
function accion(cid,uid,aid){
  var c=D.comp[String(cid)]||{};
  var u=uid?(D.ubic[String(uid)]||{}):{};
  if(u.tipo==='tallerista'){
    var t=D.tall[String(u.ref)]||{};
    return {tipo:'ENV TALL',cls:'t-tall',det:'Enviar a '+(t.nom||('tall '+u.ref))};
  }
  if(u.tipo==='proveedor_servicio'){
    var v=D.prov_serv[String(u.ref)]||{};
    return {tipo:'ENV PROV',cls:'t-prov',det:'Enviar a '+(v.nom||('prov '+u.ref))};
  }
  if(c.s===12)return {tipo:'ARMAR',cls:'t-armar',det:'Armar/recibir de tallerista'};
  // PRIORIDAD: si existe ruta que produce el comp (en cualquier art), esa acción
  // (aplica incluso a s=9 Garage: si hay tall que lo arma, no ARMAR aquí)
  var prod=_buscarProductor(cid,aid);
  if(prod)return prod;
  if(c.s===9)return {tipo:'ARMAR',cls:'t-armar',det:'Armar en garage'};
  // Sino, decidir por sector = COMPRAR
  return {tipo:'COMPRAR',cls:'t-comprar',det:'Comprar'};
}

// ¿Un comp se compra en este art? true si algún paso ingreso/insumo con ce=cid en las rutas del art
function _seCompra(cid,aid){
  for(var rid in D.rp){
    var pasos=D.rp[rid];
    if(artDeRuta(pasos)!==aid)continue;
    for(var i=0;i<pasos.length;i++){
      var p=pasos[i];
      if((p.tipo==='ingreso'||p.tipo==='insumo')&&String(p.ce)===String(cid))return true;
    }
  }
  return false;
}

// Demanda: si est>0 hay demanda; si est=0 (ej 574) no
var demanda={};
D.art.forEach(function(a){demanda[a.id]=(a.est||0)>0?1:0;});

// Filtros
var fQ=document.getElementById('q');
var open={};
document.getElementById('expAll').addEventListener('click',function(){
  var all=D.art.every(function(a){return open[a.id];});
  D.art.forEach(function(a){open[a.id]=!all;});
  render();
});

function render(){
  var cont=document.getElementById('sections');
  cont.innerHTML='';
  var q=fQ.value.trim().toLowerCase();

  var nCrit=0,nOK=0,nNoDem=0;
  var vistas=[];
  // Aplicar filtro ANTES de calcular KPIs
  var artsFilt=D.art.filter(function(a){
    if(!q)return true;
    return a.cod.toLowerCase().indexOf(q)>=0||(a.fam||'').toLowerCase().indexOf(q)>=0;
  });
  artsFilt.forEach(function(a){
    var dem=demanda[a.id];
    var bom=compsArt[a.id];
    var rows=[];
    var faltaN=0;
    Object.keys(bom).sort(function(x,y){
      var cx=D.comp[x]||{},cy=D.comp[y]||{};
      return (cx.s||0)-(cy.s||0)||(cx.cod||'').localeCompare(cy.cod||'');
    }).forEach(function(cid){
      var c=D.comp[cid]||{};
      var ubics=ubicsDeComp(cid,a.id);
      if(ubics.length===0){
        // Sin min>0: mostrar una fila con min=0
        rows.push({cid:cid,c:c,u:null,min:0,minTotal:0,st:0,faltaGlobal:0,f:0,qty:bom[cid],shared:(compUsadoPor[cid]||[]).length>1});
      }else{
        // Una fila por cada ubicación con min>0
        ubics.forEach(function(u){
          var f=dem<=0?0:u.faltaArt;
          if(f>0)faltaN++;
          rows.push({cid:cid,c:c,u:u,min:u.min,minTotal:u.minTotal,st:u.cant,faltaGlobal:u.faltaGlobal,f:f,qty:bom[cid],shared:(compUsadoPor[cid]||[]).length>1});
        });
      }
    });
    // Agregar filas COMPRAR extra: comps que se compran (ingreso/insumo) pero cuya fila del sector muestra otra acción (ENV PROV, PRODUCIR, etc)
    var addComprar=[];
    rows.forEach(function(r){
      if(!r.u)return;
      var uObj=D.ubic[String(r.u.uid)]||{};
      if(uObj.tipo!=='sector')return;
      var ac=accion(r.cid,r.u.uid,a.id);
      if(ac.tipo==='COMPRAR')return;  // ya es compra
      if(_seCompra(r.cid,a.id)){
        addComprar.push({cid:r.cid,c:r.c,u:r.u,min:r.min,minTotal:r.minTotal,st:r.st,faltaGlobal:r.faltaGlobal,f:r.f,qty:r.qty,shared:r.shared,_forceCompra:true});
      }
    });
    rows=rows.concat(addComprar);
    // Ordenar filas por acción: COMPRAR → PRODUCIR → ENV PROV → ENV TALL → ARMAR
    var ordenAcc={'COMPRAR':1,'PRODUCIR':2,'ENV PROV':3,'ENV TALL':4,'ARMAR':5};
    rows.forEach(function(r){r._acc=r._forceCompra?'COMPRAR':accion(r.cid,r.u?r.u.uid:null,a.id).tipo;});
    rows.sort(function(x,y){
      return (ordenAcc[x._acc]||99)-(ordenAcc[y._acc]||99)||
             (x.c.cod||'').localeCompare(y.c.cod||'');
    });
    if(dem<=0)nNoDem++;
    else if(faltaN>0)nCrit++;
    else nOK++;
    vistas.push({a:a,dem:dem,faltaN:faltaN,rows:rows});
  });

  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><div class="n">'+artsFilt.length+'</div><div class="lb">Artículos</div></div>'+
    '<div class="kpi crit"><div class="n">'+nCrit+'</div><div class="lb">Con faltante</div></div>'+
    '<div class="kpi ok"><div class="n">'+nOK+'</div><div class="lb">Sin faltante</div></div>'+
    '<div class="kpi"><div class="n">'+nNoDem+'</div><div class="lb">Sin demanda</div></div>';

  vistas.forEach(function(v){
    var a=v.a;
    var sec=document.createElement('div');
    sec.className='art-section'+(open[a.id]?' open':'')+(v.dem<=0?' no-dem':'');
    var head=document.createElement('div');head.className='art-head';
    head.innerHTML='<span class="caret">▸</span>'+
      '<span class="cod">'+a.cod+'</span>'+
      '<span class="fam">'+(a.fam||'')+'</span>'+
      (v.dem<=0?'<span class="badge no-dem">sin demanda</span>':'')+
      '<div class="stats">'+
        '<span>Comp: '+v.rows.length+'</span>'+
        '<span>Falta: <b class="'+(v.faltaN>0?'':'ok')+'">'+v.faltaN+'</b></span>'+
      '</div>';
    head.addEventListener('click',function(e){
      if(e.target.tagName==='INPUT')return;
      open[a.id]=!open[a.id];render();
    });
    sec.appendChild(head);
    var body=document.createElement('div');body.className='art-body';
    var th='<table><thead><tr>'+
      '<th>Cod</th><th>Componente</th><th>Sector</th><th>Ubicación</th>'+
      '<th title="Mínimo que aporta este artículo">Aporte art</th>'+
      '<th title="Mínimo total agregado en esa ubicación (todos los arts)">Mín total</th>'+
      '<th>Stock</th>'+
      '<th title="Faltante global de la ubicación">Falta total</th>'+
      '<th title="Faltante proporcional al aporte del art">Falta art</th>'+
      '<th>Unid</th><th>Acción</th><th>Detalle</th>'+
      '</tr></thead><tbody>';
    v.rows.forEach(function(r){
      var ac=r._forceCompra?{tipo:'COMPRAR',cls:'t-comprar',det:'Comprar'}:accion(r.cid,r.u?r.u.uid:null,a.id);
      var sec_nom=(D.sect[String(r.c.s)]||{nom:''}).nom;
      var u_obj=r.u?(D.ubic[String(r.u.uid)]||{}):null;
      var uNom=u_obj?u_obj.nom:sec_nom;
      // Simplificar nombre: sacar prefijos redundantes
      if(u_obj){
        if(u_obj.tipo==='proveedor_servicio')uNom=uNom.replace(/^Prov\.\s*Serv\.\s*/i,'').trim();
        else if(u_obj.tipo==='tallerista')uNom=uNom.replace(/^Tallerista\s*/i,'').trim();
      }
      th+='<tr'+(r.f===0?' class="zero-row"':'')+'>'+
        '<td>'+(r.c.cod||'')+(r.shared?'<span class="shared">×'+compUsadoPor[r.cid].length+'</span>':'')+'</td>'+
        '<td>'+(r.c.d||'')+'</td>'+
        '<td>'+sec_nom+'</td>'+
        '<td>'+uNom+'</td>'+
        '<td class="num">'+r.min+'</td>'+
        '<td class="num" style="color:#7a92a8">'+(r.minTotal||0)+'</td>'+
        '<td class="num">'+r.st+'</td>'+
        '<td class="num" style="color:'+(r.faltaGlobal>0?'#d0836b':'#5fd39a')+'">'+(r.faltaGlobal||0)+'</td>'+
        '<td class="num '+(r.f>0?'fal':'ok')+'">'+r.f+'</td>'+
        '<td>'+(r.c.um||'uni')+'</td>'+
        '<td><span class="tag '+ac.cls+'">'+ac.tipo+'</span></td>'+
        '<td style="color:#7a92a8;font-style:italic">'+ac.det+'</td>'+
      '</tr>';
    });
    th+='</tbody></table>';
    body.innerHTML=th;
    sec.appendChild(body);
    cont.appendChild(sec);
  });
}

fQ.addEventListener('input',render);
render();
}
async function __boot(){
  try{
    document.body.style.cursor='progress';
    var r=await SB.rpc('faltantes_bundle');
    if(r.error) throw r.error;
    Object.assign(D, r.data);
    __run();
  }catch(e){
    document.body.innerHTML='<p style=\'padding:24px;font-family:system-ui;color:#b3402f\'>Error cargando datos de Supabase: '+(e.message||e)+'</p>';
    console.error(e);
  }finally{ document.body.style.cursor=''; }
}
__boot();
</script>
</body></html>
