 .chk{display:flex;align-items:center;gap:6px;font-size:16px;color:#333;cursor:pointer;user-select:none}
 .chk input{width:20px;height:20px}
 .flje-link{margin-left:auto;font-size:15px;font-weight:700;color:#0066cc;text-decoration:none}
 /* "También en: …" — el componente aparece en otros rubros que el abierto */
 .hint-otros{font-size:16px;color:#333;margin:-4px 0 10px;line-height:1.7}
 .hint-otros b{color:#111}
 .hint-otros a{color:#0066cc;font-weight:800;text-decoration:none;cursor:pointer;white-space:nowrap}
 .hint-otros a:hover{text-decoration:underline}
 .hint-otros .sin-link{font-weight:800;color:#555;white-space:nowrap}
 .nota-tabla{font-size:15px;color:#666;margin:8px 0 0;font-style:italic}
 table.t td.rub-cell{cursor:pointer;color:#0066cc;font-weight:800;text-decoration:underline dotted}
 table.t td.rub-cell:hover{background:#eef4fb}
 table.t td.mov-cell,table.t td.stk-cell,table.t td.max-cell{cursor:pointer;text-decoration:underline dotted}
 table.t td.mov-cell:hover,table.t td.stk-cell:hover,table.t td.max-cell:hover{background:#eef4fb}
 /* popup del Máximo: la cuenta en una línea arriba de la tabla */
 .max-linea{font-size:16px;line-height:1.5;margin:0 0 10px;color:#111}
 .max-aviso{font-size:16px;line-height:1.5;margin:0 0 10px;color:#b45309;font-weight:700}
 table.t td.pos{color:#15803d}
 table.t td.neg{color:#b91c1c}
 table.t td.cero{color:#9aa4af}
 /* popup detalle de movimiento (igual que Stock por Sector) */
 .popup{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
 .popup.open{display:flex}
 .pop-card{background:#fff;border-radius:14px;width:100%;max-width:880px;max-height:86vh;overflow:auto;padding:20px}
 .pop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
 .pop-head h3{font-size:20px;font-weight:800}
 /* Ajuste (heredado de Registrar_Movimiento) */
 .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:250;padding:14px}
 .modal-bg.on{display:flex}
 .modal{background:#fff;border-radius:12px;padding:22px;max-width:600px;width:100%;max-height:94vh;overflow-y:auto}
 .modal h3{margin:0 0 14px;font-size:19px}
 .frow{margin-bottom:12px}
 .frow label{display:block;font-size:13px;text-transform:uppercase;color:#666;font-weight:700;margin-bottom:4px}
 .frow select,.frow input{width:100%;border:2px solid #d0d7de;border-radius:8px;padding:10px 12px;font-size:18px}
 .frow .hint{font-size:13px;color:#666;margin-top:3px;font-style:italic}
 .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid #e5e9ee;padding-top:14px}
 .btn-m{padding:12px 20px;border-radius:8px;border:2px solid;font-size:16px;font-weight:800;cursor:pointer;min-height:44px}
 .btn-m.primary{background:#111;border-color:#111;color:#fff}
 .btn-m.primary[disabled]{opacity:.5;cursor:progress}
 .btn-m.cancel{background:#fff;border-color:#d0d7de;color:#111}
 #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#dcfce7;border:1px solid #86efac;color:#15803d;padding:10px 18px;border-radius:8px;font-size:15px;font-weight:700;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
 #toast.on{opacity:1}
 #toast.err{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
 .movs-wrap{overflow-x:auto}
 .tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:800;text-transform:uppercase;background:#eef2f7;color:#334}
 details.movs{margin-top:18px;border:1px solid #e5e9ee;border-radius:10px;padding:0 12px}
 details.movs>summary{cursor:pointer;font-weight:800;font-size:17px;padding:12px 0;list-style:none}
 details.movs>summary::-webkit-details-marker{display:none}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Stock general</h1>
    <div class="hbtns">
      <button class="hlink" id="btnAjuste" onclick="openAjuste()">± Ajuste</button>
      <a href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="planta-tabs" role="tablist">
    <button type="button" class="planta-tab active" id="tabTodos" role="tab" onclick="filtrarPlanta('todos')">🔎 Todos</button>
    <button type="button" class="planta-tab" id="tabCervantes" role="tab" onclick="filtrarPlanta('cerv')">🏭 Cervantes</button>
    <button type="button" class="planta-tab" id="tabTerceros" role="tab" onclick="filtrarPlanta('terc')">👥 Terceros</button>
    <button type="button" class="planta-tab sep" id="tabVirgilio" role="tab" onclick="filtrarPlanta('virg')">🏬 Virgilio</button>
  </div>

  <div class="steps" id="paneCervantes">

    <!-- v3.2.0: insumos de Virgilio sin código asignado (sólo pestaña Virgilio, arriba de los filtros) -->
    <div id="vinsBox" class="vins-box hidden">
      <div class="vins-head">
        <div class="vins-ttl">🔗 Insumos de Virgilio sin asignar a un código</div>
        <div class="vins-sub" id="vinsSub"></div>
      </div>
      <div class="toolbar"><input type="text" id="vinsQ" placeholder="Buscar insumo sin asignar…"></div>
      <div class="table-wrap">
        <table class="t">
          <thead><tr>
            <th>Cod ISIS</th><th>Cod V</th><th>Cod C</th><th>Descripción</th><th>Rubro</th>
            <th class="num">Saldo</th><th>Unidad</th><th>Ubicación</th>
          </tr></thead>
          <tbody id="vinsBody"></tbody>
        </table>
      </div>
      <div id="vinsEmpty" class="empty hidden"></div>
    </div>

    <div class="rubro-lbl">Rubro</div>
    <div id="rubros"></div>

    <div class="kpis" id="kpis"></div>

    <div class="toolbar">
      <input type="text" id="q" placeholder="Buscar por código o descripción…">
      <label class="chk"><input type="checkbox" id="soloStock"> Solo con stock</label>
      <a id="fljeLink" class="flje-link" style="display:none" href="../StockFlejes/Flejes_GP2.html">Detalle de flejes / rollos →</a>
    </div>

    <div class="hint-otros hidden" id="hintOtros"></div>

    <div class="table-wrap">
      <table class="t">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="tblEmpty" class="empty hidden">Sin resultados.</div>
    <div id="notaTabla" class="nota-tabla hidden"></div>
    <div id="status" class="status">Cargando…</div>

    <details class="movs" id="grpMovs">
      <summary>📜 Últimos movimientos <span id="movsBadge"></span></summary>
      <div class="movs-wrap">
        <table class="t" id="tblMovs">
          <thead><tr>
            <th>Fecha</th><th>Tipo</th><th>Componente</th><th>Origen</th><th>Destino</th>
            <th class="num">Cantidad</th><th>Transformado</th><th class="num">Cant. transf.</th>
          </tr></thead>
          <tbody id="tbodyMovs"><tr><td colspan="8" class="empty">Cargando…</td></tr></tbody>
        </table>
      </div>
    </details>
  </div>
</div>

<!-- popup detalle de un movimiento (rubros de sector) -->
<div class="popup" id="popup">
  <div class="pop-card">
    <div class="pop-head"><h3 id="popTitle"></h3><button class="btn-m cancel" id="popClose" type="button">Cerrar</button></div>
    <div id="popBody"></div>
  </div>
</div>

<!-- Ajuste +/- (heredado de Registrar_Movimiento) -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalForm"></div>
    <div class="actions">
      <button class="btn-m cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-m primary" id="btnSave" onclick="saveModal()">✔ Registrar</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>window.SB_CLIENT = GP2_SB();</script>
<script src="../gp2-composicion.js?v=20260911p"></script>
<script src="../gp2-motor.js?v=20260905f"></script>
<script>
"use strict";
const SB = window.SB_CLIENT;
var $ = GP2UI.$, esc = GP2UI.esc, clsNum = GP2UI.cls;
function fmt(n,d){ return GP2N.fmt(n, d==null?0:d); }
var fmtFecha = GP2UI.fechaTsAR;

/* ═══ config de columnas de movimiento por sector ═══
   COPIA de gp2-stock-sector.js (SECTORES): mantener en sync, SALVO "En Virgilio", que acá no va
   (v2.2.0: el inventario de Virgilio lo lleva Gestión Virgilio). */
var COLS_INSUMO = [
  { k:"compras", label:"Compras", tipos:["compra"], lado:"ent" },
  { k:"consumo", label:"Consumo", tipos:["consumo_prod","consumo_tall","consumo_virgilio","consumo","fabricacion"], lado:"sal" },
  { k:"envios",  label:"Envíos",  tipos:["envio_ps","envio_tallerista","envio_prov_at","envio_inyector"], lado:"sal" }
];
var COLS_MP = [
  { k:"compras", label:"Compras",           tipos:["compra"],         lado:"ent" },
  { k:"envios",  label:"Envíos a inyector", tipos:["envio_inyector"], lado:"sal" }
];
var COLS_SC = [
  { k:"fabricacion", label:"Fabricación", tipos:["fabricacion","armado_fabrica"], lado:"neto" },
  { k:"envios",      label:"Envíos",      tipos:["envio_ps","envio_prov_at","envio_tallerista"], lado:"sal"  },
  { k:"a_virgilio",  label:"A Virgilio",  tipos:["recepcion_virgilio","consumo_virgilio"], lado:"sal" }
];
var COLS_SP = [
  { k:"entregas_ps", label:"Entregas PS",      tipos:["entrega_ps"],                             lado:"ent"  },
  { k:"fabricacion", label:"Fabricación",      tipos:["fabricacion","armado_fabrica"],           lado:"neto" },
  { k:"envios_tall", label:"Envíos Tallerista", tipos:["envio_tallerista"],                      lado:"sal"  },
  { k:"recep_tall",  label:"Recep. Tallerista", tipos:["entrega_tallerista"],                    lado:"ent"  },
  { k:"a_virgilio",  label:"A Virgilio",        tipos:["recepcion_virgilio","consumo_virgilio"], lado:"sal"  }
];
var COLS_MOV3 = [
  { k:"fabricado", label:"Fabricado", tipos:["fabricacion"], lado:"ent" },
  { k:"consumido", label:"Consumido", tipos:["fabricacion","consumo_prod"], lado:"sal" }
];
/* Sectores de empaque/consumo (es_insumo): NUNCA se le mandan a un proveedor de servicio
   [usuario 2026-09-15: "a un PS no se le envian cajas"]. Al PS se le manda la pieza a
   cromar/niquelar/procesar (crudo/procesado/bombilla/garage), no el envase ni el insumo.
   Auditoria 2026-09-15: las filas de caja/carton/etc en un PS eran SEED en 0 sin movimiento. */
var SECT_CONSUMIBLE = { 5:1, 6:1, 8:1, 10:1, 11:1, 14:1 }; // fleje, plastico, remache, carton, caja, bolsas

/* ═══ rubros ═══
   Los de sector (mode:'sector') abren stock_sector_bundle(sid) con su config de columnas.
   Los de 'otros' salen de movimientos_bundle / extra_bundle y NO llevan columnas de movimiento. */
var RUBROS = [
  // el buscador transversal: una sola tabla con TODO, para cuando no se sabe el rubro. v3.0.0:
  // vuelve a tener botón (y SIEMPRE visible, en las 3 plantas) — ver el comentario de arriba.
  { key:"all", grupo:"Buscar", nom:"🔎 Todos los rubros", mode:"global", mostrar_ubic:"Dónde", mostrar_rubro:true },
  { key:"sc",  grupo:"Cervantes", nom:"Stock SC",         mode:"sector", sid:1,  cols:COLS_SC },
  { key:"sp",  grupo:"Cervantes", nom:"Stock SP",         mode:"sector", sid:2,  cols:COLS_SP },
  { key:"mov", grupo:"Cervantes", nom:"En Movimiento",    mode:"sector", sid:3,  cols:COLS_MOV3, sin_max:true },
  // v2.9.0: Sector Afilado — el único sector con ubicación que no tenía botón (hoy: Y1, Cuchilla para Afilar)
  { key:"afi", grupo:"Cervantes", nom:"Afilado",          mode:"sector", sid:4,  cols:COLS_MOV3 },
  { key:"fle", grupo:"Cervantes", nom:"Flejes",           mode:"sector", sid:5,  cols:COLS_INSUMO, sin_caj:true, mostrar_fleje:true, detalle:true },
  { key:"pla", grupo:"Cervantes", nom:"Plásticos",        mode:"sector", sid:6,  cols:COLS_INSUMO },
  { key:"bom", grupo:"Cervantes", nom:"Bombillas",        mode:"sector", sid:7,  cols:COLS_INSUMO },
  { key:"rem", grupo:"Cervantes", nom:"Remaches",         mode:"sector", sid:8,  cols:COLS_INSUMO },
  { key:"gar", grupo:"Cervantes", nom:"Garage",           mode:"sector", sid:9,  cols:COLS_INSUMO },
  { key:"car", grupo:"Cervantes", nom:"Cartones",         mode:"sector", sid:10, cols:COLS_INSUMO },
  { key:"caj", grupo:"Cervantes", nom:"Cajas",            mode:"sector", sid:11, cols:COLS_INSUMO },
  // v2.6.0: Bolsas Plásticas se mudó a la pestaña Virgilio (sigue siendo el mismo sector 14,
  // stock_sector_bundle(14); sólo cambia en qué caja de Stock General se ve).
  // v2.3.0: Tránsito PS se ve con los sectores; los datos siguen saliendo de extra_bundle
  { key:"tra", grupo:"Cervantes", nom:"Tránsito PS",      mode:"otros",  fuente:"transito", mostrar_ubic:"En tránsito", sin_max:true },
  // v2.6.0 (2026-10-01): lo que produjo Fábrica y todavía no mandó a Virgilio (ubicación
  // "Art. Terminado (Fábrica)"). Sale de stock_general_extra_bundle.art_terminado.
  { key:"art", grupo:"Cervantes", nom:"Art. Terminado",   mode:"otros",  fuente:"art_terminado", mostrar_ubic:"Art. Terminado (Fábrica)" },
  // v3.0.0: Virgilio deja de ser pane aparte — mismo motor, filtro planta:"virg" (ver
  // pintarRubros/filtrarPlanta). vbol (sector 14) vive del lado Virgilio desde siempre
  // (stock_sector_bundle(14).online YA es lo que tiene Virgilio: ese sector no tiene presencia
  // del lado Cervantes) — mode "sector" como cualquier otro, con sus columnas de movimiento.
  // Los otros 5 comparten el MISMO CACHE[sid] que ya cargan sc/sp/fle/pla/caj (sin RPC nueva):
  // leen "en_virgilio" en vez de "online" (mode "virg", ver filasDe/filasGlobales). Sin Máximo:
  // ese concepto es de la demanda de Cervantes, no se duplica del lado Virgilio.
  { key:"vbol", grupo:"Virgilio", planta:"virg", nom:"Bolsas Plásticas",      mode:"sector", sid:14, cols:COLS_MP },
  { key:"vsc",  grupo:"Virgilio", planta:"virg", nom:"SC en Virgilio",        mode:"virg",   sid:1,  sin_max:true },
  { key:"vsp",  grupo:"Virgilio", planta:"virg", nom:"SP en Virgilio",        mode:"virg",   sid:2,  sin_max:true },
  { key:"vfle", grupo:"Virgilio", planta:"virg", nom:"Flejes en Virgilio",    mode:"virg",   sid:5,  sin_max:true, sin_caj:true, mostrar_fleje:true },
  { key:"vpla", grupo:"Virgilio", planta:"virg", nom:"Plásticos en Virgilio", mode:"virg",   sid:6,  sin_max:true },
  { key:"vcaj", grupo:"Virgilio", planta:"virg", nom:"Cajas en Virgilio",     mode:"virg",   sid:11, sin_max:true },
  // v2.7.0: estos 4 son la planta TERCEROS (planta:"terc"), no "Otros" adentro de Cervantes.
  { key:"ps",  grupo:"Terceros", planta:"terc", nom:"Prov. Servicio",   mode:"otros",  fuente:"ps",       mostrar_ubic:"Prov. Servicio", sin_max:true },
  { key:"tal", grupo:"Terceros", planta:"terc", nom:"Talleristas",      mode:"otros",  fuente:"tall",     mostrar_ubic:"Tallerista" },
  { key:"pat", grupo:"Terceros", planta:"terc", nom:"Prov. Art. Term.", mode:"otros",  fuente:"provat",   mostrar_ubic:"Proveedor" },
  // v2.3.0: la materia prima plástica que se le mandó a cada inyector (ubicación tipo inyector), en kg
  { key:"iny", grupo:"Terceros", planta:"terc", nom:"Inyectores",       mode:"otros",  fuente:"iny",      mostrar_ubic:"Inyector", sin_caj:true, sin_max:true }
];

var D = null;                 // movimientos_bundle (para Ajuste y rubros 'otros')
var EXTRA = { prov_at:[], transito:[], inyector:[], art_terminado:{ubic:null, filas:[]} };
var CACHE = {};               // sid -> stock_sector_bundle
var GLOBAL = null;            // indice transversal (todas las ubicaciones), se arma una vez
var TOPE_GLOBAL = 400;        // filas dibujadas sin busqueda (el inventario entero son ~1.330)
var RUBRO = null;             // rubro activo
var CUR = { filas:[], ubic_id:null };
/* v3.0.0: PLANTA es un FILTRO sobre "Todos los rubros", no una pestaña exclusiva [Thomas: "Cuando
   entro a stock general quiero ver los stocks de todo y después si quiero puedo filtrar por
   Cervantes, Virgilio, Terceros"]. Se entra siempre en "todos" (ver reload) y el filtro recorta
   tanto los botones de #rubros como las filas de la tabla "Todos los rubros". */
var PLANTA = "todos";          // "todos" | "cerv" | "virg" | "terc"

/* ---------- selector de rubros ---------- */
function cajaDeRubro(r){ return r.planta || "cerv"; }
function pintarRubros(){
  var lista = RUBROS.filter(function(r){
    return r.mode==="global" || PLANTA==="todos" || cajaDeRubro(r)===PLANTA;
  });
  var grupos = [], vistos = {};
  lista.forEach(function(r){ var g=r.grupo||""; if(!vistos[g]){ vistos[g]=1; grupos.push(g); } });
  $("rubros").innerHTML = grupos.map(function(g){
    var btns = lista.filter(function(r){ return (r.grupo||"")===g; }).map(function(r){
      return '<button class="rubro-btn" data-k="'+r.key+'" type="button">'+esc(r.nom)+'</button>';
    }).join("");
    return (g ? '<div class="rubro-grp">'+esc(g)+'</div>' : '') + '<div class="rubros">'+btns+'</div>';
  }).join("");
  document.querySelectorAll("#rubros .rubro-btn").forEach(function(b){
    b.addEventListener("click", function(){ seleccionar(b.dataset.k); });
  });
}
function pintarPlantaTabs(){
  document.getElementById("tabTodos").classList.toggle("active", PLANTA==="todos");
  document.getElementById("tabCervantes").classList.toggle("active", PLANTA==="cerv");
  document.getElementById("tabVirgilio").classList.toggle("active", PLANTA==="virg");
  document.getElementById("tabTerceros").classList.toggle("active", PLANTA==="terc");
}
/* v3.0.0: el filtro de planta SIEMPRE vuelve al índice combinado ("Todos los rubros"), acotado a
   esa planta — es la pestaña que pidió Thomas, no un destino nuevo. Elegir un rubro puntual (ver
   seleccionar) sincroniza la pestaña sola, al revés. */
function filtrarPlanta(p){
  PLANTA = p;
  pintarPlantaTabs();
  pintarRubros();
  mostrarVins();            // v3.2.0: la tabla de insumos sin asignar sólo vive en Virgilio
  seleccionar("all");
}

/* ═══ v3.2.0: insumos de Virgilio sin código asignado (sólo pestaña Virgilio) ═══
   Sale del espejo del stock REAL de GV (GP2.virgilio_insumo_stock — Regla 0: GP2 lee el espejo,
   NUNCA public) menos los ya mapeados en GP2.importado_virgilio_componente, vía la RPC
   GP2.virgilio_insumos_sin_match_bundle. Cod ISIS / Cod C quedan "—" porque justamente NO están
   matcheados (ver CLAUDE.md "TRES SISTEMAS DE CÓDIGOS"). */
var VINS = null, VINS_CARGANDO = false;
var VINS_RUBRO = { partes_plasticas:"Partes plásticas", importados:"Importados", cajas:"Cajas",
  fleje:"Flejes", cartones:"Cartones", carton:"Cartones", plasticos:"Plásticos", plastico:"Plásticos",
  bolsas:"Bolsas", remaches:"Remaches", remache:"Remaches", bombillas:"Bombillas", garage:"Garage" };
function vinsRubro(c){ return c ? (VINS_RUBRO[c] || c) : "—"; }
function mostrarVins(){
  var box = $("vinsBox"); if (!box) return;
  var on = PLANTA==="virg";
  box.classList.toggle("hidden", !on);
  if (!on) return;
  if (!VINS && !VINS_CARGANDO) cargarVins();
  else if (VINS) renderVins();
}
async function cargarVins(){
  VINS_CARGANDO = true;
  $("vinsSub").textContent = "Cargando stock de Virgilio…";
  var res;
  try { res = await SB.rpc("virgilio_insumos_sin_match_bundle"); }
  catch(e){ res = { error:e }; }
  VINS_CARGANDO = false;
  if (!res || res.error || !res.data){
    // una lectura ROTA no es "0 insumos": lo dice, no muestra la tabla vacía.
    VINS = null; $("vinsBody").innerHTML = ""; $("vinsEmpty").classList.add("hidden");
    $("vinsSub").innerHTML = '<span style="color:#b91c1c;font-weight:700">No se pudo leer el stock de Virgilio — reintentá.</span>';
    return;
  }
  VINS = res.data;
  renderVins();
}
function renderVins(){
  if (!VINS) return;
  var q = String(($("vinsQ")||{}).value||"").trim().toLowerCase();
  var filas = (VINS.filas||[]).filter(function(f){
    return !q || ((f.cod_v||"")+" "+(f.nombre||"")+" "+(f.ubicacion||"")+" "+vinsRubro(f.categoria)).toLowerCase().indexOf(q)>=0;
  });
  $("vinsBody").innerHTML = filas.map(function(f){
    var kg = (f.unidad||"").toLowerCase()==="kg";
    return '<tr data-cv="'+esc(f.cod_v||"")+'">'+
      '<td><input class="vins-in vins-isis" type="text" inputmode="numeric" value="'+esc(f.isis||"")+'" placeholder="ISIS"></td>'+
      '<td><span class="cod">'+esc(f.cod_v||"")+'</span></td>'+
      '<td class="vins-cc"><input class="vins-in vins-cerv" type="text" placeholder="Cód. Cervantes"><button type="button" class="vins-ok" title="Vincular esta equivalencia">✓</button></td>'+
      '<td>'+esc(f.nombre||"")+'</td>'+
      '<td>'+esc(vinsRubro(f.categoria))+'</td>'+

      '<td>'+esc(f.unidad||"")+'</td>'+
      '<td>'+esc(f.ubicacion||"—")+'</td>'+
    '</tr>';
  }).join("");
  $("vinsEmpty").classList.toggle("hidden", filas.length>0);
  if (!filas.length) $("vinsEmpty").textContent = q ? ("Sin resultados para «"+q+"».") : "Todo asignado 🎉";
  var ts = VINS.actualizado_en ? fmtFecha(VINS.actualizado_en) : "—";
  $("vinsSub").innerHTML = fmt(VINS.total||0)+" sin asignar · "+fmt(VINS.con_saldo||0)+
    " con stock · completá el <b>Cód. Cervantes</b> y/o el <b>ISIS</b> y tocá ✓ · espejo (refresca c/10 min) · últ. cambio "+esc(ts);
}

/* v3.3.0: guardar la equivalencia de una fila (Cod V ↔ Cod C ↔ ISIS). Escribe SOLO GP2 (Regla 0)
   vía GP2.virgilio_equivalencia_guardar. Al setear el componente de Cervantes, la fila SALE de sin asignar. */
async function vinsGuardar(tr){
  if (!tr) return;
  var cv = tr.getAttribute("data-cv")||"";
  var cc = ((tr.querySelector(".vins-cerv")||{}).value||"").trim();
  var isis = ((tr.querySelector(".vins-isis")||{}).value||"").trim();
  if (!cc && !isis){ toast("Completá el Cód. Cervantes o el ISIS", true); return; }
  var btn = tr.querySelector(".vins-ok"); if (btn){ btn.disabled = true; btn.textContent = "…"; }
  var res;
  try { res = await SB.rpc("virgilio_equivalencia_guardar", { p_cod_virgilio: cv, p_cod_cervantes: cc, p_isis: isis }); }
  catch(e){ res = { error:e }; }
  if (!res || res.error){
    var m = ((res && res.error && res.error.message) || "")+"";
    toast(/COMPONENTE_INEXISTENTE/.test(m) ? ("No existe el código de Cervantes «"+cc+"»") : ("Error: "+(m||"no se pudo guardar")), true);
    if (btn){ btn.disabled = false; btn.textContent = "✓"; }
    return;
  }
  toast("✔ Equivalencia guardada"+((res.data && res.data.componente_id) ? " · sale de sin asignar" : ""));
  await cargarVins();   // si quedó vinculado el componente, la fila desaparece de sin asignar
}
function marcarActivo(){

/* ---------- conversiones (misma regla que Stock por Sector) ---------- */
/* en_kg: la cantidad YA está en kg y va en la columna Kg, NO en Uni. Son dos casos: la materia prima
   del inyector (um kg sin kg_x_uni, marcada con en_kg) y TODO componente cuya unidad canónica es kg
   —los flejes— cuyo inventario (y el depósito de Virgilio) se guarda en kg [Thomas 2026-10-02: "me
   pusiste 33 unidades de fleje cuando son kg"]. aKg sobre un stock que ya es kg lo multiplicaba de más. */
function esKg(x){ return !!(x && (x.en_kg || x.um==="kg")); }
function kgDe(x){ return esKg(x) ? Number(x.online||0) : GP2N.aKg(x.kg_x_uni, x.online || 0); }
function cajDe(x){ return x.uni_x_cajon ? Number(x.online||0)/Number(x.uni_x_cajon) : null; }
function valorCol(x, col){
  if (col.campo) return x[col.campo]==null ? null : Number(x[col.campo]);
  var tot=0, hubo=false;
  (col.tipos||[]).forEach(function(t){
    var m=(x.mov||{})[t]; if(!m) return; hubo=true;
    if (col.lado==="ent") tot += Number(m.ent||0);
    else if (col.lado==="sal") tot += Number(m.sal||0);
    else tot += Number(m.ent||0) - Number(m.sal||0);
  });
  return hubo ? tot : null;
}

/* inventario que Stock General NO muestra (v2.2.0): lo de Virgilio lo lleva Gestión Virgilio,
   y un tallerista dado de baja (Gentile) sólo aparece si le quedó stock, que sería una anomalía. */
function ocultarInv(u, v){
  if (u.tipo==="virgilio" || u.tipo==="virgilio_sector") return true;
  if (u.tipo==="tallerista" && ((D.tall||{})[String(u.ref)]||{}).act===false && Number(v.cant)===0) return true;
  return false;
}

/* ---------- armar las filas del rubro activo ---------- */
function compInfo(cid){
  var c = (D && D.comp[String(cid)]) || {};
  return { cod:c.cod||"?", desc:c.d||"", um:c.um, kg_x_uni:c.kg_x_uni, uni_x_cajon:c.uxc };
}
function filasDe(r){
  if (r.mode==="global"){ CUR.ubic_id = null; return { filas: filasGlobales() }; }
  if (r.mode==="sector"){
    var b = CACHE[r.sid] || { filas:[], ubicacion_id:null };
    CUR.ubic_id = b.ubicacion_id;
    return { filas:(b.filas||[]).map(function(x){
      return { cid:x.comp_id, cod:x.cod, desc:x.desc, um:x.um, kg_x_uni:x.kg_x_uni,
               uni_x_cajon:x.uni_x_cajon, online:Number(x.online||0), maximo:x.maximo,
               n_fleje:x.n_fleje, mov:x.mov, en_virgilio:x.en_virgilio, ubic_id:b.ubicacion_id };
    }) };
  }
  if (r.mode==="virg"){
    // v3.0.0: mismo CACHE[sid] que su contraparte de Cervantes (sc/sp/fle/pla/caj) — lee
    // "en_virgilio" en vez de "online". Sin ubicación propia clickeable (no hay composición acá,
    // igual que antes en renderVir): ni Máximo ni movimientos propios.
    var bv = CACHE[r.sid] || { filas:[], ubicacion_id:null };
    CUR.ubic_id = null;
    return { filas:(bv.filas||[]).map(function(x){
      return { cid:x.comp_id, cod:x.cod, desc:x.desc, um:x.um, kg_x_uni:x.kg_x_uni,
               uni_x_cajon:x.uni_x_cajon, online:Number(x.en_virgilio||0), maximo:null, n_fleje:x.n_fleje };
    }) };
  }
  // 'otros': no hay mov{}
  var out = [];
  if (r.fuente==="iny"){
    out = filasInyector(false);
  } else if (r.fuente==="ps" || r.fuente==="tall"){
    var tipo = r.fuente==="ps" ? "proveedor_servicio" : "tallerista";
    var tabla = r.fuente==="ps" ? (D.prov_serv||{}) : (D.tall||{});
    for (var k in (D.inv||{})){
      var p=k.split(":"), cid=+p[0], uid=+p[1], u=D.ubic[String(uid)];
      if (!u || u.tipo!==tipo) continue;
      var v=D.inv[k];
      if (ocultarInv(u, v)) continue;
      // PS: ocultar el ruido de empaque/consumo sembrado en 0 (una fila !=0 seria anomalia a ver).
      if (r.fuente==="ps" && SECT_CONSUMIBLE[(D.comp[String(cid)]||{}).s] && Number(v.cant)===0) continue;
      var ci=compInfo(cid);
      var nom = (tabla[String(u.ref)]||{}).nom || u.nom || "?";
      out.push({ cid:cid, cod:ci.cod, desc:ci.desc, um:ci.um, kg_x_uni:ci.kg_x_uni,
                 uni_x_cajon:ci.uni_x_cajon, online:Number(v.cant)||0, maximo:v.max,
                 ubic_nom:nom, ubic_id:uid });
    }
  } else if (r.fuente==="provat"){
    (EXTRA.prov_at||[]).forEach(function(p){
      (p.filas||[]).forEach(function(f){
        var ci=compInfo(f.cid);
        out.push({ cid:f.cid, cod:ci.cod, desc:ci.desc, um:ci.um, kg_x_uni:ci.kg_x_uni,
                   uni_x_cajon:ci.uni_x_cajon, online:Number(f.cant)||0, maximo:f.max,
                   ubic_nom:p.nom, ubic_id:p.ubic });
      });
    });
  } else if (r.fuente==="art_terminado"){
    // v2.6.0: lo que Fábrica produjo y todavía no se mandó a Virgilio. Una fila por artículo
    // (ubic_id fija: todos viven en "Art. Terminado (Fábrica)"), uxc viene de compInfo.
    var ubicArt = (EXTRA.art_terminado||{}).ubic;
    ((EXTRA.art_terminado||{}).filas||[]).forEach(function(f){
      var ci=compInfo(f.cid);
      out.push({ cid:f.cid, cod:ci.cod, desc:ci.desc, um:ci.um, kg_x_uni:ci.kg_x_uni,
                 uni_x_cajon:f.uxc||ci.uni_x_cajon, online:Number(f.cant)||0, maximo:null,
                 ubic_nom:"Art. Terminado (Fábrica)", ubic_id:ubicArt });
    });
  } else if (r.fuente==="transito"){
    (EXTRA.transito||[]).forEach(function(t){
      var ci=compInfo(t.cid);
      out.push({ cid:t.cid, cod:ci.cod, desc:ci.desc, um:ci.um, kg_x_uni:ci.kg_x_uni,
                 uni_x_cajon:ci.uni_x_cajon, online:Number(t.cant)||0, maximo:null,
                 ubic_nom:(t.ps1||"?")+" → "+(t.ps2||"?"), ubic_id:null });
    });
  }
  CUR.ubic_id = null;
  return { filas: out };
}

/* ═══ índice transversal (rubro "Todos" + renglón "También en: …") ═══
   Sale de D.inv —el inventario entero, que movimientos_bundle YA trae— más los extras
   de prov AT y tránsito: no cuesta ninguna RPC nueva. Incluye A PROPÓSITO las ubicaciones
   que no tienen botón propio (sectores sin rubro; Virgilio NO desde v2.2.0; inyectores tienen rubro desde v2.3.0), porque justamente
   ahí es donde un componente se volvía imposible de encontrar. */
function rubroIdx(k){ for (var i=0;i<RUBROS.length;i++) if (RUBROS[i].key===k) return i; return RUBROS.length; }
function rubroPorKey(k){ return RUBROS.filter(function(r){ return r.key===k; })[0] || null; }
function rubroDeUbic(u){
  if (!u) return null;
  if (u.tipo==="sector") return RUBROS.filter(function(r){ return r.mode==="sector" && Number(r.sid)===Number(u.ref); })[0] || null;
  if (u.tipo==="tallerista") return rubroPorKey("tal");
  if (u.tipo==="proveedor_servicio") return rubroPorKey("ps");
  if (u.tipo==="inyector") return rubroPorKey("iny");
  if (u.tipo==="art_terminado") return rubroPorKey("art");
  return null;
}
/* inyector: la ubicación guarda materia prima en kg sin factor (componente.unidad_medida kg) */
function enKg(u, ci){ return u.tipo==="inyector" && ci.um==="kg" && !ci.kg_x_uni; }
/* v2.3.1: las filas del inyector salen de extra_bundle.inyector —la resina de cada PIEZA suya
   (componente.material_id) más lo que ya tenga en su ubicación—, NO de D.inv: Pat Bet Plast y
   JL Matriceria no tenían ninguna fila en inventario porque nunca se les mandó nada, y no se veían. */
function filasInyector(conRubro){
  var out = [], R = rubroPorKey("iny") || {};
  (EXTRA.inyector||[]).forEach(function(p){
    (p.filas||[]).forEach(function(f){
      var ci=compInfo(f.cid), fila={ cid:f.cid, cod:ci.cod, desc:ci.desc, um:ci.um, kg_x_uni:ci.kg_x_uni,
               uni_x_cajon:null, online:Number(f.cant)||0, maximo:null,
               en_kg:enKg({ tipo:"inyector" }, ci), ubic_nom:p.nom, ubic_id:p.ubic };
      if (conRubro){ fila.rubro_key = "iny"; fila.rubro_nom = R.nom; fila.planta = "terc"; }
      out.push(fila);
    });
  });
  return out;
}
var TIPO_UBIC = { virgilio:"Virgilio", virgilio_sector:"Virgilio", inyector:"Inyector", analisis:"Análisis" };
function etiqSuelta(u){
  if (u.tipo==="sector") return ((D.sect||{})[String(u.ref)]||{}).nom || u.nom || "Sector";
  return TIPO_UBIC[u.tipo] || u.nom || u.tipo || "?";
}
function nomUbic(u){
  var t = u.tipo==="tallerista" ? (D.tall||{}) : (u.tipo==="proveedor_servicio" ? (D.prov_serv||{}) : null);
  return (t && (t[String(u.ref)]||{}).nom) || u.nom || "?";
}
/* v3.1.0: "Todos los rubros" = lo que muestra CADA rubro, así que antes de armar el índice se
   precargan los bundles de TODOS los sectores que algún rubro lee (v3.0.0 sólo precargaba los 6
   de Virgilio) — mismo CACHE que después reusan los rubros, sin pedir nada dos veces. Lo que
   falla NO se cachea vacío: el rubro lo reintenta al abrirlo y "Todos" avisa que le faltan filas. */
function sidsDeRubros(){
  var vistos = {}, out = [];
  RUBROS.forEach(function(r){
    if ((r.mode==="sector" || r.mode==="virg") && !vistos[r.sid]){ vistos[r.sid] = 1; out.push(r.sid); }
  });
  return out;
}
function sidsSinLeer(){ return sidsDeRubros().filter(function(sid){ return !CACHE[sid]; }); }
async function precargarSectores(){
  var faltan = sidsSinLeer();
  if (!faltan.length) return;
  var res = await Promise.all(faltan.map(function(sid){ return SB.rpc("stock_sector_bundle", { p_sector_id: sid }); }));
  faltan.forEach(function(sid, i){
    var rr = res[i];
    if (rr && !rr.error && rr.data) CACHE[sid] = rr.data;
  });
}
function filasGlobales(){
  if (GLOBAL) return GLOBAL;
  var out = [];
  for (var k in (D.inv||{})){
    var p=k.split(":"), cid=+p[0], uid=+p[1], u=D.ubic[String(uid)];
    if (!u || u.tipo==="inyector") continue;             // el inyector sale de extra_bundle (abajo)
    var v=D.inv[k], r=rubroDeUbic(u);
    if (ocultarInv(u, v)) continue;
    // mismo criterio que el rubro Prov. Servicio: no listar el empaque sembrado en 0
    if (r && r.key==="ps" && SECT_CONSUMIBLE[(D.comp[String(cid)]||{}).s] && Number(v.cant)===0) continue;
    var ci=compInfo(cid);
    // el máximo se muestra SOLO donde el rubro lo muestra: a un P.S. (y al tránsito) no le
    // corresponde uno propio [usuario 2026-09-15: "a un PS se le manda segun el maximo del
    // SECTOR PROCESADO"], así que acá tampoco, ni cuenta en "bajo el máximo".
    out.push({ cid:cid, cod:ci.cod, desc:ci.desc, um:ci.um, kg_x_uni:ci.kg_x_uni,
               uni_x_cajon:ci.uni_x_cajon, online:Number(v.cant)||0, en_kg:enKg(u, ci),
               maximo:(r && r.sin_max) ? null : v.max,
               rubro_key:r?r.key:null, rubro_nom:r?r.nom:etiqSuelta(u),
               ubic_nom:nomUbic(u), ubic_id:uid, planta:r?cajaDeRubro(r):"cerv" });
  }
  // prov AT, inyectores y tránsito no viven (completos) en el inventario por ubicación del bundle
  out = out.concat(filasInyector(true));
  (EXTRA.prov_at||[]).forEach(function(pa){
    (pa.filas||[]).forEach(function(f){
      var ci=compInfo(f.cid);
      out.push({ cid:f.cid, cod:ci.cod, desc:ci.desc, um:ci.um, kg_x_uni:ci.kg_x_uni,
                 uni_x_cajon:ci.uni_x_cajon, online:Number(f.cant)||0, maximo:f.max,
                 rubro_key:"pat", rubro_nom:(rubroPorKey("pat")||{}).nom, ubic_nom:pa.nom, ubic_id:pa.ubic, planta:"terc" });
    });
  });
  (EXTRA.transito||[]).forEach(function(t){
    var ci=compInfo(t.cid);
    out.push({ cid:t.cid, cod:ci.cod, desc:ci.desc, um:ci.um, kg_x_uni:ci.kg_x_uni,
               uni_x_cajon:ci.uni_x_cajon, online:Number(t.cant)||0, maximo:null,
               rubro_key:"tra", rubro_nom:(rubroPorKey("tra")||{}).nom,
               ubic_nom:(t.ps1||"?")+" → "+(t.ps2||"?"), ubic_id:null, planta:"cerv" });
  });
  // v3.0.0: lo que Virgilio tiene de SC/SP/Fleje/Plástico/Caja (Bolsas Plásticas ya entró arriba:
  // su ubicación es tipo "sector" como cualquier otra, ocultarInv no la saca — ver rubroDeUbic).
  // Mismo CACHE que ya cargan sus rubros "en Virgilio"; precargarSectores lo deja listo antes.
  RUBROS.filter(function(r){ return r.mode==="virg"; }).forEach(function(r){
    var b = CACHE[r.sid] || { filas:[], ubicacion_id:null };
    (b.filas||[]).forEach(function(x){
      out.push({ cid:x.comp_id, cod:x.cod, desc:x.desc, um:x.um, kg_x_uni:x.kg_x_uni,
                 uni_x_cajon:x.uni_x_cajon, online:Number(x.en_virgilio||0), maximo:null,
                 rubro_key:r.key, rubro_nom:r.nom, ubic_nom:"Virgilio", ubic_id:null, planta:"virg" });
    });
  });
  completarConRubros(out);
  // sólo se cachea completo: con algún sector sin leer, el próximo pedido lo vuelve a armar
  if (!sidsSinLeer().length) GLOBAL = out;
  return out;
}
/* v3.1.0: lo que dibuja cada rubro TIENE que estar en "Todos" [usuario 2026-10-05: "Todos los
   rubros se tiene que armar de todos los items que hay acá adentro"]. El barrido de arriba sólo ve
   filas que EXISTEN en inventario, y los rubros no leen todos de ahí: los de sector salen de
   stock_sector_bundle (todos los componentes del sector, tengan o no fila) y Art. Terminado de
   stock_general_extra_bundle (los terminados por receta/ruta, en 0 si nunca se produjeron). Acá se
   suma, con la misma fila que dibuja el rubro, lo que le falte al índice; lo que ya entró no se repite. */
function claveFila(x){ return (x.rubro_key||"_")+"|"+x.cid+"|"+(x.ubic_id!=null ? x.ubic_id : (x.ubic_nom||"")); }
function completarConRubros(out){
  var visto = {}, ubicAnt = CUR.ubic_id;            // filasDe deja CUR.ubic_id puesto: se restituye
  out.forEach(function(x){ visto[claveFila(x)] = 1; });
  RUBROS.forEach(function(r){
    if (r.mode==="global") return;
    filasDe(r).filas.forEach(function(x){
      x.rubro_key = r.key; x.rubro_nom = r.nom; x.planta = cajaDeRubro(r);
      if (r.sin_max) x.maximo = null;
      if (x.ubic_nom==null) x.ubic_nom = r.mode==="virg" ? "Virgilio"
        : (((D.ubic||{})[String(x.ubic_id)]||{}).nom || ((D.sect||{})[String(r.sid)]||{}).nom || r.nom);
      var k = claveFila(x);
      if (visto[k]) return;
      visto[k] = 1; out.push(x);
    });
  });
  CUR.ubic_id = ubicAnt;
}

/* ---------- filtros ---------- */
/* el texto buscable se calcula UNA vez por fila: el índice global son ~1.300 filas
   y esto corre en cada tecla, tanto para la tabla como para el renglón "También en". */
function texto(x){
  return x._t || (x._t = ((x.cod||"")+" "+(x.desc||"")+" "+(x.ubic_nom||"")+" "+(x.rubro_nom||"")).toLowerCase());
}
function filtradas(){
  var arr = (CUR.filas||[]).slice();
  // v3.0.0: el filtro de planta sólo aplica sobre el índice combinado — un rubro puntual
  // (Stock SC, Talleristas…) ya es, de por sí, de UNA sola planta.
  if (RUBRO && RUBRO.mode==="global" && PLANTA!=="todos"){
    arr = arr.filter(function(x){ return x.planta===PLANTA; });
  }
  var q = String($("q").value||"").trim().toLowerCase();
  if (q) arr = arr.filter(function(x){ return texto(x).indexOf(q)>=0; });
  if ($("soloStock").checked) arr = arr.filter(function(x){ return Number(x.online||0)!==0; });
  // v3.0.2: en "Todos" manda el RUBRO, en el orden de los botones (Cervantes → Virgilio →
  // Terceros; lo que no tiene rubro va al final); adentro, código numérico y después dónde.
  if (RUBRO && RUBRO.mode==="global") return arr.sort(function(a,b){
    var r=rubroIdx(a.rubro_key)-rubroIdx(b.rubro_key); if(r) return r;
    var c=String(a.cod||"").localeCompare(String(b.cod||""), "es", { numeric:true }); if(c) return c;
    return (a.ubic_nom||"").localeCompare(b.ubic_nom||"");
  });
  // en los sectores (y su contraparte "en Virgilio"), orden numérico del código: GRJ4, GRJ5 …
  // GRJ10, GRJ10A (no GRJ10 antes que GRJ4)
  if (RUBRO && (RUBRO.mode==="sector" || RUBRO.mode==="virg")) return arr.sort(function(a,b){
    return String(a.cod||"").localeCompare(String(b.cod||""), "es", { numeric:true });
  });
  // en 'otros' manda el proveedor / tallerista
  return arr.sort(function(a,b){
    var u=(a.ubic_nom||"").localeCompare(b.ubic_nom||""); if(u) return u;
    return String(a.cod||"").localeCompare(String(b.cod||""));
  });
}
/* los OTROS rubros donde cae lo que se está buscando (renglón "También en: …") */
function otrosRubros(q){
  if (!q || !D) return [];
  var sin = $("soloStock").checked, act = RUBRO ? RUBRO.key : null, acum = {}, orden = [];
  filasGlobales().forEach(function(x){
    if (act && x.rubro_key===act) return;                 // el rubro abierto ya se ve en la tabla
    if (sin && Number(x.online||0)===0) return;
    if (texto(x).indexOf(q)<0) return;
    var k = x.rubro_key || ("_"+x.rubro_nom);
    if (!acum[k]){ acum[k] = { key:x.rubro_key, nom:x.rubro_nom, n:0 }; orden.push(k); }
    acum[k].n++;
  });
  return orden.map(function(k){ return acum[k]; }).sort(function(a,b){ return b.n-a.n; });
}
var PRECARGA = null;          // lectura de los sectores que dispara el renglón "También en…" (una por carga)
function pintarHint(){
  var el = $("hintOtros"), q = String($("q").value||"").trim().toLowerCase();
  // v3.1.0: "También en…" lee el índice de TODOS los rubros; si sólo se abrió uno, se completa acá
  if (q && RUBRO && RUBRO.mode!=="global" && !PRECARGA && sidsSinLeer().length)
    PRECARGA = precargarSectores().then(pintarHint);
  var otros = (RUBRO && RUBRO.mode==="global") ? [] : otrosRubros(q);
  if (!otros.length){ el.className = "hint-otros hidden"; el.innerHTML = ""; return; }

/* ---------- tbody + kpis ---------- */
function render(){
  if (!RUBRO) return;
  var r = RUBRO, cols = (r.mode==="sector" ? r.cols : []) || [];
  var todas = filtradas(), tb = $("tbody");
  tb.innerHTML = "";
  $("tblEmpty").classList.toggle("hidden", todas.length>0);
  pintarHint();

  // "Todos" sin búsqueda son ~1.330 filas: se dibujan las primeras y se avisa.
  var arr = todas, cortado = 0;
  if (r.mode==="global" && todas.length>TOPE_GLOBAL){ arr = todas.slice(0,TOPE_GLOBAL); cortado = todas.length; }
  var nota = $("notaTabla");
  nota.classList.toggle("hidden", !cortado);
  if (cortado) nota.textContent = "Mostrando las primeras "+fmt(TOPE_GLOBAL)+" de "+fmt(cortado)+" filas — escribí en el buscador para afinar.";

  // los KPI cuentan TODO lo filtrado, aunque la tabla dibuje menos filas
  var tKg=0, tUni=0, tBajo=0;
  todas.forEach(function(x){
    var uni=Number(x.online||0);
    tKg += (kgDe(x)||0); if (!esKg(x)) tUni += uni;
    if (!r.sin_max && x.maximo!=null && uni < Number(x.maximo)) tBajo++;
  });

  arr.forEach(function(x){
    var kg=kgDe(x), caj=cajDe(x), uni=Number(x.online||0);
    var bajo = !r.sin_max && x.maximo!=null && uni < Number(x.maximo);

    var celdasMov = cols.map(function(col,i){
      var sep = i===0 ? " sep" : "";
      var v = valorCol(x, col);
      if (v==null) return '<td class="num cero'+sep+'">—</td>';
      var cls = col.lado==="neto" ? (" "+clsNum(v)) : (v<0?" neg":"");
      return '<td class="num mov-cell'+cls+sep+'" data-cid="'+x.cid+'" data-col="'+esc(col.k)+'">'+fmt(v)+'</td>';
    }).join("");

    var clickable = x.ubic_id!=null && window.GP2Composicion;
    var stkCls = clickable ? " stk-cell" : "";
    var stkData = clickable ? ' data-cid="'+x.cid+'" data-uid="'+x.ubic_id+'"' : "";
    // v2.4.0: el Máximo se toca y abre su desglose (hace falta la ubicación: el máximo es de esa fila)
    var maxClick = x.maximo!=null && x.ubic_id!=null;
    var maxCelda = maxClick
      ? '<td class="num max-cell" data-cid="'+x.cid+'" data-uid="'+x.ubic_id+'">'+fmt(x.maximo)+'</td>'
      : '<td class="num">'+(x.maximo!=null?fmt(x.maximo):"—")+'</td>';

    var tr = document.createElement("tr");
    if (bajo) tr.className = "falt";
    else if (uni>0) tr.className = "stk";
    tr.innerHTML =
      (r.mostrar_rubro ? (x.rubro_key
          ? '<td class="rub-cell" data-rub="'+esc(x.rubro_key)+'">'+esc(x.rubro_nom||"")+'</td>'
          : '<td>'+esc(x.rubro_nom||"")+'</td>') : '')+
      (r.mostrar_ubic ? '<td>'+esc(x.ubic_nom||"")+'</td>' : '')+
      '<td><span class="cod">'+esc(x.cod)+'</span></td>'+
      '<td>'+esc(x.desc||"")+'</td>'+
      '<td class="num sep'+stkCls+'"'+stkData+'>'+(kg==null?"—":fmt(kg))+'</td>'+
      (r.sin_caj?'':'<td class="num'+stkCls+'"'+stkData+'>'+(caj==null?"—":fmt(caj,1))+'</td>')+
      '<td class="num'+stkCls+'"'+stkData+'>'+(esKg(x)?"—":fmt(uni))+'</td>'+
      celdasMov +
      '<td class="num sep">'+(x.kg_x_uni?fmt(x.kg_x_uni,6):"—")+'</td>'+
      (r.sin_caj?'':'<td class="num">'+(x.uni_x_cajon?fmt(x.uni_x_cajon):"—")+'</td>')+
      (r.sin_max?'':maxCelda)+
      (r.mostrar_fleje?'<td class="num">'+(x.n_fleje!=null?esc(x.n_fleje):"—")+'</td>':"");
    tb.appendChild(tr);
  });

  $("kpis").innerHTML =
    '<div class="kpi"><div class="k">'+(r.mode==="global"?"Filas":"Componentes")+'</div><div class="v">'+fmt(todas.length)+'</div></div>'+
    '<div class="kpi"><div class="k">Total uni</div><div class="v">'+fmt(tUni)+'</div></div>'+
    '<div class="kpi"><div class="k">Total kg</div><div class="v">'+fmt(tKg)+'</div></div>'+
    (r.sin_max?'':'<div class="kpi"><div class="k">Bajo el máximo</div><div class="v '+(tBajo?"neg":"cero")+'">'+tBajo+'</div></div>');
}

/* ---------- seleccionar rubro (carga perezosa del sector) ---------- */
async function seleccionar(key){
  var r = RUBROS.filter(function(x){ return x.key===key; })[0];
  if (!r) return;
  // v3.0.0: elegir un rubro puntual sincroniza la pestaña de planta sola (como antes "También
  // en: …"); "Todos los rubros" NO toca la pestaña — respeta el filtro que ya estaba elegido.
  if (r.mode!=="global"){ PLANTA = cajaDeRubro(r); pintarPlantaTabs(); pintarRubros(); mostrarVins(); }
  RUBRO = r;
  marcarActivo();
  $("fljeLink").style.display = r.detalle ? "" : "none";
  document.title = "Stock general · " + r.nom + " · GP2";
  if ((r.mode==="sector" || r.mode==="virg") && !CACHE[r.sid]){
    $("status").textContent = "Cargando " + r.nom + "…";
    var res = await SB.rpc("stock_sector_bundle", { p_sector_id: r.sid });
    if (res.error){ $("status").textContent = "Error: " + res.error.message; return; }
    CACHE[r.sid] = res.data || { filas:[], ubicacion_id:null };
  }
  if (r.mode==="global" && !GLOBAL){
    $("status").textContent = "Cargando…";
    await precargarSectores();
  }
  var f = filasDe(r);
  CUR.filas = f.filas;
  renderHead();
  render();
  var con = CUR.filas.filter(function(x){ return Number(x.online||0)!==0; }).length;
  var sinLeer = r.mode==="global" ? sidsSinLeer().length : 0;
  $("status").textContent = r.mode==="global"
    ? "Todos los rubros · " + fmt(CUR.filas.length) + " filas (todo lo que muestra cada rubro: sectores, Virgilio, tránsito, art. terminado, talleristas, P.S., prov. AT e inyectores) · " + fmt(con) + " con stock."
      + (sinLeer ? " ⚠ No se pudieron leer " + sinLeer + " sector(es): faltan filas." : "")
    : r.nom + " · " + CUR.filas.length + " componentes · " + con + " con stock.";
}

   tabla cierra con la celda. Comparte el popup (y su secuencia) con el detalle de movimientos. */
var MAX_CACHE = {};
async function abrirMaximo(cid, uid){
  var miSeq = ++DET_SEQ, k = cid+":"+uid;

/* La cuenta en una línea, según de dónde sale el máximo (inventario.maximo_origen). */
function lineaMaximo(d){
  var u = d.unidad==="kg" ? "kg" : "uni", dec = u==="kg" ? 2 : 0, o = String(d.maximo_origen||"");
  var max = d.maximo, cons = Number(d.consumo_mes||0), meses = d.meses, cxm = Number(d.consumo_x_meses||0);
  var cuenta = fmt(cons,dec)+" "+u+"/mes × "+fmt(meses,1)+" meses = "+fmt(cxm,dec)+" "+u;
  var L = [], esperado = null, tope = d.tope_cajones!=null ? Number(d.tope_cajones) : null;
  if (!d.base) return { L:['<p class="max-linea">Máximo '+fmt(max,dec)+' '+u+'. Este lugar no tiene desglose.</p>'], aviso:null };
  if (d.base==="piezas_mb"){
    L.push("Master bach: el "+fmt(d.mb_pct,1)+" % de la resina de las piezas color "+esc(d.mb_color||"?")+": "+cuenta+".");
    L.push("Se le suma su parte de las piezas que no tienen color y se redondea a bolsas de "+fmt(d.kg_x_bolsa)+" kg (mínimo 1 bolsa): <b>"+fmt(max,dec)+" kg</b>.");
  } else if (d.base==="piezas"){
    var bolsa = Number(d.kg_x_bolsa||25);
    esperado = Math.ceil(Math.round(cxm*100)/100/bolsa)*bolsa;
    L.push("Resina de sus piezas"+(Number(d.desperdicio_pct)>0?" (con "+fmt(d.desperdicio_pct,1)+" % de desperdicio)":"")+": "+cuenta+".");
    L.push("En bolsas de "+fmt(bolsa)+" kg: <b>"+fmt(esperado)+" kg</b> ("+fmt(esperado/bolsa)+" bolsas).");
  } else if (o==="fisico"){
    L.push("Máximo fijado a mano por el lugar físico: <b>"+fmt(max,dec)+" "+u+"</b>. No sale de la demanda.");
    if (cons>0) L.push("Por demanda daría: "+cuenta+".");
  } else {
    esperado = Math.round(cxm);
    if (tope!=null && esperado>tope){
      L.push(cuenta+", pero en Crudo / Procesado no pasa de "+fmt(d.cajones)+" cajones × "+fmt((d.comp||{}).uni_x_cajon)+" uni = <b>"+fmt(tope)+" uni</b>.");
      esperado = tope;
    } else {
      L.push("Máximo = "+fmt(cons,dec)+" "+u+"/mes × "+fmt(meses,1)+" meses = <b>"+fmt(esperado)+" "+u+"</b>.");
    }
    if (o && o!=="est_madre" && o!=="est_madre_x_reparto" && o!=="consumo_meses") L.push("Origen del máximo: "+esc(o)+".");
  }
  var aviso = (esperado!=null && max!=null && Math.round(Number(max))!==Math.round(esperado))
    ? "⚠ El máximo cargado ("+fmt(max,dec)+" "+u+") no coincide con la cuenta de hoy ("+fmt(esperado,dec)+" "+u+")."
    : null;
  return { L:L.map(function(t){ return '<p class="max-linea">'+t+'</p>'; }), aviso:aviso };
}
function htmlMaximo(d){
  var lm = lineaMaximo(d), filas = d.filas || [], base = d.base;
  var html = lm.L.join("") + (lm.aviso ? '<p class="max-aviso">'+esc(lm.aviso)+'</p>' : "");
  if (!base) return html;
  if (!filas.length) return html + '<div class="empty">Sin demanda registrada.</div>';
  var fleje = d.unidad==="kg" && base==="articulos";
  var conKg = !fleje && base==="articulos" && filas.some(function(f){ return f.aporte_kg!=null; });
  // columnas: [encabezado, valor(f), suma?, decimales]
  var C = [];
  if (base==="articulos" || base==="tallerista") C.push(["Venta<br>(uni/mes)", function(f){ return f.venta_uni_mes; }, false, 0]);
  if (base==="tallerista"){
    C.push(["Usa<br>(uni/mes)", function(f){ return f.lleva_uni_mes; }, false, 0]);
    C.push(["%", function(f){ return f.pct; }, false, 1, function(f){ return f.supuesto ? "*" : ""; }]);
    C.push(["Le toca<br>(uni/mes)", function(f){ return f.aporte_uni_mes; }, true, 0]);
  } else if (fleje){
    C.push(["Consume<br>(kg/mes)", function(f){ return f.aporte_kg; }, true, 2]);
  } else {
    C.push(["Consume<br>(uni/mes)", function(f){ return f.aporte_uni_mes; }, true, 0]);
    if (base==="piezas_mb") C.push(["Resina<br>(kg/mes)", function(f){ return f.resina_kg; }, true, 2]);
    if (base==="piezas_mb") C.push(["Master<br>(kg/mes)", function(f){ return f.aporte_kg; }, true, 2]);
    if (base==="piezas" || conKg) C.push([base==="piezas"?"Resina<br>(kg/mes)":"kg/mes", function(f){ return f.aporte_kg; }, true, 2]);
  }
  var tot = C.map(function(){ return 0; });
  var head = '<tr><th>'+(base==="piezas"||base==="piezas_mb"?"Pieza":"Artículo")+'</th>'+
    C.map(function(c){ return '<th class="num">'+c[0]+'</th>'; }).join("")+'</tr>';
  var body = filas.map(function(f){
    return '<tr><td><span class="cod">'+esc(f.cod)+'</span> '+esc(f.desc||"")+'</td>'+
      C.map(function(c,i){
        var v = c[1](f);
        if (c[2] && v!=null) tot[i] += Number(v);
        return '<td class="num">'+(v==null?"—":fmt(v,c[3])+(c[4]?c[4](f):""))+'</td>';
      }).join("")+'</tr>';
  }).join("");
  var foot = '<tr><td>Total ('+filas.length+')</td>'+
    C.map(function(c,i){ return '<td class="num">'+(c[2]?fmt(tot[i],c[3]):"")+'</td>'; }).join("")+'</tr>';
  var nota = filas.some(function(f){ return f.supuesto; })
    ? '<p class="nota-tabla">* reparto supuesto (partes iguales): el % no está cargado en Proporciones.</p>' : "";
  return html + '<div class="table-wrap"><table class="t"><thead>'+head+'</thead><tbody>'+body+
    '</tbody><tfoot>'+foot+'</tfoot></table></div>' + nota;
}

async function saveModal(){

  setBusy(true);
  try{
    var res=await GP2M.registrar(SB, r.rows);
    closeModal();
    toast("✔ "+((res&&res.n)||r.rows.length)+" movimiento(s) registrado(s)");
    await reload();
  }catch(e){ toast("Error: "+((e&&e.message)||e), true); }
  finally{ setBusy(false); }
}

/* ═══ Últimos movimientos ═══ */
var TIPOS={
  compra:{lbl:"Compra"}, fabricacion:{lbl:"Fabricación"}, armado_fabrica:{lbl:"Armado fábrica"},
  consumo_prod:{lbl:"Consumo prod"}, envio_ps:{lbl:"Env prov serv"}, entrega_ps:{lbl:"Entrega prov serv"},
  consumo:{lbl:"Consumo prov serv"}, envio_tallerista:{lbl:"Env tall"}, entrega_tallerista:{lbl:"Entrega tall"},
  consumo_tall:{lbl:"Consumo tall"}, devolucion_tallerista:{lbl:"Devolución tall"}, envio_prov_at:{lbl:"Env prov AT"},
  recepcion_virgilio:{lbl:"Rec Virgilio"}, consumo_virgilio:{lbl:"Consumo Virgilio"},
  envio_inyector:{lbl:"Env inyector"}, consumo_inyector:{lbl:"Consumo inyector"}, traslado:{lbl:"Traslado Virgilio"},
  stock_inicial:{lbl:"Stock inicial"}, ajuste:{lbl:"Ajuste"}
};
function aplicarVocabulario(){
  var v = (D && D.tipos_mov) || null; if(!v) return;
  Object.keys(v).forEach(function(k){ if(v[k]&&v[k].lbl) TIPOS[k]={lbl:v[k].lbl}; });
  if (window.GP2Composicion && GP2Composicion.setVocabulario) GP2Composicion.setVocabulario(v);
}
function cNom(cid){ var c=(D&&D.comp[String(cid)])||null; return c?c.cod:(cid==null?"":String(cid)); }
function uNom(uid){ return uid ? (((D&&D.ubic[String(uid)])||{nom:"?"}).nom) : ""; }
async function renderMovs(){
  var tb=$("tbodyMovs"); if(!tb) return;
  var res=await SB.from("movimiento").select("*").order("id",{ascending:false}).limit(50);
  if(res.error){ tb.innerHTML='<tr><td colspan="8" class="empty">Error: '+esc(res.error.message)+'</td></tr>'; return; }
  var movs=res.data||[], bd=$("movsBadge"); if(bd) bd.textContent=movs.length?("("+movs.length+")"):"";
  if(!movs.length){ tb.innerHTML='<tr><td colspan="8" class="empty">Sin movimientos todavía</td></tr>'; return; }
  tb.innerHTML=movs.map(function(m){
    var ti=TIPOS[m.tipo_mov]||{lbl:m.tipo_mov};
    return '<tr>'+
      '<td>'+fmtFecha(m.fecha)+'</td>'+
      '<td><span class="tag">'+esc(ti.lbl)+'</span></td>'+
      '<td>'+esc(cNom(m.comp_id))+'</td>'+
      '<td>'+(esc(uNom(m.ubic_origen_id))||"—")+'</td>'+
      '<td>'+(esc(uNom(m.ubic_destino_id))||"—")+'</td>'+
      '<td class="num">'+fmt(m.cantidad,2)+' '+esc(m.unidad_origen||"")+'</td>'+
      '<td>'+esc(m.comp_transformado_id?cNom(m.comp_transformado_id):"")+'</td>'+
      '<td class="num">'+(m.cantidad_transformada!=null?fmt(m.cantidad_transformada,2)+" "+esc(m.unidad_destino||""):"")+'</td>'+
    '</tr>';
  }).join("");
}

/* ---------- eventos ---------- */
$("q").addEventListener("input", render);
$("soloStock").addEventListener("change", render);
$("vinsQ").addEventListener("input", renderVins);
$("vinsBody").addEventListener("click", function(e){
  var b = e.target.closest(".vins-ok"); if (b) vinsGuardar(b.closest("tr"));
});
$("vinsBody").addEventListener("keydown", function(e){
  if (e.key==="Enter" && e.target.classList && e.target.classList.contains("vins-in")){ e.preventDefault(); vinsGuardar(e.target.closest("tr")); }
});
$("hintOtros").addEventListener("click", function(e){
  var a=e.target.closest("a[data-k]"); if(a) seleccionar(a.dataset.k);   // la búsqueda del input se conserva
});
$("tbody").addEventListener("click", function(e){
  var rub=e.target.closest("td.rub-cell");
  if(rub){ seleccionar(rub.dataset.rub); return; }
  var mov=e.target.closest("td.mov-cell");
  if(mov){ abrirDetalle(mov.dataset.cid, mov.dataset.col); return; }
  var mx=e.target.closest("td.max-cell");
  if(mx){ abrirMaximo(mx.dataset.cid, mx.dataset.uid); return; }
  var stk=e.target.closest("td.stk-cell");
  if(stk && window.GP2Composicion){
    var f=(CUR.filas||[]).filter(function(x){ return String(x.cid)===String(stk.dataset.cid); })[0]||{};
    window.GP2Composicion.abrir({ SB:SB, comp_id:stk.dataset.cid, ubic_id:stk.dataset.uid,
      cod:f.cod, desc:f.desc, kg_x_uni:f.kg_x_uni, uni_x_cajon:f.uni_x_cajon });
  }
});
$("popClose").addEventListener("click", function(){ $("popup").classList.remove("open"); });
$("popup").addEventListener("click", function(e){ if(e.target===$("popup")) $("popup").classList.remove("open"); });

pintarPlantaTabs();
pintarRubros();
reload();
</script>
