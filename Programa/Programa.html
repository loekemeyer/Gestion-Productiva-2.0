<style>
 /* ============================================================================
    GP2 · Despiece x Artículo ("¿Qué necesito para producir?").

    TEMA (08/10/2026): pasa al TEMA COMÚN de GP2 (fondo claro, gp2-modulo.css).
    Desde el rediseño del 11/09 esta pantalla era OSCURA a propósito, pisada entera
    acá (pedido del usuario: "más grande, sin tantos colores, no tan claro, fondo
    más oscuro, más legible"). El 08/10 el dueño pidió que GP2 sea UN solo producto
    —misma barra, misma letra, mismo fondo en todos los módulos— y esta era la única
    pantalla que parecía de otro programa. Se cambia el FONDO, no lo que resolvió
    aquel pedido, que se conserva tal cual:
      1. CONTRASTE ALTO: nombres y números en tinta (--ink), descripciones en
         --ink-2. Nada de grises lavados (--ink-3/--ink-4 no se usan para datos).
      2. LETRA GRANDE: el nombre del paso a 20px, cantidades y kg a 16px en negrita,
         el código del artículo a 40px. Los campos, 18-20px (regla de la casa).
      3. DOS colores, no once. ÁMBAR = lo nuestro (matriz, fleje, kg, artículo).
         AZUL CELESTE = lo de afuera (proveedor, tallerista). Todo lo demás neutro.
         El tipo de nodo se lee por la ETIQUETA y por la barra lateral, no por
         diez fondos de colores distintos. Sobre fondo claro el ámbar es oscuro
         (texto) y el lleno es suave (fondo), para que se lea igual de bien.
      4. El sector donde queda el stock NO es un nodo suelto: es el pie de la
         tarjeta del paso que lo produce (la cadena mide ~5 nodos, no ~10).
    El selector de artículo y las unidades viven en una barra pegada debajo de la
    barra de la app (antes eran la .top oscura pegada arriba).
    ========================================================================== */
 /* colores de DOMINIO de esta pantalla (los dos únicos): ámbar = nuestro, celeste = de afuera */
 :root{
  --nos:#dc9a00;            /* barra lateral / acento ámbar */
  --nos-ink:var(--warn);    /* texto ámbar sobre blanco (6,5:1) */
  --nos-soft:var(--warn-soft);
  --nos-line:var(--warn-line);
  --ext:#0284c7;            /* barra lateral celeste */
  --ext-ink:#075985;        /* texto celeste sobre blanco (8:1) */
  --ext-soft:#e0f2fe;
  --ext-line:#9fd3f3;
 }

 /* ---- elegir artículo + unidades: pegado debajo de la barra de la app ---- */
 .elegir{position:sticky;top:var(--bar-h);z-index:30;background:var(--bg);
   margin:calc(-1 * var(--s4)) calc(-1 * var(--gutter)) var(--s3);padding:var(--s3) var(--gutter);
   box-shadow:0 1px 0 var(--line)}
 .elegir .field>label{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
 /* #uni: el sistema estira los input[type=text] de una .toolbar; acá va angosto */
 .elegir .f-art{flex:0 1 620px;min-width:0}
 #uni{flex:none;width:130px;min-width:0;text-align:right;font-size:20px;font-weight:750}
 .pick[hidden]{display:none}
 /* ---- selector de articulo en UN PASO: se abre en el buscador con TODOS los articulos
    (usuario 2026-09-23: "no me hagas elegir por marca, que el buscador aparezca en todas
    directamente"). La marca quedo como filtro opcional en chips, arriba del buscador; antes
    era un paso obligatorio previo (2026-09-11). El <select id="art"> sigue existiendo
    OCULTO: es el modelo que lee el resto de la pantalla. ---- */
 .artbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
   min-height:var(--touch);padding:0 12px;background:var(--surface);color:var(--ink);
   border:1px solid var(--field-line);border-radius:var(--r-sm);font-size:var(--fs-lg);font-weight:650;
   text-align:left;cursor:pointer}
 .artbtn:hover{border-color:var(--ink-4)}
 .artbtn:focus-visible{border-color:var(--pri)}
 .artbtn #artBtnTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .artbtn .caret{color:var(--ink-2);font-size:15px;flex-shrink:0}
 .pick{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;z-index:200}
 .pickbox{width:100%;max-width:520px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
 .pickhead{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);font-size:var(--fs-lg)}
 .pickhead b{flex:1;font-weight:750}
 .pickhead .btn{padding:0;width:var(--touch);font-size:19px}
 .marcas{margin:0}
 #pickArts{display:flex;flex-direction:column;min-height:0;padding:14px;gap:10px}
 .picklist{overflow-y:auto;min-height:0}
 .picklist .fam{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);margin:12px 0 5px;font-weight:750}
 .picklist button{display:block;width:100%;text-align:left;background:var(--surface);
   border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink);font-size:var(--fs-lg);font-weight:500;
   padding:10px 13px;min-height:var(--touch);margin-bottom:6px;cursor:pointer}
 .picklist button:hover{border-color:var(--pri);background:var(--surface-2)}
 .picklist button.on{background:var(--sel);border-color:var(--sel);color:#fff;font-weight:700}

 .canvas{overflow-x:auto}

 /* ---- encabezado del artículo + despiece, lado a lado si entran ---- */
 .cabeza{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-start;margin-bottom:var(--s2)}
 .cabeza>.hero{flex:1 1 480px}
 .cabeza>.despiece{flex:0 1 auto}
 .hero{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--nos);
       border-radius:var(--r-md);padding:var(--s3) var(--s5);display:flex;justify-content:space-between;
       align-items:center;gap:var(--s3) var(--s5);flex-wrap:wrap;width:fit-content;max-width:100%}
 .hero .cod{font-size:40px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.01em}
 .hero .fam{font-size:var(--fs-base);color:var(--ink-2);margin-top:5px}
 .hero .kpis{display:flex;flex-wrap:wrap;gap:0;margin:0}
 .hero .kpi{border:0;border-left:1px solid var(--line);border-radius:0;padding:2px 16px;background:none}
 .hero .kpi .v{font-size:24px;margin:0 0 2px}
 .hero .kpi .k{color:var(--ink-2)}
 .hero .kpi.ens .v{font-size:var(--fs-lg);line-height:1.3;color:var(--ext-ink)}

 /* ---- despiece del artículo (qué piezas lleva y cuántas) ---- */
 .despiece{max-width:100%;min-width:0}
 .despiece h3{margin:2px 0 6px;color:var(--ink-2)}
 .despiece .table-wrap{width:fit-content;max-width:100%}
 .despiece table.t{width:auto}
 .despiece table.t td{font-size:var(--fs-base);white-space:nowrap}
 .despiece .cd{font-weight:750;color:var(--ink)}
 .despiece .ds{color:var(--ink-2);white-space:normal;min-width:160px;max-width:340px}
 .despiece .sc{color:var(--ink-2);font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:.04em}
 .despiece .nu{font-weight:750}
 .despiece .tt{font-weight:800;color:var(--nos-ink)}

 /* ---- títulos de bloque ---- */
 .section-title{margin:var(--s5) 0 var(--s2);flex-wrap:nowrap}
 .section-title .n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
   border-radius:50%;background:var(--sel);color:#fff;font-size:15px;font-weight:750;flex-shrink:0}

 /* ---- carril de una ruta. width:fit-content = sin espacio muerto a la derecha.
        Sin max-width: si la ruta es más larga que la pantalla, el carril mide lo que
        necesita y ajustarFilas() lo escala para que entre entero. ---- */
 .lane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;
       margin-bottom:var(--s2);width:fit-content;box-shadow:var(--sh-1)}
 .lane.conv{border-color:var(--line-2)}
 .lane .head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:10px;
             font-size:var(--fs-base);color:var(--ink-2);flex-wrap:wrap}
 .lane .head b{color:var(--ink);font-size:17px;font-weight:750}
 .lane .head .fkg,.lane .head .uni{padding:3px 13px;border-radius:var(--r-pill);font-weight:750;font-size:var(--fs-base);white-space:nowrap}
 .lane .head .fkg{background:var(--nos-soft);color:var(--nos-ink);border:1px solid var(--nos-line)}
 .lane .head .uni{background:var(--surface-3);color:var(--ink);border:1px solid var(--line-2)}
 .lane .head .sinrend{color:var(--ink-2);font-size:var(--fs-sm)}

 /* ---- la cadena ----
    UNA RUTA = UNA FILA [usuario 2026-09-11: "quiero que una misma ruta entre en una sola
    fila, que no se mande por abajo, para terminarla"]. Nada de wrap y nada de scroll
    lateral (que escondía el final de la ruta): el carril que no entra se ACHICA solo
    hasta que entra — lo hace ajustarFilas() en JS, con piso para que no se vuelva
    ilegible. En celular la cadena sigue bajando en vertical. */
 .flow{display:flex;gap:8px;align-items:stretch;flex-wrap:nowrap;padding-bottom:2px}
 .flow.branch{margin-bottom:4px}
 .branch-lbl{font-size:15px;font-weight:650;color:var(--ink-2);margin:12px 0 5px}
 .branch-lbl .r{color:var(--nos-ink);font-weight:800}
 .converge-bar{display:flex;align-items:center;gap:12px;margin:14px 0 10px;color:var(--nos-ink);font-size:13px;
               font-weight:800;text-transform:uppercase;letter-spacing:.1em}
 .converge-bar .line{flex:1;height:1px;background:var(--line-2)}

 /* ---- tarjeta de paso ---- */
 /* Angosta a propósito: cuanto más angosta la tarjeta, menos hay que achicar el carril
    para que la ruta entre en una fila — y la letra queda más grande, no más chica. */
 .node{background:var(--surface);border:1px solid var(--line-2);border-left:4px solid var(--line-2);
       border-radius:var(--r-sm);padding:9px 11px;min-width:150px;max-width:225px;display:flex;flex-direction:column;
       gap:2px;flex-shrink:0}
 .node .tp{font-size:var(--fs-xs);font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
           line-height:1.25}
 .node .nm{font-size:20px;font-weight:750;color:var(--ink);line-height:1.15;letter-spacing:-.01em;
           word-break:break-word;margin-top:1px}
 /* 2+ talleristas en el mismo paso: uno por renglón, el nombre y su % sin cortarse */
 .node.multi{max-width:none}
 .node .nm .tl{display:block;white-space:nowrap}
 .node .ex{font-size:14.5px;color:var(--ink-2);line-height:1.3;margin-top:1px;
           display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
 .node .rend{font-size:14px;color:var(--nos-ink);font-weight:700;margin-top:2px}
 .node .foot{margin-top:auto;padding-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
 .node .dest{width:100%;font-size:13.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);
             border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:4px 9px;line-height:1.3}
 .node .dest .sc{color:var(--ink);font-weight:800}
 .node .qty,.node .kg{font-size:var(--fs-base);font-weight:800;border-radius:var(--r-sm);padding:2px 10px;white-space:nowrap}
 .node .qty{color:var(--ink);background:var(--surface-3)}
 .node .kg{color:var(--nos-ink);background:var(--nos-soft)}

 /* ---- SOLO DOS COLORES: ámbar = lo nuestro, celeste = lo de afuera ---- */
 .n-matriz,.n-afil,.n-fleje{border-left-color:var(--nos)}
 .n-matriz .tp,.n-afil .tp,.n-fleje .tp{color:var(--nos-ink)}
 .n-prov,.n-tall{border-left-color:var(--ext)}
 .n-prov .tp,.n-tall .tp{color:var(--ext-ink)}
 .n-virg{background:var(--nos-soft);border-color:var(--nos-line);border-left-color:var(--nos)}
 .n-virg .tp{color:var(--nos-ink)}

 .arr{color:var(--ink-2);font-size:22px;align-self:center;user-select:none;flex-shrink:0;padding:0 1px}
 .arr.plus{color:var(--nos-ink);font-size:20px;font-weight:800}

 /* ---- celular: la cadena baja en vertical y cada tarjeta ocupa el ancho ---- */
 @media(max-width:560px){
  .elegir{flex-wrap:nowrap}
  .elegir .f-art{flex:1 1 auto}
  #uni{width:96px}
  .hero{width:100%;padding:var(--s3)}
  .hero .cod{font-size:34px}
  .hero .kpis{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:var(--s2) var(--s4)}
  .hero .kpi{border:0;padding:0}
  .hero .kpi.ens{grid-column:1 / -1}
  .lane{width:auto;padding:12px}
  .flow{flex-direction:column;align-items:stretch;gap:6px}
  .node{min-width:0;max-width:none}
  .arr{align-self:center;transform:rotate(90deg);font-size:24px;padding:0}
  .arr.plus{transform:none}
 }

<body>
<div class="card">
 <div class="header">
  <h1>Despiece x Artículo<small>¿Qué necesito para producir?</small></h1>
  <div class="hbtns"><a href="../GP2_MODULOS.html">Atrás</a></div>
 </div>
 <div class="steps">
  <div class="toolbar elegir">
   <div class="field f-art"><label for="artBtn">Artículo</label><button type="button" id="artBtn" class="artbtn"><span id="artBtnTxt">—</span><span class="caret">▾</span></button></div>
   <select id="marca" hidden><option value="">Todas</option><option value="LOEKE">Loeke</option><option value="LOKE">Loke</option><option value="CHEF">Chef</option></select>
   <select id="art" hidden></select>
   <div class="field"><label for="uni">Unidades</label><input inputmode="numeric" id="uni" type="text" value="1"></div>
  </div>
  <div class="canvas" id="canvas"></div>
 </div>
</div>

<div id="pick" class="pick modal-bg" hidden>
 <div class="pickbox modal">
  <div class="pickhead">
   <b id="pickTit">Elegí el artículo</b>
   <button type="button" id="pickX" class="btn btn-secondary" aria-label="Cerrar">✕</button>
  </div>
  <div id="pickArts">
   <input id="buscar" type="search" placeholder="código o nombre" autocomplete="off">
   <div id="pickMarcas" class="marcas chips">
    <button type="button" data-mk="" class="chip on">Todas</button>
    <button type="button" data-mk="LOEKE" class="chip">Loeke</button>
    <button type="button" data-mk="LOKE" class="chip">Loke</button>
    <button type="button" data-mk="CHEF" class="chip">Chef</button>
   </div>
   <div id="pickList" class="picklist"></div>
  </div>
 </div>
</div>

<script>var D={};

var SB=GP2_SB();
function __run(){
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function sName(sid){var s=D.sect[String(sid)];return s?s.t:"?"}
var SECT2CLS={"crudo":"crudo","procesado":"proc","movimiento":"tr","afilado":"afil","fleje":"fleje","plástico":"insu","bombilla":"insu","remache":"insu","garage":"sub","cartón":"insu","caja":"insu","terminado":"virg"};
function sCls(sid){return SECT2CLS[sName(sid)]||"crudo"}
function cById(cid){return D.comp[String(cid)]||{cod:"?",d:"",s:null}}
function fmt(n){if(n==null||isNaN(n))return "?";n=Number(n);return GP2N.fmt(n, n>=100?0:n>=10?1:n>=1?2:3, null, true);}   /* la regla de numero de la casa; decimales segun magnitud */
/* el rendimiento de la matriz se imprimia crudo ("27.95 uni/kg", punto de JS): dos decimales
   con la regla de la casa y sin ceros de relleno, o sea "27,95" y "28". (idea 7291) */
function unikg(r){return GP2N.fmt(r, 2)+" uni/kg";}

// Defensive: ordenar rp por 'orden' aunque en Excel esté fuera de orden físico
for(var _rid in D.rp)D.rp[_rid].sort(function(a,b){return a.o-b.o;});

/* DOS O MÁS TALLERISTAS EN EL MISMO PASO [Nazareno 2026-10-08: "todos los artículos que tienen 2
   talleristas (modelado en Proporciones) quiero que me aparezca en el módulo de Despiece x Art"].
   La convención de la casa DUPLICA la ruta por tallerista: misma cadena, distinto tallerista en el
   paso. Hasta ese día un selector elegía uno y dibujaba sólo sus rutas: el 506 decía "Alex Escalante
   ensambla" y Martin Cornejo, que hace la mitad, no aparecía en ningún lado. Ahora las copias se
   juntan en UNA (la de id más bajo: los kg de fleje se siguen sumando una sola vez) y cada paso de
   tallerista lleva en p.tas a TODOS los que lo hacen y en p.rep su % (D.reparto = v_reparto_efectivo,
   lo mismo que muestra Proporciones). Una ruta que tiene un solo tallerista queda igual que antes. */
var RUTAS_ART={};
function rutasDeArt(aid){
 var k=String(aid);
 if(RUTAS_ART[k])return RUTAS_ART[k];
 var rep=(D.reparto||{})[k]||{}, grupos={}, orden=[];
 (D.rutas_by_art[k]||[]).forEach(function(r){
  var pasos=D.rp[String(r.id)]||[];
  // la firma ignora QUIÉN es el tallerista: dos rutas iguales salvo eso son la misma ruta
  var firma=pasos.map(function(p){return [p.tp,p.m||"",p.pr||"",p.pat||"",p.ce||"",p.cs||""].join(":");}).join(">");
  if(!grupos[firma]){grupos[firma]={r:r,copias:[],tas:{}};orden.push(firma);}
  grupos[firma].copias.push(pasos);
  pasos.forEach(function(p,i){
   if(p.tp!=="tallerista"||!p.ta)return;
   var l=grupos[firma].tas[i]=grupos[firma].tas[i]||[];
   if(l.indexOf(p.ta)<0)l.push(p.ta);
  });
 });
 orden.forEach(function(f){
  var g=grupos[f];
  Object.keys(g.tas).forEach(function(i){
   var ids=g.tas[i].slice().sort(function(x,y){return String(D.tall[String(x)]||"").localeCompare(String(D.tall[String(y)]||""),"es");});
   // todas las copias llevan la lista: una convergencia puede tomar cualquiera de ellas
   g.copias.forEach(function(pasos){var p=pasos[i];p.tas=ids;p.rep=ids.length>1?(rep[String(p.cs)]||null):null;});
  });
 });
 return (RUTAS_ART[k]=orden.map(function(f){return grupos[f].r;}));
}
/* "50%" con la regla de número de la casa; "(sin dictar)" cuando el % es el reparto parejo por
   default y nadie lo cargó en Proporciones (un default no se muestra como si fuera un dato, 4dw). */
function pctTxt(r){return r?(GP2N.fmt(r.p,1)+"%"+(r.s?" (sin dictar)":"")):"";}
/* Quién hace un paso de tallerista: un nombre, o uno por renglón con su % si son 2+. */
function tallNombres(p){
 var ids=p.tas||(p.ta?[p.ta]:[]);
 if(!ids.length)return "(sin asignar)";
 var l=ids.map(function(id){
  var n=String(D.tall[String(id)]||"?").trim(), r=p.rep&&p.rep[String(id)];
  return r?n+" "+pctTxt(r):n;
 });
 return l.length>1?l:l[0];
}
var sel=document.getElementById("art");
var selMarca=document.getElementById("marca");
var inpBuscar=document.getElementById("buscar");
var artBtn=document.getElementById("artBtn"),pick=document.getElementById("pick"),
    pickMarcas=document.getElementById("pickMarcas"),pickArts=document.getElementById("pickArts"),
    pickList=document.getElementById("pickList"),pickTit=document.getElementById("pickTit");
/* el articulo realmente elegido: solo cambia al tocar una fila, nunca al filtrar */
var elegido=null;
/* busca por codigo o por descripcion, sin acentos ni mayusculas */
function norm(t){return (t||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
/* El combo se arma por FAMILIA (optgroup) y cada opcion muestra la descripcion del articulo,
   no la familia repetida. La familia y la descripcion salen de GP2.articulo (catalogo mayorista,
   2026-09-10). El filtro de marca deja LOEKE / CHEF / todas. */
function llenarArticulos(){
 var mk=selMarca.value, prev=sel.value, q=norm(inpBuscar.value).trim();
 var arts=D.art.filter(function(a){
     /* 2026-09-23 [usuario: "lo discontinuado no quiero seguir viendolo en el programa"]:
        un articulo discontinuado no se ofrece. programa_bundle sigue mandandolos TODOS con
        el flag disc -- el bundle no cambia, el que decide que se ve es esta pantalla. */
     if(a.disc)return false;
     if(mk&&a.mk!==mk)return false;
     if(!q)return true;
     return norm(a.cod).indexOf(q)>=0||norm(a.d).indexOf(q)>=0||norm(a.fam).indexOf(q)>=0;
   })
   .sort(function(a,b){
     var fa=a.fam||"zzz", fb=b.fam||"zzz";
     if(fa!==fb)return fa.localeCompare(fb,"es");
     return (parseInt(a.cod)||9999)-(parseInt(b.cod)||9999);
   });
 sel.innerHTML="";

function expandBOM(aid){
 var need={};
 var bom=D.bom.filter(function(b){return b.a===aid;});
 // vis por rama: corta ciclos en componente_bom (padre->hijo->padre) sin romper diamantes (mismo patron que Faltantes)
 function add(cid,q,vis){if(vis[cid])return;var v=Object.assign({},vis);v[cid]=1;need[cid]=(need[cid]||0)+q;var subs=D.children[String(cid)]||[];subs.forEach(function(s){add(s.c,q*s.q,v);});}
 bom.forEach(function(b){add(b.c,b.q,{});});
 return {need:need,bom:bom};
}

/* Una tarjeta de paso. 'dest' es el pie: dónde queda lo que sale de este paso
   (sector de stock o tránsito). Antes era un nodo aparte y duplicaba el largo
   de la cadena; ahora vive adentro de la tarjeta que lo produce. */
function node(tp,cls,nm,ex,extra,qty,kg,dest){
 var h='<div class="node n-'+cls+(Array.isArray(nm)?' multi':'')+'">';
 h+='<div class="tp">'+esc(tp)+'</div>';
 /* nm puede ser una lista (2+ talleristas en el mismo paso): uno por renglón */
 h+='<div class="nm">'+(Array.isArray(nm)?nm.map(function(x){return '<span class="tl">'+esc(x)+'</span>';}).join(''):esc(nm))+'</div>';
 if(ex)h+='<div class="ex">'+esc(ex)+'</div>';
 if(extra)h+='<div class="rend">'+esc(extra)+'</div>';
 if(dest||qty!=null||kg!=null){
  h+='<div class="foot">';
  if(dest)h+=dest;
  if(qty!=null)h+='<div class="qty">× '+fmt(qty)+'</div>';
  if(kg!=null)h+='<div class="kg">'+fmt(kg)+' kg</div>';
  h+='</div>';
 }
 h+='</div>';
 return h;
}
/* PROVEEDOR = primer paso de la ruta [usuario 2026-09-30: "quiero que me aparezca como primer
   paso de las rutas el proveedor, ej. Basconia provee el fleje ID6"]. Sale de GP2.componente.proveedor
   (+ componente_proveedor_alt), que programa_bundle manda como comp.pv / comp.pva. Es lo de afuera:
   celeste, como el prov. de servicio. Sin proveedor cargado no se dibuja nada -- no se inventa. */
function provNode(comp){
 if(!comp||!comp.pv)return "";
 var alt=comp.pva||[];
 return node("PROVEEDOR","prov",comp.pv,alt.length?("o "+alt.join(" o ")):"","",null,null,"")+
        '<span class="arr">→</span>';
}
/* pie "queda en el sector X" */
function destSector(sec,cod,desc){
 var t='📦 <span class="sc">'+esc(sec.toUpperCase())+'</span>';
 if(cod)t+=' · stock '+esc(cod);
 if(desc)t+=' · '+esc(desc);
 return '<div class="dest">'+t+'</div>';
}

/* ---- Stock Tránsito PS -------------------------------------------------------------
   Una pieza que sale de un proveedor de servicio y se va DERECHO a otro no vuelve a
   ningún sector: espera "en tránsito" hasta que se manda al siguiente. Dibujar ahí un
   "stock Sector X" es mentira — ese stock no existe.
   La regla es LA MISMA que usa stock_transito_ps_bundle (módulo Stock Tránsito PS):
   dos pasos proveedor_servicio consecutivos donde el segundo consume lo que salió del
   primero. No se inventa nada acá.                                                     */
function esTransitoPS(p,pNext){
 return !!(p && pNext && p.tp==='proveedor_servicio' && pNext.tp==='proveedor_servicio'
           && p.cs && pNext.ce===p.cs);
}
// El proceso que espera, en infinitivo, para leerlo como el resto de las descripciones
// ("Resorte U p/Templar" que ya se templó y espera niquelado → "Resorte U p/Niquelar").
var PROC_INF={"Niquelado":"Niquelar","Cromado":"Cromar","Zincado":"Zincar","Pintado":"Pintar",
 "Serigrafiado":"Serigrafiar","Pavonado":"Pavonar","Rectificado":"Rectificar","Calado":"Calar",
 "Adhesivado":"Adhesivar","Blisteado":"Blistear","blisteado":"Blistear","Armado Mango":"Armar Mango",
 "Templado, Cementado":"Templar"};
function procInf(proc){
 proc=String(proc||"").trim();
 if(!proc)return "";
 if(PROC_INF[proc])return PROC_INF[proc];
 return /ado$/.test(proc)?proc.replace(/ado$/,"ar"):proc;   // niquelado → niquelar
}
// "Resorte U p/Templar" → "Resorte U": el estado viejo ya no aplica, la pieza espera otra cosa
function descSinDestino(d){ return String(d||"").replace(/\s*p\/\s*.*$/i,"").trim(); }
/* pie "no vuelve a ningún sector: queda en tránsito esperando al PS siguiente" */
function destTransito(comp,pNext){
 var px=D.prov[String(pNext.pr)]||{};
 var inf=procInf(px.p);
 var base=descSinDestino(comp.d);
 var ex=(comp.cod||"?")+(base?(" · "+base):"")+(inf?(" p/"+inf):"");
 return '<div class="dest">🚚 <span class="sc">TRÁNSITO</span> · '+esc(ex)+' → '+esc(px.n||"?")+'</div>';
}
/* el pie que corresponde al paso p (tránsito, sector, o nada) */
function destDePaso(p,pNext){
 if(!p.cs)return "";
 var cs=cById(p.cs), sn=sName(cs.s);
 if(esTransitoPS(p,pNext))return destTransito(cs,pNext);
 if(sn && sn!=='terminado' && sn!=='fleje' && sn!=='?')return destSector(sn,cs.cod,"");
 return "";
}

function pasoNode(p,need,uni,pNext){
 var tp="",cls="",nm="",ex="",extra="";
 var ce=cById(p.ce), cs=cById(p.cs);
 if(p.tp==="matriz"){var mx=D.mat[String(p.m)]||{};tp="MATRIZ N°"+mx.n;cls="matriz";nm=(mx.d||cs.cod||"?");ex=(cs.cod||"")+((cs.d&&cs.d!==mx.d)?(" · "+cs.d):"");if(mx.r)extra="⚙️ "+unikg(mx.r);}
 else if(p.tp==="proveedor_servicio"){var px=D.prov[String(p.pr)]||{};tp="PROV "+(px.n||"?");cls="prov";nm=cs.cod||ce.cod||"?";ex=(px.p||"")+(cs.cod?(" · "+cs.cod):"");}
 else if(p.tp==="tallerista"){tp="TALLERISTA";cls="tall";nm=tallNombres(p);ex=(ce.cod||"")+" → "+(cs.cod||"?");}
 else if(p.tp==="afilado"){tp="AFILADO";cls="afil";nm="Afilar";ex=(ce.cod||"")+" → "+(cs.cod||"?");}
 else if(p.tp==="proveedor_at"){var pa=D.provat?D.provat[String(p.pat)]:null;tp="PROV. ART. TERM.";cls="prov";nm=(pa||"(sin prov)").trim();ex="entrega terminado";}
 else if(p.tp==="virgilio"){tp="VIRGILIO";cls="virg";nm="Distribución";ex="centro";}
 else return "";
 // El sector/tránsito y la cantidad van DENTRO de la tarjeta del paso (fallback 1:1 con uni)
 var dest="", qty=null;
 if(p.cs && p.tp!=='virgilio' && p.tp!=='tallerista'){
  dest=destDePaso(p,pNext);
  qty=(need[p.cs]?need[p.cs]*uni:uni);
 }
 return node(tp,cls,nm,ex,extra,qty,null,dest);
}

function renderStandaloneLane(r,pasos,fl,need,uni,flejesTotal){
 var qty=0, cs_final=null;
 for(var i=pasos.length-1;i>=0;i--){var p=pasos[i];if(p.cs && need[p.cs]){cs_final=p.cs;qty=need[p.cs]*uni;break;}}
 if(!cs_final){for(var i=pasos.length-1;i>=0;i--){if(pasos[i].cs){cs_final=pasos[i].cs;break;}}}
 var mat0=null;
 for(var i=0;i<pasos.length;i++){if(pasos[i].tp==="matriz"){mat0=D.mat[String(pasos[i].m)];break;}}
 var rend=mat0?mat0.r:null;
 var kg=(rend && qty)?qty/rend:0;
 if(kg){flejesTotal[r.f]=(flejesTotal[r.f]||0)+kg;}
 // fleje ahora es un componente que ingresa (ce del primer paso ingreso)
 var flComp=null;
 for(var i=0;i<pasos.length;i++){if(pasos[i].tp==="ingreso" && pasos[i].ce){flComp=cById(pasos[i].ce);break;}}
 if(!flComp)flComp=cById(r.f);
 var cs_desc = cs_final ? (" → "+cById(cs_final).cod+" ("+(cById(cs_final).d||"")+")") : "";
 var H='<div class="lane"><div class="head"><b>'+esc((flComp.cod||"?")+' · '+(flComp.d||"")+cs_desc)+'</b>'+
    (kg?'<span class="fkg">'+fmt(kg)+' kg fleje</span>':(qty?'<span class="sinrend">sin rendimiento</span>':""))+
    '</div><div class="flow">';
 H+=provNode(flComp)+node("INSUMO","fleje",flComp.cod||"?",flComp.d||"",rend?unikg(rend):"",null,kg||null,"");
 pasos.forEach(function(p,i,arr){
  if((p.tp==="fleje"||p.tp==="ingreso"))return;
  H+='<span class="arr">→</span>'+pasoNode(p,need,uni,arr[i+1]);
 });
 H+='</div></div>';
 return H;
}

function renderConvergenceLane(padre_id,ruta_list,need,uni,flejesTotal,aid,insumoEnConv,rutaDibujada){
 var pc=cById(padre_id);
 var hijos=D.children[String(padre_id)]||[];
 // Identificar paso de convergencia (matriz o tallerista que arma padre) desde primera ruta que lo tenga
 var convPaso=null, postPasos=null;
 ruta_list.forEach(function(r){
  if(convPaso)return;
  var pasos=D.rp[String(r.id)]||[];
  for(var i=0;i<pasos.length;i++){
   if(pasos[i].cs===padre_id){convPaso=pasos[i];postPasos=pasos.slice(i+1);break;}
  }
 });

 var qty_padre=need[padre_id]?need[padre_id]*uni:0;
 if(!qty_padre && postPasos){
  for(var pi=0;pi<postPasos.length;pi++){
   var pc2=postPasos[pi].cs;
   if(pc2 && need[pc2]){qty_padre=need[pc2]*uni;break;}
  }
 }
 // El sub-conjunto no esta en la receta (la receta trae sus partes sueltas, 94xE): cuantos
 // salen lo dice la parte mas escasa segun su BOM.
 if(!qty_padre && hijos.length){
  var _mn=null;
  hijos.forEach(function(h){var q=(need[h.c]||0)/(h.q||1);if(_mn===null||q<_mn)_mn=q;});
  if(_mn)qty_padre=_mn*uni;
 }
 var H='<div class="lane conv"><div class="head"><b>🔀 Convergencia · '+esc(pc.cod+' · '+(pc.d||""))+'</b>'+
    '<span class="uni">× '+fmt(qty_padre)+' u</span></div>';

 // Loop puro por hijos del componente_bom
 var brN=0;
 var usedRutas={};
 hijos.forEach(function(h){
  brN++;
  var hc=cById(h.c);
  var qty_hijo=qty_padre*(h.q||1);
  // Buscar ruta del articulo cuyo cs sea este hijo. Las de fleje primero; las de insumo
  // (f null, ej. CV3 -> niquelado -> V3 que entra a la Matriz 135) son el fallback, si no
  // la rama se dibujaba como un insumo pelado y se perdia el paso del proveedor.
  var rutas_art=(D.rutas_by_art[String(aid)]||[]).filter(function(x){return !usedRutas[x.id];})
    .sort(function(x,y){return (y.f?1:0)-(x.f?1:0);});
  var matchRuta=null, matchIdx=-1;
  for(var ri=0;ri<rutas_art.length;ri++){
   var rr=rutas_art[ri]; var pps=D.rp[String(rr.id)]||[];
   // buscar ÚLTIMO cs=h.c (incluye pasos intermedios que "pasan" el componente)
   var lastMatch=-1;
   for(var pi=0;pi<pps.length;pi++){if(pps[pi].cs===h.c)lastMatch=pi;}
   if(lastMatch>=0){matchRuta=rr;matchIdx=lastMatch;break;}
  }
  if(matchRuta){
   usedRutas[matchRuta.id]=1;
   // La ruta ya se dibuja como rama: no repetirla como ruta simple en el bloque 1 (570: F2 de la ruta 96)
   if(rutaDibujada)rutaDibujada[matchRuta.id]=1;
   // La ruta de insumo ya se dibuja aca: no repetirla abajo en el bloque 4
   if(!matchRuta.f && insumoEnConv)insumoEnConv[matchRuta.id]=1;
   var pps=D.rp[String(matchRuta.id)]||[];
   var prePasos=pps.slice(0,matchIdx+1);
   var flComp2=null;
   // De donde arranca la rama: el fleje del paso 'ingreso' o, en una ruta de insumo, la pieza
   // del paso 'insumo' (sin esto la rama salia con el nodo vacio, "? produce BOM10")
   for(var i=0;i<prePasos.length;i++){if((prePasos[i].tp==="ingreso"||prePasos[i].tp==="insumo") && prePasos[i].ce){flComp2=cById(prePasos[i].ce);break;}}
   if(!flComp2)flComp2=cById(matchRuta.f);
   var mat0=null;
   for(var i=0;i<prePasos.length;i++){if(prePasos[i].tp==="matriz"){mat0=D.mat[String(prePasos[i].m)];break;}}
   var rend=mat0?mat0.r:null;
   var kg=(rend && qty_hijo)?qty_hijo/rend:0;
   if(kg){flejesTotal[matchRuta.f]=(flejesTotal[matchRuta.f]||0)+kg;}
   var mergedNeed=Object.assign({},need);mergedNeed[h.c]=qty_hijo/uni;
   // 'ingreso' e 'insumo' son marcas de entrada, no pasos productivos
   var pasosNoFleje=prePasos.filter(function(p){return p.tp!=='fleje'&&p.tp!=='ingreso'&&p.tp!=='insumo';});
   // Si el "productor" es el mismo componente y no hay pasos productivos, solo mostrar el insumo (evita duplicado)
   if(pasosNoFleje.length===0 && flComp2.cod===hc.cod){
    H+='<div class="branch-lbl"><span class="r">Rama '+brN+'</span> — Insumo '+esc(hc.cod||'?')+' · × '+fmt(qty_hijo)+' u</div>';
    H+='<div class="flow branch">';
    H+=provNode(hc)+node("INSUMO",sCls(hc.s),hc.cod||"?",hc.d||"","",qty_hijo,null,"");
    H+='</div>';
   } else {
    H+='<div class="branch-lbl"><span class="r">Rama '+brN+'</span> — '+esc((flComp2.cod||"?")+' produce '+hc.cod)+(kg?' · '+fmt(kg)+' kg fleje':'')+'</div>';
    H+='<div class="flow branch">';
    H+=provNode(flComp2)+node("INSUMO",matchRuta.f?"fleje":sCls(flComp2.s),flComp2.cod||"?",flComp2.d||"",rend?unikg(rend):"",matchRuta.f?null:qty_hijo,kg||null,"");
    pasosNoFleje.forEach(function(p,i,arr){
     H+='<span class="arr">→</span>'+pasoNode(p,mergedNeed,uni,arr[i+1]);
    });
    if(pasosNoFleje.length===0){
     var _sn=sName(hc.s);
     var _dest=(_sn && _sn!=='terminado' && _sn!=='fleje' && _sn!=='?')?destSector(_sn,hc.cod,""):"";
     H+='<span class="arr">→</span>'+node("COMPONENTE",sCls(hc.s),hc.cod,hc.d||"","",qty_hijo,null,_dest);
    }
    H+='</div>';
   }
   return;
  }
  // Fallback: insumo
  var sn=sName(hc.s);
  var destIns=(sn && sn!=='terminado' && sn!=='fleje' && sn!=='?')?destSector(sn,hc.cod,""):"";
  H+='<div class="branch-lbl"><span class="r">Rama '+brN+'</span> — Insumo '+esc((hc.cod||'?')+' ('+sn+')')+' · × '+fmt(qty_hijo)+' u</div>';
  H+='<div class="flow branch">';
  H+=provNode(hc)+node("INSUMO",sCls(hc.s),hc.cod||"?",hc.d||"","",qty_hijo,null,destIns);
  H+='</div>';
 });
 // barra de convergencia
 H+='<div class="converge-bar"><span class="line"></span>↓ Convergencia ↓<span class="line"></span></div>';
 // paso conv + post
 H+='<div class="flow">';
 // convergencia node muestra padre como resultado
 var mx=D.mat[String(convPaso.m)]||{};
 var extra=mx.r?"⚙️ "+unikg(mx.r):"";
 var convTp,convCls,convNm,convEx;
 if(convPaso.tp==="matriz"){convTp="MATRIZ N°"+mx.n;convCls="matriz";convNm=pc.cod;convEx=pc.d||"";}
 else if(convPaso.tp==="tallerista"){convTp="TALLERISTA";convCls="tall";convNm=tallNombres(convPaso);convEx=pc.cod+" · "+(pc.d||"");}
 else if(convPaso.tp==="proveedor_servicio"){var _px=D.prov[String(convPaso.pr)]||{};convTp="PROV "+(_px.n||"?");convCls="prov";convNm=pc.cod;convEx=(_px.p||"")+" · "+(pc.d||"");}
 else {convTp=convPaso.tp.toUpperCase();convCls="prov";convNm=pc.cod;convEx=pc.d||"";}
 var _snConv=sName(pc.s), _post=postPasos||[];
 var destConv="";
 if(esTransitoPS(convPaso,_post[0]))destConv=destTransito(pc,_post[0]);
 else if(_snConv && _snConv!=='terminado' && _snConv!=='fleje' && _snConv!=='?')destConv=destSector(_snConv,pc.cod,"");
 H+=node(convTp,convCls,convNm,convEx,extra,qty_padre,null,destConv);
 _post.forEach(function(p,i,arr){
  H+='<span class="arr">→</span>'+pasoNode(p,need,uni,arr[i+1]);
 });
 H+='</div></div>';
 return H;
}

function render(){
 var aid=GP2N.entero(sel.value);
 var uni=Math.max(1,GP2N.num(document.getElementById("uni").value)||1);
 var a=D.art.find(function(x){return x.id===aid;});
 if(!a){document.getElementById("canvas").innerHTML='<div class="empty">Artículo no encontrado</div>';return;}
 var ex=expandBOM(aid);
 var need=ex.need, bom=ex.bom;
 var rutas=rutasDeArt(aid);   // las copias de una ruta por tallerista ya vienen juntas
 /* QUIÉN ENSAMBLA: los talleristas del paso que deja el artículo TERMINADO, TODOS, cada uno con
    su % (2026-10-08). Antes salía de tall_art y, con 2+, un selector se quedaba con uno solo. */
 var ensam=[], vistos={};
 rutas.forEach(function(r){
  (D.rp[String(r.id)]||[]).forEach(function(p){
   if(p.tp!=='tallerista'||!p.cs||sName(cById(p.cs).s)!=='terminado')return;
   (p.tas||(p.ta?[p.ta]:[])).forEach(function(id){
    if(vistos[id])return;vistos[id]=1;
    ensam.push({n:String(D.tall[String(id)]||'?').trim(),r:(p.rep&&p.rep[String(id)])||null});
   });
  });
 });
 if(!ensam.length)(D.tall_art[String(aid)]||[]).forEach(function(n){ensam.push({n:String(n).trim(),r:null});});
 /* EL PROV. DE ARTÍCULO TERMINADO REEMPLAZA AL TALLERISTA [usuario 2026-09-11, textual].
    Un artículo comprado terminado no lo ensambla nadie acá: de casa sale el cartón y la
    caja, y el proveedor entrega el artículo hecho en Virgilio. Antes, como tall_art no
    traía ningún tallerista, la pantalla dibujaba "TALLERISTA (sin asignar) — tabla
    incompleta": mentira, y encima escondía quién entrega. Son 39 de 189 artículos
    (761 Cucharita Matera, que lo entrega Melinox, es el que lo destapó). */
 var provAT=[];
 rutas.forEach(function(r){
  (D.rp[String(r.id)]||[]).forEach(function(p){
   if(p.tp!=='proveedor_at'||!p.pat)return;
   var n=String((D.provat&&D.provat[String(p.pat)])||'').trim();
   if(n&&provAT.indexOf(n)<0)provAT.push(n);
  });
 });
 /* La convergencia final puede ser una MATRIZ (de envasado): lo que antes armaba el
    tallerista "Fábrica" ahora lo cierra una matriz. Es la matriz cuyo comp_salida es el
    terminado del artículo. Si no hay tallerista ni prov AT, el paso 5 muestra esta matriz. */
 var matrizFinal=null;
 rutas.forEach(function(r){
  (D.rp[String(r.id)]||[]).forEach(function(p){
   if(p.tp!=='matriz'||!p.cs||!p.m)return;
   var csc=cById(p.cs);
   if(csc&&sName(csc.s)==='terminado')matrizFinal=D.mat[String(p.m)]||matrizFinal;
  });
 });
 var rutas_prod=rutas.filter(function(r){return r.f;});
 var rutas_ins=rutas.filter(function(r){return !r.f;});
 var flejesTotal={};
 var insumoEnConv={}; // ruta de insumo consumida dentro de una convergencia → no repetir en el bloque 4

 // Agrupar por convergencia: {padre_sub_id: [ruta,...]}
 var convergences={}; // padre_id → [rutaObj]
 var rutas_en_conv={}; // ruta.id → padre_id
 rutas_prod.forEach(function(r){
  var pasos=D.rp[String(r.id)]||[];
  for(var i=0;i<pasos.length;i++){
   var cs=pasos[i].cs;
   if(cs && D.children[String(cs)]){
    convergences[cs]=convergences[cs]||[];
    convergences[cs].push(r);
    rutas_en_conv[r.id]=cs;
    break; // primera convergencia por ruta
   }
  }
 });
 /* Convergencia armada SOLO con piezas compradas (94xE, 2026-10-01): PEST1 + pieza inox +
    mango importados entran a la matriz 505x. Ninguna de esas rutas arranca en un fleje, asi
    que el bucle de arriba no las veia. Se suman las rutas de insumo cuando el paso que arma
    el sub-conjunto es una MATRIZ o un TALLERISTA [Nazareno 2026-10-08: "Ese subconjunto no
    tendria que aparecer asi. En las dos rutas de BOM8 y BOM12 hace la convergencia"]: BOM12 +
    BOM8 -> Martin Cornejo arma GRJ6 (557/762) o GRJ5 (558/763) -> Blist-Pack -> Virgilio. Hasta
    ese dia GRJ5/GRJ6 salian partidos en "sub-conjunto sin ruta" + dos insumos sueltos que
    repetian a Martin y Blist-Pack. Las ramas se dibujan adentro y no se repiten en el bloque 4
    (insumoEnConv). */
 rutas_ins.forEach(function(r){
  var pasos=D.rp[String(r.id)]||[];
  for(var i=0;i<pasos.length;i++){
   var cs=pasos[i].cs;
   if(cs && (pasos[i].tp==='matriz'||pasos[i].tp==='tallerista') && D.children[String(cs)]){
    convergences[cs]=convergences[cs]||[];
    convergences[cs].push(r);
    rutas_en_conv[r.id]=cs;
    break;
   }
  }
 });
 // filtrar convergences: solo padres que aparecen en need (bom expandido) o cuya continuación aporta
 // (todas quedan, ya que están en rutas del articulo)

 // Los bloques se arman primero (ahí se suman los kg de fleje) y el encabezado
 // se compone al final, para poder mostrar el total de fleje arriba de todo.
 var B='';

 // Marcar rutas que producen hijos de un sub-conjunto convergente (se consumen dentro de la convergencia)
 var childrenOfConv={};
 Object.keys(convergences).forEach(function(padre){
  (D.children[padre]||[]).forEach(function(h){childrenOfConv[h.c]=parseInt(padre);});
 });
 rutas_prod.forEach(function(r){
  if(rutas_en_conv[r.id])return;
  var pasos=D.rp[String(r.id)]||[];
  // último cs de la ruta
  var lastCs=null;
  for(var i=pasos.length-1;i>=0;i--){if(pasos[i].cs){lastCs=pasos[i].cs;break;}}
  if(lastCs && childrenOfConv[lastCs]){rutas_en_conv[r.id]=childrenOfConv[lastCs];}
 });

 function titulo(n,txt){return '<h2 class="sec-h section-title"><span class="n">'+n+'</span>'+txt+'</h2>';}

 // Las convergencias se arman ANTES que las rutas simples: una ruta que se dibuja como rama
 // de una convergencia (570: Fleje 28 -> L8 -> F2 entra a la Matriz 194) no se repite en el
 // bloque 1, aunque su ultimo paso no sea el hijo (la ruta 96 sigue F2 -> Fabrica -> 570).
 // Ademas evita sumar dos veces sus kg de fleje.
 var convKeys=Object.keys(convergences);
 var Bconv='', rutaDibujada={};
 convKeys.forEach(function(padre){
  Bconv+=renderConvergenceLane(parseInt(padre),convergences[padre],need,uni,flejesTotal,aid,insumoEnConv,rutaDibujada);
 });
 // Rutas standalone
 var standalone=rutas_prod.filter(function(r){return !rutas_en_conv[r.id] && !rutaDibujada[r.id];});
 if(standalone.length){
  B+=titulo(1,'Partes que se fabrican en Cervantes ('+standalone.length+(standalone.length===1?' ruta simple)':' rutas simples)'));
  standalone.forEach(function(r){
   var pasos=D.rp[String(r.id)]||[];
   B+=renderStandaloneLane(r,pasos,{},need,uni,flejesTotal);
  });
 }
 // Rutas con convergencia
 if(convKeys.length){
  B+=titulo(2,'Convergencias · sub-conjuntos que unen 2+ rutas ('+convKeys.length+')');
  B+=Bconv;
  // Las rutas de insumo que ya se dibujaron dentro de una convergencia no se repiten en el bloque 4
  rutas_ins=rutas_ins.filter(function(r){return !insumoEnConv[r.id];});
 }

 // Sub-conjuntos NO cubiertos por rutas (BOM puro)
 var subsCubiertos={};
 convKeys.forEach(function(k){subsCubiertos[k]=1;});
 var subKeys=Object.keys(D.children).filter(function(k){return need[parseInt(k)] && !subsCubiertos[k];});
 if(subKeys.length){
  B+=titulo(3,'Sub-conjuntos (BOM sin ruta explícita)');
  subKeys.forEach(function(k){
   var pid=parseInt(k); var pc=cById(pid);
   var pq=need[pid]*uni;
   B+='<div class="lane"><div class="head"><b>'+esc(pc.cod+' · '+(pc.d||""))+'</b><span class="uni">× '+fmt(pq)+' u</span></div><div class="flow">';
   var hijos=D.children[k];
   hijos.forEach(function(hh,i){
    var hc=cById(hh.c);
    var hq=hh.q*pq;
    if(i>0)B+='<span class="arr plus">+</span>';
    B+=node(sName(hc.s).toUpperCase(),sCls(hc.s),hc.cod,hc.d||"","",hq,null,"");
   });
   B+='<span class="arr">=</span>'+node(sName(pc.s).toUpperCase(),"sub",pc.cod,pc.d||"","sub-conjunto",pq,null,"");
   B+='</div></div>';
  });
 }

 if(rutas_ins.length){
  B+=titulo(4,'Insumos comprados / transformados (entran al tallerista)');
  // FIX aud4-p7: agrupar por firma SIN tall → mostrar "Alex O Martin" en vez de dos líneas duplicadas
  // FIX aud5-p3: agrupar talls por POSICIÓN/etapa, no juntar todos los talls de la ruta
  var grupos={};
  rutas_ins.forEach(function(r){
   var pasos=D.rp[String(r.id)]||[];
   var p0=pasos[0]||{}; var cidIni=p0.ce||p0.cs;
   // Firma reemplaza cada tall por marcador de etapa: T_<orden>
   var sigSinTall=cidIni+'|'+pasos.map(function(p,idx){return p.tp+':'+(p.pr||'')+':'+(p.ce||'')+':'+(p.cs||'')+(p.tp==='tallerista'?':T'+idx:'');}).join('>');
   if(!grupos[sigSinTall])grupos[sigSinTall]={pasos:pasos,cidIni:cidIni,tallsPorPos:{}};
   pasos.forEach(function(p,idx){
    if(p.tp==='tallerista'&&p.ta){
     // ids, no nombres: p.tas ya trae a todos los talleristas de las copias de la ruta (rutasDeArt)
     var l=grupos[sigSinTall].tallsPorPos[idx]=grupos[sigSinTall].tallsPorPos[idx]||[];
     (p.tas||[p.ta]).forEach(function(id){if(l.indexOf(id)<0)l.push(id);});
    }
   });
  });
  Object.keys(grupos).forEach(function(k){
   var g=grupos[k],pasos=g.pasos,cidIni=g.cidIni;
   var comp=cById(cidIni);
   var qFin=null,csFin=cidIni;
   for(var ii=pasos.length-1;ii>=0;ii--){var pp=pasos[ii];if(pp.cs && need[pp.cs]){csFin=pp.cs;qFin=need[pp.cs]*uni;break;}}
   if(qFin===null && need[cidIni])qFin=need[cidIni]*uni;
   B+='<div class="lane"><div class="head"><b>'+esc(comp.cod+' — '+(comp.d||""))+'</b>'+(qFin?'<span class="uni">× '+fmt(qFin)+' u</span>':"")+'</div><div class="flow">';
   B+=provNode(comp)+node("INSUMO",sCls(comp.s),comp.cod||"?",comp.d||"","",qFin,null,"");
   pasos.forEach(function(p,idx){
    if(idx===0)return;
    if(p.tp==="proveedor_servicio"){
     var pv=D.prov[String(p.pr)]||{n:"(sin prov)",p:""};
     var csComp=cById(p.cs);
     // lo que sale del proveedor va en el PIE de su tarjeta, no en un nodo aparte
     var dst="";
     if(esTransitoPS(p,pasos[idx+1]))dst=destTransito(csComp,pasos[idx+1]);
     else if(csComp && csComp.cod)dst=destSector(csComp.s?sName(csComp.s):"componente",csComp.cod,csComp.d||"");
     B+='<span class="arr">→</span>'+node("PROV.SERV.","prov",pv.n.trim(),pv.p||"","",qFin,null,dst);
    }
    else if(p.tp==="tallerista"){
     var lbl=tallNombres({ta:p.ta,tas:g.tallsPorPos[idx],rep:p.rep});
     B+='<span class="arr">→</span>'+node("TALLERISTA","tall",lbl,"","",qFin,null,"");
    }
    else if(p.tp==="proveedor_at"){
     /* Articulo comprado terminado: lo unico que sale de casa es el carton y la caja;
        el Prov AT los usa y entrega el articulo ya terminado en Virgilio. */
     var pa=(D.provat?D.provat[String(p.pat)]:null)||"(sin prov)";
     B+='<span class="arr">→</span>'+node("PROV. ART. TERM.","prov",pa.trim(),"entrega terminado","",qFin,null,"");
    }
    else if(p.tp==="matriz"){
     /* La parte (caja, cartón, pieza) entra a una MATRIZ (de envasado o intermedia) antes
        de Virgilio: se dibuja el paso para que no parezca que va suelta a Virgilio. */
     B+='<span class="arr">→</span>'+pasoNode(p,need,uni,pasos[idx+1]);
    }
    else if(p.tp==="virgilio"){B+='<span class="arr">→</span>'+node("VIRGILIO","virg","Distribución","artículo","",null,null,"");}
   });
   B+='</div></div>';
  });
 }

 B+=titulo(5,(ensam.length||!provAT.length)?'Convergencia final → Artículo → Virgilio'
                                          :'Artículo comprado terminado → Virgilio');
 B+='<div class="lane"><div class="flow">';
 /* con % se reparten el volumen: "+" y cada uno con SU parte de las unidades (50% de 100 = 50) */
 if(ensam.length){ensam.forEach(function(e,i){B+=(i>0?'<span class="arr plus">'+(e.r?'+':'O')+'</span>':"")+node("TALLERISTA","tall",e.n,"ensambla"+(e.r?" "+pctTxt(e.r):""),"",e.r?uni*e.r.p/100:uni,null,"");});}
 else if(provAT.length){provAT.forEach(function(n,i){B+=(i>0?'<span class="arr plus">O</span>':"")+node("PROV. ART. TERM.","prov",n,"entrega terminado","",uni,null,"");});}
 else if(matrizFinal){B+=node("MATRIZ FINAL","matriz","N° "+matrizFinal.n,matrizFinal.d||"","",uni,null,"");}
 else B+=node("TALLERISTA","tall","(sin asignar)","tabla incompleta","",uni,null,"");
 B+='<span class="arr">→</span>'+node("ARTÍCULO","virg",a.cod,a.fam+" terminado","",uni,null,"")+
    '<span class="arr">→</span>'+node("VIRGILIO","virg","Distribución","centro logístico","",uni,null,"");
 B+='</div></div>';

 // ---- encabezado + resumen de fleje (se arman al final: necesitan los kg sumados) ----
 /* el número va ARRIBA del rótulo (.v + .k): así se lee "2 rutas de producción" */
 var H='<div class="cabeza"><div class="hero">'+
    '<div><div class="cod">'+esc(a.cod)+'</div><div class="fam">'+esc(a.d||"")+(a.d&&a.fam?' · ':'')+esc(a.fam||"")+(a.mk?' · '+esc(a.mk):'')+'</div></div>'+
    '<div class="kpis">'+
      '<div class="kpi"><span class="v">'+fmt(uni)+'</span><span class="k">unidades a producir</span></div>'+
      '<div class="kpi"><span class="v">'+bom.length+'</span><span class="k">partes BOM</span></div>'+
      '<div class="kpi"><span class="v">'+rutas_prod.length+'</span><span class="k">rutas de producción</span></div>'+
      (ensam.length?'<div class="kpi ens"><span class="v">'+ensam.map(function(e){return esc(e.n+(e.r?" "+pctTxt(e.r):""));}).join("<br>")+'</span><span class="k">'+(ensam.length>1?'ensamblan':'ensambla')+'</span></div>'
        :provAT.length?'<div class="kpi ens"><span class="v">'+esc(provAT.join(" O "))+'</span><span class="k">entrega terminado</span></div>':"")+
    '</div></div>';

 // DESPIECE: qué piezas lleva el artículo y cuántas. Sale del BOM ya expandido (need),
 // que es el mismo número con el que se dibujan las rutas — no se calcula nada aparte.
 // [usuario 2026-09-11] pidió esto en lugar del "fleje a pedir" (los kg de fleje siguen
 // estando en el badge de cada carril, que es donde se leen por ruta).
 var despKeys=Object.keys(need).filter(function(k){return need[k]>0;});
 if(despKeys.length){
  despKeys.sort(function(x,y){return (need[y]*uni)-(need[x]*uni);});
  H+='<div class="despiece"><h3 class="eyebrow">Despiece del artículo · '+despKeys.length+' componentes para '+fmt(uni)+' unidades</h3>'+
     '<div class="table-wrap libre"><table class="t"><thead><tr><th>Código</th><th>Descripción</th><th>Sector</th>'+
     '<th class="num">Por unidad</th><th class="num">Total</th></tr></thead><tbody>';
  despKeys.forEach(function(k){
   var c=cById(k), sn=sName(c.s);
   H+='<tr><td class="cd">'+esc(c.cod||"?")+'</td><td class="ds">'+esc(c.d||"")+'</td>'+
      '<td class="sc">'+esc(sn==='?'?'—':sn)+'</td>'+
      '<td class="nu num">'+fmt(need[k])+'</td><td class="tt num">'+fmt(need[k]*uni)+' u</td></tr>';
  });
  H+='</tbody></table></div></div>';
 }
 H+='</div>';   /* cierra .cabeza (hero + despiece) */

 document.getElementById("canvas").innerHTML=H+B;
 ajustarFilas();
}

/* UNA RUTA = UNA FILA. El carril mide lo que la ruta necesita (fit-content, sin tope) y
   acá se lo achica con `zoom` hasta que entra en el ancho de la pantalla. `zoom` y no
   `transform:scale` a propósito: zoom SÍ reacomoda el layout, así que el carril ocupa de
   verdad lo que se ve y no deja un hueco abajo ni desborda la página.
   PISO: por debajo de esto la letra dejaría de leerse, que es justo lo que se vino a
   arreglar; si una ruta no entra ni al piso, ese carril (solo ese) scrollea. */
var PISO_ZOOM=0.62;
/* OJO: el ancho de la fila NO se puede medir con offsetWidth/scrollWidth del carril.
   El carril es width:fit-content, y fit-content se capea al ancho del contenedor: mide
   1.464 aunque la cadena adentro pida 1.900 y se esté cortando. El ancho REAL de la fila
   es de dónde arranca la primera tarjeta a dónde termina la última. */
function anchoFila(f){
 var k=f.children;
 if(!k.length)return 0;
 var pri=k[0], ult=k[k.length-1];
 return (ult.offsetLeft+ult.offsetWidth)-pri.offsetLeft;
}
function ajustarFilas(){
 var cv=document.getElementById("canvas");
 var carriles=cv.querySelectorAll(".lane");
 var movil=window.innerWidth<=560;          // en celular la cadena va en vertical: no se escala
 for(var i=0;i<carriles.length;i++){
  var l=carriles[i];
  l.style.zoom="";                          // medir siempre sin escalar
  if(movil)continue;
  var disp=cv.clientWidth;                  // el canvas no tiene padding (lo pone .steps)
  if(disp<=0)continue;
  var filas=l.querySelectorAll(".flow"), nec=0;
  for(var j=0;j<filas.length;j++)nec=Math.max(nec,anchoFila(filas[j]));
  nec+=l.offsetWidth-l.clientWidth+28;      // bordes + el padding lateral del carril
  if(nec>disp)l.style.zoom=Math.max(PISO_ZOOM,disp/nec);
 }
}
var _rsz;
window.addEventListener("resize",function(){clearTimeout(_rsz);_rsz=setTimeout(ajustarFilas,120);});

sel.addEventListener("change",function(){elegido=sel.value;pintarBoton();render();});
/* El selector abre DIRECTO en el buscador con todos los articulos (usuario 2026-09-23:
   "no me hagas elegir por marca"). La marca es un filtro opcional -- los chips de arriba --
   y se resetea a "Todas" en cada apertura, para que nadie se coma un filtro que dejo puesto
   la vez anterior. Filtrar (chip o buscador) NO cambia el articulo elegido: eso pasa solo
   al tocar una fila de la lista. */
function pintarChips(){
 var v=selMarca.value;
 Array.prototype.forEach.call(pickMarcas.querySelectorAll("button[data-mk]"),function(b){
  b.classList.toggle("on",b.getAttribute("data-mk")===v);});}
function abrirPicker(){
 pick.hidden=false;selMarca.value="";inpBuscar.value="";pintarChips();llenarArticulos();
 /* foco solo en pantalla grande: en el celular el teclado taparia la lista recien abierta */
 if(window.innerWidth>560)inpBuscar.focus();}
function cerrarPicker(){pick.hidden=true;}
artBtn.addEventListener("click",abrirPicker);
document.getElementById("pickX").addEventListener("click",cerrarPicker);
pick.addEventListener("click",function(e){if(e.target===pick)cerrarPicker();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!pick.hidden)cerrarPicker();});
pickMarcas.addEventListener("click",function(e){
 var b=e.target.closest("button[data-mk]");if(!b)return;
 selMarca.value=b.getAttribute("data-mk");pintarChips();llenarArticulos();});
function elegirArticulo(id){
 elegido=id;sel.value=elegido;
 cerrarPicker();pintarBoton();render();}
pickList.addEventListener("click",function(e){
 var b=e.target.closest("button[data-id]");if(!b)return;
 elegirArticulo(b.getAttribute("data-id"));});
inpBuscar.addEventListener("input",function(){llenarArticulos();});
/* 2026-10-01 [usuario: "cuando le doy enter quiero que me entre al articulo"]: Enter en el
   buscador elige de la lista que se ve. Gana el codigo EXACTO (066 entra al 066 aunque el
   texto aparezca en otra descripcion); si no hay, la primera fila de la lista. Sin filas, nada. */
inpBuscar.addEventListener("keydown",function(e){
 if(e.key!=="Enter"||e.isComposing)return;
 e.preventDefault();
 var bs=pickList.querySelectorAll("button[data-id]");if(!bs.length)return;
 var q=norm(inpBuscar.value).trim(), b=bs[0];
 if(q)Array.prototype.some.call(bs,function(x){
  var a=D.art.find(function(y){return String(y.id)===x.getAttribute("data-id");});
  if(a&&norm(a.cod)===q){b=x;return true;}return false;});
 elegirArticulo(b.getAttribute("data-id"));});
document.getElementById("uni").addEventListener("input",render);
var a501=D.art.find(function(a){return a.cod==="501";});
sel.value=a501?a501.id:D.art[0].id;
elegido=sel.value;
pintarBoton();
render();
}
async function __boot(){
  try{
    document.body.style.cursor='progress';
    var r=await SB.rpc('programa_bundle');
    if(r.error) throw r.error;
    Object.assign(D, r.data);
    __run();
  }catch(e){
    /* el aviso va en el lienzo: la barra de la app queda (se puede ir a otro módulo) */
    var cv=document.getElementById('canvas');
    cv.innerHTML='<div class="aviso err"></div>';
    cv.firstChild.textContent='Error cargando datos de Supabase: '+(e.message||e);
    console.error(e);
  }finally{ document.body.style.cursor=''; }
}
__boot();
