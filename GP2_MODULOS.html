<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GP2 · Menú</title>
<link rel="icon" type="image/png" href="GP2_favicon.png">
<link rel="apple-touch-icon" href="GP2_favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080c12;color:#e0e8f0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,sans-serif;min-height:100vh}

/* ── header ── */
.header{background:linear-gradient(135deg,#0d1520 0%,#131e2e 100%);border-bottom:1px solid #1a2538;padding:20px 0 16px;text-align:center}
.header img{width:90%;max-width:400px;height:auto;border-radius:8px}
.header-sub{color:#5a7a9a;font-size:12px;margin-top:10px;letter-spacing:.3px}
.header-sub b{color:#7aacd4}

/* ── layout ── */
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* ── cards ── */
.card{background:#0e1520;border:1px solid #182435;border-radius:14px;overflow:hidden;transition:border-color .2s}
.card:hover{border-color:#243a55}
.card.all-locked{opacity:.35;pointer-events:none;filter:saturate(.3)}
.card.all-locked .card-head{background:#0c1018}

.card-head{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #182435;cursor:pointer;user-select:none;transition:background .15s}
.card-head:hover{background:#121d2b}
.card-head .icon{font-size:20px;line-height:1;flex-shrink:0}
.card-head .title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#c0d4e8;flex:1}
.card-head .badge{background:#1a6b42;color:#5fd89e;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.5px}
.card-head .chevron{color:#3a5570;font-size:16px;transition:transform .2s;font-weight:700}
.card.collapsed .chevron{transform:rotate(-90deg)}
.card.collapsed .card-body{display:none}

.card-body{padding:8px 10px 12px}
.btns{display:flex;flex-direction:column;gap:5px}

/* ── botones activos ── */
a.op{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:500;color:#d0dcea;background:linear-gradient(135deg,#131f2e 0%,#162438 100%);border:1px solid #1e3350;transition:all .15s}
a.op:hover{background:linear-gradient(135deg,#182a40 0%,#1c3250 100%);border-color:#2a5a90;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
a.op:active{transform:translateY(0)}
a.op .arrow{color:#3a6a9a;font-size:16px;margin-left:auto;font-weight:700;transition:color .15s}
a.op:hover .arrow{color:#5a9ad4}
a.op .dot{width:6px;height:6px;border-radius:50%;background:#2a8a55;flex-shrink:0}

/* ── botones locked ── */
span.op.lock{display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:8px;font-size:12px;color:#3a4a5a;border:1px solid #15202d;background:#0a1018;cursor:default}
span.op.lock .lk{font-size:11px;margin-left:auto;opacity:.6}

/* ── footer ── */
.foot{max-width:1200px;margin:0 auto;padding:0 16px;color:#3a5068;font-size:11px;text-align:center}
</style></head><body>

<div class="header">
  <img src="GP2_logo.png" alt="GP2 · Gestión Productiva — Loekemeyer">
  <div class="header-sub">Módulos con <b>🔒</b> pendientes de migración</div>
</div>

<div class="wrap"><div class="grid" id="grid"></div></div>
<div class="foot">GP2 — schema propio, independiente de la app vieja</div>

<script>
const MENU = [
 ["🔧","Tallerista", [
   ["Control", "Talleristas/Control%20Tall/ControlTalleristas_GP2.html"],
   ["Envío", "Talleristas/Envios/EnviosTalleristas_GP2.html"],
   ["Entregas", "Talleristas/Recepcion/EntregasTalleristas_GP2.html"],
   ["Devolución Cervantes", null],
   ["Entrega Cervantes Fotos", null],
   ["ABM Artículos", "Talleristas/ABM%20Articulos/ABM_Articulos_GP2.html"],
   ["Proporciones", "Talleristas/Proporciones/Proporciones_GP2.html"],
   ["Faltante Partes", "Talleristas/Faltante%20Partes%20Tallerista/FaltantePartesTallerista_GP2.html"],
 ]],
 ["☰","PS (Prov. Servicio)", [
   ["Control", "Prov%20Serv/Control/ControlPS_GP2.html"],
   ["Envío", "Prov%20Serv/Control/ControlPS_GP2.html"],
   ["Entrega", "Prov%20Serv/Control/ControlPS_GP2.html"],
 ]],
 ["📦","Prov. Art. Terminado", [
   ["Control", null], ["Envío Cartón/Cajas", null], ["Entrega Art. Terminado", null],
 ]],
 ["🗒","Control Envíos y Entregas", [
   ["Abrir", null], ["Stock Online", null], ["Exportar datos", null],
 ]],
 ["▦","Stocks", [
   ["Stock SP", "StockSP/StockSP_GP2.html"],
   ["Stock SC", "StockSC/StockSC_GP2.html"],
   ["Stock en Movimiento", null],
   ["Stock Tránsito PS", null],
   ["Stocks general", "Stocks%20General/StockGeneral_GP2.html"],
   ["Verificación Integridad", "Verificacion/Verificacion_GP2.html"],
   ["Verificación Madres", "VerifMadres/VerifMadres_GP2.html"],
 ]],
 ["⋯","Producción", [
   ["Registro Producción", null],
   ["Informes Producción", "Informes/informe_persona_GP2.html"],
   ["Informe x Matriz", "Informes/informe_matriz_GP2.html"],
   ["Informes Virgilio", null],
   ["Producciones Disruptivas", "Disruptivas/Disruptivas_GP2.html"],
   ["Maestro Producción", "Produccion/maestro_GP2.html"],
   ["Rendimiento x Mes", "Produccion/rendimiento_GP2.html"],
   ["Alertas", "Alertas/alertas_GP2.html"],
   ["ABM Operarios", null],
   ["Monitor en Vivo", null],
   ["Monitor en Vivo 2.0", null],
   ["Tiempos Matrices", null],
   ["Problemas con Matrices", null],
   ["Entrevistas", null],
 ]],
 ["◈","Despiece", [
   ["Despiece x Artículo", "Despiece%20x%20Articulo/Despiece_GP2.html"],
 ]],
 ["✓","Control Carga Remitos", [ ["Ver Cargas", null] ]],
 ["🧾","Facturas", [
   ["Lectura de Facturas Entrantes", null],
   ["Entrega Proveedores Cervantes", null],
 ]],
 ["▦","Insumos", [
   ["Recepción Insumos", null], ["Cajas", null], ["Flejes", null], ["Cartones", null],
   ["Partes Plásticas", null], ["Remaches", null], ["Bombillas", null], ["Garage", null],
 ]],
 ["🗒","Relevamiento", [ ["Relevamientos", null] ]],
 ["🔗","Ventas", [ ["Chat Bot Ventas", null] ]],
 ["🛠","Herramientas GP2", [
   ["Inicio (dashboard)", "Inicio/index_GP2.html"],
   ["Programa de Stock", "Programa/Programa.html"],
   ["Faltantes", "Faltantes/Faltantes.html"],
   ["Registrar Movimiento", "Movimientos/Registrar_Movimiento.html"],
 ]],
];

const grid = document.getElementById("grid");
MENU.forEach(([icon, titulo, items]) => {
  const allLocked = items.every(i => !i[1]);
  const activeCount = items.filter(i => i[1]).length;

  const card = document.createElement("div");
  card.className = "card" + (allLocked ? " all-locked" : "");

  // head
  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML =
    '<span class="icon">' + icon + '</span>' +
    '<span class="title">' + titulo + '</span>' +
    (activeCount > 0 ? '<span class="badge">' + activeCount + '</span>' : '') +
    '<span class="chevron">‹</span>';
  head.addEventListener("click", () => { card.classList.toggle("collapsed"); });
  card.appendChild(head);

  // body
  const body = document.createElement("div");
  body.className = "card-body";
  const box = document.createElement("div");
  box.className = "btns";
  items.forEach(([label, href]) => {
    if (href) {
      const a = document.createElement("a"); a.className = "op"; a.href = href;
      a.innerHTML = '<span class="dot"></span><span>' + label + '</span><span class="arrow">›</span>';
      box.appendChild(a);
    } else {
      const s = document.createElement("span"); s.className = "op lock";
      s.innerHTML = '<span>' + label + '</span><span class="lk">🔒</span>';
      box.appendChild(s);
    }
  });
  body.appendChild(box);
  card.appendChild(body);
  grid.appendChild(card);
});
</script>
</body></html>
