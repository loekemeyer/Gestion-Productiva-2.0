ario): arriba y a todo el ancho Ordenes de Compra y Recepcion Insumos, despues el stock de cada rubro, y ultimo y apagado Inyectores — la linea se habia perdido en un merge de la sesion paralela, el codigo estaba bien; v1.9.1 - Produccion llego a 15 modulos ("Orden de Produccion") y en pantalla baja el grupo abierto se pasaba 12px: las baldosas bajan de 64 a 56px; v1.9.0 - Prov. Art. Terminado gana su "Historial x Fecha" (?origen=provat): el grupo tenia un solo boton y el modulo ya tenia esa vista; v1.8.0 - celular: adentro de un grupo los modulos dejan de ser una lista de filas finitas y pasan a baldosas grandes en 2 columnas (igual en todos los rubros); hasta Produccion (14) entra en una pantalla; v1.7.0 - Control Envios y Entregas deja de ser un grupo suelto: se reparte en un boton "Historial x Fecha" dentro de Tallerista (?origen=tall) y otro dentro de PS (?origen=ps); v1.6.0 - un solo menu: entra "Entrega Virgilio" (unica pantalla sin version GP2 que no figuraba) y se saca "Inicio (dashboard)", que era el menu viejo duplicado; sus datos vivos (KPIs, badge de Disruptivas y aviso de espejo) se portaron aca; v1.5.0 - celular: los 13 grupos entran en UNA pantalla (grilla de 2 columnas, tarjetas mas grandes), se muestra el numero de version y se saco el texto que no son modulos (subtitulo y pie); v1.4.0 - entra "Inyectores · Quien hace cada parte" en el grupo Insumos; v1.3.0 - menu depurado: fuera Stock Online duplicado, Informes Virgilio y los 2 candados de Prov AT; v1.2.0 - es la pagina de entrada post-login (con auth-guard y Cerrar sesion); v1.1.0 - grupos 100% bloqueados arrancan minimizados; acordeon exclusivo; vista foco en celular -->

/* ── Menu principal · Sistema de diseño v2 (2026-10-08) ──────────────────────────────
   La portada es la cara del producto: cabecera azul marino con el logo y los datos del dia,
   y los grupos como paneles blancos con baldosas. Tokens, tipografia y colores salen de
   gp2-modulo.css (DISENO_GP2.md); aca solo va lo propio de esta pantalla.
   Lo que fijan los tests y NO se toca: en el celular los grupos entran en UNA pantalla
   (375x600 incluido), baldosas en 2 columnas >= 44px y texto >= 15px, las pastillas de
   tablet fijas abajo, .card = grupo, #appVersion, .header-sub, #sesion. */
body{background:var(--bg);min-height:100vh}

/* ── cabecera ── */
.mhead{position:relative;background:var(--bar);color:#fff;overflow:hidden}
.mhead::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(900px 260px at 18% 0%,rgba(47,140,255,.28),transparent 70%),
             radial-gradient(500px 200px at 100% 100%,rgba(70,182,255,.14),transparent 70%)}
.mhead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--accent) 0%,#46b6ff 40%,rgba(70,182,255,0) 85%)}
.mhead-in{position:relative;max-width:1400px;margin:0 auto;padding:18px 24px 20px;display:flex;align-items:center;gap:20px 32px;flex-wrap:wrap}
.mhead img.logo{height:92px;width:auto;border-radius:10px;display:block}
.mhead .mid{flex:1 1 300px;min-width:0}
.mhead .eyebrow{color:#8fb3e8}
.header-sub{color:#c9d5e6;font-size:15px;margin-top:4px}
.header-sub b{color:#fff}
.header-sub a{color:#ffb4b0;text-decoration:none;font-weight:700}
#kpiResumen{display:block;margin-top:8px;font-size:15px;color:#c9d5e6;font-variant-numeric:tabular-nums}
#kpiResumen b{color:#fff;font-size:18px}
#kpiResumen:empty{display:none}

/* pastillas de tablet (accesos directos) */
.tablet-links{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
a.tablet-link{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--touch);
  padding:0 16px;border-radius:var(--r-sm);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-weight:650;font-size:16px;text-decoration:none;white-space:nowrap;transition:background .12s}
a.tablet-link:hover{background:rgba(255,255,255,.17)}
a.tablet-link:first-child{background:var(--pri);border-color:var(--pri)}
a.tablet-link:first-child:hover{background:#2c6af0}

/* ── grupos ── */
.wrap{max-width:1400px;margin:0 auto;padding:22px 24px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));align-items:start;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1)}
.card.all-locked{opacity:.6;filter:saturate(.4)}
.card.all-locked .card-body{pointer-events:none}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);
  background:var(--surface-2);cursor:pointer;user-select:none}
.card-head:hover{background:var(--surface-3)}
body.fijo .card-head{cursor:default}
body.fijo .card-head:hover{background:var(--surface-2)}
.card-head .icon{font-size:20px;line-height:1;flex-shrink:0;width:34px;height:34px;border-radius:9px;display:inline-flex;
  align-items:center;justify-content:center;background:var(--sel);color:#fff}
.card-head .title{font-size:18px;font-weight:750;letter-spacing:-.01em;color:var(--ink);flex:1}
.card-head .badge{background:var(--pri-soft);color:var(--pri-h);font-size:12px}
.card-head .chevron{color:var(--ink-3);font-size:18px;transition:transform .2s;font-weight:700}
.card.collapsed .chevron{transform:rotate(-90deg)}
.card.collapsed .card-body{display:none}
.card-body{padding:12px}
.btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}

/* baldosa de modulo */
a.op{position:relative;display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 14px;border-radius:var(--r-md);
  text-decoration:none;font-size:16px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);
  transition:border-color .12s,background .12s,box-shadow .12s,transform .12s}
a.op:hover{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-h);box-shadow:0 4px 14px rgba(31,91,216,.12);transform:translateY(-1px)}
a.op:active{transform:none}
a.op .arrow{color:var(--ink-4);font-size:20px;margin-left:auto;font-weight:600;transition:color .12s,transform .12s}
a.op:hover .arrow{color:var(--pri);transform:translateX(2px)}
a.op .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 0 3px rgba(47,140,255,.15)}
/* tres niveles de importancia dentro de un grupo (pedido del usuario, Insumos) */
a.op.principal{grid-column:1 / -1;background:var(--pri-soft);border-color:var(--pri-line);font-weight:700;font-size:17px}
a.op.secundario{color:var(--ink-3);font-weight:500;font-size:15px;min-height:50px;background:var(--surface-2);border-color:var(--line)}
a.op.secundario .dot{background:var(--ink-4);box-shadow:none;width:6px;height:6px}
/* boton que todavia abre la app anterior (schema public) */
a.op.vieja{background:var(--warn-soft);border-color:var(--warn-line);color:#6b3a00}
a.op.vieja .dot{background:#dc9a00;box-shadow:none}
a.op.vieja .tag{margin-left:auto;font-size:11px;font-weight:700;opacity:.8;white-space:nowrap}
a.op.vieja .arrow{margin-left:8px}
span.op.lock{display:flex;align-items:center;gap:10px;min-height:50px;padding:9px 14px;border-radius:var(--r-md);font-size:15px;
  color:var(--ink-3);border:1px dashed var(--line-2);background:var(--surface-2);cursor:default}
span.op.lock .lk{font-size:14px;margin-left:auto;opacity:.7}

.foot{max-width:1400px;margin:0 auto;padding:0 24px;color:var(--ink-3);font-size:12px;text-align:center}

/* ── celular: los grupos TIENEN que entrar en una sola pantalla (test_menu_una_pantalla) ── */

  .btns{grid-template-columns:1fr}
  a.op,span.op.lock{font-size:15px;padding:11px 12px;min-height:44px}

  body.focus .grid,body.fijo .grid{grid-template-columns:1fr}
  body.focus .card.open .card-head,body.fijo .card.open .card-head{flex-direction:row;align-items:center;gap:10px;min-height:0;padding:12px 14px;border-bottom:1px solid var(--line)}

  body.focus .card.open .card-head .badge,body.fijo .card.open .card-head .badge{position:static}
  body.focus .mhead,body.focus .foot{display:none}
  body.focus .wrap{padding:0 0 30px}
  body.focus .card:not(.open){display:none}
  body.focus .card.open{border:0;border-radius:0;box-shadow:none;opacity:1;filter:none}

  /* adentro del grupo: baldosas en 2 columnas */
  :is(body.focus,body.fijo) .card.open .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  :is(body.focus,body.fijo) .card.open a.op,
  :is(body.focus,body.fijo) .card.open span.op.lock{flex-direction:column;align-items:center;justify-content:center;text-align:center;
    gap:4px;min-height:76px;padding:12px 10px;font-size:16px;font-weight:600;line-height:1.15;border-radius:12px;overflow-wrap:anywhere}
  :is(body.focus,body.fijo) .card.open a.op .arrow{display:none}
  :is(body.focus,body.fijo) .card.open a.op .dot{position:absolute;top:8px;left:8px;margin:0}
  :is(body.focus,body.fijo) .card.open span.op.lock .lk{margin:0}
  :is(body.focus,body.fijo) .card.open a.op.principal{grid-column:1 / -1;min-height:66px;font-size:18px}
  :is(body.focus,body.fijo) .card.open a.op.secundario{min-height:56px;font-size:15px}
  :is(body.focus,body.fijo) .card.open .btns > :last-child:nth-child(odd){grid-column:1 / -1;min-height:56px}

}

const VER_TODOS = new URLSearchParams(location.search).get("todos") === "1";
const MENU_VISIBLE = VER_TODOS ? MENU.concat(MENU_OCULTO) : MENU;
/* v1.201.0 (2026-09-28) - MENU FIJO [Thomas: "Por default quiero los dos modulos abiertos ...
   No lo quiero poder cerrar. Que este expandido ambos"]: en el menu normal Stocks y
   Herramientas arrancan abiertos, sin chevron ni click que los cierre. Con ?todos=1 sigue el
   acordeon de siempre (13 grupos no entran abiertos). */
const FIJO = !VER_TODOS;
if (FIJO) document.body.classList.add("fijo");
MENU_VISIBLE.forEach(([icon, titulo, items]) => {
  const allLocked = items.every(i => !i[1]);
  const activeCount = items.filter(i => i[1]).length;

  const card = document.createElement("div");
  // arrancan todos minimizados: en el celular se ven los 13 grupos de una,
  // y los que estan 100% bloqueados ya no ocupan pantalla mostrando candados.
  card.className = "card " + (FIJO ? "open" : "collapsed") + (allLocked ? " all-locked" : "");

  // head
  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML =
    '<span class="icon">' + icon + '</span>' +
    '<span class="title">' + titulo + '</span>' +
    (activeCount > 0 ? '<span class="badge">' + activeCount + '</span>' : '') +
    (FIJO ? '' : '<span class="chevron">‹</span>');
  if (!FIJO) head.addEventListener("click", () => {
    const abrir = card.classList.contains("collapsed");
    // acordeon exclusivo: abrir uno cierra el resto
    document.querySelectorAll(".card").forEach(c => {
      c.classList.add("collapsed"); c.classList.remove("open");
    });
    if (abrir) { card.classList.remove("collapsed"); card.classList.add("open"); }
    // en celular el grupo abierto se queda solo en pantalla (CSS body.focus)
    document.body.classList.toggle("focus", abrir);
    if (abrir) window.scrollTo(0, 0);
  });
  card.appendChild(head);

  // body
  const body = document.createElement("div");
  body.className = "card-body";
  const box = document.createElement("div");
  box.className = "btns";
  items.forEach(([label, href, marca]) => {
    // marca: lista separada por espacios. "vieja" = abre la app anterior;
    // "principal"/"secundario" = peso dentro del grupo (lo pidio el usuario).
    const marcas = String(marca || "").split(/\s+/).filter(Boolean);
    const tiene = (m) => marcas.includes(m);
    if (href) {
      const a = document.createElement("a");
      a.className = ["op"].concat(marcas).join(" ");
      a.href = href;
      if (tiene("vieja")) a.title = "Todavía sin versión GP2: abre la pantalla de la app anterior";
      a.innerHTML = '<span class="dot"></span><span>' + label + '</span>' +
        (tiene("vieja") ? '<span class="tag">app vieja</span>' : '') +
        '<span class="arrow">›</span>';
      box.appendChild(a);
    } else {
      const s = document.createElement("span"); s.className = "op lock";
      s.innerHTML = '<span>' + label + '</span><span class="lk">🔒</span>';
      box.appendChild(s);
    }
  });
  body.appendChild(box);
  card.appendChild(body);
  grid.appendChild(card);
});
// Grilla de 2 columnas en celular: con una cantidad impar de grupos el ultimo
// quedaria solo en media fila. Se lo marca para que ocupe el ancho entero.
if (MENU_VISIBLE.length % 2 === 1) grid.lastElementChild.classList.add("solo");
</script>

<script src="gp2-ui.js?v=20260930a"></script>
<!-- Verificacion de cajones: el aviso de las 15:00 NO va en el menu, solo en la Tablet Logistica [Elias 08/10] -->
<script>
/* Datos vivos del menu. Antes vivian en Inicio/index_GP2.html, que era una copia
   del menu viejo y quedo como redirect: el RPC "GP2".inicio_bundle() se trajo aca
   para no perder los KPIs, el badge de Disruptivas ni — sobre todo — el aviso de
   cargas de Virgilio que el espejo no pudo aplicar. */
(async () => {
  try {
    const sb = GP2_SB();
    const { data: bundle, error } = await sb.rpc("inicio_bundle");
    if (error) { console.error(error); return; }
    if (!bundle) return;
    const al = bundle.alertas || {};

    // Aviso 'cargas de Virgilio SIN aplicar' sacado a pedido del usuario 2026-08-31.

    // Cuantas disruptivas quedan pendientes este mes, sobre su propio boton.
    const nDis = Number(al.disruptivas_mes) || 0;
    if (nDis > 0) {
      const a = document.querySelector('a.op[href*="Disruptivas_GP2.html"] span:nth-child(2)');
      if (a) a.textContent = a.textContent + " (" + nDis + ")";
    }

    // Cuantas recepciones "de mas" esperan revision (GP2.alerta_recepcion, las carga la
    // Version Tablet), sobre el boton de Alertas. inicio_bundle las trae desde el 2026-09-13.
    const nRec = Number(al.recepcion_de_mas) || 0;
    if (nRec > 0) {
      const a = document.querySelector('a.op[href*="alertas_GP2.html"] span:nth-child(2)');
      if (a) a.textContent = a.textContent + " (" + nRec + " de más)";
    }

    // KPIs de hoy y del mes, debajo de la version.
    const d = bundle.dia || {}, m = bundle.mes || {};
    const kpi = document.getElementById("kpiResumen");
    if (kpi) {
      const f = v => Number(v || 0).toLocaleString("es-AR");
      kpi.innerHTML = "Hoy: <b>" + f(d.uni) + "</b> uni · " + f(d.registros) + " reg · " +
        f(d.empleados) + " oper &nbsp;|&nbsp; Mes: <b>" + f(m.uni) + "</b> uni · " +
        f(m.registros) + " reg · " + f(m.empleados) + " oper";
    }
  } catch (e) { console.error(e); }
})();
</script>
<script src="pwa.js?v=20260830e"></script>
