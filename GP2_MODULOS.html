ario): arriba y a todo el ancho Ordenes de Compra y Recepcion Insumos, despues el stock de cada rubro, y ultimo y apagado Inyectores — la linea se habia perdido en un merge de la sesion paralela, el codigo estaba bien; v1.9.1 - Produccion llego a 15 modulos ("Orden de Produccion") y en pantalla baja el grupo abierto se pasaba 12px: las baldosas bajan de 64 a 56px; v1.9.0 - Prov. Art. Terminado gana su "Historial x Fecha" (?origen=provat): el grupo tenia un solo boton y el modulo ya tenia esa vista; v1.8.0 - celular: adentro de un grupo los modulos dejan de ser una lista de filas finitas y pasan a baldosas grandes en 2 columnas (igual en todos los rubros); hasta Produccion (14) entra en una pantalla; v1.7.0 - Control Envios y Entregas deja de ser un grupo suelto: se reparte en un boton "Historial x Fecha" dentro de Tallerista (?origen=tall) y otro dentro de PS (?origen=ps); v1.6.0 - un solo menu: entra "Entrega Virgilio" (unica pantalla sin version GP2 que no figuraba) y se saca "Inicio (dashboard)", que era el menu viejo duplicado; sus datos vivos (KPIs, badge de Disruptivas y aviso de espejo) se portaron aca; v1.5.0 - celular: los 13 grupos entran en UNA pantalla (grilla de 2 columnas, tarjetas mas grandes), se muestra el numero de version y se saco el texto que no son modulos (subtitulo y pie); v1.4.0 - entra "Inyectores · Quien hace cada parte" en el grupo Insumos; v1.3.0 - menu depurado: fuera Stock Online duplicado, Informes Virgilio y los 2 candados de Prov AT; v1.2.0 - es la pagina de entrada post-login (con auth-guard y Cerrar sesion); v1.1.0 - grupos 100% bloqueados arrancan minimizados; acordeon exclusivo; vista foco en celular -->

<style>
/* ── Menú GP2 · v2.0 (2026-10-09, sistema de diseño) ─────────────────────────
   La portada usa la MISMA barra que todas las pantallas (gp2-modulo.css) y el
   resto se arma con los tokens del sistema. Desktop: accesos rápidos grandes
   arriba + los grupos como paneles anchos con baldosas. Celular: se conserva
   todo lo que el usuario pidió (2 grupos abiertos que entran en UNA pantalla,
   baldosas en 2 columnas, pastillas de tablet fijas abajo) — test_menu_una_pantalla. */
body{min-height:100vh}
.header h1 small{color:var(--ink-400)}
.header-sub{display:flex;align-items:center;gap:10px;color:var(--ink-400);font-size:var(--fs-sm)}
.header-sub b{color:#fff;font-weight:650}
.header-sub #sesion a{color:#fecaca;background:transparent;border-color:rgba(254,202,202,.25)}
.header-sub #sesion a:hover{background:rgba(254,202,202,.1)}

/* ── layout ── */
.wrap{max-width:1320px;margin:0 auto;padding:var(--s5) var(--gutter) var(--s8)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));align-items:start;gap:var(--s4)}

/* ── accesos rápidos (tablets + monitor): lo que se abre de pie, en el galpón ── */
.tablet-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin:0 0 var(--s4)}
a.tablet-link{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 18px;border-radius:var(--r-lg);
  background:var(--ink-900);color:#fff;text-decoration:none;font-weight:700;font-size:17px;
  box-shadow:var(--sh-1);border:1px solid var(--ink-950);transition:background .12s,transform .06s}
a.tablet-link:hover{background:var(--ink-800)}
a.tablet-link:active{transform:translateY(1px)}
a.tablet-link .tl-i{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;
  background:var(--brand-600);font-size:19px;flex:none}
a.tablet-link .tl-s{display:block;font-size:var(--fs-sm);font-weight:500;color:var(--ink-400)}

/* ── KPIs de hoy / mes (inicio_bundle) ── */
#kpiResumen{margin:0 0 var(--s4)}
#kpiResumen:empty{display:none}

/* ── grupos ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1)}
.card.all-locked{opacity:.6;filter:saturate(.4)}
.card.all-locked .card-body{pointer-events:none}
.card-head{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);
  background:var(--surface-2);cursor:pointer;user-select:none}
.card-head:hover{background:var(--ink-100)}
body.fijo .card-head{cursor:default}
body.fijo .card-head:hover{background:var(--surface-2)}
.card-head .icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;
  background:var(--ink-900);color:#fff;font-size:16px;line-height:1;flex-shrink:0}
.card-head .title{font-size:var(--fs-h2);font-weight:700;color:var(--ink-900);flex:1;letter-spacing:-.005em}
.card-head .badge{background:var(--ink-100);color:var(--ink-600);border:1px solid var(--line)}
.card-head .chevron{color:var(--ink-500);font-size:18px;transition:transform .2s;font-weight:700}
.card.collapsed .chevron{transform:rotate(-90deg)}
.card.collapsed .card-body{display:none}

.card-body{padding:12px}
/* desktop: baldosas en 2 columnas dentro de cada grupo (densidad sin perder tamaño) */
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
a.op{position:relative;display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border-radius:var(--r-md);
  text-decoration:none;font-size:16px;font-weight:600;color:var(--ink-800);background:var(--surface);
  border:1.5px solid var(--line);transition:border-color .12s,background .12s,box-shadow .12s}
a.op:hover{border-color:var(--brand-500);background:var(--brand-50);box-shadow:var(--sh-1)}
a.op:active{transform:translateY(1px)}
a.op .arrow{color:var(--ink-400);font-size:20px;margin-left:auto;font-weight:500;transition:color .12s,transform .12s}
a.op:hover .arrow{color:var(--brand-600);transform:translateX(2px)}
a.op .dot{display:none}                 /* hoy todo es GP2: el punto sólo marca lo que abre la app vieja */
a.op.vieja .dot{display:block;width:8px;height:8px;border-radius:50%;background:var(--warn-600);flex-shrink:0}

/* tres niveles de importancia dentro de un grupo (usuario, Insumos) */
a.op.principal{grid-column:1 / -1;background:var(--brand-50);border-color:var(--brand-200);font-weight:700;font-size:17px}
a.op.secundario{color:var(--ink-500);font-weight:500;font-size:15px;background:var(--surface-2)}
a.op.vieja{background:var(--warn-50);border-color:var(--warn-200);color:#7c2d12}
a.op.vieja .dot{background:var(--warn-600)}
a.op.vieja .tag{margin-left:auto}
a.op.vieja .arrow{margin-left:8px}
span.op.lock{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border-radius:var(--r-md);font-size:15px;
  color:var(--ink-400);border:1.5px dashed var(--line);background:var(--surface-2);cursor:default}
span.op.lock .lk{font-size:13px;margin-left:auto;opacity:.7}
.btns > :last-child:nth-child(odd):not(.principal){grid-column:1 / -1}

/* ── celular: los grupos TIENEN que entrar en una sola pantalla ──
   (requisito del usuario, 2026-08-29; lo mide test_menu_una_pantalla). */
@media (max-width:640px){
  .header{min-height:48px}
  .header h1{font-size:16px}
  .header h1 small{display:none}
  .header-sub{font-size:12px;gap:6px}
  .header-sub #sesion a{min-height:34px;padding:0 8px;font-size:12.5px}
  .wrap{padding:8px 8px 12px}
  .foot{display:none}
  #kpiResumen{display:none}               /* en el celular no entra: los grupos primero */
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .card{border-radius:12px;position:relative}
  .card-head{flex-direction:column;align-items:flex-start;justify-content:center;
             gap:3px;padding:10px 11px;min-height:82px;border-bottom:0}
  .card-head .icon{width:28px;height:28px;font-size:14px}
  .card-head .title{font-size:15px;line-height:1.15;flex:none}
  .card-head .badge{position:absolute;top:9px;right:9px}
  .card.collapsed .chevron{display:none}
  .card.solo{grid-column:1 / -1}
  .card.solo .card-head{min-height:56px;flex-direction:row;align-items:center;gap:9px}
  .card-body{padding:6px 8px 9px}
  .btns{display:flex;flex-direction:column;gap:5px}
  a.op,span.op.lock{font-size:15px;padding:11px 12px;min-height:44px}

  body.focus .grid,body.fijo .grid{grid-template-columns:1fr}
  body.focus .card.open .card-head,body.fijo .card.open .card-head{flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;min-height:0;padding:13px 14px;border-bottom:1px solid var(--line)}
  body.focus .card.open .card-head .title,body.fijo .card.open .card-head .title{font-size:18px}
  body.focus .card.open .card-head .badge,body.fijo .card.open .card-head .badge{position:static}

  body.focus .header,body.focus .foot{display:none}
  body.focus .wrap{padding:0 0 30px}
  body.focus .card:not(.open){display:none}
  body.focus .card.open{border:0;border-radius:0;box-shadow:none;opacity:1;filter:none}
  body.focus .card.open .card-head{position:sticky;top:0;z-index:5;background:#fff;padding:14px 14px}
  body.focus .card.open .card-body{padding:8px 10px 12px}

  :is(body.focus,body.fijo) .card.open .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  :is(body.focus,body.fijo) .card.open a.op,
  :is(body.focus,body.fijo) .card.open span.op.lock{
    flex-direction:column;align-items:center;justify-content:center;text-align:center;
    gap:4px;min-height:76px;padding:12px 10px;font-size:16px;font-weight:600;
    line-height:1.15;border-radius:12px;overflow-wrap:anywhere}
  :is(body.focus,body.fijo) .card.open a.op .arrow{display:none}
  :is(body.focus,body.fijo) .card.open a.op .dot{position:absolute;top:8px;left:8px;margin:0}
  :is(body.focus,body.fijo) .card.open span.op.lock .lk{margin:0}
  :is(body.focus,body.fijo) .card.open a.op.principal{grid-column:1 / -1;min-height:66px;font-size:18px}
  :is(body.focus,body.fijo) .card.open a.op.secundario{min-height:56px;font-size:15px}   /* 15 = piso del test */
  :is(body.focus,body.fijo) .card.open .btns > :last-child:nth-child(odd){grid-column:1 / -1;min-height:56px}
  body.fijo .card.open .card-head{padding:10px 14px}
  body.fijo .card.open a.op,body.fijo .card.open span.op.lock{min-height:56px;padding:8px 10px}
  body.fijo .card.open .btns > :last-child:nth-child(odd){min-height:48px}

  /* accesos rápidos: pastillas fijas abajo (no ocupan fila de la grilla) */
  .tablet-links{position:fixed;right:10px;bottom:10px;z-index:20;margin:0;display:flex;
    flex-direction:column;align-items:flex-end;gap:8px}
  a.tablet-link{min-height:44px;padding:0 14px;border-radius:999px;font-size:15px;gap:6px}
  a.tablet-link .tl-i{width:auto;height:auto;background:none;font-size:16px}
  a.tablet-link .tl-s{display:none}
  body.focus .tablet-links{display:none}
  body.fijo .wrap{padding-bottom:70px}
  body:not(.fijo) .wrap{padding-bottom:170px}
  body.fijo .tablet-links{left:0;right:0;bottom:0;flex-direction:row;justify-content:center;
    flex-wrap:nowrap;gap:8px;padding:8px 10px;background:#fff;border-top:1px solid var(--line)}
  body.fijo a.tablet-link{flex:1;justify-content:center;font-size:14px;padding:0 8px;white-space:nowrap}
  body.fijo a.tablet-link .tl-v{display:none}
}
@media (max-width:640px) and (max-height:700px){
  .grid{gap:6px}
  .card-head{min-height:62px;padding:8px 10px}
  .card-head .title{font-size:14px}
  .card.solo .card-head{min-height:46px}
  :is(body.focus,body.fijo) .card.open .btns{gap:6px}
  :is(body.focus,body.fijo) .card.open a.op,

}

.foot{max-width:1320px;margin:var(--s4) auto 0;padding:0 16px;font-size:var(--fs-sm);text-align:center}

   Herramientas arrancan abiertos, sin chevron ni click que los cierre. Con ?todos=1 sigue el
   acordeon de siempre (13 grupos no entran abiertos). */
const FIJO = !VER_TODOS;
if (VER_TODOS) { const vt = document.getElementById("verTodos"); vt.href = "GP2_MODULOS.html"; vt.textContent = "← Menú reducido"; }
if (FIJO) document.body.classList.add("fijo");
MENU_VISIBLE.forEach(([icon, titulo, items]) => {
  const allLocked = items.every(i => !i[1]);
  const activeCount = items.filter(i => i[1]).length;

  const card = document.createElement("div");
  // arrancan todos minimizados: en el celular se ven los 13 grupos de una,
  // y los que estan 100% bloqueados ya no ocupan pantalla mostrando candados.
  card.className = "card " + (FIJO ? "open" : "collapsed") + (allLocked ? " all-locked" : "");

  // head
  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML =
    '<span class="icon">' + icon + '</span>' +
    '<span class="title">' + titulo + '</span>' +
    (activeCount > 0 ? '<span class="badge">' + activeCount + '</span>' : '') +
    (FIJO ? '' : '<span class="chevron">‹</span>');
  if (!FIJO) head.addEventListener("click", () => {
    const abrir = card.classList.contains("collapsed");
    // acordeon exclusivo: abrir uno cierra el resto
    document.querySelectorAll(".card").forEach(c => {
      c.classList.add("collapsed"); c.classList.remove("open");
    });
    if (abrir) { card.classList.remove("collapsed"); card.classList.add("open"); }
    // en celular el grupo abierto se queda solo en pantalla (CSS body.focus)
    document.body.classList.toggle("focus", abrir);
    if (abrir) window.scrollTo(0, 0);
  });
  card.appendChild(head);

  // body
  const body = document.createElement("div");
  body.className = "card-body";
  const box = document.createElement("div");
  box.className = "btns";
  items.forEach(([label, href, marca]) => {
    // marca: lista separada por espacios. "vieja" = abre la app anterior;
    // "principal"/"secundario" = peso dentro del grupo (lo pidio el usuario).
    const marcas = String(marca || "").split(/\s+/).filter(Boolean);
    const tiene = (m) => marcas.includes(m);
    if (href) {
      const a = document.createElement("a");
      a.className = ["op"].concat(marcas).join(" ");
      a.href = href;
      if (tiene("vieja")) a.title = "Todavía sin versión GP2: abre la pantalla de la app anterior";
      a.innerHTML = '<span class="dot"></span><span>' + label + '</span>' +
        (tiene("vieja") ? '<span class="tag">app vieja</span>' : '') +
        '<span class="arrow">›</span>';
      box.appendChild(a);
    } else {
      const s = document.createElement("span"); s.className = "op lock";
      s.innerHTML = '<span>' + label + '</span><span class="lk">🔒</span>';
      box.appendChild(s);
    }
  });
  body.appendChild(box);
  card.appendChild(body);
  grid.appendChild(card);
});

<!-- Verificacion de cajones: el aviso de las 15:00 NO va en el menu, solo en la Tablet Logistica [Elias 08/10] -->
<script>
/* Datos vivos del menu. Antes vivian en Inicio/index_GP2.html, que era una copia
   del menu viejo y quedo como redirect: el RPC "GP2".inicio_bundle() se trajo aca
   para no perder los KPIs, el badge de Disruptivas ni — sobre todo — el aviso de
   cargas de Virgilio que el espejo no pudo aplicar. */
(async () => {
  try {
    const sb = GP2_SB();
    const { data: bundle, error } = await sb.rpc("inicio_bundle");
    if (error) { console.error(error); return; }
    if (!bundle) return;
    const al = bundle.alertas || {};

    // Aviso 'cargas de Virgilio SIN aplicar' sacado a pedido del usuario 2026-08-31.

    // Cuantas disruptivas quedan pendientes este mes, sobre su propio boton.
    const nDis = Number(al.disruptivas_mes) || 0;
    if (nDis > 0) {
      const a = document.querySelector('a.op[href*="Disruptivas_GP2.html"] span:nth-child(2)');
      if (a) a.textContent = a.textContent + " (" + nDis + ")";
    }

    // Cuantas recepciones "de mas" esperan revision (GP2.alerta_recepcion, las carga la
    // Version Tablet), sobre el boton de Alertas. inicio_bundle las trae desde el 2026-09-13.
    const nRec = Number(al.recepcion_de_mas) || 0;
    if (nRec > 0) {
      const a = document.querySelector('a.op[href*="alertas_GP2.html"] span:nth-child(2)');
      if (a) a.textContent = a.textContent + " (" + nRec + " de más)";
    }

    // KPIs de hoy y del mes, debajo de la version.
    const d = bundle.dia || {}, m = bundle.mes || {};
    const kpi = document.getElementById("kpiResumen");
    if (kpi) {
      const f = v => Number(v || 0).toLocaleString("es-AR");
      const t = (k, v, d) => '<div class="kpi"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="d">' + d + '</div></div>';
      kpi.innerHTML = t("Unidades hoy", f(d.uni), f(d.registros) + " registros · " + f(d.empleados) + " operarios") +
        t("Unidades del mes", f(m.uni), f(m.registros) + " registros · " + f(m.empleados) + " operarios");
    }
  } catch (e) { console.error(e); }
})();
</script>
