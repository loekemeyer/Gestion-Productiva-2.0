<!DOCTYPE html>
<html lang="es">
<head>
  <script src="auth-guard.js?v=20261006b"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora</title>
  <link rel="stylesheet" href="gp2-modulo.css?v=20261009ds">
  <style>
    /* Una calculadora es angosta por naturaleza: un panel centrado con teclas grandes
       (se usa con el dedo en la tablet del galpón). */
    .calc{max-width:440px;margin:var(--s2) auto 0;padding:var(--s4)}
    .display{
      background:var(--ink-900);color:#fff;padding:18px 18px 14px;border-radius:var(--r-lg);
      text-align:right;margin-bottom:var(--s4);min-height:104px;
      display:flex;flex-direction:column;justify-content:flex-end;font-variant-numeric:tabular-nums;
    }
    .display-prev{font-size:var(--fs-sm);color:var(--ink-400);min-height:20px;word-break:break-all}
    .display-cur{font-size:var(--fs-hero);font-weight:700;word-break:break-all;line-height:1.15;letter-spacing:-.01em}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
    button.key{
      height:68px;border-radius:var(--r-md);border:1.5px solid var(--line-strong);
      background:var(--surface);color:var(--ink-900);font-size:24px;font-weight:650;cursor:pointer;
      transition:background .12s,border-color .12s,transform .06s;
    }
    button.key:hover{border-color:var(--ink-500);background:var(--ink-50)}
    button.key:active{transform:translateY(1px)}
    button.key.op{background:var(--ink-100);border-color:var(--ink-100);color:var(--ink-700)}
    button.key.op:hover{background:var(--ink-200)}
    button.key.del{background:var(--err-50);border-color:var(--err-200);color:var(--err-700)}
    button.key.eq{background:var(--brand-600);border-color:var(--brand-600);color:#fff;grid-column:span 2}
    button.key.eq:hover{background:var(--brand-500)}
    @media (max-width:640px){ .calc{padding:var(--s3)} button.key{height:62px} }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Calculadora Básica</h1>
      <div class="hbtns">
        <a class="back" href="calculadora.html">Atrás</a>
      </div>
    </div>
    <div class="steps">
      <div class="panel calc">
        <div class="display">
          <div class="display-prev" id="prev"></div>
          <div class="display-cur" id="cur">0</div>
        </div>

        <div class="grid">
          <button class="key del" onclick="clr()">C</button>
          <button class="key del" onclick="back()">⌫</button>
          <button class="key op"  onclick="op('%')">%</button>
          <button class="key op"  onclick="op('/')">÷</button>

          <button class="key" onclick="num('7')">7</button>
          <button class="key" onclick="num('8')">8</button>
          <button class="key" onclick="num('9')">9</button>
          <button class="key op" onclick="op('*')">×</button>

          <button class="key" onclick="num('4')">4</button>
          <button class="key" onclick="num('5')">5</button>
          <button class="key" onclick="num('6')">6</button>
          <button class="key op" onclick="op('-')">−</button>

          <button class="key" onclick="num('1')">1</button>
          <button class="key" onclick="num('2')">2</button>
          <button class="key" onclick="num('3')">3</button>
          <button class="key op" onclick="op('+')">+</button>

          <button class="key zero" onclick="num('0')">0</button>
          <button class="key" onclick="dot()">.</button>
          <button class="key eq" onclick="eq()">=</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const elCur = document.getElementById('cur');
    const elPrev = document.getElementById('prev');
    let cur = '0';
    let prev = '';
    let pending = null; // operador pendiente
    let justEq = false;

    function render(){
      elCur.textContent = cur;
      elPrev.textContent = prev + (pending ? ' ' + dispOp(pending) : '');
    }
    function dispOp(o){ return ({'+':'+','-':'−','*':'×','/':'÷','%':'%'})[o] || o; }

    function num(n){
      if (justEq){ cur = '0'; prev = ''; pending = null; justEq = false; }
      if (cur === '0') cur = n;
      else cur += n;
      render();
    }
    function dot(){
      if (justEq){ cur = '0'; prev = ''; pending = null; justEq = false; }
      if (!cur.includes('.')) cur += '.';
      render();
    }
    function back(){
      if (justEq){ clr(); return; }
      if (cur.length <= 1) cur = '0';
      else cur = cur.slice(0, -1);
      render();
    }
    function clr(){
      cur = '0'; prev = ''; pending = null; justEq = false;
      render();
    }
    function op(o){
      if (pending && prev && !justEq){
        // Aplicar pendiente: ej. 5 + 3 → al apretar otro op, calcula 8
        const r = calc(parseFloat(prev), parseFloat(cur), pending);
        cur = String(r);
        prev = String(r);
      } else {
        prev = cur;
      }
      pending = o;
      cur = '0';
      justEq = false;
      // mostramos prev sin que cur lo pise (cur=0 pero el usuario va a tipear)
      elCur.textContent = '0';
      elPrev.textContent = prev + ' ' + dispOp(pending);
    }
    function eq(){
      if (!pending || !prev) return;
      const r = calc(parseFloat(prev), parseFloat(cur), pending);
      elPrev.textContent = prev + ' ' + dispOp(pending) + ' ' + cur + ' =';
      cur = String(r);
      prev = '';
      pending = null;
      justEq = true;
      elCur.textContent = cur;
    }
    function calc(a, b, o){
      let r;
      switch(o){
        case '+': r = a + b; break;
        case '-': r = a - b; break;
        case '*': r = a * b; break;
        case '/': r = b === 0 ? 0 : a / b; break;
        case '%': r = a * b / 100; break;
        default: r = b;
      }
      // Limitar decimales para evitar 0.1+0.2=0.30000000000004
      if (!Number.isFinite(r)) return 0;
      return Math.round(r * 1e10) / 1e10;
    }

    // Teclado
    window.addEventListener('keydown', e => {
      if (/^[0-9]$/.test(e.key)) { num(e.key); e.preventDefault(); }
      else if (e.key === '.' || e.key === ',') { dot(); e.preventDefault(); }
      else if (['+','-','*','/','%'].includes(e.key)) { op(e.key); e.preventDefault(); }
      else if (e.key === 'Enter' || e.key === '=') { eq(); e.preventDefault(); }
      else if (e.key === 'Backspace') { back(); e.preventDefault(); }
      else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') { clr(); e.preventDefault(); }
    });

    render();
  </script>
</body>
</html>
