<!doctype html>
<html lang="es">
<head>
<!-- Anti-cache: la lógica de esta pantalla es JS INLINE, así que si la tablet se queda con el
     HTML viejo se queda con la pantalla vieja (no hay ?v= que la salve). -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- v1.0.0 (2026-09-21) — EL CONTROL DE LO QUE ENTREGÓ UN PROVEEDOR DE SERVICIO, EN PANTALLA APARTE
     (usuario, textual: "En recepcion de proveedores de servicio se tiene que seguir la lógica de
     primero cargar lo que dice el remito y despues hacer el control (como en recepcion de insumos)
     en el remito que sea en kg y despues controlar en kg y cajones (o unidad de medida
     correspondiente segun la parte)" + "Despues de recepcionar tengo que ir al control").
     EL MISMO CIRCUITO QUE INSUMOS, pieza por pieza: la Tablet registra lo que dice el REMITO y esa
     entrega queda PENDIENTE DE CONTROL hasta que acá se carga lo que se contó de verdad. Al
     confirmar, controlar_entrega_ps guarda lo declarado en GP2.entrega_ps_control y PISA la
     cantidad del movimiento, así que el stock queda con lo CONTROLADO y no con lo que dijo el
     papel — igual que controlar_recepcion_kg en la recepción de insumos.
     LOS CAMPOS NO SE PRECARGAN con el remito a propósito: el control es un dato nuevo (se pesa y se
     cuenta), no una confirmación. El remito queda a la vista arriba para comparar, y la diferencia
     se calcula al tipear. Arriba de la tolerancia (parametro tol_ctrl_peso_pct, hoy 2 %) la tarjeta
     se pinta y el confirmar pregunta.
     LOS CAJONES SON EL DATO FÍSICO: acá se cuentan, no se derivan de los kg (misma regla que el
     stock del proveedor, ver CONOCIMIENTO 4et). Si la pieza no tiene envase cargado, el campo no
     se pide. -->
<!-- v1.0.1 (2026-09-22) — EL ENVASE COPIA LA UNIDAD DEL ENVÍO (usuario, sobre la tarjeta de PC1A de
     Ester que pedía "Cajones": "La devolución de Ester es en bolsas como el envío. Fijate que
     pusiste como genérico cajones"). La v1.0.0 miraba sólo proveedor_servicio.entrega_unidad y si
     estaba vacía ponía "cajones" — Ester no tiene entrega_unidad porque la regla de la Tablet es
     que la entrega COPIA el envío. Ahora envaseDe() sigue el mismo orden que la Tablet y
     control_entrega_ps_bundle manda envio_unidad / envio_uni_x / sp_sector. -->
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Control de entregas · Prov. de Servicio · GP2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260905k"></script>
<!-- el CSS de la casa primero (tipografía y botones base, igual que la Tablet) y abajo lo propio -->
<link rel="stylesheet" href="../gp2-modulo.css?v=20260912c"/>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f6f8;color:#111;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       font-size:18px;-webkit-text-size-adjust:100%}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 16px 40px}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
         border-bottom:2px solid #d0d7de;padding-bottom:12px;margin-bottom:14px}
  h1{font-size:23px;margin:0;font-weight:900;color:#0b3b73}
  .hbtns{display:flex;gap:8px;flex-wrap:wrap}
  .hlink{min-height:44px;padding:10px 14px;border:2px solid #d0d7de;border-radius:10px;background:#fff;
         color:#0b3b73;font-size:16px;font-weight:800;text-decoration:none;font-family:inherit;cursor:pointer;
         display:inline-flex;align-items:center}
  h2{font-size:18px;margin:18px 0 10px;color:#475569;text-transform:uppercase;letter-spacing:.4px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{border:2px solid #d0d7de;border-radius:14px;background:#fff;padding:14px 16px;overflow-wrap:anywhere}
  .card.desvio{border-color:#c2410c;background:#fff7ed}
  .cod{font-size:21px;font-weight:900;color:#0b3b73}
  .desc{font-size:17px;font-weight:700;margin-top:2px}
  .meta{font-size:15px;color:#555;margin-top:4px}
  .remito{margin:10px 0 4px;font-size:17px;font-weight:800;color:#0b5cad}
  label{display:block;font-size:15px;font-weight:800;color:#475569;margin:10px 0 4px}
  input{width:100%;min-height:48px;font-size:20px;font-weight:700;padding:8px 10px;border:2px solid #d0d7de;
        border-radius:10px;background:#fff;color:#111;font-family:inherit;text-align:right}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  /* sin diferencia cargada no hay renglón: un hueco en blanco arriba del botón es espacio muerto */
  .diff{margin-top:8px;font-size:16px;font-weight:800;color:#166534}
  .diff:empty{display:none}
  .diff.mal{color:#c2410c}
  .btn{width:100%;min-height:52px;margin-top:10px;border:0;border-radius:12px;background:#0b5cad;color:#fff;
       font-size:18px;font-weight:900;font-family:inherit;cursor:pointer}
  .btn[disabled]{background:#b6c2cf;cursor:default}
  .empty{border:2px dashed #d0d7de;border-radius:14px;padding:22px;text-align:center;color:#555;font-size:17px}
  .table-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:16px;background:#fff}
  th,td{border:1px solid #e2e8f0;padding:8px 10px;text-align:left;white-space:nowrap}
  th{background:#eef4fb;color:#0b3b73;font-weight:800}
  td.num{text-align:right}
  .ok{color:#166534;font-weight:800}
  .mal{color:#c2410c;font-weight:800}
  #status{font-size:17px;color:#555;padding:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Control de entregas · Prov. de Servicio</h1>
    <div class="hbtns">
      <a class="hlink" href="Tablet_GP2.html">← Recepción</a>
      <a class="hlink" href="../GP2_MODULOS.html">Menú</a>
    </div>
  </header>

  <div id="status">Cargando…</div>

  <h2>Pendiente de controlar (<span id="nPend">0</span>)</h2>
  <div class="cards" id="pend"></div>

  <h2>Controlado</h2>
  <div class="table-wrap" id="hechosWrap"></div>
</div>

<script src="../auth-guard.js?v=20260912d"></script>
<script src="../gp2-ui.js?v=20260913e"></script>
<script src="../gp2-numero.js?v=20260911o"></script>
<script>
"use strict";
/* Cliente GP2 (schema GP2): nunca un createClient suelto, que cae en public. */
var SB = GP2_SB();
var $ = GP2UI.$, esc = GP2UI.esc, num = GP2N.num, fmt = GP2N.fmt;

var D = { pend: [], hechos: [], tol: 2 };

function usuario() {
  try { return localStorage.getItem("gp2_usuario") || null; } catch (e) { return null; }
}

/* Rótulo del envase de la pieza: LA MISMA REGLA que envaseDe() de la Tablet en Recibir
   [usuario 2026-09-18: "si enviamos en bolsas recepcionamos en bolsas, si lo hacemos en cajones,
   en cajones"; 2026-09-22: "La devolución de Ester es en bolsas como el envío"]:
     1) el override del proveedor (proveedor_servicio.entrega_unidad: AJ paquetes, Maspoli bolsas);
     2) si no, la unidad con la que SE LE ENVÍA (envio_unidad: Ester bolsas, Guazzaroni cajones);
     3) envío por peso (Julio, envio_unidad 'kg'): el bulto lo pone el sector — plástico en
        bolsas, el resto en cajones;
     4) P.S. sin unidad definida: cajones, como hasta ahora.
   Se pide SÓLO si la pieza tiene con qué contarlos (factor del proveedor o uni_x_cajon del SC o
   del SP): sin envase cargado no se inventa un campo que nadie puede llenar. */
function envaseDe(x) {
  var hayPieza = Number(x.sc_unixcaj || 0) > 0 || Number(x.sp_unixcaj || 0) > 0;
  if (x.entrega_unidad)
    return (Number(x.entrega_uni_x || 0) > 0 || hayPieza) ? String(x.entrega_unidad) : null;
  var ev = String(x.envio_unidad || "");
  if (ev.toLowerCase() === "kg")
    return hayPieza ? (/pl[aá]stico/i.test(String(x.sp_sector || "")) ? "bolsas" : "cajones") : null;
  if (ev) return (Number(x.envio_uni_x || 0) > 0 || hayPieza) ? ev : null;
  return hayPieza ? "cajones" : null;
}

/* La diferencia contra el remito, con su % — es para lo que existe el control. */
function difTxt(decl, ctrl, uni) {
  var d = ctrl - decl, pct = decl > 0 ? (d / decl) * 100 : 0;
  var signo = d > 0 ? "+" : "";
  return { txt: signo + fmt(d, 2) + " " + uni + " (" + signo + fmt(pct, 1) + " %)",
           pct: pct, fuera: Math.abs(pct) > Number(D.tol || 2) };
}

function pintarDiff(card) {
  var x = D.pend.filter(function (p) { return String(p.mov_id) === card.dataset.mov; })[0];
  if (!x) return;
  var q = num(card.querySelector('input[data-f="cant"]').value);
  var box = card.querySelector(".diff");
  if (!(q > 0)) { box.textContent = ""; box.classList.remove("mal"); card.classList.remove("desvio"); return; }
  var d = difTxt(Number(x.declarado), q, x.unidad);
  box.textContent = "Diferencia " + d.txt;
  box.classList.toggle("mal", d.fuera);
  card.classList.toggle("desvio", d.fuera);
}

function render() {
  var cont = $("pend");
  cont.innerHTML = "";
  $("nPend").textContent = D.pend.length;
  if (!D.pend.length) {
    cont.innerHTML = '<div class="empty">No hay entregas pendientes de controlar.</div>';
  }
  D.pend.forEach(function (x) {
    var env = envaseDe(x);
    var card = document.createElement("div");
    card.className = "card";
    card.dataset.mov = String(x.mov_id);
    card.innerHTML =
      '<div class="cod">' + esc(x.sp_cod || "") + "</div>" +
      '<div class="desc">' + esc(x.sp_desc || "") + "</div>" +
      '<div class="meta">' + esc(x.ps_nombre || "") + " · consume " + esc(x.sc_cod || "") +
        " · " + esc(GP2UI.fechaAR(String(x.fecha).slice(0, 10))) + "</div>" +
      '<div class="remito">Remito ' + fmt(Number(x.declarado), 2) + " " + esc(x.unidad) + "</div>" +
      '<div class="' + (env ? "dos" : "") + '">' +
        "<div><label>Contado (" + esc(x.unidad) + ")</label>" +
        '<input data-f="cant" inputmode="' + (x.unidad === "kg" ? "decimal" : "numeric") + '"></div>' +
        (env ? '<div><label>' + esc(env.charAt(0).toUpperCase() + env.slice(1)) + "</label>" +
               '<input data-f="caj" inputmode="numeric"></div>' : "") +
      "</div>" +
      '<div class="diff"></div>' +
      '<button class="btn" type="button" data-a="ok">Confirmar control</button>';
    cont.appendChild(card);
  });

  var t = $("hechosWrap");
  if (!D.hechos.length) { t.innerHTML = '<div class="empty">Todavía no se controló ninguna entrega.</div>'; }
  else {
    t.innerHTML =
      '<table><thead><tr><th>Parte</th><th>Proveedor</th><th class="num">Remito</th>' +
      '<th class="num">Contado</th><th class="num">Dif.</th><th class="num">Bultos</th><th>Quién</th></tr></thead><tbody>' +
      D.hechos.map(function (h) {
        var d = Number(h.diff || 0);
        return "<tr><td>" + esc(h.sp_cod || "") + "</td><td>" + esc(h.ps_nombre || "") + "</td>" +
          '<td class="num">' + fmt(Number(h.declarado), 2) + " " + esc(h.unidad) + "</td>" +
          '<td class="num">' + fmt(Number(h.controlado), 2) + " " + esc(h.unidad) + "</td>" +
          '<td class="num ' + (Math.abs(d) < 0.0005 ? "ok" : "mal") + '">' +
            (d > 0 ? "+" : "") + fmt(d, 2) + "</td>" +
          '<td class="num">' + (h.cajones == null ? "—" : fmt(Number(h.cajones), 0)) + "</td>" +
          "<td>" + esc(h.controlado_por || "—") + "</td></tr>";
      }).join("") + "</tbody></table>";
  }
}

async function cargar() {
  $("status").textContent = "Cargando…";
  var r = await SB.rpc("control_entrega_ps_bundle");
  if (r.error) { $("status").textContent = "Error: " + r.error.message; return; }
  D.pend = (r.data && r.data.pend) || [];
  D.hechos = (r.data && r.data.hechos) || [];
  D.tol = Number((r.data && r.data.tol_pct) || 2);
  $("status").textContent = D.pend.length
    ? ("Tolerancia " + fmt(D.tol, 1) + " % — arriba de eso hay que confirmar.")
    : "Todo controlado.";
  render();
}

async function confirmar(card) {
  var mov = card.dataset.mov;
  var x = D.pend.filter(function (p) { return String(p.mov_id) === mov; })[0];
  if (!x) return;
  var q = num(card.querySelector('input[data-f="cant"]').value);
  var cajEl = card.querySelector('input[data-f="caj"]');
  var caj = cajEl ? num(cajEl.value) : null;
  if (!(q > 0)) { alert("Falta la cantidad contada."); return; }

  var d = difTxt(Number(x.declarado), q, x.unidad);
  if (d.fuera && !confirm("El remito dice " + fmt(Number(x.declarado), 2) + " " + x.unidad +
      " y contaste " + fmt(q, 2) + " " + x.unidad + " (" + d.txt + ").\n\n" +
      "El stock va a quedar con lo CONTADO. ¿Confirmás?")) return;

  var btn = card.querySelector('button[data-a="ok"]');
  btn.disabled = true; btn.textContent = "Registrando…";
  var r = await SB.rpc("controlar_entrega_ps", {
    p_mov_id: Number(mov), p_cantidad: q,
    p_cajones: (caj > 0 ? caj : null), p_usuario: usuario()
  });
  if (r.error) {
    alert("No se pudo registrar: " + r.error.message);
    btn.disabled = false; btn.textContent = "Confirmar control";
    return;
  }
  await cargar();
}

document.addEventListener("input", function (ev) {
  var card = ev.target.closest && ev.target.closest(".card");
  if (card && ev.target.dataset.f === "cant") pintarDiff(card);
});
document.addEventListener("click", function (ev) {
  var btn = ev.target.closest && ev.target.closest('button[data-a="ok"]');
  if (btn) confirmar(btn.closest(".card"));
});

cargar();
</script>
</body>
</html>
