     se queda con el HTML viejo se queda con la app vieja (no hay ?v= que la salve). -->

     columnas el navegador repartía todo el ancho sobrante de la tablet entre ellas y dejaba media
     pantalla de blanco entre la pieza y su número. Ahora el bloque de carga (buscador + cartel +
     tabla) encoge con la tabla: cada columna mide lo que necesita su contenido, el buscador mide
     exactamente lo que miden las columnas, y el aire que queda va ADENTRO de cada celda (padding

     con bolsas+kg, PS por peso, PS/tallerista/inyector común y Recibir), que son un solo render. En el celular (≤640px)

<!-- v1.8.0 (2026-09-17) — ESTER: EL SUGERIDO EN BOLSAS DE 1800 Y LA CANTIDAD EN KG (usuario:
     "en el caso de Ester, el sugerido que aparezca en bolsas (1800 uni por bolsa) redondeas por
     arriba y la cantidad pones kg y te aparece al lado bolsas"). TERCERA forma de enviar, y no es
     ninguna de las dos que ya habia: AJ escribe el envase (paquetes) y Hernandez Julio (v1.7.0)
     escribe kg con el bulto que le pone el SECTOR de cada pieza. Ester mira BOLSAS —una sola
     medida para todo el proveedor, como AJ— pero PESA lo que carga, como Julio. Lo dice la base:
     proveedor_servicio.envio_carga_unidad = 'kg' (Ester = bolsas/1800/kg; AJ sigue con null y
     Julio con envio_unidad='kg' sin factor, y ninguno de los dos cambia). Con eso: encabezados
     "Sugerido (bolsas)" y "Cantidad (kg)", el sugerido en bolsas con TECHO (112.432 mangos ->
     63 bolsas), la cantidad precargada en los kg de esas bolsas (63 x 1800 x 0,0054 = 612,36 kg)
     y debajo del campo "= 63 bolsas", que se recalcula mientras se tipea. Al registrar viaja el KG
     tal cual y to_canonical lo pasa a mangos con kg_x_uni: el inventario nunca ve bolsas. Si a la
     pieza le falta kg_x_uni no hay forma de pasar de bolsas a kg, asi que esa fila cae al modo de
     AJ (se carga en bolsas) en vez de inventar.
     OJO: bolsa != cajon. uni_x_cajon de PC2 es 1852 y de PC3B 1800, pero la bolsa es 1800 para las
     dos; por eso el factor de Ester vive en el proveedor y no se saca del componente (al contrario
     de Julio, donde el bulto SI sale de componente.uni_x_cajon). Las bolsas quedan anotadas en
     movimiento.cajones (mismo criterio que las bolsas calculadas de Julio): es informativo, el
     stock lo mueve la cantidad en kg. -->
<!-- v1.7.0 (2026-09-17) — ENVIO A HERNANDEZ JULIO: SE MANDA POR PESO, CON EL BULTO AL LADO
     (usuario: "para lo que son partes plásticas, que empieza con la letra P, el envío sugerido tiene
     que estar nominado en bolsas… cuántos kilos le están mandando y cuántas bolsas eso significa.
     Después, para A1, B12, B4B y C2, el sugerido en kilos y en cajones a enviar, y anotar cuántos
     kilos y cuántos cajones le están mandando").
     UNIDAD DE ENVIO 'kg' POR PROVEEDOR (proveedor_servicio.envio_unidad='kg', sin envio_uni_x). A
     diferencia de AJ Adhesivos —una sola unidad para todo el proveedor— acá el BULTO cambia por
     pieza, así que sale del SECTOR de cada una: Sector Plástico → bolsas, el resto → cajones (en
     los plásticos componente.uni_x_cajon ES el tamaño de la bolsa). La tabla pasa a 4 columnas:
     Pieza | Sugerido (kg y "= N bolsas/cajones") | Kg a enviar | Bolsas/cajones.
     Los KG son lo que se tipea (manda la balanza) y lo que se registra (unidad 'kg'; la base los
     pasa a unidades con kg_x_uni). El bulto de los plásticos es CALCULADO (display, se repinta al
     tipear); el de las metálicas es un campo EDITABLE que se autocompleta desde los kg mientras el
     operario no lo toque, y viaja como movimiento.cajones (crear_envio_ps ya tenía p_cajones;

     como siempre, no se inventa el factor. -->

     (usuario: "quiero que la cantidad me la preestablezcas en paquetes tambien"). La cantidad ya se

<!-- v1.0.0 (2026-09-13) — Versión Tablet del operario (ideas 7342/7343). UNA pantalla con tres
     modos — Enviar / Recibir / Conteo — para la tablet del galpón, en vez de abrir la pantalla

     online si trae un tallerista / PS / Virgilio) y "GP2".tablet_registrar(p) (reusa las RPC de
     siempre — crear_envio_*, crear_entrega_*, crear_recepcion_insumo — y NO inventa movimientos).
     La alerta de "recibí de más" AVISA pero NO FRENA: el operario registra igual y la alerta queda
     en GP2.alerta_recepcion para que la revisen en Alertas.
     Dos trampas de unidad (las anotó la sesión que armó el backend):
       · el proveedor de artículo terminado entrega CAJAS: se carga en cajas y el esperado de la
         OC está en unidades (por_caja las cruza);
       · una pieza cuya unidad es kg se manda y se recibe en kg (teclado con coma).
     El Conteo no escribe nada: es la ayuda para contar contra el online; el ajuste de stock va

<style>
  /* los tres modos: baldosas grandes, el activo en negro (mismo lenguaje que .seg-btn).
     Conteo es un <a>: se va al módulo de Relevamientos, así que nunca queda "activo". */
  .modos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
  .modo-btn{min-height:60px;border-radius:12px;border:2px solid #d0d7de;background:#fff;
    font-weight:900;font-size:20px;cursor:pointer;color:#111;text-decoration:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .modo-btn.active{background:#111;color:#fff;border-color:#111}
  .modo-btn small{display:block;font-size:13px;font-weight:700;color:#777;margin-top:2px}
  .modo-btn.active small{color:#cfcfcf}
  /* Primero el TIPO y recién después la contraparte: 33 botones juntos no se leen en la
     tablet. No se estiran a todo el ancho (máximo 320px cada uno) para no dejar baldosas
     enormes con dos palabras adentro. */
  .tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,320px));gap:10px;
    margin:8px 0;justify-content:start}
  .tipo-btn{min-height:78px;border-radius:12px;border:2px solid #d0d7de;background:#fff;color:#111;
    padding:12px 16px;text-align:left;cursor:pointer;text-decoration:none;display:block}
  .tipo-btn:hover{border-color:#111}
  .tipo-btn .ti{display:block;font-size:21px;font-weight:900}
  .tipo-btn small{display:block;font-size:14px;font-weight:700;color:#777;margin-top:4px;line-height:1.3}
  .tipo-btn small b{color:#c2410c}
  .cp-tipo{font-size:14px;color:#777;font-weight:700}
  /* fila con exceso: se ve, no frena */
  table.t tr.demas td{background:#fff4e5}
  .demas-tag{display:inline-block;margin-top:4px;background:#c2410c;color:#fff;border-radius:999px;
    padding:3px 10px;font-size:14px;font-weight:800;white-space:nowrap}
  .esp{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .esp small{display:block;color:#777;font-size:13px;font-weight:700}
  .uni-tag{display:inline-block;background:#eef2f6;border-radius:6px;padding:2px 7px;font-size:13px;
    font-weight:800;color:#333;margin-left:4px;white-space:nowrap}
  .uni-tag.kg{background:#e6f0ff;color:#0b4aa2}
  .cell-in.big{font-size:20px;width:110px}
  /* equivalencia en la unidad de envio del proveedor (Ester: se carga kg, al lado las bolsas) */
  .env-eq{display:block;margin-top:4px;color:#0b4aa2;font-size:14px;font-weight:800;white-space:nowrap}
  .alerta-box{margin:10px 0;border:2px solid #f4c08c;background:#fff4e5;border-radius:12px;padding:12px 14px;
    font-size:17px;color:#5c2d00;line-height:1.4}
  .alerta-box b{color:#8a3b00}
  input#fRemito{height:44px;border:2px solid #d0d7de;border-radius:8px;padding:0 10px;font-size:19px;width:150px}
  /* COLUMNAS SIN BLANCO MUERTO EN LA TABLET [usuario 2026-09-17: "optimizame todos los espacios en
     blanco que hay entre las columnas en todas las pantallas de envio a ps en la version tablet"].
     table.t viene a width:100% de gp2-modulo.css: con 3 o 4 columnas el navegador repartia el ancho
     sobrante y dejaba un desierto entre la pieza y su numero (el ojo tenia que cruzar media pantalla
     para leer una fila). Aca #tblBox (buscador + cartel + tabla) es inline-block: encoge hasta el
     ancho de la tabla, y la tabla al de su propio contenido. El .table-wrap sigue con su scroll
     propio para cuando no entra (celular, o muchas columnas). */
  #tblBox{display:inline-block;max-width:100%;vertical-align:top}
  .table-wrap{display:block;max-width:100%}
  table.t{width:100%}   /* 100% de #tblBox, que ya mide lo que mide el contenido */
  /* un poco mas de aire ADENTRO de cada columna, que es el unico blanco que suma: separa los
     numeros del borde sin volver a abrir el hueco entre columnas. */
  table.t th,table.t td{padding-left:12px;padding-right:12px}
  table.t td.num,table.t th.num{white-space:nowrap}
  /* la de Pieza es la unica que puede crecer: con techo, para que una descripcion larga no reabra
     el hueco; abajo del techo la descripcion envuelve en dos lineas. */
  table.t th:first-child,table.t td:first-child{max-width:340px}
  table.t td:first-child .sub{white-space:normal}
  @media (max-width:640px){
    .modo-btn{font-size:17px;min-height:56px}
    .modo-btn small{display:none}
    /* en el celular no hay blanco que recortar: el bloque ocupa todo el ancho */
    #tblBox{display:block;width:100%}
    table.t th,table.t td{padding-left:8px;padding-right:8px}
  }
</style>

<script src="../gp2-ui.js?v=20260913e"></script>
<script src="../gp2-numero.js?v=20260911o"></script>
<script src="../gp2-envios-common.js?v=20260905c"></script>
<script>
"use strict";

var E = GP2EE;
var $ = GP2UI.$, esc = GP2UI.esc, num = GP2N.num, fmt = GP2N.fmt, hoyISO = E.hoyISO;
var SB = GP2_SB();

var D = { contrapartes: [], enviar: [], recibir: [], alertas_abiertas: 0 };
var MODO = null;        // enviar | recibir  (Conteo no es un modo: es el salto a Relevamientos)
var selTipo = null;     // tallerista | proveedor_servicio | proveedor_at | virgilio
var selCP = null;       // { tipo, ref, nombre, id }
var BUF = E.buffer("gp2_tablet_buffer", function(){ return { q: "" }; });

/* Los TIPOS de contraparte de cada modo, en el orden en que el operario los busca. El que trae
   `link` no se carga acá: abre la pantalla que ya hace ese trabajo, para no tener dos copias de
   la misma lógica. */
var TIPOS = {
  enviar: [
    { tipo: "tallerista",         icono: "👷", titulo: "Talleristas",            sub: "lo que arman afuera" },
    { tipo: "proveedor_servicio", icono: "🏭", titulo: "Prov. de servicio",      sub: "pintan, niquelan, cortan, inyectan" },
    { tipo: "proveedor_at",       icono: "📦", titulo: "Prov. de art. terminado", sub: "cartones y cajas" }
  ],
  recibir: [
    { tipo: "tallerista",         icono: "👷", titulo: "Talleristas",       sub: "lo que traen armado" },
    { tipo: "proveedor_servicio", icono: "🏭", titulo: "Prov. de servicio", sub: "lo que devuelven procesado" },
    { tipo: "proveedor_insumo",   icono: "🧰", titulo: "Prov. de insumos",  sub: "flejes, cartones, plásticos, garage",
      link: "../StockFlejes/RecepcionInsumos_GP2.html?volver=tablet" },
    { tipo: "virgilio",           icono: "🚚", titulo: "Virgilio",          sub: "lo que vuelve a Cervantes" }
  ]
};

/* La unidad con la que se CARGA cada fila. El contrato de tablet_registrar acepta 'uni' o 'kg';
   componente.unidad_medida dice 'kg' o 'unidad'. Desde que el prov. de art. terminado salió de
   Recibir (entrega en Virgilio, no acá) no queda nada que se cargue en CAJAS. */
function unidadDe(x){
  return String(x.um || "").toLowerCase() === "kg" ? "kg" : "uni";
}
function inputmodeDe(u){ return u === "kg" ? "decimal" : "numeric"; }
function uniTag(u){ return '<span class="uni-tag ' + u + '">' + u + "</span>"; }

/* clave de fila: en recibir una pieza puede aparecer dos veces (dos entradas distintas del PS) */
function claveDe(x){
  return String(x.comp_id || "") + ":" + String(x.comp_entrada_id || "") + ":" + String(x.cod_art || "");
}
function claveCP(c){ return MODO + ":" + c.tipo + ":" + c.ref; }

/* En Enviar tienen sugerido: PS y talleristas (máximo − stock − lo que ya está en el destino) y
   los INYECTORES (bolsas de resina en kg = Σ deficit de las partes plásticas × kg_x_uni). Prov. AT
   no tiene sugerido y ahí la tablet sigue mostrando "Online sector". */
function envConSugerido(){
  return MODO === "enviar" && !!selCP &&
    (selCP.tipo === "proveedor_servicio" || selCP.tipo === "tallerista" || selCP.tipo === "inyector");
}

/* Unidad de ENVIO del proveedor (display), p.ej. AJ Adhesivos manda de a PAQUETES de 100 pliegos
   [usuario 2026-09-17]. Solo presentacion: sugerido y cantidad se MUESTRAN/CARGAN divididos por
   factor y rotulados con label, pero al registrar se multiplica de nuevo y se guarda en la unidad
   canonica (uni/kg). Devuelve {factor,label} si el proveedor lo definio (envio_uni_x>1), o null. */
function packEnvio(){
  if (!selCP || MODO !== "enviar") return null;
  var f = Number(selCP.envio_uni_x || 0);
  if (!(f > 1) || !selCP.envio_unidad) return null;
  // cargaKg: el sugerido se MIRA en bolsas pero la cantidad se ESCRIBE en kg (Ester). Sin esto
  // (AJ Adhesivos) el campo va en la misma unidad de envio que el sugerido.
  return { factor: f, label: String(selCP.envio_unidad),
           cargaKg: String(selCP.envio_carga_unidad || "").toLowerCase() === "kg" };
}

/* Cuantos KG entran en UNA unidad de envio de esta pieza. Si la pieza se cuenta en unidades, la
   bolsa son factor x kg_x_uni (Ester: 1800 x 0,0054 = 9,72 kg); si la pieza ya se mide en kg, el
   factor YA esta en kg. 0 = no se puede saber (a la pieza le falta kg_x_uni). */
function kgPorEnvase(x, pk){
  if (!pk) return 0;
  if (unidadDe(x) === "kg") return pk.factor;
  var k = Number(x.kg_x_uni || 0);
  return k > 0 ? pk.factor * k : 0;
}
/* true si la CANTIDAD de esta fila se carga en kg. Pide las dos cosas: que el proveedor lo diga
   (envio_carga_unidad='kg') y que la pieza permita pasar de bolsas a kg. Si no, la fila cae al
   modo de AJ (se carga en la unidad de envio) en vez de mostrar un kg inventado. */
function cargaEnKg(x, pk){
  return !!(pk && pk.cargaKg && kgPorEnvase(x, pk) > 0);
}
/* El "= N bolsas" que va debajo del campo cuando la cantidad se carga en kg. */
function equivEnvase(kg, kgEnv, label){
  var n = (kgEnv > 0) ? (Number(kg || 0) / kgEnv) : 0;
  var ent = Math.abs(n - Math.round(n)) < 0.005;
  return "= " + fmt(ent ? Math.round(n) : n, ent ? 0 : 2) + " " + label;
}

/* Envio POR PESO: el proveedor recibe pesado (hoy Hernandez Julio). Se marca con
   proveedor_servicio.envio_unidad='kg' SIN envio_uni_x, porque acá el bulto no es uno solo para
   todo el proveedor como en AJ: cambia por pieza (ver bultoDe). */
function pesoEnvio(){
  if (!selCP || MODO !== "enviar") return false;
  return String(selCP.envio_unidad || "").toLowerCase() === "kg" && !(Number(selCP.envio_uni_x) > 1);
}

/* El BULTO de una pieza cuando se manda por peso: las partes plásticas van en BOLSAS y el resto en
   CAJONES. El tamaño del bulto es componente.uni_x_cajon en los dos casos (en los plásticos esa
   columna ES el tamaño de la bolsa). Sin kg_x_uni no hay conversión: devuelve null y la fila se
   carga como siempre, en unidades. */
function bultoDe(x){
  var kgu = Number((x && x.kg_x_uni) || 0), uxc = Number((x && x.uxc) || 0);
  if (!(kgu > 0)) return null;
  var plast = /pl[aá]stico/i.test(String((x && x.sector) || ""));
  return { kgu: kgu, uxc: uxc > 0 ? uxc : 0, label: plast ? "bolsas" : "cajones", editable: !plast };
}
function bultosDeKg(b, kg){
  return (b && b.uxc > 0 && kg > 0) ? (kg / b.kgu / b.uxc) : null;
}
function textoBultos(b, kg){
  var v = bultosDeKg(b, kg);
  return v != null ? fmt(v, 2) + " " + b.label : "—";
}

/* ---------- carga ---------- */
async function cargar(){
  try {
    var r = await SB.rpc("tablet_bundle");
    if (r.error) throw r.error;
    D = r.data || D;
    BUF.load();
    var m = new URLSearchParams(location.search).get("modo");
    var guardado = null;
    try { guardado = localStorage.getItem("gp2_tablet_modo"); } catch(e){}
    setModo(m || guardado || "enviar");
  } catch(e){
    $("status").innerHTML = '<span style="color:#b91c1c">Error: ' + esc(e.message || e) + "</span>";
  }
}

function setModo(m){
  if (m !== "enviar" && m !== "recibir") m = "enviar";
  MODO = m;
  try { localStorage.setItem("gp2_tablet_modo", m); } catch(e){}
  var bs = document.querySelectorAll("#modos .modo-btn");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("active", bs[i].dataset.modo === m);
  mostrarTipos();
}

/* contrapartes que aplican al modo. En enviar, sólo a quien se le manda desde Cervantes.
   En recibir queda afuera el prov. de art. terminado (entrega en Virgilio) y el prov. de
   insumos, que tiene su propia pantalla con rubros, pesaje y cruce contra OC. */
function cpsDelModo(){
  return (D.contrapartes || []).filter(function(c){
    if (MODO === "enviar") return c.tipo !== "virgilio" && c.tipo !== "proveedor_insumo" && Number(c.n_env) > 0;
    return c.tipo !== "proveedor_at" && c.tipo !== "proveedor_insumo" && Number(c.n_rec) > 0;
  });
}
function cpsDelTipo(tipo){
  // Los INYECTORES (tipo 'inyector') se muestran DENTRO de "Prov. de servicio": el usuario los
  // manda al mismo lugar mental. En la base son proveedor_insumo/inyector, no proveedor_servicio;
  // el envio de bolsas lo rutea tablet_registrar a enviar_material_inyector. [usuario 2026-09-15]
  return cpsDelModo().filter(function(c){
    return c.tipo === tipo || (tipo === "proveedor_servicio" && c.tipo === "inyector");
  });
}
/* la contraparte como la espera el resto de la pantalla (id = clave del buffer) */
function cpItem(c){
  return { id: claveCP(c), tipo: c.tipo, ref: c.ref, nombre: c.nombre,
           envio_unidad: c.envio_unidad, envio_uni_x: c.envio_uni_x,
           envio_carga_unidad: c.envio_carga_unidad,
           n: MODO === "enviar" ? c.n_env : c.n_rec };
}
function cargadasDeCP(c){
  return E.cargadasDe(BUF.all[claveCP(c)], function(it){ return num(it.q) > 0; }).length;
}
function avisoAlertas(){
  return Number(D.alertas_abiertas) > 0
    ? "⚠ " + D.alertas_abiertas + " alerta" + (D.alertas_abiertas === 1 ? "" : "s") + " de recepción sin revisar"
    : "";
}

/* ---------- paso 1: el tipo ---------- */
function mostrarTipos(){
  selTipo = null; selCP = null;
  E.mostrarFase(0);
  $("tipoGrid").classList.remove("hidden");
  $("cpBox").classList.add("hidden");
  $("btnVolverTipo").classList.add("hidden");
  $("fase0Title").textContent = MODO === "enviar" ? "¿A quién le enviás?" : "¿Quién trae?";
  pintarTipos();
}

function pintarTipos(){
  var g = $("tipoGrid");
  g.innerHTML = "";
  (TIPOS[MODO] || []).forEach(function(t){
    var lista = t.link ? null : cpsDelTipo(t.tipo);
    if (lista && !lista.length) return;   // un tipo sin contrapartes no se dibuja: no lleva a nada
    var b = document.createElement(t.link ? "a" : "button");
    if (t.link) b.href = t.link; else b.type = "button";
    b.className = "tipo-btn";
    b.dataset.tipo = t.tipo;
    // el número sin la palabra "contraparte": el título del tipo ya dice qué son. NO se muestra
    // "N sin registrar" [usuario 2026-09-16]: desde que Enviar precarga el sugerido, abrir una
    // contraparte ya llenaba el buffer y el cartelito contaba destinos sin trabajo real.
    b.innerHTML = '<span class="ti">' + t.icono + " " + esc(t.titulo) + "</span><small>" + esc(t.sub) +
      (lista ? " · " + lista.length : "") + "</small>";
    if (!t.link) b.addEventListener("click", function(){ elegirTipo(t); });
    g.appendChild(b);
  });
  $("status").textContent = avisoAlertas();
}

/* ---------- paso 2: la contraparte de ese tipo ---------- */
function elegirTipo(t){
  selTipo = t.tipo;
  var lista = cpsDelTipo(t.tipo);
  if (lista.length === 1) { elegir(cpItem(lista[0])); return; }  // un solo destino: no se elige entre uno
  $("tipoGrid").classList.add("hidden");
  $("cpBox").classList.remove("hidden");
  $("btnVolverTipo").classList.remove("hidden");
  $("fase0Title").textContent = t.titulo;
  $("q0").value = "";
  pintarCPS();
}

function pintarCPS(){
  var lista = E.filtrar(cpsDelTipo(selTipo), $("q0").value, function(c){ return c.nombre; });
  E.gridContrapartes("cpGrid", lista.map(cpItem), {
    vacio: "No hay a quién en este modo.",
    meta: function(c){
      // el tipo no se repite en cada chip: ya lo dice el título de arriba
      var cargado = E.cargadasDe(BUF.all[c.id], function(it){ return num(it.q) > 0; }).length;
      return c.n + " pieza" + (c.n === 1 ? "" : "s") +
        (cargado ? (" · <b>" + cargado + " cargadas</b>") : "");
    },
    onPick: elegir
  });
  var av = avisoAlertas();
  $("status").textContent = lista.length + " para elegir" + (av ? " · " + av : "");
}

/* ---------- piezas de la contraparte elegida ---------- */
function piezasDe(c){
  var arr;
  if (MODO === "enviar") {
    // Cada contraparte ve SOLO sus piezas (para prov. AT, los cartones/cajas que la receta de
    // sus articulos usa; antes iba con ref '*' y mostraba los 191 a todos, bug 2026-09-15).
    arr = (D.enviar || []).filter(function(x){
      return x.tipo === c.tipo && String(x.ref) === String(c.ref);
    });
  } else {
    arr = (D.recibir || []).filter(function(x){ return x.tipo === c.tipo && String(x.ref) === String(c.ref); });
  }
  return arr.sort(function(a,b){ return String(a.cod).localeCompare(String(b.cod)); });
}

function elegir(c){
  selCP = c;
  $("fase1Title").textContent = c.nombre;
  E.mostrarFase(1);
  var esRec = MODO === "recibir";
  $("lblRemito").classList.toggle("hidden", !esRec);
  $("fRemito").classList.toggle("hidden", !esRec);
  if (!$("fFecha").value) $("fFecha").value = hoyISO();
  $("q").value = "";
  // Enviar con sugerido: la tabla muestra SOLO Pieza · Sugerido · Cantidad [usuario 2026-09-17:
  // "quiero ver solo la columna de pieza, sugerido y cantidad"]. Se sacaron Stock PS/Stock Tall.
  // (saldo_dest) y Máximo/O.C. (maximo); el cálculo del sugerido no cambia, solo el render.
  // Si el proveedor tiene unidad de envío propia (paquetes, etc.) se aclara en ambos encabezados.
  var _pk = packEnvio();
  var _u = _pk ? " (" + esc(_pk.label) + ")" : "";
  // Ester mira el sugerido en bolsas pero PESA lo que manda: ahí la Cantidad va en kg.
  var _uq = (_pk && _pk.cargaKg) ? " (kg)" : _u;
  // Envío por peso (Julio): 4 columnas — el sugerido en kg con su equivalencia en bultos, los kg
  // que se mandan, y el bulto (bolsas calculadas en los plásticos / cajones a mano en el resto).
  $("thead").innerHTML = pesoEnvio()
    ? "<th>Pieza</th><th class=\"num\">Sugerido</th><th class=\"num sep\">Kg a enviar</th><th class=\"num\">Bolsas / cajones</th>"
    : MODO === "enviar"
    ? (envConSugerido()
        ? "<th>Pieza</th><th class=\"num\">Sugerido" + _u + "</th><th class=\"num sep\">Cantidad" + _uq + "</th>"
        : "<th>Pieza</th><th class=\"num\">Online sector</th><th class=\"num sep\">Cantidad</th>")
    : "<th>Pieza</th><th class=\"num\">Esperado</th><th class=\"num sep\">Recibido</th>";
  // precarga UNA vez: el sugerido entra como cantidad por defecto (editable). Sólo toca campos sin
  // cargar, así que si el operario vació uno a mano no se lo vuelve a llenar en cada render.
  if (envConSugerido()) {
    var _pk = packEnvio(), _peso = pesoEnvio();
    piezasDe(c).forEach(function(x){
      var it = BUF.item(c.id, claveDe(x));
      var rawSug = Number(x.sugerido);
      var b = _peso ? bultoDe(x) : null;
      // el sugerido se precarga en la unidad de envío del proveedor: por peso va EN KG (sugerido ×
      // kg_x_uni, Julio); por paquetes/bolsas se divide por el factor con redondeo PARA ARRIBA (no
      // se pide menos de lo que falta), y si ADEMÁS se carga en kg (Ester) se precarga el peso de
      // esas bolsas enteras (63 × 1800 × 0,0054 = 612,36 kg); sin unidad propia, tal cual viene.
      var sugEnv = _pk ? Math.ceil(rawSug / _pk.factor) : rawSug;
      var _kgEnv = kgPorEnvase(x, _pk), _ckg = cargaEnKg(x, _pk);
      var sug = b ? rawSug * b.kgu : (_ckg ? sugEnv * _kgEnv : sugEnv);
      var dec = (b || _ckg) ? 2 : ((!_pk && unidadDe(x) === "kg") ? 2 : 0);
      var vacio = (it.q === undefined || it.q === null || it.q === "");
      // migración: si el proveedor ahora manda por paquetes/bolsas (o por peso) pero en el buffer
      // quedó guardado el sugerido VIEJO (en unidades de una versión anterior, o en bolsas antes de
      // pasar a kg), se reemplaza por el valor nuevo. Solo si el valor guardado es EXACTAMENTE esa
      // precarga vieja: una edición del operario no se toca.
      var precargaVieja = (_pk || b) && !vacio &&
        (it.q === fmt(rawSug, unidadDe(x) === "kg" ? 2 : 0) || (_ckg && it.q === fmt(sugEnv, 0)));
      // se precarga con el formato de la casa (coma decimal / punto de miles), que es el que
      // GP2N.num sabe leer; String(sugerido) con punto se leería como miles.
      if ((vacio || precargaVieja) && sug > 0) {
        it.q = fmt(sug, dec);
        // los cajones de las metálicas arrancan en lo que dan esos kg; el operario los corrige.
        if (b && b.editable) {
          var nb = bultosDeKg(b, sug);
          it.c = nb != null ? fmt(nb, 2) : "";
          it.cAuto = it.c;
        }
      }
    });
    BUF.save();
  }
  render();
}

/* El "← Cambiar" vuelve un paso, no al principio: a la lista de contrapartes del tipo, y
   si ese tipo tenía una sola (Virgilio) directamente a los tipos. */
function volver(){
  selCP = null;
  if (!selTipo || cpsDelTipo(selTipo).length <= 1) { mostrarTipos(); return; }
  E.mostrarFase(0);
  $("tipoGrid").classList.add("hidden");
  $("cpBox").classList.remove("hidden");
  $("btnVolverTipo").classList.remove("hidden");
  pintarCPS();
}

/* esperado en la unidad con la que se carga */
function esperadoTxt(x){
  if (x.esperado == null) return '<span class="esp">—<small>sin referencia</small></span>';
  var u = unidadDe(x);
  var e = Number(x.esperado);
  var origen = { oc: "según OC", online_tall: "stock que tiene", online_ps: "stock que tiene",
                 online_virgilio: "online Virgilio" }[x.esperado_origen] || x.esperado_origen || "";
  return '<span class="esp">' + fmt(e, u === "kg" ? 2 : 0) + " " + u + "<small>" + esc(origen) + "</small></span>";
}

function exceso(x, q){
  if (MODO !== "recibir" || x.esperado == null || !(q > 0)) return 0;
  var d = q - Number(x.esperado);
  return d > 0 ? d : 0;
}

function render(){
  var arr = E.filtrar(piezasDe(selCP), $("q").value, function(x){
    return String(x.cod || "") + " " + String(x.desc || "") + " " + String(x.ent_cod || "") + " " + String(x.sector || "");
  });
  var tb = $("tbody");
  tb.innerHTML = "";
  $("tblEmpty").classList.toggle("hidden", arr.length > 0);
  if (!arr.length) $("tblEmpty").textContent = "Sin resultados para ese filtro.";

  arr.forEach(function(x){
    var k = claveDe(x);
    var it = BUF.item(selCP.id, k);
    var u = unidadDe(x);
    var q = num(it.q);
    var tr = document.createElement("tr");
    tr.dataset.k = k;
    var sub = esc(x.desc || "");
    if (MODO === "recibir" && x.ent_cod) sub += ' · <span class="proc">consume ' + esc(x.ent_cod) + "</span>";
    var ex = exceso(x, q);
    var cargaKgFila = false, kgEnvFila = 0, labelEnvFila = "";
    // el cartelito de unidad dice con qué se carga la fila: por peso siempre kg, aunque la pieza
    // sea de unidades (a Julio se le manda pesado; a Ester también, ver más abajo).
    var uCarga = (MODO === "enviar" && pesoEnvio() && bultoDe(x)) ? "kg" : u;
    var pieza = '<td><span class="cod">' + esc(x.cod) + "</span>" + uniTag(uCarga) +
      '<br><small class="sub">' + sub + "</small>" +
      (ex > 0 ? '<br><span class="demas-tag">⚠ ' + fmt(ex, u === "kg" ? 2 : 0) + " de más</span>" : "") + "</td>";
    var mitad;
    // el bulto de la pieza cuando el proveedor recibe por peso (null = se carga en unidades)
    var b = (MODO === "enviar" && pesoEnvio()) ? bultoDe(x) : null;
    if (MODO === "enviar") {
      // Solo el Sugerido (se sacaron Stock y Máximo) [usuario 2026-09-17]. Si el proveedor recibe
      // por peso, el sugerido va en kg con la equivalencia en bultos abajo; si manda por paquetes,
      // en paquetes (techo); si no, en su unidad. Sigue precargado en la carga; el cálculo del
      // sugerido no cambió, solo el render.
      var _pk = packEnvio();
      var sugM = x.sugerido;
      if (_pk && x.sugerido != null) sugM = Math.ceil(Number(x.sugerido) / _pk.factor);
      if (b) {
        var sugKg = x.sugerido != null ? Number(x.sugerido) * b.kgu : null;
        var sugB = bultosDeKg(b, sugKg);
        mitad = '<td class="num esp"><b>' + fmt(sugKg, 2, "—") + " kg</b><small>" +
          (sugB != null ? "= " + fmt(sugB, 2) + " " + b.label
                        : "sin " + (b.label === "bolsas" ? "bolsa" : "cajón") + " cargado") + "</small></td>";
      } else {
        mitad = envConSugerido()
          ? ('<td class="num esp"><b>' + fmt(sugM, (!_pk && u === "kg") ? 2 : 0, "—") + "</b></td>")
          : ('<td class="num esp">' + fmt(x.online_sector, u === "kg" ? 2 : 0) + " " + u + "</td>");
      }
      // Ester: el sugerido queda en bolsas pero la cantidad se escribe en kg, así que debajo del
      // campo va a cuántas bolsas equivale lo tipeado (se recalcula en el evento input).
      cargaKgFila = cargaEnKg(x, _pk);
      kgEnvFila = kgPorEnvase(x, _pk);
      labelEnvFila = _pk ? _pk.label : "";
    } else {
      mitad = '<td class="num">' + esperadoTxt(x) + "</td>";
    }
    var carga = E.tdInput("q", it.q, false, "sep", (b || cargaKgFila) ? "decimal" : inputmodeDe(u))
                 .replace('class="cell-in', 'class="cell-in big');
    if (cargaKgFila)
      carga = carga.replace("</td>", '<small class="env-eq">' +
                esc(equivEnvase(q, kgEnvFila, labelEnvFila)) + "</small></td>");
    // por peso se agrega la columna del bulto: las bolsas de los plásticos son calculadas (salen de
    // los kg tipeados) y los cajones de las metálicas se anotan a mano.
    if (b) carga += b.editable
      ? E.tdInput("c", it.c, false, "", "decimal").replace('class="cell-in', 'class="cell-in big')
      : ('<td class="num esp bultos">' + textoBultos(b, q) + "</td>");
    tr.innerHTML = pieza + mitad + carga;
    if (ex > 0) tr.classList.add("demas");
    tb.appendChild(tr);
  });
  actualizar();
}

function cargadas(){ return E.cargadasDe(BUF.de(selCP.id), function(it){ return num(it.q) > 0; }); }

function actualizar(){
  var n = cargadas().length;
  E.actualizarEnviar(n, MODO === "enviar" ? "Enviar" : "Recibir");
  // el aviso de exceso: informa, no frena (el botón sigue habilitado)
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });
  var conExceso = cargadas().filter(function(o){ return meta[o.k] && exceso(meta[o.k], num(o.it.q)) > 0; });
  var box = $("alertaBox");
  box.classList.toggle("hidden", conExceso.length === 0);
  if (conExceso.length) {
    box.innerHTML = "⚠ <b>Estás recibiendo más de lo esperado</b> en " + conExceso.length + " pieza" +
      (conExceso.length === 1 ? "" : "s") + " (" + conExceso.map(function(o){ return esc(meta[o.k].cod); }).join(", ") +
      "). <b>Podés registrar igual</b>: queda una alerta para que la revisen en Alertas.";
  }
}

/* ---------- eventos ---------- */
$("tbody").addEventListener("input", function(e){
  var inp = e.target.closest("input.cell-in");
  if (!inp) return;
  var tr = inp.closest("tr");
  BUF.item(selCP.id, tr.dataset.k)[inp.dataset.f] = inp.value;
  BUF.save();
  // repintar sólo lo que cambia de esa fila (el aviso de exceso), sin perder el foco
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });
  var x = meta[tr.dataset.k];
  if (x) {
    var q = num(inp.value), u = unidadDe(x), ex = exceso(x, q);
    // Ester: la cantidad se escribe en kg y debajo se ve a cuántas bolsas equivale
    var eq = tr.querySelector(".env-eq");
    if (eq) {
      var _pk2 = packEnvio();
      eq.textContent = equivEnvase(q, kgPorEnvase(x, _pk2), _pk2 ? _pk2.label : "");
    }
    // envío por peso: el bulto acompaña a los kg. En los plásticos es calculado (se repinta la
    // celda); en las metálicas se autocompleta mientras el operario no lo haya tocado — si lo
    // corrigió a mano, no se le pisa.
    var bb = (MODO === "enviar" && pesoEnvio()) ? bultoDe(x) : null;
    if (bb && inp.dataset.f === "q") {
      var it2 = BUF.item(selCP.id, tr.dataset.k);
      if (bb.editable) {
        var vacioC = (it2.c === undefined || it2.c === null || it2.c === "");
        if (vacioC || it2.c === it2.cAuto) {
          var nb = bultosDeKg(bb, q);
          it2.c = nb != null ? fmt(nb, 2) : "";
          it2.cAuto = it2.c;
          var inC = tr.querySelector('input[data-f="c"]');
          if (inC) inC.value = it2.c;
          BUF.save();
        }
      } else {
        var celB = tr.querySelector("td.bultos");
        if (celB) celB.textContent = textoBultos(bb, q);
      }
    }
    tr.classList.toggle("demas", ex > 0);
    var old = tr.querySelector(".demas-tag"); if (old) { old.previousSibling && old.previousSibling.nodeName === "BR" && old.previousSibling.remove(); old.remove(); }
    if (ex > 0) tr.firstElementChild.insertAdjacentHTML("beforeend", '<br><span class="demas-tag">⚠ ' + fmt(ex, u === "kg" ? 2 : 0) + " de más</span>");
  }
  actualizar();
});

$("q").addEventListener("input", render);
$("q0").addEventListener("input", pintarCPS);
$("btnVolver").addEventListener("click", volver);
$("btnOtro").addEventListener("click", function(){ location.reload(); });
$("btnVolverTipo").addEventListener("click", mostrarTipos);
$("modos").addEventListener("click", function(e){
  var b = e.target.closest("button.modo-btn");   // Conteo es un <a>: se va solo a Relevamientos
  if (b) setModo(b.dataset.modo);
});

$("btnEnviar").addEventListener("click", async function(){
  if (!selCP) return;
  var items = cargadas();
  if (!items.length) return;
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });

  var fecha = $("fFecha").value || hoyISO();
  // si el proveedor manda por paquetes, la cantidad se carga EN paquetes: se multiplica por el factor
  // para guardar en la unidad canonica (pliegos/uni). El inventario nunca ve "paquetes".
  // Si en cambio la cantidad se carga en KG (Ester) o el proveedor recibe pesado (Julio), el kg
  // viaja tal cual con unidad 'kg' y to_canonical lo pasa a mangos con kg_x_uni: tampoco ve bolsas.
  var _pk = packEnvio(), _peso = pesoEnvio();
  var payload = {
    modo: MODO, tipo: selCP.tipo, ref: String(selCP.ref),
    fecha: fecha + "T12:00:00",
    remito: MODO === "recibir" ? ($("fRemito").value.trim() || null) : null,
    items: items.map(function(o){
      var x = meta[o.k] || {};
      var u = unidadDe(x);
      var ckg = cargaEnKg(x, _pk);
      // por peso: lo que viaja son los KG (la base los pasa a unidades con kg_x_uni) y el bulto va
      // aparte, en movimiento.cajones — los cajones tal como los anotó el operario, las bolsas
      // calculadas desde los kg.
      var b = _peso ? bultoDe(x) : null;
      var q = num(o.it.q);
      var caj = b ? (b.editable ? (num(o.it.c) || null) : bultosDeKg(b, q)) : null;
      // Ester: el bulto tambien queda anotado (las bolsas que dan esos kg), mismo criterio que las
      // bolsas calculadas de Julio: es informativo, el stock lo mueve la cantidad.
      if (caj == null && ckg && kgPorEnvase(x, _pk) > 0) caj = q / kgPorEnvase(x, _pk);
      return {
        comp_id: x.comp_id != null ? Number(x.comp_id) : null,
        comp_entrada_id: x.comp_entrada_id != null ? Number(x.comp_entrada_id) : null,
        cod_art: x.cod_art || null,
        cantidad: (ckg || b) ? q : (_pk ? q * _pk.factor : q),
        unidad: (ckg || b || u === "kg") ? "kg" : "uni",
        cajones: caj != null ? Math.round(caj * 100) / 100 : null,
        esperado: MODO === "recibir" && x.esperado != null ? Number(x.esperado) : null,
        esperado_origen: x.esperado_origen || null
      };
    })
  };
  var nEx = items.filter(function(o){ return meta[o.k] && exceso(meta[o.k], num(o.it.q)) > 0; }).length;
  var resumen = items.map(function(o){
    var x = meta[o.k] || {};
    if (cargaEnKg(x, _pk))
      return (x.cod || o.k) + ": " + fmt(num(o.it.q), 2) + " kg (" +
             equivEnvase(num(o.it.q), kgPorEnvase(x, _pk), _pk.label).replace("= ", "") + ")";
    var b = _peso ? bultoDe(x) : null;
    if (b) {
      var q2 = num(o.it.q);
      var cb = b.editable ? num(o.it.c) : bultosDeKg(b, q2);
      return (x.cod || o.k) + ": " + fmt(q2, 2) + " kg" + (cb ? " (" + fmt(cb, 2) + " " + b.label + ")" : "");
    }
    return _pk
      ? (x.cod || o.k) + ": " + fmt(num(o.it.q), 0) + " " + _pk.label
      : (x.cod || o.k) + ": " + fmt(num(o.it.q), unidadDe(x) === "kg" ? 2 : 0) + " " + unidadDe(x);
  });
  var verbo = MODO === "enviar" ? "Enviar a " : "Recibir de ";
  if (!confirm(verbo + selCP.nombre + " (" + fecha + "):\n\n" + resumen.join("\n") +
      (nEx ? "\n\n⚠ " + nEx + " pieza" + (nEx === 1 ? "" : "s") + " con más de lo esperado: se registra igual y queda la alerta." : ""))) return;

  var btn = $("btnEnviar");
  btn.disabled = true; btn.textContent = "Registrando…";
  $("msg1").textContent = "";
  try {
    var r = await SB.rpc("tablet_registrar", { p: payload });
    if (r.error) throw r.error;
    BUF.borrar(selCP.id);
    var res = r.data || {};
    var al = res.alertas || [];
    $("successTitle").textContent = MODO === "enviar" ? "✓ Enviado" : "✓ Recibido";
    $("successAlertas").innerHTML = al.length
      ? '<div class="alerta-box">⚠ <b>Quedó anotado para revisar</b>: ' + al.map(function(a){
          return esc(a.cod) + " (" + fmt(a.recibido, 0) + " contra " + fmt(a.esperado, 0) + " esperados)";
        }).join(", ") + ". La recepción se registró igual.</div>"
      : "";
    E.mostrarExito((res.n || items.length) + " pieza" + ((res.n || items.length) === 1 ? "" : "s") + " · " +
      (MODO === "enviar" ? "enviadas a " : "recibidas de ") + (res.contraparte || selCP.nombre) + " · " + fecha);
    try { var r2 = await SB.rpc("tablet_bundle"); if (!r2.error && r2.data) D = r2.data; } catch(e2){}
  } catch(err){
    $("msg1").innerHTML = '<span style="color:#b91c1c">Error: ' + esc(err.message || err) + "</span>";
    btn.disabled = false; actualizar();
  }
});

$("fFecha").value = hoyISO();
cargar();
</script>
