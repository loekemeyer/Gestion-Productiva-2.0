<!doctype html>
<html lang="es">
<head>
<!-- Anti-cache: la lógica de esta pantalla es JS INLINE, así que si el navegador de la tablet
     se queda con el HTML viejo se queda con la app vieja (no hay ?v= que la salve). -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- v1.4.1 (2026-09-16) — SE SACA "N sin registrar" DE LAS BALDOSAS DE TIPO EN ENVIAR (usuario:
     "me aparece 3 sin registrar/1 sin registrar"). Desde la precarga de v1.4.0, abrir una
     contraparte PS/tallerista ya llena el buffer con el sugerido, así que el cartelito contaba
     como "sin registrar" destinos que el operario ni tocó. Se elimina el badge de pintarTipos
     (queda sólo el número de contrapartes). El chip por contraparte sigue mostrando "N cargadas". -->
<!-- v1.4.0 (2026-09-16) — ENVIAR MUESTRA CUÁNTO MANDAR (usuario: "máximo de pliegos adhesivados −
     stock de pliegos adhesivados = lo que debería mandarle", "precarga en el campo cantidad").
     En Enviar a PROV. DE SERVICIO y TALLERISTA cada fila trae ahora Stock | Máximo | Sugerido de la
     pieza PROCESADA/ARMADA (la salida), y el Sugerido se PRECARGA en el campo Cantidad (editable).
     sugerido = Σ salidas max(0, máximo_salida − stock_salida − lo que ya está en el destino)·ratio
     − lo que ya se le mandó de esa entrada y no volvió. Sale de tablet_bundle (CTE rep, ruta_paso
     entrada→salida). Prov. AT / inyector siguen mostrando "Online sector" (sin sugerido). El
     precargado se hace UNA vez al elegir la contraparte: si borrás un campo, no se vuelve a llenar. -->
<!-- v1.3.1 (2026-09-15) — FIX: en Enviar → Prov. de art. terminado, cada proveedor ve SOLO los
     cartones/cajas que la receta de sus articulos usa (Cabral 39, Paternal Goma 1…), no los 191
     de todo el sector 10/11. tablet_bundle: el prov AT deja de ir con ref '*' (recibe todo) y pasa
     por el cruce articulo_prov_at→articulo→articulo_componente; n_env por proveedor; piezasDe filtra
     por ref para todos. Kuffo/Manfer quedan en 0 (sin cartones en receta) y no aparecen en Enviar. -->
<!-- v1.3.0 (2026-09-15) — LOS INYECTORES APARECEN DENTRO DE "PROV. DE SERVICIO" PARA ENVIARLES
     BOLSAS (usuario: "Tendria que aparecer en prov. de servicio para enviar las bolsas plasticas").
     No son proveedor_servicio en la base (son proveedor_insumo/inyector con material_id), asi que
     NO se creo un modelo PS falso: tablet_bundle ahora devuelve los inyectores como contraparte
     tipo 'inyector' con sus RESINAS (sector 14) como envio, y cpsDelTipo los agrupa bajo el tipo
     "Prov. de servicio". El envio de bolsas lo rutea tablet_registrar a enviar_material_inyector
     (un solo RPC, sin duplicar la logica de Compras/Inyectores_GP2.html). El operario elige el
     inyector, tipea kg de cada resina y listo. Migracion tablet_enviar_bolsas_a_inyector. -->
<!-- v1.2.1 (2026-09-14) — SE SACA EL BOTON "INYECTORES" que v1.2.0 habia agregado en Enviar
     [usuario: "saca el boton de inyectores y arranca la cirugia"]. Era un tipo-link a
     Compras/Inyectores_GP2.html como atajo sin cirugia, pero el usuario quiere a los 3 inyectores
     DENTRO de "Prov. de servicio", no en un boton aparte. Eso se logra convirtiendolos en
     proveedor_servicio de verdad con su ruta de inyeccion (cirugia en la base), y ahi salen solos
     en la lista de PS del Tablet (que se arma desde la base). Enviar vuelve a 3 tipos. -->
<!-- v1.1.1 (2026-09-14) — el operario no ve la palabra "contraparte" [usuario 2026-09-14: "no
     quiero que diga contraparte"]. El buscador dice "Buscar por nombre…", la baldosa del tipo
     muestra sólo el número (el título ya dice qué son) y el pie dice "N para elegir". -->
<!-- v1.1.0 (2026-09-14) — PRIMERO EL TIPO, Y LO QUE YA ESTÁ MODELADO NO SE COPIA
     [usuario 2026-09-14]. Tres cambios, uno por modo:
       · ENVIAR: antes tiraba las 33 contrapartes juntas. Ahora pregunta primero el TIPO
         (tallerista / prov. de servicio / prov. de art. terminado) y recién adentro muestra
         todas las de ese tipo. Si un tipo tiene una sola contraparte se entra derecho.
       · RECIBIR: sale el PROV. DE ART. TERMINADO — entrega en Virgilio, y esta tablet es de
         Cervantes. Entra PROV. DE INSUMOS, que NO se recarga acá: abre Recepción de Insumos
         (rubros, pesaje de pallets, cruce contra OC), que ya hace ese trabajo. Una sola copia.
         Con el prov. AT se fue la única carga en CAJAS: acá ya no se recibe nada por caja
         (el `por_caja` del payload y el esperado en cajas quedan en el historial de git).
       · CONTEO: deja de ser una tabla propia con CSV y abre el módulo de Relevamientos
         (cronograma por sector, envases + sueltas, y el ajuste lo decide el operador del
         sistema en Validación de Stock). No se guarda como modo: al volver, la tablet abre
         en Enviar/Recibir y no rebota.
     Los dos saltos son <a href> con ?volver=tablet, y esas dos pantallas devuelven el "Atrás"
     acá en vez de al menú. El backend NO cambió: tablet_bundle sigue trayendo lo mismo. -->
<!-- v1.0.0 (2026-09-13) — Versión Tablet del operario (ideas 7342/7343). UNA pantalla con tres
     modos — Enviar / Recibir / Conteo — para la tablet del galpón, en vez de abrir la pantalla
     de cada contraparte. El backend ya vive en la base: "GP2".tablet_bundle() (qué puede enviar
     y qué puede recibir cada contraparte, con el ESPERADO: la OC si trae un proveedor, el stock
     online si trae un tallerista / PS / Virgilio) y "GP2".tablet_registrar(p) (reusa las RPC de
     siempre — crear_envio_*, crear_entrega_*, crear_recepcion_insumo — y NO inventa movimientos).
     La alerta de "recibí de más" AVISA pero NO FRENA: el operario registra igual y la alerta queda
     en GP2.alerta_recepcion para que la revisen en Alertas.
     Dos trampas de unidad (las anotó la sesión que armó el backend):
       · el proveedor de artículo terminado entrega CAJAS: se carga en cajas y el esperado de la
         OC está en unidades (por_caja las cruza);
       · una pieza cuya unidad es kg se manda y se recibe en kg (teclado con coma).
     El Conteo no escribe nada: es la ayuda para contar contra el online; el ajuste de stock va
     por Relevamientos → Validación de Stock (el operario cuenta, el operador del sistema decide). -->

  .tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,320px));gap:10px;

  .tipo-btn small b{color:#c2410c}

  /* fila con exceso: se ve, no frena */
  table.t tr.demas td{background:#fff4e5}
  .demas-tag{display:inline-block;margin-top:4px;background:#c2410c;color:#fff;border-radius:999px;

  .alerta-box b{color:#8a3b00}
  input#fRemito{height:44px;border:2px solid #d0d7de;border-radius:8px;padding:0 10px;font-size:19px;width:150px}

<script>
"use strict";

var E = GP2EE;
var $ = GP2UI.$, esc = GP2UI.esc, num = GP2N.num, fmt = GP2N.fmt, hoyISO = E.hoyISO;
var SB = GP2_SB();

var D = { contrapartes: [], enviar: [], recibir: [], alertas_abiertas: 0 };
var MODO = null;        // enviar | recibir  (Conteo no es un modo: es el salto a Relevamientos)
var selTipo = null;     // tallerista | proveedor_servicio | proveedor_at | virgilio
var selCP = null;       // { tipo, ref, nombre, id }
var BUF = E.buffer("gp2_tablet_buffer", function(){ return { q: "" }; });

/* Los TIPOS de contraparte de cada modo, en el orden en que el operario los busca. El que trae
   `link` no se carga acá: abre la pantalla que ya hace ese trabajo, para no tener dos copias de
   la misma lógica. */
var TIPOS = {
  enviar: [
    { tipo: "tallerista",         icono: "👷", titulo: "Talleristas",            sub: "lo que arman afuera" },
    { tipo: "proveedor_servicio", icono: "🏭", titulo: "Prov. de servicio",      sub: "pintan, niquelan, cortan, inyectan" },
    { tipo: "proveedor_at",       icono: "📦", titulo: "Prov. de art. terminado", sub: "cartones y cajas" }
  ],
  recibir: [
    { tipo: "tallerista",         icono: "👷", titulo: "Talleristas",       sub: "lo que traen armado" },
    { tipo: "proveedor_servicio", icono: "🏭", titulo: "Prov. de servicio", sub: "lo que devuelven procesado" },
    { tipo: "proveedor_insumo",   icono: "🧰", titulo: "Prov. de insumos",  sub: "flejes, cartones, plásticos, garage",
      link: "../StockFlejes/RecepcionInsumos_GP2.html?volver=tablet" },
    { tipo: "virgilio",           icono: "🚚", titulo: "Virgilio",          sub: "lo que vuelve a Cervantes" }
  ]
};

/* La unidad con la que se CARGA cada fila. El contrato de tablet_registrar acepta 'uni' o 'kg';
   componente.unidad_medida dice 'kg' o 'unidad'. Desde que el prov. de art. terminado salió de
   Recibir (entrega en Virgilio, no acá) no queda nada que se cargue en CAJAS. */
function unidadDe(x){
  return String(x.um || "").toLowerCase() === "kg" ? "kg" : "uni";
}
function inputmodeDe(u){ return u === "kg" ? "decimal" : "numeric"; }
function uniTag(u){ return '<span class="uni-tag ' + u + '">' + u + "</span>"; }

/* clave de fila: en recibir una pieza puede aparecer dos veces (dos entradas distintas del PS) */
function claveDe(x){
  return String(x.comp_id || "") + ":" + String(x.comp_entrada_id || "") + ":" + String(x.cod_art || "");
}
function claveCP(c){ return MODO + ":" + c.tipo + ":" + c.ref; }

/* En Enviar, sólo PS y talleristas tienen sugerido (máximo − stock − lo que ya está en el destino);
   prov. AT / inyector no, y ahí la tablet sigue mostrando "Online sector". */
function envConSugerido(){
  return MODO === "enviar" && !!selCP &&
    (selCP.tipo === "proveedor_servicio" || selCP.tipo === "tallerista");
}

/* ---------- carga ---------- */
async function cargar(){
  try {
    var r = await SB.rpc("tablet_bundle");
    if (r.error) throw r.error;
    D = r.data || D;
    BUF.load();
    var m = new URLSearchParams(location.search).get("modo");
    var guardado = null;
    try { guardado = localStorage.getItem("gp2_tablet_modo"); } catch(e){}
    setModo(m || guardado || "enviar");
  } catch(e){
    $("status").innerHTML = '<span style="color:#b91c1c">Error: ' + esc(e.message || e) + "</span>";
  }
}

function setModo(m){
  if (m !== "enviar" && m !== "recibir") m = "enviar";
  MODO = m;
  try { localStorage.setItem("gp2_tablet_modo", m); } catch(e){}
  var bs = document.querySelectorAll("#modos .modo-btn");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("active", bs[i].dataset.modo === m);
  mostrarTipos();
}

/* contrapartes que aplican al modo. En enviar, sólo a quien se le manda desde Cervantes.
   En recibir queda afuera el prov. de art. terminado (entrega en Virgilio) y el prov. de
   insumos, que tiene su propia pantalla con rubros, pesaje y cruce contra OC. */
function cpsDelModo(){
  return (D.contrapartes || []).filter(function(c){
    if (MODO === "enviar") return c.tipo !== "virgilio" && c.tipo !== "proveedor_insumo" && Number(c.n_env) > 0;
    return c.tipo !== "proveedor_at" && c.tipo !== "proveedor_insumo" && Number(c.n_rec) > 0;
  });
}
function cpsDelTipo(tipo){
  // Los INYECTORES (tipo 'inyector') se muestran DENTRO de "Prov. de servicio": el usuario los
  // manda al mismo lugar mental. En la base son proveedor_insumo/inyector, no proveedor_servicio;
  // el envio de bolsas lo rutea tablet_registrar a enviar_material_inyector. [usuario 2026-09-15]
  return cpsDelModo().filter(function(c){
    return c.tipo === tipo || (tipo === "proveedor_servicio" && c.tipo === "inyector");
  });
}
/* la contraparte como la espera el resto de la pantalla (id = clave del buffer) */
function cpItem(c){
  return { id: claveCP(c), tipo: c.tipo, ref: c.ref, nombre: c.nombre,
           n: MODO === "enviar" ? c.n_env : c.n_rec };
}
function cargadasDeCP(c){
  return E.cargadasDe(BUF.all[claveCP(c)], function(it){ return num(it.q) > 0; }).length;
}
function avisoAlertas(){
  return Number(D.alertas_abiertas) > 0
    ? "⚠ " + D.alertas_abiertas + " alerta" + (D.alertas_abiertas === 1 ? "" : "s") + " de recepción sin revisar"
    : "";
}

/* ---------- paso 1: el tipo ---------- */
function mostrarTipos(){
  selTipo = null; selCP = null;
  E.mostrarFase(0);
  $("tipoGrid").classList.remove("hidden");
  $("cpBox").classList.add("hidden");
  $("btnVolverTipo").classList.add("hidden");
  $("fase0Title").textContent = MODO === "enviar" ? "¿A quién le enviás?" : "¿Quién trae?";
  pintarTipos();
}

function pintarTipos(){
  var g = $("tipoGrid");
  g.innerHTML = "";
  (TIPOS[MODO] || []).forEach(function(t){
    var lista = t.link ? null : cpsDelTipo(t.tipo);
    if (lista && !lista.length) return;   // un tipo sin contrapartes no se dibuja: no lleva a nada
    var b = document.createElement(t.link ? "a" : "button");
    if (t.link) b.href = t.link; else b.type = "button";
    b.className = "tipo-btn";
    b.dataset.tipo = t.tipo;
    // el número sin la palabra "contraparte": el título del tipo ya dice qué son. NO se muestra
    // "N sin registrar" [usuario 2026-09-16]: desde que Enviar precarga el sugerido, abrir una
    // contraparte ya llenaba el buffer y el cartelito contaba destinos sin trabajo real.
    b.innerHTML = '<span class="ti">' + t.icono + " " + esc(t.titulo) + "</span><small>" + esc(t.sub) +
      (lista ? " · " + lista.length : "") + "</small>";
    if (!t.link) b.addEventListener("click", function(){ elegirTipo(t); });
    g.appendChild(b);
  });
  $("status").textContent = avisoAlertas();
}

/* ---------- paso 2: la contraparte de ese tipo ---------- */
function elegirTipo(t){
  selTipo = t.tipo;
  var lista = cpsDelTipo(t.tipo);
  if (lista.length === 1) { elegir(cpItem(lista[0])); return; }  // un solo destino: no se elige entre uno
  $("tipoGrid").classList.add("hidden");
  $("cpBox").classList.remove("hidden");
  $("btnVolverTipo").classList.remove("hidden");
  $("fase0Title").textContent = t.titulo;
  $("q0").value = "";
  pintarCPS();
}

function pintarCPS(){
  var lista = E.filtrar(cpsDelTipo(selTipo), $("q0").value, function(c){ return c.nombre; });
  E.gridContrapartes("cpGrid", lista.map(cpItem), {
    vacio: "No hay a quién en este modo.",
    meta: function(c){
      // el tipo no se repite en cada chip: ya lo dice el título de arriba
      var cargado = E.cargadasDe(BUF.all[c.id], function(it){ return num(it.q) > 0; }).length;
      return c.n + " pieza" + (c.n === 1 ? "" : "s") +
        (cargado ? (" · <b>" + cargado + " cargadas</b>") : "");
    },
    onPick: elegir
  });
  var av = avisoAlertas();
  $("status").textContent = lista.length + " para elegir" + (av ? " · " + av : "");
}

/* ---------- piezas de la contraparte elegida ---------- */
function piezasDe(c){
  var arr;
  if (MODO === "enviar") {
    // Cada contraparte ve SOLO sus piezas (para prov. AT, los cartones/cajas que la receta de
    // sus articulos usa; antes iba con ref '*' y mostraba los 191 a todos, bug 2026-09-15).
    arr = (D.enviar || []).filter(function(x){
      return x.tipo === c.tipo && String(x.ref) === String(c.ref);
    });
  } else {
    arr = (D.recibir || []).filter(function(x){ return x.tipo === c.tipo && String(x.ref) === String(c.ref); });
  }
  return arr.sort(function(a,b){ return String(a.cod).localeCompare(String(b.cod)); });
}

function elegir(c){
  selCP = c;
  $("fase1Title").textContent = c.nombre;
  E.mostrarFase(1);
  var esRec = MODO === "recibir";
  $("lblRemito").classList.toggle("hidden", !esRec);
  $("fRemito").classList.toggle("hidden", !esRec);
  if (!$("fFecha").value) $("fFecha").value = hoyISO();
  $("q").value = "";
  $("thead").innerHTML = MODO === "enviar"
    ? (envConSugerido()
        ? "<th>Pieza</th><th class=\"num\">Stock</th><th class=\"num\">Máximo</th><th class=\"num\">Sugerido</th><th class=\"num sep\">Cantidad</th>"
        : "<th>Pieza</th><th class=\"num\">Online sector</th><th class=\"num sep\">Cantidad</th>")
    : "<th>Pieza</th><th class=\"num\">Esperado</th><th class=\"num sep\">Recibido</th>";
  // precarga UNA vez: el sugerido entra como cantidad por defecto (editable). Sólo toca campos sin
  // cargar, así que si el operario vació uno a mano no se lo vuelve a llenar en cada render.
  if (envConSugerido()) {
    piezasDe(c).forEach(function(x){
      var it = BUF.item(c.id, claveDe(x));
      // se precarga con el formato de la casa (coma decimal / punto de miles), que es el que
      // GP2N.num sabe leer; String(sugerido) con punto se leería como miles.
      if ((it.q === undefined || it.q === null || it.q === "") && Number(x.sugerido) > 0)
        it.q = fmt(Number(x.sugerido), unidadDe(x) === "kg" ? 2 : 0);
    });
    BUF.save();
  }
  render();
}

/* El "← Cambiar" vuelve un paso, no al principio: a la lista de contrapartes del tipo, y
   si ese tipo tenía una sola (Virgilio) directamente a los tipos. */
function volver(){
  selCP = null;
  if (!selTipo || cpsDelTipo(selTipo).length <= 1) { mostrarTipos(); return; }
  E.mostrarFase(0);
  $("tipoGrid").classList.add("hidden");
  $("cpBox").classList.remove("hidden");
  $("btnVolverTipo").classList.remove("hidden");
  pintarCPS();
}

/* esperado en la unidad con la que se carga */
function esperadoTxt(x){
  if (x.esperado == null) return '<span class="esp">—<small>sin referencia</small></span>';
  var u = unidadDe(x);
  var e = Number(x.esperado);
  var origen = { oc: "según OC", online_tall: "stock que tiene", online_ps: "stock que tiene",
                 online_virgilio: "online Virgilio" }[x.esperado_origen] || x.esperado_origen || "";
  return '<span class="esp">' + fmt(e, u === "kg" ? 2 : 0) + " " + u + "<small>" + esc(origen) + "</small></span>";
}

function exceso(x, q){
  if (MODO !== "recibir" || x.esperado == null || !(q > 0)) return 0;
  var d = q - Number(x.esperado);
  return d > 0 ? d : 0;
}

function render(){
  var arr = E.filtrar(piezasDe(selCP), $("q").value, function(x){
    return String(x.cod || "") + " " + String(x.desc || "") + " " + String(x.ent_cod || "") + " " + String(x.sector || "");
  });
  var tb = $("tbody");
  tb.innerHTML = "";
  $("tblEmpty").classList.toggle("hidden", arr.length > 0);
  if (!arr.length) $("tblEmpty").textContent = "Sin resultados para ese filtro.";

  arr.forEach(function(x){
    var k = claveDe(x);
    var it = BUF.item(selCP.id, k);
    var u = unidadDe(x);
    var q = num(it.q);
    var tr = document.createElement("tr");
    tr.dataset.k = k;
    var sub = esc(x.desc || "");
    if (MODO === "recibir" && x.ent_cod) sub += ' · <span class="proc">consume ' + esc(x.ent_cod) + "</span>";
    var ex = exceso(x, q);
    var pieza = '<td><span class="cod">' + esc(x.cod) + "</span>" + uniTag(u) +
      '<br><small class="sub">' + sub + "</small>" +
      (ex > 0 ? '<br><span class="demas-tag">⚠ ' + fmt(ex, u === "kg" ? 2 : 0) + " de más</span>" : "") + "</td>";
    var mitad;
    if (MODO === "enviar") {
      mitad = envConSugerido()
        ? ('<td class="num esp">' + fmt(x.stock_dest, u === "kg" ? 2 : 0, "—") + "</td>" +
           '<td class="num esp">' + fmt(x.maximo, u === "kg" ? 2 : 0, "—") + "</td>" +
           '<td class="num esp"><b>' + fmt(x.sugerido, u === "kg" ? 2 : 0, "—") + "</b></td>")
        : ('<td class="num esp">' + fmt(x.online_sector, u === "kg" ? 2 : 0) + " " + u + "</td>");
    } else {
      mitad = '<td class="num">' + esperadoTxt(x) + "</td>";
    }
    tr.innerHTML = pieza + mitad + E.tdInput("q", it.q, false, "sep", inputmodeDe(u)).replace('class="cell-in', 'class="cell-in big');
    if (ex > 0) tr.classList.add("demas");
    tb.appendChild(tr);
  });
  actualizar();
}

function cargadas(){ return E.cargadasDe(BUF.de(selCP.id), function(it){ return num(it.q) > 0; }); }

function actualizar(){
  var n = cargadas().length;
  E.actualizarEnviar(n, MODO === "enviar" ? "Enviar" : "Recibir");
  // el aviso de exceso: informa, no frena (el botón sigue habilitado)
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });
  var conExceso = cargadas().filter(function(o){ return meta[o.k] && exceso(meta[o.k], num(o.it.q)) > 0; });
  var box = $("alertaBox");
  box.classList.toggle("hidden", conExceso.length === 0);
  if (conExceso.length) {
    box.innerHTML = "⚠ <b>Estás recibiendo más de lo esperado</b> en " + conExceso.length + " pieza" +
      (conExceso.length === 1 ? "" : "s") + " (" + conExceso.map(function(o){ return esc(meta[o.k].cod); }).join(", ") +
      "). <b>Podés registrar igual</b>: queda una alerta para que la revisen en Alertas.";
  }
}

/* ---------- eventos ---------- */
$("tbody").addEventListener("input", function(e){
  var inp = e.target.closest("input.cell-in");
  if (!inp) return;
  var tr = inp.closest("tr");
  BUF.item(selCP.id, tr.dataset.k)[inp.dataset.f] = inp.value;
  BUF.save();
  // repintar sólo lo que cambia de esa fila (el aviso de exceso), sin perder el foco
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });
  var x = meta[tr.dataset.k];
  if (x) {
    var q = num(inp.value), u = unidadDe(x), ex = exceso(x, q);
    tr.classList.toggle("demas", ex > 0);
    var old = tr.querySelector(".demas-tag"); if (old) { old.previousSibling && old.previousSibling.nodeName === "BR" && old.previousSibling.remove(); old.remove(); }
    if (ex > 0) tr.firstElementChild.insertAdjacentHTML("beforeend", '<br><span class="demas-tag">⚠ ' + fmt(ex, u === "kg" ? 2 : 0) + " de más</span>");
  }
  actualizar();
});

$("q").addEventListener("input", render);
$("q0").addEventListener("input", pintarCPS);
$("btnVolver").addEventListener("click", volver);
$("btnOtro").addEventListener("click", function(){ location.reload(); });
$("btnVolverTipo").addEventListener("click", mostrarTipos);
$("modos").addEventListener("click", function(e){
  var b = e.target.closest("button.modo-btn");   // Conteo es un <a>: se va solo a Relevamientos
  if (b) setModo(b.dataset.modo);
});

$("btnEnviar").addEventListener("click", async function(){
  if (!selCP) return;
  var items = cargadas();
  if (!items.length) return;
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });

  var fecha = $("fFecha").value || hoyISO();
  var payload = {
    modo: MODO, tipo: selCP.tipo, ref: String(selCP.ref),
    fecha: fecha + "T12:00:00",
    remito: MODO === "recibir" ? ($("fRemito").value.trim() || null) : null,
    items: items.map(function(o){
      var x = meta[o.k] || {};
      var u = unidadDe(x);
      return {
        comp_id: x.comp_id != null ? Number(x.comp_id) : null,
        comp_entrada_id: x.comp_entrada_id != null ? Number(x.comp_entrada_id) : null,
        cod_art: x.cod_art || null,
        cantidad: num(o.it.q),
        unidad: u === "kg" ? "kg" : "uni",
        esperado: MODO === "recibir" && x.esperado != null ? Number(x.esperado) : null,
        esperado_origen: x.esperado_origen || null
      };
    })
  };
  var nEx = items.filter(function(o){ return meta[o.k] && exceso(meta[o.k], num(o.it.q)) > 0; }).length;
  var resumen = items.map(function(o){
    var x = meta[o.k] || {};
    return (x.cod || o.k) + ": " + fmt(num(o.it.q), unidadDe(x) === "kg" ? 2 : 0) + " " + unidadDe(x);
  });
  var verbo = MODO === "enviar" ? "Enviar a " : "Recibir de ";
  if (!confirm(verbo + selCP.nombre + " (" + fecha + "):\n\n" + resumen.join("\n") +
      (nEx ? "\n\n⚠ " + nEx + " pieza" + (nEx === 1 ? "" : "s") + " con más de lo esperado: se registra igual y queda la alerta." : ""))) return;

  var btn = $("btnEnviar");
  btn.disabled = true; btn.textContent = "Registrando…";
  $("msg1").textContent = "";
  try {
    var r = await SB.rpc("tablet_registrar", { p: payload });
    if (r.error) throw r.error;
    BUF.borrar(selCP.id);
    var res = r.data || {};
    var al = res.alertas || [];
    $("successTitle").textContent = MODO === "enviar" ? "✓ Enviado" : "✓ Recibido";
    $("successAlertas").innerHTML = al.length
      ? '<div class="alerta-box">⚠ <b>Quedó anotado para revisar</b>: ' + al.map(function(a){
          return esc(a.cod) + " (" + fmt(a.recibido, 0) + " contra " + fmt(a.esperado, 0) + " esperados)";
        }).join(", ") + ". La recepción se registró igual.</div>"
      : "";
    E.mostrarExito((res.n || items.length) + " pieza" + ((res.n || items.length) === 1 ? "" : "s") + " · " +
      (MODO === "enviar" ? "enviadas a " : "recibidas de ") + (res.contraparte || selCP.nombre) + " · " + fecha);
    try { var r2 = await SB.rpc("tablet_bundle"); if (!r2.error && r2.data) D = r2.data; } catch(e2){}
  } catch(err){
    $("msg1").innerHTML = '<span style="color:#b91c1c">Error: ' + esc(err.message || err) + "</span>";
    btn.disabled = false; actualizar();
  }
});

$("fFecha").value = hoyISO();
cargar();
</script>
</body>
</html>
