<!-- Anti-cache: la lógica de esta pantalla es JS INLINE, así que si el navegador de la tablet
     se queda con el HTML viejo se queda con la app vieja (no hay ?v= que la salve). -->

<meta http-equiv="Pragma" content="no-cache">

<!-- v1.20.0 (2026-09-18) — RECIBIR DE UN P.S.: TARJETAS, Y LA ENTREGA COPIA LA UNIDAD DEL ENVIO
     (usuario, textual: "AJ adhesivos entrega en paquetes de 200. El resto copia la logica del
     envio: si enviamos en bolsas recepcionamos en bolsas, si lo hacemos en cajones, en cajones.
     Charcas cajones").
     LA REGLA SE ESCRIBE UNA VEZ: por defecto la ENTREGA de un P.S. usa la MISMA unidad con la que
     se le envia (packEnvio / pesoEnvio, que ya estaban), asi que no hizo falta cargar un dato por
     proveedor. Para los que difieren hay dos columnas nuevas en GP2.proveedor_servicio:
     entrega_unidad / entrega_uni_x. Hoy son dos:
       · AJ Adhesivos: envia en paquetes de 100 y ENTREGA en paquetes de 200 (se escribe en paquetes);
       · Resortes Charcas: 'cajones' SIN factor = el cajon de CADA PIEZA, y se escribe en kg
         (Charcas no esta en Enviar por hibrido, asi que no tenia unidad de la cual copiar).
     Las dos columnas viajan con la contraparte en tablet_bundle, al lado de las de envio.
     Lo demas ya estaba hecho para el tallerista: esperado en el envase, campo en kg con el renglon
     "≈ N cajones", el exceso comparado en unidad canonica y el esperado viajando en la misma unidad
     que la cantidad. Un P.S. sin unidad definida (Blist-Pack, Rec Color, Daniel…) sigue como
     estaba: esperado y cantidad en la unidad de la pieza. -->
<!-- v1.19.0 (2026-09-18) — RECIBIR DE TALLERISTAS: TARJETAS, ESPERADO EN CAJONES Y CANTIDAD EN KG
     (usuario, textual: "de talleristas, todos se entregan en cajones… tanto en esperado como en
     recibido, tenés que poner la unidad de medida. En esperado va a ser en cajones… y en recibido
     va a ser en kilos. Y pones en chiquito cuántos cajones equivalen. La única excepción que no es
     en cajones sino en bolsas son las bombillas GRJ5 y GRJ6. Entregan bolsas de 120 unidades…
     quiero que también aparezcan las partes en box… en vez de sugerido y cantidad, va a ser
     esperado y cantidad").
     (1) COMO ENTREGA cada pieza es un dato de la PIEZA, igual que el envase de envio: columnas
     nuevas GP2.componente.entrega_unidad / entrega_uni_x, con default cajones + uni_x_cajon. Solo
     GRJ5 y GRJ6 las tienen cargadas (bolsas / 120). tablet_bundle las manda en cada fila de
     'recibir' de un tallerista como env_unidad / env_factor / env_carga, que son las mismas claves
     que ya usaba Enviar: el front no aprendio un modelo nuevo.
     (2) LA TARJETA dice ESPERADO (en cajones o bolsas) y, abajo, lo que se va a recibir. La vista
     de la parte dice "Esperado" y "Cantidad" (el usuario pidio que no se llame mas "Recibido"), con
     el campo en KG y el renglon chico "≈ N cajones" debajo, el mismo de siempre.
     (3) EL EXCESO SE COMPARA EN LA UNIDAD CANONICA (canonDe): el esperado viene en unidades y ahora
     se escriben kg, asi que sin convertir se comparaba peras con manzanas. Y al registrar, el
     esperado VIAJA EN LA MISMA UNIDAD que la cantidad (1.000 uni x 0,01 = 10 kg), porque
     tablet_registrar los compara crudos para levantar la alerta de "recibi de mas".
     (4) La tarjeta con exceso se pinta naranja y lo dice, como la fila de la tabla.
     OJO: en Recibir la tablet SI se acuerda de lo tipeado (envSinMemoria es solo de Enviar). Lo que
     cambio aca es como se ve, no la memoria. Los cajones NO se registran: crear_entrega_tallerista
     no tiene donde anotarlos (a diferencia de crear_envio_ps); el kg es lo que mueve el stock. -->
<!-- v1.18.0 (2026-09-18) — Y EL PROV. DE ART. TERMINADO, IGUAL (usuario: "seguís de la misma manera
     con prov de art terminado"). Era el ultimo destino de Enviar que quedaba con tabla: ahora va en
     tarjetas y con la vista por parte, como los otros tres.
     UNIDAD: el prov. AT recibe SOLO cartones y cajas (sector 10 y 11), o sea justo las dos cosas que
     van en PAQUETES, asi que hereda tal cual el envase por pieza del tallerista — el paqueton del
     formato para el carton y los 25 de parametro.caja_uni_x_paquete para la caja. En tablet_bundle
     es un cambio de una linea: el case de env_unidad/env_factor/env_carga pasa de "tipo =
     'tallerista'" a "tipo in ('tallerista','proveedor_at')".
     LA REFERENCIA NO ES EL SUGERIDO: el prov. AT no tiene (envConSugerido() es false), asi que la
     tarjeta y la vista muestran el ONLINE DEL SECTOR — lo que hay en Cervantes para mandarle — con

     paquetes: es un stock, no algo que se manda.
     CON ESTO EN ENVIAR YA NO QUEDA TABLA NI MEMORIA EN NINGUN DESTINO: envSinMemoria() son los
     cuatro. La tabla sigue viva solo en Recibir, que no se toco. -->
<!-- v1.17.0 (2026-09-18) — LOS TALLERISTAS TAMBIEN EN TARJETAS, Y CON UNIDAD DE ENVIO POR PIEZA
     (usuario, textual: "quiero que copies la misma logica para los talleristas. Lo que si no esta
     modelado la unidad de medida ni de sugerido ni de cantidad… Carton segun el formato se le manda
     segun como viene el paqueton… o mil unidades o dos mil. Y las cajas en paquetes de 25. Entonces
     el sugerido y la cantidad va para ambos en paquetes, cartones y cajas. En cambio para el resto
     el sugerido va en cajones y la cantidad va en kilos… y abajo chiquito te pone a cuantos cajones
     equivale. Ademas, tendria que aparecer en formato box").
     (1) LA UNIDAD LA PONE LA PIEZA, NO EL DESTINO. Hasta hoy la unidad de envio era del PROVEEDOR
     (proveedor_servicio.envio_*). Un tallerista recibe de todo, asi que la unidad no puede ser una
     sola: la dice cada pieza y la manda la base. tablet_bundle agrega env_unidad / env_factor /
     env_carga a cada fila de tallerista: Sector Carton (10) -> paquetes, y el paqueton es el del
     FORMATO (carton_formato.uni_x_bolsa: 1.000 el C y el LOKE, 2.000 el Huevo, 3.000 el 8, 100 el
     Pliego); Sector Caja (11) -> paquetes de parametro.caja_uni_x_paquete (25); el resto -> sugerido
     en CAJONES (componente.uni_x_cajon) y cantidad en KG, con la equivalencia redondeada en el
     renglon chico de abajo del campo. Sin el dato NO se inventa el envase: esa pieza queda en
     unidades y la tarjeta lo dice ("sin paquete cargado" / "sin cajon cargado").
     (2) EN EL FRONT eso es envaseDe(x), que unifica las dos formas que conviven: el envase del
     PROVEEDOR (packEnvio, con el caso por pieza de Guazzaroni, Jade y los otros) y el de la PIEZA
     (tallerista). Todo lo demas — sugerido, campo, eqFila, payload, resumen del confirm — ya
     colgaba de ahi; se fue factorEnvio(), que era el pedazo que solo sabia de proveedores.
     (3) Y NO SE PRECARGA MAS NADA: el tallerista era el ultimo que arrancaba con la cantidad escrita
     y con memoria; el usuario eligio "igual que P.S.: vacio y sin memoria". Con eso se fueron
     precargaCantidad(), sugeridoEnCarga() y la firma qAuto: ya no hay valor derivado guardado en
     localStorage que pueda quedar viejo. La tabla sigue viva solo para el prov. de art. terminado
     y para TODO Recibir.
     (4) De paso, "1 cajones" pasa a "1 cajon" (unidadTxt): con uno va el singular. Es el mismo criterio
     que singularEnvase() de v1.16.0, pero para el SUGERIDO: aquella dice el envase de un renglon de
     equivalencia, esta la unidad del sugerido y de lo cargado en la tarjeta.
     SIN cambios de datos: mismo payload (el inventario sigue viendo uni o kg, nunca paquetes ni
     cajones) y misma RPC de registro. -->

     (usuario: "dentro del version tablet, y envio a ps. Siguiendo la logica del modulo Ester ->

     pones kg y que te diga cuantos cajones son (redondeando)"). Es la forma de Ester con UNA

     (componente.uni_x_cajon), como el bulto de Hernandez Julio. Lo dice la base:
     proveedor_servicio 4 = envio_unidad 'cajones' / envio_uni_x NULL / envio_carga_unidad 'kg';
     la regla nueva es que envio_uni_x NULL significa "el factor sale de la pieza". Con eso:
     encabezados "Sugerido (cajones)" / "Cantidad (kg)", el sugerido en cajones con TECHO
     (34.992 remaches / 57.143 por cajon -> 1 cajon), la cantidad precargada con el peso de esos
     cajones y debajo del campo "= N cajones" REDONDEADO ("≈ N" cuando no da entero, que es lo que
     pidio el usuario). Al registrar viaja el KG y to_canonical lo pasa a unidades con kg_x_uni: el
     inventario nunca ve cajones; los cajones quedan anotados en movimiento.cajones (informativo).

     fila cae a unidades y la celda lo dice ("sin cajon cargado"), en vez de inventar el factor.

     localStorage y sobrevive dias, y la precarga solo tocaba campos vacios, asi que cuando cambiaba
     el sugerido se veia el Sugerido nuevo con la Cantidad de otro dia [usuario: "fijate que hoy
     aparece el sugerido y la cantidad preescrita distinta en guazzaroni"]. Ahora la precarga queda
     firmada en it.qAuto: mientras el operario no la haya tocado se refresca sola; si la edito, no
     se le pisa nunca. Vale para TODOS los proveedores (antes la migracion solo corria para los que
     tienen unidad de envio propia). -->

<script>
"use strict";

var E = GP2EE;
var $ = GP2UI.$, esc = GP2UI.esc, num = GP2N.num, fmt = GP2N.fmt, hoyISO = E.hoyISO;
var SB = GP2_SB();

var D = { contrapartes: [], enviar: [], recibir: [], alertas_abiertas: 0 };
var MODO = null;        // enviar | recibir  (Conteo no es un modo: es el salto a Relevamientos)
var selTipo = null;     // tallerista | proveedor_servicio | inyector | proveedor_at | virgilio
var selCP = null;       // { tipo, ref, nombre, id }
var detK = null;        // la parte abierta en la vista de carga (solo vista de tarjetas)
var BUF = E.buffer("gp2_tablet_buffer", function(){ return { q: "" }; });

/* Los TIPOS de contraparte de cada modo, en el orden en que el operario los busca. El que trae
   `link` no se carga acá: abre la pantalla que ya hace ese trabajo, para no tener dos copias de
   la misma lógica. */
var TIPOS = {
  enviar: [
    { tipo: "tallerista",         icono: "👷", titulo: "Talleristas",            sub: "lo que arman afuera" },
    { tipo: "proveedor_servicio", icono: "🏭", titulo: "Prov. de servicio",      sub: "pintan, niquelan, cortan" },
    { tipo: "inyector",           icono: "💉", titulo: "Inyectores",             sub: "bolsas plásticas" },
    { tipo: "proveedor_at",       icono: "📦", titulo: "Prov. de art. terminado", sub: "cartones y cajas" }
  ],
  recibir: [
    { tipo: "tallerista",         icono: "👷", titulo: "Talleristas",       sub: "lo que traen armado" },
    { tipo: "proveedor_servicio", icono: "🏭", titulo: "Prov. de servicio", sub: "lo que devuelven procesado" },
    { tipo: "proveedor_insumo",   icono: "🧰", titulo: "Prov. de insumos",  sub: "flejes, cartones, plásticos, garage",
      link: "../StockFlejes/RecepcionInsumos_GP2.html?volver=tablet" },
    { tipo: "virgilio",           icono: "🚚", titulo: "Virgilio",          sub: "lo que vuelve a Cervantes" }
  ]
};

/* La unidad con la que se CARGA cada fila. El contrato de tablet_registrar acepta 'uni' o 'kg';
   componente.unidad_medida dice 'kg' o 'unidad'. Desde que el prov. de art. terminado salió de
   Recibir (entrega en Virgilio, no acá) no queda nada que se cargue en CAJAS. */
function unidadDe(x){
  return String(x.um || "").toLowerCase() === "kg" ? "kg" : "uni";
}
function inputmodeDe(u){ return u === "kg" ? "decimal" : "numeric"; }
function uniTag(u){ return '<span class="uni-tag ' + u + '">' + u + "</span>"; }

/* clave de fila: en recibir una pieza puede aparecer dos veces (dos entradas distintas del PS) */
function claveDe(x){
  return String(x.comp_id || "") + ":" + String(x.comp_entrada_id || "") + ":" + String(x.cod_art || "");
}
function claveCP(c){ return MODO + ":" + c.tipo + ":" + c.ref; }

/* En Enviar tienen sugerido: PS y talleristas (máximo − stock − lo que ya está en el destino) y
   los INYECTORES (bolsas de resina en kg = Σ deficit de las partes plásticas × kg_x_uni). Prov. AT
   no tiene sugerido y ahí la tablet sigue mostrando "Online sector". */
function envConSugerido(){
  return MODO === "enviar" && !!selCP &&
    (selCP.tipo === "proveedor_servicio" || selCP.tipo === "tallerista" || selCP.tipo === "inyector");
}

/* La tablet NO se acuerda de lo tipeado en Enviar a P.S. / inyector: si se sale sin registrar, la
   cantidad desaparece [usuario 2026-09-18, textual: "si cargue algo yo, cuando salgo quiero que
   desaparezca, no que se guarde, por lo tanto todas las cantidades deben estar vacias"]. El buffer
   de localStorage se sigue usando mientras la contraparte esta abierta (es de donde sale lo que se
   registra y lo que sobrevive a un toque de mas), pero se borra al ENTRAR y al SALIR: nunca queda
   un numero de ayer esperando que alguien lo registre sin mirar. Desde el 2026-09-18 vale TAMBIEN
   para los TALLERISTAS `[usuario, elegido entre tres opciones: "igual que P.S.: vacio y sin
   memoria"]`: con eso ya no queda nadie con la cantidad precargada. */
function envSinMemoria(c){
  // los cuatro destinos de Enviar: P.S., inyector, tallerista y prov. de art. terminado. O sea que
  // en Enviar ya no queda tabla ni memoria en ningun lado [usuario 2026-09-18].
  return MODO === "enviar" && !!c &&
    (c.tipo === "proveedor_servicio" || c.tipo === "inyector" ||
     c.tipo === "tallerista" || c.tipo === "proveedor_at");
}
function olvidarCargado(c){
  if (envSinMemoria(c)) BUF.borrar(c.id);
}

/* Unidad de ENVIO del proveedor (display), p.ej. AJ Adhesivos manda de a PAQUETES de 100 pliegos
   [usuario 2026-09-17]. Solo presentacion: sugerido y cantidad se MUESTRAN/CARGAN divididos por
   factor y rotulados con label, pero al registrar se multiplica de nuevo y se guarda en la unidad
   canonica (uni/kg). Devuelve {factor,label} si el proveedor lo definio (envio_uni_x>1), o null. */
function packEnvio(){
  if (!selCP) return null;   // es del PROVEEDOR: en Recibir la entrega copia esta misma unidad
  var lab = String(selCP.envio_unidad || "");
  // envio_unidad='kg' es el envío POR PESO (Hernandez Julio), que tiene su propio camino
  // (pesoEnvio/bultoDe): ahí el bulto va en una columna aparte, no es la unidad del sugerido.
  if (!lab || lab.toLowerCase() === "kg") return null;
  var f = Number(selCP.envio_uni_x || 0);
  // cargaKg: el sugerido se MIRA en el envase pero la cantidad se ESCRIBE en kg (Ester,
  // Guazzaroni). Sin esto (AJ Adhesivos) el campo va en la misma unidad que el sugerido.
  var ckg = String(selCP.envio_carga_unidad || "").toLowerCase() === "kg";
  // SIN factor del proveedor el envase es el CAJÓN de CADA PIEZA (Guazzaroni Patricio): el factor
  // sale de componente.uni_x_cajon fila por fila, igual que el bulto de Julio. Solo tiene sentido
  // cargando en kg (si no, no habría con qué pasar del cajón a lo que se escribe).
  if (!(f > 1)) return ckg ? { factor: 0, label: lab, cargaKg: true, porPieza: true } : null;
  return { factor: f, label: lab, cargaKg: ckg, porPieza: false };
}

/* ---------- EL ENVASE DE UNA PIEZA ----------
   Con qué se manda ESA pieza a ESTE destino: {factor, label, cargaKg, redondea} o null (= va en
   unidades, no se inventa un envase). Junta las dos formas que conviven:
     · P.S.: lo dice el PROVEEDOR (packEnvio). Con envase por pieza (Guazzaroni, Jade y los otros
       que van por el cajón de cada pieza) el factor sale de componente.uni_x_cajon fila por fila.
     · TALLERISTA y PROV. DE ART. TERMINADO: lo dice la PIEZA, y lo manda la base en cada fila del
       bundle [usuario 2026-09-18]: cartón y caja en PAQUETES (el paquetón del formato / los 25 de
       la caja) y el resto con el sugerido en CAJONES y la cantidad en KG. Ver env_unidad /
       env_factor / env_carga en tablet_bundle.
   El redondeo del renglon de equivalencia NO vive aca: es uno solo para todos (textoEnvases). */
function envaseDe(x){
  if (!selCP || !x) return null;
  if (MODO === "recibir") {
    // ENTREGA de un tallerista: el esperado se mira en CAJONES (o en las bolsas de 120 de GRJ5 y
    // GRJ6) y la cantidad se escribe en KG. Lo dice la pieza: componente.entrega_unidad /
    // entrega_uni_x, con default cajones + uni_x_cajon. [usuario 2026-09-18]
    if (selCP.tipo === "tallerista") {
      var fr = Number(x.env_factor || 0);
      if (!x.env_unidad || !(fr > 0)) return null;   // pieza sin cajon cargado: queda en unidades
      return { factor: fr, label: String(x.env_unidad),
               cargaKg: String(x.env_carga || "") === "kg" };
    }
    if (selCP.tipo !== "proveedor_servicio") return null;
    // ENTREGA de un P.S. [usuario 2026-09-18: "AJ adhesivos entrega en paquetes de 200. El resto
    // copia la logica del envio: si enviamos en bolsas recepcionamos en bolsas, si lo hacemos en
    // cajones, en cajones. Charcas cajones"]. Primero el override del proveedor
    // (proveedor_servicio.entrega_*), y si no lo tiene, la MISMA unidad con la que se le envia.
    var lab = selCP.entrega_unidad ? String(selCP.entrega_unidad) : "";
    if (lab) {
      var fx = Number(selCP.entrega_uni_x || 0);
      if (fx > 0) return { factor: fx, label: lab, cargaKg: false };   // AJ: entrega 200 por paquete
      var fp = Number(x.uxc || 0);                                     // Charcas: el cajon de la pieza
      return fp > 0 ? { factor: fp, label: lab, cargaKg: true } : null;
    }
    if (pesoEnvio()) {                             // Julio: el bulto lo pone el sector de la pieza
      var bb = bultoDe(x);
      return (bb && bb.uxc > 0) ? { factor: bb.uxc, label: bb.label, cargaKg: true } : null;
    }
    var pkr = packEnvio();
    if (!pkr) return null;
    var fr2 = pkr.porPieza ? Number(x.uxc || 0) : pkr.factor;
    return (fr2 > 0) ? { factor: fr2, label: pkr.label, cargaKg: pkr.cargaKg } : null;
  }
  if (MODO !== "enviar") return null;
  // tallerista y prov. de art. terminado: la unidad la trae la PIEZA en el bundle. El prov. AT
  // recibe solo cartones y cajas, asi que para el siempre son PAQUETES.
  if (selCP.tipo === "tallerista" || selCP.tipo === "proveedor_at") {
    var ft = Number(x.env_factor || 0);
    if (!x.env_unidad || !(ft > 0)) return null;   // pieza sin paquete / sin cajón cargado
    return { factor: ft, label: String(x.env_unidad),
             cargaKg: String(x.env_carga || "") === "kg" };
  }
  var pk = packEnvio();
  if (!pk) return null;
  var f = pk.porPieza ? Number(x.uxc || 0) : pk.factor;
  if (!(f > 0)) return null;
  return { factor: f, label: pk.label, cargaKg: pk.cargaKg };
}

/* Cuantos KG entran en UN envase de esta pieza. Si la pieza se cuenta en unidades, el envase son
   factor x kg_x_uni (Ester: 1800 x 0,0054 = 9,72 kg); si la pieza ya se mide en kg, el factor YA
   esta en kg. 0 = no se puede saber (a la pieza le falta kg_x_uni). */
function kgPorEnvase(x){
  var ev = envaseDe(x);
  if (!ev) return 0;
  if (unidadDe(x) === "kg") return ev.factor;
  var k = Number(x.kg_x_uni || 0);
  return k > 0 ? ev.factor * k : 0;
}
/* true si la CANTIDAD de esta pieza se escribe en kg. Pide las dos cosas: que el envase lo diga y
   que la pieza permita pasar del envase a kg. Si no, cae al modo de AJ (se escribe en el envase) o
   a unidades, en vez de mostrar un kg inventado. */
function cargaEnKg(x){
  var ev = envaseDe(x);
  return !!(ev && ev.cargaKg && kgPorEnvase(x) > 0);
}
/* El "= N bolsas" que va debajo del campo cuando la cantidad se carga en kg. Con `redondear`
   (Guazzaroni: "que te diga cuantos cajones son (redondeando)") no se muestran decimales: va el
   entero más cercano con "≈" para que se lea que es redondeado. Si redondeando diera CERO se
   vuelve a los 2 decimales: "≈ 0 cajones" no le dice nada al operario. */
function equivEnvase(kg, kgEnv, label){
  // campo vacío = nada que equivaler: un "= 0 cajones" debajo de un campo en blanco es ruido
  // (desde que la cantidad no se precarga, el campo arranca vacío en todos los P.S.).
  if (!(Number(kg || 0) > 0)) return "";
  return textoEnvases((kgEnv > 0) ? (Number(kg || 0) / kgEnv) : 0, label);
}

/* UN ENVASE NO SE PARTE: bolsas y cajones se dicen SIEMPRE en entero, nunca con decimales
   [usuario 2026-09-18, sobre un "= 6,17 bolsas": "acordate que todo lo que sea envio de cajones y
   bolsas redondear. En este caso, el pasaje serian 6 bolsas"]. Se redondea al MÁS CERCANO, que es
   lo que cierra con los dos ejemplos que dio: 6,17 -> 6 y 4,83 -> 5.
   El signo avisa de dónde sale el número: "=" cuando da justo, "≈" cuando se redondeó. Y si
   redondeando diera cero se dice con palabras, porque "≈ 0 bolsas" no le sirve a nadie.
   OJO: esto es para lo que SE ENVÍA. El SUGERIDO sigue yendo para arriba (techo) — es "lo que
   falta", y pedir menos de lo que falta no llena el lugar [usuario 2026-09-17, Ester]. */
function textoEnvases(n, label){
  if (!(n > 0)) return "";
  var r = Math.round(n);
  var et = (r === 1) ? singularEnvase(label) : label;   // "= 1 cajon", no "= 1 cajones"
  if (Math.abs(n - r) < 0.005) return "= " + fmt(r, 0) + " " + et;
  if (r < 1) return "menos de 1 " + singularEnvase(label);
  return "≈ " + fmt(r, 0) + " " + et;
}
function singularEnvase(label){
  return label === "bolsas" ? "bolsa" : (label === "cajones" ? "cajón" : label);
}

/* Envio POR PESO: el proveedor recibe pesado (hoy Hernandez Julio). Se marca con
   proveedor_servicio.envio_unidad='kg' SIN envio_uni_x, porque acá el bulto no es uno solo para
   todo el proveedor como en AJ: cambia por pieza (ver bultoDe). */
function pesoEnvio(){
  if (!selCP) return false;
  return String(selCP.envio_unidad || "").toLowerCase() === "kg" && !(Number(selCP.envio_uni_x) > 1);
}

/* El BULTO de una pieza cuando se manda por peso: las partes plásticas van en BOLSAS y el resto en
   CAJONES. El tamaño del bulto es componente.uni_x_cajon en los dos casos (en los plásticos esa
   columna ES el tamaño de la bolsa). Sin kg_x_uni no hay conversión: devuelve null y la fila se
   carga como siempre, en unidades. */
function bultoDe(x){
  var kgu = Number((x && x.kg_x_uni) || 0), uxc = Number((x && x.uxc) || 0);
  if (!(kgu > 0)) return null;
  var plast = /pl[aá]stico/i.test(String((x && x.sector) || ""));
  return { kgu: kgu, uxc: uxc > 0 ? uxc : 0, label: plast ? "bolsas" : "cajones" };
}
/* Un bulto NO se parte: los cajones y las bolsas van SIEMPRE enteros, redondeados para arriba
   [usuario 2026-09-17: "acordate que los cajones y las bolsas siempre van redondeadas, no puedes
   poner 4,83, sino que pones 5"]. Mismo criterio que el sugerido en paquetes de AJ y en bolsas de
   Ester. */
function bultosDeKg(b, kg){
  // entero redondeado al más cercano, misma regla que el renglón (ver textoEnvases). Puede dar 0
  // si lo tipeado no llega a un envase: ahí no se anota un bulto que no existe.
  return (b && b.uxc > 0 && kg > 0) ? Math.round(kg / b.kgu / b.uxc) : null;
}
/* los envases crudos (con decimales) de esos kg, para el texto del renglón */
function envasesDeKg(b, kg){
  return (b && b.uxc > 0 && kg > 0) ? (kg / b.kgu / b.uxc) : null;
}
/* el sugerido de la pieza (que viene en unidades) llevado a bultos enteros */
function bultosSugeridos(b, sugUni){
  return (b && b.uxc > 0 && sugUni > 0) ? Math.ceil(sugUni / b.uxc) : null;
}

/* ---------- la vista de TARJETAS (Enviar → Prov. de servicio) ----------
   [usuario 2026-09-18: "quiero reemplazar ese listado por boxes o tarjetas individuales… al
   seleccionar una parte, debe abrirse una vista donde se muestre la cantidad sugerida y un campo
   para indicar la cantidad efectiva que se va a enviar"]. Vale para P.S. e inyector (que se elige
   adentro del mismo botón "Prov. de servicio"), que es justo el conjunto que ya no se acuerda de
   lo tipeado: la misma cuenta de envSinMemoria. Talleristas, prov. de art. terminado y TODO
   Recibir siguen con la tabla — ahí hay esperado, exceso y remito, y se leen de corrido. */
function vistaTarjetas(){
  // en Enviar, los cuatro destinos; en Recibir, el tallerista y el P.S. [usuario 2026-09-18:
  // "quiero que tambien aparezcan las partes en box... en vez de sugerido y cantidad, va a ser
  // esperado y cantidad"]. Ojo: en Recibir la tablet SI se acuerda de lo tipeado (envSinMemoria
  // es solo de Enviar): lo que cambia aca es como se ve, no la memoria.
  return envSinMemoria(selCP) ||
    (MODO === "recibir" && !!selCP &&
     (selCP.tipo === "tallerista" || selCP.tipo === "proveedor_servicio"));
}

/* El SUGERIDO de una pieza tal como se muestra, en la unidad de envío del proveedor. Lo usan la
   tabla y la tarjeta, así no hay dos cuentas que se puedan separar:
     txt   el número ya formateado          uni   su unidad (paquetes, bolsas, cajones, kg, uni)
     nota  la aclaración cuando no se puede  small lo que la TABLA pinta en su <small> */
function sugeridoInfo(x){
  var b = (MODO === "enviar" && pesoEnvio()) ? bultoDe(x) : null;
  var u = unidadDe(x);
  if (b) {
    // por peso el sugerido se mira EN BULTOS enteros, no en kilos [usuario 2026-09-17]
    var sugB = bultosSugeridos(b, Number(x.sugerido));
    var faltaB = "sin " + (b.label === "bolsas" ? "bolsa" : "cajón") + " cargado";
    return { txt: fmt(sugB, 0, "—"), num: sugB, uni: sugB != null ? b.label : "",
             nota: sugB != null ? "" : faltaB, small: sugB != null ? b.label : faltaB };
  }
  var ev = envaseDe(x);
  var sug = x.sugerido;
  if (ev && x.sugerido != null) sug = Math.ceil(Number(x.sugerido) / ev.factor);
  // el destino manda por envase pero ESTA pieza no lo tiene cargado: no se inventa el factor, la
  // fila queda en unidades (sugerido y campo) y se avisa para que no se lea como cajones.
  var falta = faltaEnvase(x);
  return { txt: fmt(sug, (!ev && u === "kg") ? 2 : 0, "—"),
           num: sug,
           uni: ev ? ev.label : u,
           nota: falta,
           small: falta ? (u + " · " + falta) : "" };
}

/* El aviso cuando el destino manda por envase y a la pieza le falta el dato para convertir:
   sin uni_x_cajon no hay cajón, sin el paquetón del formato no hay paquete. Vacío = no aplica. */
function faltaEnvase(x){
  if (MODO !== "enviar" || !selCP || !x || envaseDe(x)) return "";
  if (selCP.tipo === "tallerista")
    return x.env_unidad
      ? ("sin " + (String(x.env_unidad) === "paquetes" ? "paquete" : "cajón") + " cargado")
      : "";
  var pk = packEnvio();
  return (pk && pk.porPieza) ? "sin cajón cargado" : "";
}

/* EL NUMERO DE REFERENCIA de la tarjeta y de la vista de la parte: el SUGERIDO donde lo hay
   (P.S., tallerista, inyector) y el ONLINE DEL SECTOR en el prov. de art. terminado, que no tiene
   sugerido — ahí la referencia es lo que hay en Cervantes para mandarle. Devuelve el mismo
   {rotulo, txt, num, uni, nota} para los dos, así la tarjeta no sabe de la diferencia. */
function refInfo(x){
  if (MODO === "recibir") {
    // ESPERADO: lo que la base cree que el tallerista tiene para entregar, mirado en CAJONES (o en
    // las bolsas de 120 de GRJ5/GRJ6). Se dice con el mismo criterio que el resto de los envases:
    // entero mas cercano, con "≈" cuando se redondeo. [usuario 2026-09-18]
    var ev = envaseDe(x), u = unidadDe(x);
    if (x.esperado == null)
      return { rotulo: "Esperado", txt: "—", num: null, uni: "", nota: "sin referencia", small: "" };
    var e = Number(x.esperado);
    if (ev) return { rotulo: "Esperado", txt: textoEnvases(e / ev.factor, ev.label).replace("= ", ""),
                     num: null, uni: "", nota: "", small: "" };
    return { rotulo: "Esperado", txt: fmt(e, u === "kg" ? 2 : 0), num: e, uni: u,
             nota: faltaEnvase(x), small: "" };
  }
  if (envConSugerido()) {
    var si = sugeridoInfo(x);
    si.rotulo = "Sugerido";
    return si;
  }
  var u = unidadDe(x);
  return { rotulo: "Online sector", txt: fmt(x.online_sector, u === "kg" ? 2 : 0, "—"),
           num: Number(x.online_sector), uni: u, nota: faltaEnvase(x), small: "" };
}

/* La unidad con la que se ESCRIBE la cantidad de esa pieza (la del campo, no la de la pieza). */
function uniCarga(x){
  if ((pesoEnvio() && bultoDe(x)) || cargaEnKg(x)) return "kg";   // pesoEnvio ya exige Enviar
  var ev = envaseDe(x);
  return ev ? ev.label : unidadDe(x);
}
function decDe(x){ return uniCarga(x) === "kg" ? 2 : 0; }

/* "1 cajones" no se lee: con uno va el singular. Solo toca las etiquetas que usamos. */
var SINGULAR = { cajones: "cajón", paquetes: "paquete", bolsas: "bolsa" };
function unidadTxt(n, label){
  return (Number(n) === 1 && SINGULAR[label]) ? SINGULAR[label] : label;
}

/* la pieza abierta en la vista de una parte */
function piezaDe(k){
  var arr = piezasDe(selCP);
  for (var i = 0; i < arr.length; i++) if (claveDe(arr[i]) === k) return arr[i];
  return null;
}


/* EL RENGLÓN CHICO DE DEBAJO DEL CAMPO DE KG: a cuántos envases equivale lo tipeado. Es UNO SOLO
   para las dos formas que se cargan en kg, así el operario ve siempre lo mismo [usuario 2026-09-18,
   textual: "esta bien que me lo ponga chiquito abajo, pero modifica hernandez julio asi quedan
   todos asi"]:
     · envase del PROVEEDOR — Ester (bolsas de 1800) y los que van por el cajón de cada pieza
       (Guazzaroni, Jade, FAAT, Mabra, Maspoli, Pedernera, Scorrano);
     · envío POR PESO — Hernandez Julio, donde el bulto lo pone el SECTOR de la pieza (plásticos
       bolsas, el resto cajones) y va con TECHO: un bulto no se parte.
   null = esta fila no lleva renglón (no hay con qué convertir y no se inventa el factor). */
function eqFila(x, q){
  var b = (MODO === "enviar" && pesoEnvio()) ? bultoDe(x) : null;
  if (b) {
    var n = envasesDeKg(b, q);
    return n != null ? textoEnvases(n, b.label) : "";
  }
  var ev = envaseDe(x);
  return cargaEnKg(x) ? equivEnvase(q, kgPorEnvase(x), ev.label) : null;
}

/* ---------- carga ---------- */
async function cargar(){
  try {
    var r = await SB.rpc("tablet_bundle");
    if (r.error) throw r.error;
    D = r.data || D;
    BUF.load();
    var m = new URLSearchParams(location.search).get("modo");
    var guardado = null;
    try { guardado = localStorage.getItem("gp2_tablet_modo"); } catch(e){}
    setModo(m || guardado || "enviar");
  } catch(e){
    $("status").innerHTML = '<span style="color:#b91c1c">Error: ' + esc(e.message || e) + "</span>";
  }
}

function setModo(m){
  if (m !== "enviar" && m !== "recibir") m = "enviar";
  olvidarCargado(selCP);   // antes de cambiar MODO: despues envSinMemoria ya mira el modo nuevo
  MODO = m;
  try { localStorage.setItem("gp2_tablet_modo", m); } catch(e){}
  var bs = document.querySelectorAll("#modos .modo-btn");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("active", bs[i].dataset.modo === m);
  mostrarTipos();
}

/* contrapartes que aplican al modo. En enviar, sólo a quien se le manda desde Cervantes.
   En recibir queda afuera el prov. de art. terminado (entrega en Virgilio) y el prov. de
   insumos, que tiene su propia pantalla con rubros, pesaje y cruce contra OC. */
function cpsDelModo(){
  return (D.contrapartes || []).filter(function(c){
    if (MODO === "enviar") return c.tipo !== "virgilio" && c.tipo !== "proveedor_insumo" && Number(c.n_env) > 0;
    return c.tipo !== "proveedor_at" && c.tipo !== "proveedor_insumo" && Number(c.n_rec) > 0;
  });
}
function cpsDelTipo(tipo){
  // Los INYECTORES tienen su propio boton, NO van adentro de "Prov. de servicio" [usuario
  // 2026-09-18]. En la base son proveedor_insumo/inyector (no proveedor_servicio) y el envio de
  // bolsas lo sigue ruteando tablet_registrar a enviar_material_inyector: lo unico que cambio es
  // donde se los elige.
  return cpsDelModo().filter(function(c){ return c.tipo === tipo; });
}
/* la contraparte como la espera el resto de la pantalla (id = clave del buffer) */
function cpItem(c){
  return { id: claveCP(c), tipo: c.tipo, ref: c.ref, nombre: c.nombre,
           envio_unidad: c.envio_unidad, envio_uni_x: c.envio_uni_x,
           envio_carga_unidad: c.envio_carga_unidad,
           entrega_unidad: c.entrega_unidad, entrega_uni_x: c.entrega_uni_x,
           n: MODO === "enviar" ? c.n_env : c.n_rec };
}
function cargadasDeCP(c){
  return E.cargadasDe(BUF.all[claveCP(c)], function(it){ return num(it.q) > 0; }).length;
}
function avisoAlertas(){
  return Number(D.alertas_abiertas) > 0
    ? "⚠ " + D.alertas_abiertas + " alerta" + (D.alertas_abiertas === 1 ? "" : "s") + " de recepción sin revisar"
    : "";
}

/* ---------- paso 1: el tipo ---------- */
function mostrarTipos(){
  olvidarCargado(selCP);
  cerrarDetalle();
  selTipo = null; selCP = null;
  E.mostrarFase(0);
  $("tipoGrid").classList.remove("hidden");
  $("cpBox").classList.add("hidden");
  $("btnVolverTipo").classList.add("hidden");
  $("fase0Title").textContent = MODO === "enviar" ? "¿A quién le enviás?" : "¿Quién trae?";
  pintarTipos();
}

function pintarTipos(){
  var g = $("tipoGrid");
  g.innerHTML = "";
  (TIPOS[MODO] || []).forEach(function(t){
    var lista = t.link ? null : cpsDelTipo(t.tipo);
    if (lista && !lista.length) return;   // un tipo sin contrapartes no se dibuja: no lleva a nada
    var b = document.createElement(t.link ? "a" : "button");
    if (t.link) b.href = t.link; else b.type = "button";
    b.className = "tipo-btn";
    b.dataset.tipo = t.tipo;
    // el número sin la palabra "contraparte": el título del tipo ya dice qué son. NO se muestra
    // "N sin registrar" [usuario 2026-09-16]: desde que Enviar precarga el sugerido, abrir una
    // contraparte ya llenaba el buffer y el cartelito contaba destinos sin trabajo real.
    b.innerHTML = '<span class="ti">' + t.icono + " " + esc(t.titulo) + "</span><small>" + esc(t.sub) +
      (lista ? " · " + lista.length : "") + "</small>";
    if (!t.link) b.addEventListener("click", function(){ elegirTipo(t); });
    g.appendChild(b);
  });
  $("status").textContent = avisoAlertas();
}

/* ---------- paso 2: la contraparte de ese tipo ---------- */
function elegirTipo(t){
  selTipo = t.tipo;
  var lista = cpsDelTipo(t.tipo);
  if (lista.length === 1) { elegir(cpItem(lista[0])); return; }  // un solo destino: no se elige entre uno
  $("tipoGrid").classList.add("hidden");
  $("cpBox").classList.remove("hidden");
  $("btnVolverTipo").classList.remove("hidden");
  $("fase0Title").textContent = t.titulo;
  $("q0").value = "";
  pintarCPS();
}

function pintarCPS(){
  var lista = E.filtrar(cpsDelTipo(selTipo), $("q0").value, function(c){ return c.nombre; });
  E.gridContrapartes("cpGrid", lista.map(cpItem), {
    vacio: "No hay a quién en este modo.",
    meta: function(c){
      // el tipo no se repite en cada chip: ya lo dice el título de arriba
      var cargado = E.cargadasDe(BUF.all[c.id], function(it){ return num(it.q) > 0; }).length;
      return c.n + " pieza" + (c.n === 1 ? "" : "s") +
        (cargado ? (" · <b>" + cargado + " cargadas</b>") : "");
    },
    onPick: elegir
  });
  var av = avisoAlertas();
  $("status").textContent = lista.length + " para elegir" + (av ? " · " + av : "");
}

/* ---------- piezas de la contraparte elegida ---------- */
function piezasDe(c){
  var arr;
  if (MODO === "enviar") {
    // Cada contraparte ve SOLO sus piezas (para prov. AT, los cartones/cajas que la receta de
    // sus articulos usa; antes iba con ref '*' y mostraba los 191 a todos, bug 2026-09-15).
    arr = (D.enviar || []).filter(function(x){
      return x.tipo === c.tipo && String(x.ref) === String(c.ref);
    });
  } else {
    arr = (D.recibir || []).filter(function(x){ return x.tipo === c.tipo && String(x.ref) === String(c.ref); });
  }
  return arr.sort(function(a,b){ return String(a.cod).localeCompare(String(b.cod)); });
}

function elegir(c){
  // lo que se hubiera tipeado antes en este P.S. no sobrevive: la tabla arranca vacia
  olvidarCargado(c);
  selCP = c;
  cerrarDetalle();                 // se entra por la grilla, nunca con una parte abierta
  $("fase1Title").textContent = c.nombre;
  E.mostrarFase(1);
  var esRec = MODO === "recibir";
  $("lblRemito").classList.toggle("hidden", !esRec);
  $("fRemito").classList.toggle("hidden", !esRec);
  if (!$("fFecha").value) $("fFecha").value = hoyISO();
  $("q").value = "";
  // Enviar con sugerido: la tabla muestra SOLO Pieza · Sugerido · Cantidad [usuario 2026-09-17:
  // "quiero ver solo la columna de pieza, sugerido y cantidad"]. Se sacaron Stock PS/Stock Tall.
  // (saldo_dest) y Máximo/O.C. (maximo); el cálculo del sugerido no cambia, solo el render.
  // Si el proveedor tiene unidad de envío propia (paquetes, etc.) se aclara en ambos encabezados.
  var _pk = packEnvio();
  var _u = _pk ? " (" + esc(_pk.label) + ")" : "";
  // Ester mira el sugerido en bolsas pero PESA lo que manda: ahí la Cantidad va en kg.
  var _uq = (_pk && _pk.cargaKg) ? " (kg)" : _u;
  // Envío por peso (Julio): 4 columnas — el sugerido EN BULTOS (enteros) y las dos cantidades, con
  // la unidad entre paréntesis como en el resto de las pantallas [usuario 2026-09-17].
  $("thead").innerHTML = pesoEnvio()
    ? "<th>Pieza</th><th class=\"num\">Sugerido</th><th class=\"num sep\">Cantidad (kg)</th>"
    : MODO === "enviar"
    ? (envConSugerido()
        ? "<th>Pieza</th><th class=\"num\">Sugerido" + _u + "</th><th class=\"num sep\">Cantidad" + _uq + "</th>"
        : "<th>Pieza</th><th class=\"num\">Online sector</th><th class=\"num sep\">Cantidad</th>")
    : "<th>Pieza</th><th class=\"num\">Esperado</th><th class=\"num sep\">Recibido</th>";
  // NO se precarga NADA: desde el 2026-09-18 ningún destino de Enviar arranca con la cantidad
  // escrita (P.S. e inyector desde el 17, el tallerista desde el 18, elegido por el usuario). El
  // Sugerido se sigue mostrando: es la referencia, no la orden. Ver envSinMemoria().
  render();
}

/* El "← Cambiar" vuelve un paso, no al principio: a la lista de contrapartes del tipo, y
   si ese tipo tenía una sola (Virgilio) directamente a los tipos. */
function volver(){
  olvidarCargado(selCP);
  cerrarDetalle();
  selCP = null;
  if (!selTipo || cpsDelTipo(selTipo).length <= 1) { mostrarTipos(); return; }
  E.mostrarFase(0);
  $("tipoGrid").classList.add("hidden");
  $("cpBox").classList.remove("hidden");
  $("btnVolverTipo").classList.remove("hidden");
  pintarCPS();
}

/* esperado en la unidad con la que se carga */
function esperadoTxt(x){
  if (x.esperado == null) return '<span class="esp">—<small>sin referencia</small></span>';
  var u = unidadDe(x);
  var e = Number(x.esperado);
  var origen = { oc: "según OC", online_tall: "stock que tiene", online_ps: "stock que tiene",
                 online_virgilio: "online Virgilio" }[x.esperado_origen] || x.esperado_origen || "";
  return '<span class="esp">' + fmt(e, u === "kg" ? 2 : 0) + " " + u + "<small>" + esc(origen) + "</small></span>";
}

/* Lo tipeado llevado a la unidad CANONICA de la pieza (uni, o kg si la pieza se mide en kg), que
   es la del esperado y la del stock. Sin esto, escribir kg contra un esperado en unidades
   comparaba peras con manzanas. */
function canonDe(x, q){
  if (!(q > 0)) return 0;
  if (cargaEnKg(x) && unidadDe(x) !== "kg") {
    var k = Number(x.kg_x_uni || 0);
    return k > 0 ? q / k : q;
  }
  var ev = envaseDe(x);
  return (ev && !ev.cargaKg) ? q * ev.factor : q;
}

function exceso(x, q){
  if (MODO !== "recibir" || x.esperado == null || !(q > 0)) return 0;
  var d = canonDe(x, q) - Number(x.esperado);
  return d > 0 ? d : 0;
}

function filtradas(){
  return E.filtrar(piezasDe(selCP), $("q").value, function(x){
    return String(x.cod || "") + " " + String(x.desc || "") + " " + String(x.ent_cod || "") + " " + String(x.sector || "");
  });
}

/* Un solo punto de entrada: según la contraparte, tarjetas (P.S. / inyector) o tabla. */
function render(){
  var tarj = vistaTarjetas();
  $("tblBox").classList.toggle("cards", tarj);
  $("tblWrap").classList.toggle("hidden", tarj);
  $("cardsGrid").classList.toggle("hidden", !tarj);
  if (tarj) renderCards(); else renderTabla();
}

/* ---------- las partes como TARJETAS ----------
   Código y descripción (lo mínimo que pidió el usuario), el sugerido de referencia y, abajo, lo
   que hoy se va a mandar: así se ve de un vistazo qué quedó cargado y qué no. */
function renderCards(){
  var arr = filtradas();
  var g = $("cardsGrid");
  g.innerHTML = "";
  $("tblEmpty").classList.toggle("hidden", arr.length > 0);
  if (!arr.length) $("tblEmpty").textContent = "Sin resultados para ese filtro.";
  arr.forEach(function(x){
    var k = claveDe(x), it = BUF.item(selCP.id, k), q = num(it.q);
    var si = refInfo(x), uc = uniCarga(x), ex = exceso(x, q);
    var b = document.createElement("button");
    b.type = "button";
    b.className = "parte-card" + (q > 0 ? " cargada" : "") + (ex > 0 ? " demas" : "");
    b.dataset.k = k;
    b.innerHTML =
      '<span class="pc-cod">' + esc(x.cod) + uniTag(uc) + "</span>" +
      '<span class="pc-desc">' + esc(x.desc || "") +
        // en Recibir importa QUE pieza consume lo que traen (la fila de la tabla ya lo decia)
        (MODO === "recibir" && x.ent_cod ? ' <span class="pc-nota">· consume ' + esc(x.ent_cod) + "</span>" : "") +
        "</span>" +
      '<span class="pc-sug">' + si.rotulo + " " + si.txt +
        (si.uni ? " " + esc(unidadTxt(si.num, si.uni)) : "") +
        (si.nota ? '<span class="pc-nota"> · ' + esc(si.nota) + "</span>" : "") + "</span>" +
      '<span class="pc-estado">' + (q > 0
        ? (MODO === "recibir" ? "✓ recibe <b>" : "✓ envía <b>") +
          fmt(q, decDe(x)) + " " + esc(unidadTxt(q, uc)) + "</b>" +
          (ex > 0 ? '<span class="pc-demas">⚠ ' + fmt(ex, unidadDe(x) === "kg" ? 2 : 0) + " de más</span>" : "")
        : "sin cargar") + "</span>";
    g.appendChild(b);
  });
  actualizar();
}

function renderTabla(){
  var arr = filtradas();
  var tb = $("tbody");
  tb.innerHTML = "";
  $("tblEmpty").classList.toggle("hidden", arr.length > 0);
  if (!arr.length) $("tblEmpty").textContent = "Sin resultados para ese filtro.";

  arr.forEach(function(x){
    var k = claveDe(x);
    var it = BUF.item(selCP.id, k);
    var u = unidadDe(x);
    var q = num(it.q);
    var tr = document.createElement("tr");
    tr.dataset.k = k;
    var sub = esc(x.desc || "");
    if (MODO === "recibir" && x.ent_cod) sub += ' · <span class="proc">consume ' + esc(x.ent_cod) + "</span>";
    var ex = exceso(x, q);
    // Ester / Guazzaroni: el sugerido queda en el envase (bolsas, cajones) pero la cantidad se
    // escribe en kg, así que debajo del campo va a cuántos envases equivale lo tipeado (se
    // recalcula en el evento input).
    var cargaKgFila = cargaEnKg(x);
    // el cartelito de unidad dice con qué se carga la fila: por peso siempre kg, aunque la pieza
    // sea de unidades (a Julio se le manda pesado; a Ester y Guazzaroni también).
    var uCarga = (MODO === "enviar" && ((pesoEnvio() && bultoDe(x)) || cargaKgFila)) ? "kg" : u;
    var pieza = '<td><span class="cod">' + esc(x.cod) + "</span>" + uniTag(uCarga) +
      '<br><small class="sub">' + sub + "</small>" +
      (ex > 0 ? '<br><span class="demas-tag">⚠ ' + fmt(ex, u === "kg" ? 2 : 0) + " de más</span>" : "") + "</td>";
    var mitad;
    // el bulto de la pieza cuando el proveedor recibe por peso (null = se carga en unidades)
    var b = (MODO === "enviar" && pesoEnvio()) ? bultoDe(x) : null;
    if (MODO === "enviar") {
      // Solo el Sugerido (se sacaron Stock y Máximo) [usuario 2026-09-17]. Si el proveedor recibe
      // por peso, el sugerido va en kg con la equivalencia en bultos abajo; si manda por paquetes,
      // en paquetes (techo); si no, en su unidad. Se MUESTRA siempre; en P.S. e inyector ya no se
      // precarga en la carga (v1.12.0), y lo tipeado ahí no se guarda al salir (v1.13.0). El
      // cálculo del sugerido no cambió, solo el render.
      // el sugerido sale de sugeridoInfo(), la misma cuenta que usa la tarjeta
      var si = sugeridoInfo(x);
      if (b) {
        mitad = '<td class="num esp"><b>' + si.txt + "</b><small>" + esc(si.small) + "</small></td>";
      } else {
        mitad = envConSugerido()
          ? ('<td class="num esp"><b>' + si.txt + "</b>" +
             (si.small ? "<small>" + esc(si.small) + "</small>" : "") + "</td>")
          : ('<td class="num esp">' + fmt(x.online_sector, u === "kg" ? 2 : 0) + " " + u + "</td>");
      }
    } else {
      mitad = '<td class="num">' + esperadoTxt(x) + "</td>";
    }
    var carga = E.tdInput("q", it.q, false, "sep", (b || cargaKgFila) ? "decimal" : inputmodeDe(u))
                 .replace('class="cell-in', 'class="cell-in big');
    // el bulto (bolsas/cajones) va SIEMPRE como renglón chico debajo del campo de kg, en las dos
    // formas: dejó de ser una columna aparte para Julio el 2026-09-18, a pedido del usuario.
    var eqTxt = eqFila(x, q);
    if (eqTxt != null)
      carga = carga.replace("</td>", '<small class="env-eq">' + esc(eqTxt) + "</small></td>");
    tr.innerHTML = pieza + mitad + carga;
    if (ex > 0) tr.classList.add("demas");
    tb.appendChild(tr);
  });
  actualizar();
}

/* ---------- la vista de UNA parte ----------
   Se abre al tocar la tarjeta: arriba el sugerido (grande, de referencia) y abajo el campo con la
   cantidad efectiva que se va a enviar. Es la MISMA carga de siempre — escribe en el mismo buffer,
   con las mismas unidades y las mismas equivalencias que la tabla —, solo que de a una pieza. */
function abrirParte(k){
  if (!piezaDe(k)) return;
  detK = k;
  $("tblBox").classList.add("hidden");
  $("detBox").classList.remove("hidden");
  $("tblEmpty").classList.add("hidden");
  pintarDetalle();
  var inp = $("detCard").querySelector('input[data-f="q"]');
  if (inp) inp.focus();
}

function cerrarDetalle(){
  detK = null;
  $("detBox").classList.add("hidden");
  $("tblBox").classList.remove("hidden");
}

/* volver a la grilla: la tarjeta se repinta con lo que quedó cargado */
function volverAPartes(){
  cerrarDetalle();
  render();
}

function pintarDetalle(){
  var x = piezaDe(detK);
  if (!x) { volverAPartes(); return; }
  var it = BUF.item(selCP.id, detK), q = num(it.q);
  var si = refInfo(x), uc = uniCarga(x);
  var ckg = cargaEnKg(x);
  var b = (MODO === "enviar" && pesoEnvio()) ? bultoDe(x) : null;
  var h =
    '<div class="det-cod">' + esc(x.cod) + uniTag(uc) + "</div>" +
    '<div class="det-desc">' + esc(x.desc || "") + "</div>" +
    (x.sector ? '<div class="det-sector">' + esc(x.sector) + "</div>" : "") +
    '<div class="det-lbl">' + (si.rotulo === "Sugerido" ? "Sugerido a enviar"
                              : si.rotulo === "Esperado" ? "Esperado" : "Online en el sector") + "</div>" +
    '<div class="det-sug">' + si.txt + (si.uni ? " " + esc(unidadTxt(si.num, si.uni)) : "") +
      (si.nota ? "<small>" + esc(si.nota) + "</small>" : "") + "</div>" +
    '<div class="det-lbl">' + (MODO === "recibir" ? "Cantidad" : "Cantidad a enviar") + "</div>" +
    '<div><input class="det-in" data-f="q" inputmode="' +
      ((b || ckg) ? "decimal" : inputmodeDe(unidadDe(x))) + '" value="' + esc(it.q || "") + '">' +
      '<span class="det-uni">' + esc(uc) + "</span>" +
      '<small class="det-eq">' + esc(eqFila(x, q) || "") + "</small></div>";
  // NO hay atajo para copiar el sugerido al campo [usuario 2026-09-18: "no quiero que aparezca la
  // opcion de enviar sugerido"]: la cantidad la escribe la persona, siempre. El sugerido de arriba
  // es referencia y nada mas (misma linea que 4ee).
  h += '<div class="det-acc"><button class="btn btn-primary" type="button" data-a="listo">Listo</button></div>';
  $("detCard").innerHTML = h;
}

function cargadas(){ return E.cargadasDe(BUF.de(selCP.id), function(it){ return num(it.q) > 0; }); }

function actualizar(){
  var n = cargadas().length;
  E.actualizarEnviar(n, MODO === "enviar" ? "Enviar" : "Recibir");
  // el aviso de exceso: informa, no frena (el botón sigue habilitado)
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });
  var conExceso = cargadas().filter(function(o){ return meta[o.k] && exceso(meta[o.k], num(o.it.q)) > 0; });
  var box = $("alertaBox");
  box.classList.toggle("hidden", conExceso.length === 0);
  if (conExceso.length) {
    box.innerHTML = "⚠ <b>Estás recibiendo más de lo esperado</b> en " + conExceso.length + " pieza" +
      (conExceso.length === 1 ? "" : "s") + " (" + conExceso.map(function(o){ return esc(meta[o.k].cod); }).join(", ") +
      "). <b>Podés registrar igual</b>: queda una alerta para que la revisen en Alertas.";
  }
}

/* ---------- eventos ---------- */
$("tbody").addEventListener("input", function(e){
  var inp = e.target.closest("input.cell-in");
  if (!inp) return;
  var tr = inp.closest("tr");
  BUF.item(selCP.id, tr.dataset.k)[inp.dataset.f] = inp.value;
  BUF.save();
  // repintar sólo lo que cambia de esa fila (el aviso de exceso), sin perder el foco
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });
  var x = meta[tr.dataset.k];
  if (x) {
    var q = num(inp.value), u = unidadDe(x), ex = exceso(x, q);
    // la cantidad se escribe en kg y debajo se ve a cuántos bultos equivale (los dos modos)
    var eq = tr.querySelector(".env-eq");
    if (eq) eq.textContent = eqFila(x, q) || "";
    tr.classList.toggle("demas", ex > 0);
    var old = tr.querySelector(".demas-tag"); if (old) { old.previousSibling && old.previousSibling.nodeName === "BR" && old.previousSibling.remove(); old.remove(); }
    if (ex > 0) tr.firstElementChild.insertAdjacentHTML("beforeend", '<br><span class="demas-tag">⚠ ' + fmt(ex, u === "kg" ? 2 : 0) + " de más</span>");
  }
  actualizar();
});

// cerrar la pestana, recargar o irse a otra pantalla cuenta como salir: lo tipeado en un P.S. no
// queda guardado para la proxima [usuario 2026-09-18].
window.addEventListener("pagehide", function(){ olvidarCargado(selCP); });

/* ---- eventos de la vista de tarjetas ---- */
$("cardsGrid").addEventListener("click", function(e){
  var c = e.target.closest(".parte-card");
  if (c) abrirParte(c.dataset.k);
});
$("btnVolverPartes").addEventListener("click", volverAPartes);
$("detBox").addEventListener("click", function(e){
  var b = e.target.closest("button[data-a]");
  if (!b) return;
  if (b.dataset.a === "listo") volverAPartes();
});
$("detBox").addEventListener("input", function(e){
  var inp = e.target.closest("input.det-in");
  if (!inp || !detK) return;
  var x = piezaDe(detK);
  if (!x) return;
  var it = BUF.item(selCP.id, detK);
  it[inp.dataset.f] = inp.value;
  BUF.save();
  var q = num($("detCard").querySelector('input[data-f="q"]').value);
  // el equivalente en bultos de lo tipeado: el mismo renglón chico en las cuatro formas de enviar
  var eq = $("detCard").querySelector(".det-eq");
  if (eq) eq.textContent = eqFila(x, q) || "";
  actualizar();
});

$("q").addEventListener("input", render);
$("q0").addEventListener("input", pintarCPS);
$("btnVolver").addEventListener("click", volver);
$("btnOtro").addEventListener("click", function(){ location.reload(); });
$("btnVolverTipo").addEventListener("click", mostrarTipos);
$("modos").addEventListener("click", function(e){
  var b = e.target.closest("button.modo-btn");   // Conteo es un <a>: se va solo a Relevamientos
  if (b) setModo(b.dataset.modo);
});

$("btnEnviar").addEventListener("click", async function(){
  if (!selCP) return;
  var items = cargadas();
  if (!items.length) return;
  var meta = {}; piezasDe(selCP).forEach(function(x){ meta[claveDe(x)] = x; });

  var fecha = $("fFecha").value || hoyISO();
  // si el proveedor manda por paquetes, la cantidad se carga EN paquetes: se multiplica por el factor
  // para guardar en la unidad canonica (pliegos/uni). El inventario nunca ve "paquetes".
  // Si en cambio la cantidad se carga en KG (Ester) o el proveedor recibe pesado (Julio), el kg
  // viaja tal cual con unidad 'kg' y to_canonical lo pasa a mangos con kg_x_uni: tampoco ve bolsas.
  var _peso = pesoEnvio();
  var payload = {
    modo: MODO, tipo: selCP.tipo, ref: String(selCP.ref),
    fecha: fecha + "T12:00:00",
    remito: MODO === "recibir" ? ($("fRemito").value.trim() || null) : null,
    items: items.map(function(o){
      var x = meta[o.k] || {};
      var u = unidadDe(x);
      var ckg = cargaEnKg(x);
      var ev = envaseDe(x);
      // por peso: lo que viaja son los KG (la base los pasa a unidades con kg_x_uni) y el bulto va
      // aparte, en movimiento.cajones — los cajones tal como los anotó el operario, las bolsas
      // calculadas desde los kg.
      var b = _peso ? bultoDe(x) : null;
      var q = num(o.it.q);
      var caj = b ? bultosDeKg(b, q) : null;
      // Ester: el bulto tambien queda anotado (las bolsas que dan esos kg), mismo criterio que las
      // bolsas calculadas de Julio: es informativo, el stock lo mueve la cantidad.
      if (caj == null && ckg && kgPorEnvase(x) > 0) caj = Math.round(q / kgPorEnvase(x));
      return {
        comp_id: x.comp_id != null ? Number(x.comp_id) : null,
        comp_entrada_id: x.comp_entrada_id != null ? Number(x.comp_entrada_id) : null,
        cod_art: x.cod_art || null,
        // sin cargar en kg, lo tipeado está en envases: se multiplica por el factor de ESA pieza
        // para guardar en la unidad canónica. Factor 0 (envase por pieza sin cajón cargado) = la
        // fila se cargó en unidades y viaja tal cual.
        cantidad: (ckg || b) ? q : (ev ? q * ev.factor : q),
        unidad: (ckg || b || u === "kg") ? "kg" : "uni",
        cajones: (caj != null && caj > 0) ? caj : null,
        // el esperado viaja en la MISMA unidad que la cantidad: la base los compara crudos para
        // levantar la alerta de "recibi de mas", y un esperado en unidades contra kg no compara.
        esperado: (MODO === "recibir" && x.esperado != null)
          ? ((ckg && u !== "kg") ? Number(x.esperado) * Number(x.kg_x_uni || 0) : Number(x.esperado))
          : null,
        esperado_origen: x.esperado_origen || null
      };
    })
  };
  var nEx = items.filter(function(o){ return meta[o.k] && exceso(meta[o.k], num(o.it.q)) > 0; }).length;
  var resumen = items.map(function(o){
    var x = meta[o.k] || {};
    var ev = envaseDe(x);
    if (cargaEnKg(x))
      return (x.cod || o.k) + ": " + fmt(num(o.it.q), 2) + " kg (" +
             equivEnvase(num(o.it.q), kgPorEnvase(x), ev.label)
               .replace("= ", "").replace("≈ ", "~") + ")";
    var b = _peso ? bultoDe(x) : null;
    if (b) {
      var q2 = num(o.it.q);
      var cb = bultosDeKg(b, q2);
      return (x.cod || o.k) + ": " + fmt(q2, 2) + " kg" + (cb ? " (" + fmt(cb, 0) + " " + b.label + ")" : "");
    }
    return ev
      ? (x.cod || o.k) + ": " + fmt(num(o.it.q), 0) + " " + ev.label
      : (x.cod || o.k) + ": " + fmt(num(o.it.q), unidadDe(x) === "kg" ? 2 : 0) + " " + unidadDe(x);
  });
  var verbo = MODO === "enviar" ? "Enviar a " : "Recibir de ";
  if (!confirm(verbo + selCP.nombre + " (" + fecha + "):\n\n" + resumen.join("\n") +
      (nEx ? "\n\n⚠ " + nEx + " pieza" + (nEx === 1 ? "" : "s") + " con más de lo esperado: se registra igual y queda la alerta." : ""))) return;

  var btn = $("btnEnviar");
  btn.disabled = true; btn.textContent = "Registrando…";
  $("msg1").textContent = "";
  try {
    var r = await SB.rpc("tablet_registrar", { p: payload });
    if (r.error) throw r.error;
    BUF.borrar(selCP.id);
    var res = r.data || {};
    var al = res.alertas || [];
    $("successTitle").textContent = MODO === "enviar" ? "✓ Enviado" : "✓ Recibido";
    $("successAlertas").innerHTML = al.length
      ? '<div class="alerta-box">⚠ <b>Quedó anotado para revisar</b>: ' + al.map(function(a){
          return esc(a.cod) + " (" + fmt(a.recibido, 0) + " contra " + fmt(a.esperado, 0) + " esperados)";
        }).join(", ") + ". La recepción se registró igual.</div>"
      : "";
    E.mostrarExito((res.n || items.length) + " pieza" + ((res.n || items.length) === 1 ? "" : "s") + " · " +
      (MODO === "enviar" ? "enviadas a " : "recibidas de ") + (res.contraparte || selCP.nombre) + " · " + fecha);
    try { var r2 = await SB.rpc("tablet_bundle"); if (!r2.error && r2.data) D = r2.data; } catch(e2){}
  } catch(err){
    $("msg1").innerHTML = '<span style="color:#b91c1c">Error: ' + esc(err.message || err) + "</span>";
    btn.disabled = false; actualizar();
  }
});

$("fFecha").value = hoyISO();
cargar();
</script>
