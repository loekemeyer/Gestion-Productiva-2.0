<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Despiece x Artículo (GP2)</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#0a0e13;color:#e6ecf3;font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
 .top{background:linear-gradient(90deg,#0a2a3a,#0f4256);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
 .top h1{margin:0;font-size:18px;color:#5fd0e0}
 .top .sub{font-size:11px;color:#8fc4d0}
 .filters{padding:12px 20px;background:#101820;border-bottom:1px solid #1e2a38;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
 .filters label{font-size:11px;text-transform:uppercase;color:#7a92a8;letter-spacing:.5px;margin-right:6px}
 .filters select,.filters input{background:#0b1119;color:#e6ecf3;border:1px solid #2a4a6e;border-radius:6px;padding:6px 10px;font:13px inherit}
 .filters input{min-width:220px}
 .filters select{min-width:260px}
 .btn{background:#2a4a6e;color:#e6ecf3;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font:13px inherit}
 .btn:hover{background:#356090}
 .kpis{padding:12px 20px;display:flex;gap:14px;flex-wrap:wrap}
 .kpi{background:#101820;border:1px solid #1e2a38;border-radius:8px;padding:10px 14px;min-width:110px}
 .kpi .n{font-size:22px;font-weight:800;color:#5fd0e0}
 .kpi .lb{font-size:10px;text-transform:uppercase;color:#7a92a8;letter-spacing:.6px}
 .content{padding:0 20px 40px}
 .art-section{margin:14px 0;border:1px solid #1e2a38;border-radius:8px;background:#0d141d;overflow:hidden}
 .art-head{padding:9px 14px;background:linear-gradient(90deg,#152233,#101820);display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none;flex-wrap:wrap}
 .art-head:hover{background:#1a2b40}
 .art-head .caret{color:#7a92a8;transition:transform .15s;display:inline-block;width:12px}
 .art-section.open .art-head .caret{transform:rotate(90deg)}
 .art-head .cod{color:#5fd0e0;font-weight:800;font-size:15px}
 .art-head .fam{color:#8fc4f0;font-size:12px}
 .art-head .stats{margin-left:auto;display:flex;gap:16px;font-size:11px;color:#7a92a8;align-items:center}
 .art-head .stats b{color:#e6ecf3;font-size:13px}
 .art-body{display:none;padding:0;overflow-x:auto}
 .art-section.open .art-body{display:block}
 table{border-collapse:collapse;font-size:12px;width:100%;min-width:640px}
 th,td{padding:6px 12px;text-align:left;border-bottom:1px solid #1e2a38;white-space:nowrap}
 th{color:#7a92a8;text-transform:uppercase;font-size:10px;letter-spacing:.4px;background:#0a1119}
 td.num{text-align:right;font-family:ui-monospace,SF Mono,monospace}
 tbody tr:hover{background:#111c28}
 .sect-tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
 .st-crudo{background:#3a2a10;color:#e0a95a}
 .st-procesado{background:#0e3226;color:#5fd39a}
 .st-transito{background:#1a2f47;color:#8fc4f0}
 .st-afilado{background:#2f2a1a;color:#d0c060}
 .st-fleje{background:#3a0f1f;color:#ff7fa8}
 .st-plástico{background:#2a1a3f;color:#c79bff}
 .st-bombilla{background:#0f2f3a;color:#5fd0e0}
 .st-remache{background:#332222;color:#e0a0a0}
 .st-garage{background:#1f2f1a;color:#a0d060}
 .st-cartón{background:#2a2010;color:#c0a060}
 .st-caja{background:#20283a;color:#90a8d0}
 .st-terminado{background:#0f3a2a;color:#5fe0b0}
 .st-none{background:#222;color:#888}
 .empty{padding:24px;color:#7a92a8;font-style:italic}
 .muted{color:#5a6a7a}
</style></head>
<body>
<div class="top">
  <div>
    <h1>🔧 Despiece x Artículo</h1>
    <div class="sub">Lista de materiales (BOM) por artículo — componentes, cantidades y pesos. Datos: schema GP2.</div>
  </div>
</div>
<div class="filters">
  <label>Artículo</label>
  <select id="selArt"><option value="">— todos —</option></select>
  <label style="margin-left:8px">Buscar</label>
  <input id="q" placeholder="Código, familia o componente">
  <button class="btn" id="expAll" style="margin-left:auto">Expandir todo</button>
  <button class="btn" id="btnCSV">Exportar CSV</button>
</div>
<div class="kpis" id="kpis"></div>
<div class="content" id="sections"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>var D={};</script>
<script>
var SB=window.supabase.createClient('https://hrxfctzncixxqmpfhskv.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs',{db:{schema:'GP2'}});

function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
function fmtKg(v){if(v==null||v==='')return '';var n=Number(v);if(!isFinite(n))return '';return n.toString();}
function fmtQ(v){if(v==null||v==='')return '';var n=Number(v);if(!isFinite(n))return esc(v);return Math.round(n*10000)/10000;}

var open={};
var selArt=document.getElementById('selArt');
var fQ=document.getElementById('q');

function __run(){
  // Poblar select de artículos (orden numérico/locale)
  var arts=(D.art||[]).slice().sort(function(a,b){
    return String(a.cod).localeCompare(String(b.cod),'es',{numeric:true});
  });
  D.art=arts;
  selArt.innerHTML='<option value="">— todos —</option>';
  arts.forEach(function(a){
    var o=document.createElement('option');
    o.value=a.cod;
    o.textContent=a.cod+' — '+(a.fam||'');
    selArt.appendChild(o);
  });

  selArt.addEventListener('change',function(){
    // Al elegir uno, abrirlo y limpiar búsqueda
    if(selArt.value){open={};open[selArt.value]=1;}
    render();
    if(selArt.value){
      var el=document.getElementById('art-'+selArt.value);
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    }
  });
  fQ.addEventListener('input',render);
  document.getElementById('expAll').addEventListener('click',function(){
    var vis=visibles();
    var all=vis.every(function(a){return open[a.cod];});
    vis.forEach(function(a){open[a.cod]=all?0:1;});
    render();
  });
  document.getElementById('btnCSV').addEventListener('click',exportCSV);

  render();
}

function sectNom(sid){var s=(D.sect||{})[String(sid)];return s?s.nom:'';}
function sectTipo(sid){var s=(D.sect||{})[String(sid)];return s?s.tipo:'';}

function visibles(){
  var q=fQ.value.trim().toLowerCase();
  var selCod=selArt.value;
  return (D.art||[]).filter(function(a){
    if(selCod&&a.cod!==selCod)return false;
    if(!q)return true;
    if(String(a.cod).toLowerCase().indexOf(q)>=0)return true;
    if((a.fam||'').toLowerCase().indexOf(q)>=0)return true;
    // buscar en componentes
    return (a.comp||[]).some(function(c){
      return (c.cod||'').toLowerCase().indexOf(q)>=0||(c.d||'').toLowerCase().indexOf(q)>=0;
    });
  });
}

function render(){
  var cont=document.getElementById('sections');
  cont.innerHTML='';
  var vis=visibles();

  // KPIs
  var totalComp=0,totalArt=(D.art||[]).length;
  vis.forEach(function(a){totalComp+=(a.comp||[]).length;});
  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><div class="n">'+totalArt+'</div><div class="lb">Artículos</div></div>'+
    '<div class="kpi"><div class="n">'+vis.length+'</div><div class="lb">En vista</div></div>'+
    '<div class="kpi"><div class="n">'+totalComp+'</div><div class="lb">Componentes (vista)</div></div>';

  if(vis.length===0){cont.innerHTML='<div class="empty">Sin artículos para el filtro actual.</div>';return;}

  vis.forEach(function(a){
    var comps=a.comp||[];
    var sec=document.createElement('div');
    sec.className='art-section'+(open[a.cod]?' open':'');
    sec.id='art-'+a.cod;

    var head=document.createElement('div');head.className='art-head';
    var pesoTot=0,hayPeso=false;
    comps.forEach(function(c){
      if(c.kg!=null&&c.kg!==''){var k=Number(c.kg)*Number(c.q||1);if(isFinite(k)){pesoTot+=k;hayPeso=true;}}
    });
    head.innerHTML='<span class="caret">▸</span>'+
      '<span class="cod">'+esc(a.cod)+'</span>'+
      '<span class="fam">'+esc(a.fam||'')+'</span>'+
      '<div class="stats">'+
        '<span>Componentes: <b>'+comps.length+'</b></span>'+
        (a.por!=null?'<span>Uni/caja: <b>'+esc(a.por)+'</b></span>':'')+
        (hayPeso?'<span>Peso art: <b>'+(Math.round(pesoTot*100000)/100000)+'</b> kg</span>':'')+
      '</div>';
    head.addEventListener('click',function(){open[a.cod]=!open[a.cod];render();});
    sec.appendChild(head);

    var body=document.createElement('div');body.className='art-body';
    if(comps.length===0){
      body.innerHTML='<div class="empty">Sin componentes cargados para este artículo.</div>';
    }else{
      var h='<table><thead><tr>'+
        '<th>Cód. parte</th><th>Descripción</th><th>Sector</th>'+
        '<th>Partes/uni</th><th>Kg x uni</th><th>Uni x cajón</th><th>UM</th>'+
        '</tr></thead><tbody>';
      comps.forEach(function(c){
        var tipo=sectTipo(c.s)||'';
        var cls='st-'+(tipo||'none').replace(/[^a-záéíóúñ]/gi,'');
        h+='<tr>'+
          '<td>'+esc(c.cod||'')+'</td>'+
          '<td>'+esc(c.d||'')+'</td>'+
          '<td>'+(tipo?'<span class="sect-tag '+cls+'">'+esc(tipo)+'</span>':'<span class="muted">—</span>')+'</td>'+
          '<td class="num">'+fmtQ(c.q)+'</td>'+
          '<td class="num">'+(c.kg!=null?fmtKg(c.kg):'<span class="muted">—</span>')+'</td>'+
          '<td class="num">'+(c.uxc!=null?esc(c.uxc):'<span class="muted">—</span>')+'</td>'+
          '<td>'+esc(c.um||'')+'</td>'+
        '</tr>';
      });
      h+='</tbody></table>';
      body.innerHTML=h;
    }
    sec.appendChild(body);
    cont.appendChild(sec);
  });
}

function exportCSV(){
  var vis=visibles();
  var SEP=';';
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  var linea=function(arr){return arr.map(q).join(SEP);};
  var filas=[];
  filas.push(linea(['Despiece x Artículo (GP2)']));
  filas.push(linea(['Generado',new Date().toISOString().slice(0,10)]));
  filas.push('');
  filas.push(linea(['Cod Art','Familia','Cod Parte','Descripción','Sector','Partes/uni','Kg x uni','Uni x cajón','UM']));
  vis.forEach(function(a){
    (a.comp||[]).forEach(function(c){
      filas.push(linea([a.cod,a.fam||'',c.cod||'',c.d||'',sectNom(c.s),c.q,c.kg,c.uxc,c.um||'']));
    });
  });
  var csv='﻿'+filas.join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var el=document.createElement('a');el.href=url;el.download='despiece_gp2_'+new Date().toISOString().slice(0,10)+'.csv';el.click();
  URL.revokeObjectURL(url);
}

async function __boot(){
  try{
    document.body.style.cursor='progress';
    var r=await SB.rpc('despiece_bundle');
    if(r.error)throw r.error;
    Object.assign(D,r.data);
    __run();
  }catch(e){
    document.body.innerHTML='<p style="padding:24px;font-family:system-ui;color:#ff7070">Error cargando datos de Supabase: '+(e.message||e)+'</p>';
    console.error(e);
  }finally{document.body.style.cursor='';}
}
__boot();
</script>
</body></html>
