<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
<script src="../auth-guard.js?v=20261006b"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Producciones Disruptivas (GP2)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <link rel="icon" type="image/png" href="../GP2_favicon.png">
  <link rel="apple-touch-icon" href="../GP2_favicon.png">
  <link rel="stylesheet" href="../gp2-modulo.css?v=20261009ds">
  <style>
    /* Solo layout propio: barra, campos, chips, KPIs, botones y tablas son gp2-modulo.css. */
    .emp-chips { margin: var(--s2) 0 var(--s3); }
    .emp-chip { align-items: center; text-align: center; }
    /* el titulo va arriba de una .table-wrap de alto completo: si fuera sticky taparia su encabezado */
    #result .sec-title { position: static; }
    #result .table-wrap { margin-bottom: var(--s4); }
    #result .t td, #result .t th { white-space: nowrap; }
    td.c { text-align: center; } td.r { text-align: right; } td.b { font-weight: 700; }
    td.acc .btn-icon { min-height: 40px; width: 40px; margin: 0 2px; }
    /* edicion (el sistema no trae modal: se arma con sus tokens) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-box { width: min(600px, 100%); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: var(--sh-2); }
    .modal-fields { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; align-items: flex-end; }
    .modal-fields .field input { width: 150px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
    .chk { display: inline-flex; align-items: center; gap: 8px; min-height: var(--touch); font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Producciones Disruptivas <small>puntaje mayor a 5 o menor a -5</small></h1>
    <div class="hbtns">
      <button id="btnExcelDisr" class="hidden" onclick="exportarExcelDisruptivas()">Excel</button>
      <a class="back" href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">
    <div class="toolbar">
      <div class="field"><label for="fechaDesde">Desde</label><input type="date" id="fechaDesde" /></div>
      <div class="field"><label for="fechaHasta">Hasta</label><input type="date" id="fechaHasta" /></div>
    </div>

    <div id="empGrid" class="provs-grid emp-chips hidden"></div>

    <div id="status" class="status"></div>
    <div id="result"></div>
  </div>
</div>

  <script src="../supabase-config.js?v=20260929a"></script>
  <script src="../gp2-ui.js?v=20260930a"></script>
  <script src="../gp2-numero.js?v=20260911o"></script>
<script src="disruptivas_GP2.js?v=20261009a"></script>
</body>
</html>
