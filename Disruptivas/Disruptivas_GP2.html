<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
<script src="../auth-guard.js?v=20261006b"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Producciones Disruptivas (GP2)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <link rel="stylesheet" href="../gp2-modulo.css?v=20261008ds">
<style>
    /* Sistema de diseño v2 (2026-10-08): barra, filtros, chips, KPIs, tablas y modal salen de
       gp2-modulo.css (antes esta pantalla redefinia los tokens de :root y pisaba todo el sistema).
       Aca queda lo propio: chips de operario en dos lineas, botones de fila y el modal de edicion. */
    .filtros #fechaDesde, .filtros #fechaHasta { width: 190px; }
    .emp-chips { margin: 0 0 var(--s3); }
    .emp-chip { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; line-height: 1.15; }
    .informe-wrap { margin-bottom: var(--s5); }
    td.b { font-weight: 700; }
    table.t td { white-space: nowrap; }
    /* botones de cada fila: revisado / editar (tocables) */
    .btn-icon { display: inline-flex; align-items: center; justify-content: center; width: var(--touch); height: var(--touch); margin: 0 1px;
      border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink-2); font-size: 18px; cursor: pointer; }
    .btn-icon:hover { border-color: var(--pri); color: var(--pri-h); }
    .btn-icon.btn-ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
    .btn-icon.btn-ok:hover { background: var(--ok); border-color: var(--ok); color: #fff; }
    table.t td.acc { padding-top: 4px; padding-bottom: 4px; }

    /* modal de edicion (aspecto: .modal-bg / .modal del sistema) */
    .modal-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 200; padding: var(--s4); }
    .modal-box { width: min(600px, 100%); max-height: 92vh; overflow: auto; }
    .modal-header { padding: var(--s3) var(--s5); background: var(--surface-2); border-bottom: 1px solid var(--line); font-weight: 750; font-size: var(--fs-lg);
      border-radius: var(--r-lg) var(--r-lg) 0 0; }
    .modal-body { padding: var(--s4) var(--s5); }
    .modal-info { color: var(--ink-2); }
    .modal-fields { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s3); align-items: flex-end; }
    .modal-fields .field input { width: 150px; }
    .modal-fields .tm-det { flex: 1 1 100%; margin-top: -4px; }
    .modal-preview { margin-top: var(--s3); padding: 10px 14px; background: var(--surface-2); border-radius: var(--r-sm); }
    .prev-row { display: flex; gap: 6px 16px; flex-wrap: wrap; }
    .prev-row.prev-old { margin-top: 4px; color: var(--ink-3); font-size: var(--fs-sm); }
    .modal-preview .lbl { font-size: var(--fs-sm); font-weight: 500; color: var(--ink-3); }
    .modal-footer { display: flex; justify-content: flex-end; gap: var(--s2); padding: var(--s3) var(--s5); border-top: 1px solid var(--line); }

    @media (max-width: 640px) {
      .filtros .field { flex: 1 1 140px; }
      .filtros #fechaDesde, .filtros #fechaHasta { width: 100%; }
      .modal-fields .field { flex: 1 1 140px; }
      .modal-fields .field input { width: 100%; }
    }
  </style>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Producciones Disruptivas<small>Registros con puntaje mayor a 5 o menor a -5</small></h1>
    <div class="hbtns">
      <button id="btnExcelDisr" class="hlink hidden" type="button" onclick="exportarExcelDisruptivas()">⬇ Excel</button>
      <a href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">
    <div class="toolbar filtros">
      <div class="field"><label for="fechaDesde">Desde</label><input type="date" id="fechaDesde" /></div>
      <div class="field"><label for="fechaHasta">Hasta</label><input type="date" id="fechaHasta" /></div>
    </div>

    <div id="empGrid" class="emp-chips chips hidden"></div>

    <div id="status" class="status"></div>
    <div id="result"></div>
  </div>
</div>

  <script src="../supabase-config.js?v=20260929a"></script>
  <script src="../gp2-ui.js?v=20260930a"></script>
  <script src="../gp2-numero.js?v=20260911o"></script>
<script src="disruptivas_GP2.js?v=20261008dsA"></script>
<script src="../gp2-menu.js?v=20261008ds"></script>
<script src="../gp2-nav.js?v=20261008ds"></script>
</body>
</html>
