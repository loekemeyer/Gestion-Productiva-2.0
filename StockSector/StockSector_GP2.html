<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<script src="../auth-guard.js?v=20261006b"></script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stock por sector · GP2</title>
<!-- UNA pantalla para el stock de cada sector: se abre con ?sector=N y arma titulo,
     botones, filtros y columnas desde el mapa SECTORES de ../gp2-stock-sector.js.
     Reemplaza (2026-09-04) a los 9 HTML casi iguales que habia: Stock SC (1),
     Stock SP (2), Stock en Movimiento (3), Partes Plasticas (6), Bombillas (7),
     Remaches (8), Garage (9), Cartones (10) y Cajas (11). El aspecto y los
     botones de cada una son los mismos de antes: lo que cambia por sector vive
     en el mapa, no aca. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260929a"></script>
<link rel="stylesheet" href="../gp2-modulo.css?v=20261009ds"/>
<link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
<style>
  /* sistema GP2 v2.0 (2026-10-09): look de gp2-modulo.css; acá sólo layout */
  .filtros{margin:0 0 var(--s3)}
  .filtros input.search{flex:1 1 300px;min-width:0;width:auto}
  td.mov-cell,td.stk-cell{cursor:pointer;text-decoration:underline dotted var(--ink-400)}
  /* 2026-10-01: sin negrita en la tabla (ni Uni ni los movimientos verde/rojo de gp2-modulo.css) */
  td.mov-cell,td.stk-cell{font-weight:400}
  td.mov-cell:hover,td.stk-cell:hover{background:var(--brand-100)}
  /* encabezado de 2 filas: la de grupos se va con el scroll, queda fija la de columnas */
  #thead > tr:first-child:not(:last-child) > th{position:static}
  .popup{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
  .popup.open{display:flex}
  .pop-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);width:100%;max-width:960px;max-height:88vh;overflow:auto;padding:18px 20px}
  .pop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
  .pop-card .table-wrap{max-height:none}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <!-- titulo y botones (CSV, Recepcion, Control..., Stock SP/SC) los completa
         gp2-stock-sector.js segun el sector; "Atras" queda fijo y siempre ultimo -->
    <h1 id="titulo">Stock por sector</h1>
    <div class="hbtns" id="hbtns">
      <a class="back" href="../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">
    <div class="kpis" id="kpis"></div>
    <div class="aviso hidden" id="avisoFactores"></div>

    <div class="toolbar filtros">
      <input type="text" class="search" id="q" placeholder="Buscar por código o descripción…">
      <div class="seg">
        <button class="seg-btn active" data-f="todos" type="button">Todos</button>
        <button class="seg-btn" data-f="con" type="button">Con stock</button>
        <button class="seg-btn" data-f="sin" type="button">Sin stock</button>
        <button class="seg-btn" data-f="bajo" type="button">Bajo el máximo</button>
        <button class="seg-btn" data-f="mov" type="button">Con movimientos</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="t">
        <!-- el thead lo arma gp2-stock-sector.js segun STOCK_CFG.columnas -->
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="tblEmpty" class="empty hidden">Sin resultados.</div>
    <div id="status" class="status">Cargando…</div>
  </div>
</div>

<!-- popup detalle de movimientos -->
<div class="popup" id="popup">
  <div class="pop-card">
    <div class="pop-head">
      <h3 id="popTitle"></h3>
      <button class="btn btn-secondary" id="popClose" type="button">Cerrar</button>
    </div>
    <div id="popBody"></div>
  </div>
</div>

<script>
window.SB_CLIENT = GP2_SB();
</script>
<script src="../gp2-ui.js?v=20260930a"></script>
<script src="../gp2-numero.js?v=20260911o"></script>
<script src="../gp2-composicion.js?v=20260911p"></script>
<script src="../gp2-stock-sector.js?v=20261009c"></script>
</body>
</html>
