<!doctype html>
<html lang="es">
<head>
<!-- v1.0.0 (2026-09-17) — CASOS ESPECIALES: ENVIO DE MATERIAL A CHARCAS Y ECLIPSE (usuario Nazareno:
     "Hace un boton que sea casos especiales. Tiene que haber envio a Charcas y Eclipse. A ambos se le
     envia solo desde ese modulo y se registran los kg que se le mando de material. NO SE LE PUEDE
     ENVIAR NI A CHARCAS NI A ECLIPSE DESDE LA TABLET DE LOGISTICA").
     Charcas (id 1) y Eclipse (id 13) son los PS hibridos (proveedor_servicio.hibrido): reciben nuestra
     materia prima BRUTA (Charcas -> FLEJE90_BRUTO, Eclipse -> CHAPA430; proveedor_servicio.mp_componente_id)
     y la procesan. El envio se registra en kg via RPC enviar_material_ps_especial (movimiento tipo
     'envio_ps', destino = ubicacion del PS). Es el UNICO camino para mandarles material: la tablet de
     logistica y Envio a PS los excluyen porque envios_ps_bundle filtra "not hibrido" y tablet_bundle no
     los lista (no tienen paso de entrada SC->SP). No toca la compra de MP (cargar_compra_mp). -->
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Casos especiales · Envío a Charcas / Eclipse · GP2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase-config.js?v=20260905k"></script>
<link rel="stylesheet" href="../../gp2-modulo.css?v=20260912c"/>
<link rel="icon" type="image/png" href="../../GP2_favicon.png">
<link rel="apple-touch-icon" href="../../GP2_favicon.png">
<style>
  /* pantalla acotada: no estirar a todo el ancho sin necesidad */
  .ce-wrap{max-width:560px}
  .ce-dest{display:flex;flex-direction:column;gap:10px;margin:10px 0}
  .ce-card{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;border:2px solid #d0d7de;
           border-radius:12px;padding:16px 18px;cursor:pointer;font-size:18px}
  .ce-card:hover{border-color:#111}
  .ce-card .n{font-size:22px;font-weight:900;color:#111}
  .ce-card .m{font-size:16px;color:#555}
  .ce-panel{background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:16px 18px;margin:10px 0}
  .ce-panel .dato{font-size:16px;color:#475569;margin:2px 0}
  .ce-panel .dato b{color:#111;font-size:18px}
  .ce-field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
  .ce-field label{font-size:18px;font-weight:800;color:#111}
  .ce-field input{font-size:22px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;width:100%}
  .ce-acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body>

<div class="card ce-wrap">
  <div class="header">
    <h1>Casos especiales</h1>
    <div class="hbtns">
      <button class="hlink hidden" id="btnVolver" type="button">← Cambiar destino</button>
      <a href="../../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">

    <!-- FASE 0 — elegir destino -->
    <div id="fase0">
      <div class="row"><label class="lbl">Envío de material a…</label></div>
      <div class="ce-dest" id="destGrid"></div>
      <div id="status" class="status">Cargando…</div>
    </div>

    <!-- FASE 1 — cargar kg -->
    <div id="fase1" class="hidden">
      <div class="ce-panel">
        <div class="dato">Destino: <b id="pName">—</b></div>
        <div class="dato">Material que se envía: <b id="pMat">—</b></div>
        <div class="dato" id="pStockLine">Ya en poder del destino: <b id="pStock">—</b> kg</div>
      </div>

      <div class="ce-field">
        <label for="kg">Kg de material enviados</label>
        <input type="text" id="kg" inputmode="decimal" autocomplete="off" placeholder="0">
      </div>

      <div class="ce-field">
        <label for="fFecha">Fecha del envío</label>
        <input type="date" id="fFecha">
      </div>

      <div class="ce-acc">
        <button class="btn btn-primary" id="btnEnviar" type="button" disabled>Registrar envío</button>
      </div>
      <div id="msg1" class="status"></div>
    </div>

    <!-- FASE 2 — confirmación -->
    <div id="fase2" class="hidden">
      <div class="successBox">
        <div class="title">✓ Envío registrado</div>
        <div id="okDetail" style="font-size:18px;color:#333"></div>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn btn-primary" id="btnOtro" type="button">← Registrar otro</button>
      </div>
    </div>

  </div>
</div>

<script src="../../gp2-ui.js?v=20260913e"></script>
<script src="../../gp2-numero.js?v=20260911o"></script>
<script>
"use strict";

var $ = GP2UI.$, esc = GP2UI.esc, hoyAR = GP2UI.hoyAR;
var num = GP2N.num, fmt = GP2N.fmt;

var SB = GP2_SB();

var DEST = [];      // [{id, nombre, proceso, mp_id, mp_cod, mp_desc}]
var sel = null;

/* ---------- carga ---------- */
async function cargar(){
  var r = await SB.from("proveedor_servicio")
    .select("id,nombre,proceso,mp_componente_id,hibrido")
    .eq("hibrido", true).order("nombre");
  if (r.error){ $("status").textContent = "Error: " + r.error.message; return; }
  var ps = (r.data || []).filter(function(p){ return p.mp_componente_id != null; });

  var ids = ps.map(function(p){ return p.mp_componente_id; });
  var mats = {};
  if (ids.length){
    var rc = await SB.from("componente").select("id,codigo,descripcion").in("id", ids);
    (rc && rc.data || []).forEach(function(c){ mats[c.id] = c; });
  }

  DEST = ps.map(function(p){
    var m = mats[p.mp_componente_id] || {};
    return { id:p.id, nombre:p.nombre, proceso:p.proceso,
             mp_id:p.mp_componente_id, mp_cod:m.codigo || ("#"+p.mp_componente_id), mp_desc:m.descripcion || "" };
  });
  renderDest();
  $("status").textContent = DEST.length ? (DEST.length + " destinos especiales.") : "No hay destinos híbridos configurados.";
}

function renderDest(){
  var cont = $("destGrid"); cont.innerHTML = "";
  DEST.forEach(function(d){
    var b = document.createElement("button");
    b.type = "button"; b.className = "ce-card";
    b.innerHTML =
      '<span class="n">'+esc(d.nombre)+'</span>'+
      '<span class="m">'+esc(d.proceso || "")+'</span>'+
      '<span class="m">Material: <b>'+esc(d.mp_cod)+'</b>'+(d.mp_desc? " · "+esc(d.mp_desc):"")+'</span>';
    b.addEventListener("click", function(){ elegir(d); });
    cont.appendChild(b);
  });
}

/* ---------- elegir destino ---------- */
async function elegir(d){
  sel = d;
  $("pName").textContent = d.nombre;
  $("pMat").textContent = d.mp_cod + (d.mp_desc ? " · " + d.mp_desc : "");
  $("kg").value = "";
  if (!$("fFecha").value) $("fFecha").value = hoyAR();
  mostrarFase(1);
  actualizarBtn();
  $("pStock").textContent = "…";
  var kg = await stockEnDestino(d);
  $("pStock").textContent = (kg == null) ? "—" : fmt(kg, 2);
  $("kg").focus();
}

/* Stock del material que ya está en poder del PS (solo informativo). Best-effort:
   si algo falla, se muestra "—" y no rompe el flujo. */
async function stockEnDestino(d){
  try {
    var ru = await SB.from("ubicacion").select("id")
      .eq("tipo","proveedor_servicio").eq("ref_id", d.id).maybeSingle();
    var ubic = ru && ru.data && ru.data.id;
    if (!ubic) return null;
    var ri = await SB.from("inventario").select("cantidad")
      .eq("componente_id", d.mp_id).eq("ubicacion_id", ubic).maybeSingle();
    return (ri && ri.data) ? num(ri.data.cantidad) : 0;
  } catch(e){ return null; }
}

function mostrarFase(n){
  $("fase0").classList.toggle("hidden", n !== 0);
  $("fase1").classList.toggle("hidden", n !== 1);
  $("fase2").classList.toggle("hidden", n !== 2);
  $("btnVolver").classList.toggle("hidden", n === 0);
}

function volver(){ sel = null; mostrarFase(0); renderDest(); }

function actualizarBtn(){ $("btnEnviar").disabled = !(sel && num($("kg").value) > 0); }

/* ---------- eventos ---------- */
$("kg").addEventListener("input", actualizarBtn);
$("btnVolver").addEventListener("click", volver);
$("btnOtro").addEventListener("click", volver);

$("btnEnviar").addEventListener("click", async function(){
  if (!sel) return;
  var kg = num($("kg").value);
  if (!(kg > 0)){ actualizarBtn(); return; }
  var fecha = $("fFecha").value || hoyAR();

  if (!confirm("Registrar envío a " + sel.nombre + ":\n\n" + fmt(kg,2) + " kg de " + sel.mp_cod)) return;

  var btn = $("btnEnviar");
  btn.disabled = true; btn.textContent = "Registrando…";
  $("msg1").textContent = "";

  var r = await SB.rpc("enviar_material_ps_especial", {
    p_ps_id: sel.id,
    p_kg: kg,
    p_fecha: fecha
  });

  btn.textContent = "Registrar envío";

  if (r.error || (r.data && r.data.ok === false)){
    btn.disabled = false;
    $("msg1").innerHTML = '<span style="color:#b91c1c">Error: ' +
      esc((r.error && r.error.message) || (r.data && r.data.error) || "no se pudo registrar") + '</span>';
    return;
  }

  var d = r.data || {};
  $("okDetail").innerHTML =
    "Se registraron <b>" + fmt(kg,2) + " kg</b> de " + esc(sel.mp_cod) +
    " enviados a <b>" + esc(sel.nombre) + "</b> · " + esc(fecha) +
    (d.stock_kg != null ? "<br>En poder del destino: <b>" + fmt(num(d.stock_kg),2) + " kg</b>" : "");
  mostrarFase(2);
});

/* ---------- boot ---------- */
$("fFecha").value = hoyAR();
cargar().catch(function(e){ $("status").textContent = "Error: " + (e && e.message ? e.message : e); });
</script>
</body>
</html>
