  <script>
  var D = {};

  var SB = window.supabase.createClient(
    'https://hrxfctzncixxqmpfhskv.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs',
    { db:{ schema:'GP2' } }
  );

  function __run(){
    var provs = (D && D.proveedores) ? D.proveedores : [];
    var elGrid   = document.getElementById('talleristasGrid');
    var elResult = document.getElementById('result');
    var elStatus = document.getElementById('status');
    var elFiltro = document.getElementById('filtroDesc');
    var btnVolver= document.getElementById('btnVolver');
    var btnImpr  = document.getElementById('btnImprimir');
    var btnIndex = document.getElementById('btnIndex');
    var printArea= document.getElementById('printArea');

    var provSel = null; // proveedor elegido

    // ---- helpers de formato ----
    function fmt(n){
      if(n===null || n===undefined || isNaN(n)) return '0';
      n = Number(n);
      var neg = n < 0;
      var abs = Math.abs(n);
      // hasta 3 decimales, sin ceros colgando
      var s;
      if(Math.abs(abs - Math.round(abs)) < 1e-9){
        s = String(Math.round(abs));
      } else {
        s = abs.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
      }
      // separador de miles (parte entera)
      var parts = s.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      s = parts.join(',');
      return (neg ? '-' : '') + s;
    }
    function esc(t){
      return String(t==null?'':t)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ---- grilla de proveedores ----
    function renderGrid(){
      elGrid.innerHTML = '';
      if(!provs.length){
        elGrid.innerHTML = '<div class="empty-msg">No hay proveedores con datos GP2.</div>';
        return;
      }
      provs.forEach(function(p){
        var partes = p.partes || [];
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'tallerista-btn';
        var viejo = p.nombre_viejo ? (' &middot; ' + esc(p.nombre_viejo)) : '';
        b.innerHTML = esc(p.nombre) +
          '<div class="prov-meta">' + esc(p.proceso||'') +
          ' &middot; ' + partes.length + ' partes' + viejo + '</div>';
        b.addEventListener('click', function(){ elegir(p, b); });
        elGrid.appendChild(b);
      });
    }

    function elegir(p, btn){
      provSel = p;
      Array.prototype.forEach.call(elGrid.querySelectorAll('.tallerista-btn'), function(x){ x.classList.remove('active'); });
      if(btn) btn.classList.add('active');
      // ocultar los chips del resto: se vuelve con "Cambiar proveedor"
      elGrid.classList.add('hidden');
      // mostrar toolbar de detalle
      btnVolver.classList.remove('hidden');
      elFiltro.classList.remove('hidden');
      btnImpr.classList.remove('hidden');
      elFiltro.value = '';
      renderTabla('');
    }

    function partesFiltradas(txt){
      var partes = (provSel && provSel.partes) ? provSel.partes.slice() : [];
      txt = (txt||'').trim().toLowerCase();
      if(txt){
        partes = partes.filter(function(x){
          return (String(x.descripcion||'').toLowerCase().indexOf(txt) >= 0) ||
                 (String(x.codigo||'').toLowerCase().indexOf(txt) >= 0);
        });
      }
      return partes;
    }

    function numCell(v){
      var cls = 'num' + (Number(v) < 0 ? ' neg' : '');
      return '<td class="'+cls+'">'+fmt(v)+'</td>';
    }

    function renderTabla(filtro){
      if(!provSel){ elResult.innerHTML=''; elStatus.textContent=''; return; }
      var partes = partesFiltradas(filtro);

      var tEnv=0, tEnt=0, tSal=0;
      partes.forEach(function(x){
        tEnv += Number(x.enviado)||0;
        tEnt += Number(x.entregado)||0;
        tSal += Number(x.saldo)||0;
      });

      var viejo = provSel.nombre_viejo ? (' &middot; nombre viejo: <b>'+esc(provSel.nombre_viejo)+'</b>') : '';
      var h = '<h2 style="margin:6px 0 4px">'+esc(provSel.nombre)+'</h2>' +
              '<div class="prov-meta" style="margin-bottom:10px">Proceso: '+esc(provSel.proceso||'?')+
              ' &middot; Cod. Prov.: '+esc(provSel.cod_prov||'?')+viejo+'</div>';

      if(!partes.length){
        h += '<div class="empty-msg">Sin partes que coincidan.</div>';
        elResult.innerHTML = h;
        elStatus.textContent = '0 partes';
        return;
      }

      h += '<table><thead><tr>' +
           '<th>#</th><th>Codigo</th><th>Descripcion</th><th>Sector</th>' +
           '<th>Enviado</th><th>Entregado</th><th>Saldo en PS</th>' +
           '</tr></thead><tbody>';
      partes.forEach(function(x, i){
        h += '<tr>' +
             '<td>'+(i+1)+'</td>' +
             '<td>'+esc(x.codigo)+'</td>' +
             '<td>'+esc(x.descripcion)+'</td>' +
             '<td>'+esc(x.sector||'')+'</td>' +
             numCell(x.enviado) + numCell(x.entregado) +
             '<td class="num stk-cell'+(Number(x.saldo)<0?' neg':'')+'" data-cid="'+x.comp_id+'"'+
               ' title="Ver cómo se compone">'+fmt(x.saldo)+'</td>' +
             '</tr>';
      });
      h += '</tbody><tfoot><tr>' +
           '<td colspan="4" style="text-align:right;font-weight:bold">TOTALES</td>' +
           numCell(tEnv) + numCell(tEnt) + numCell(tSal) +
           '</tr></tfoot></table>';

      elResult.innerHTML = h;
      elStatus.textContent = partes.length + ' partes' +
        (filtro && filtro.trim() ? ' (filtradas)' : '') +
        ' · unidades canonicas GP2';
    }

    // El saldo en PS sale del mismo ledger que el resto del stock GP2:
    // se abre la composicion apuntando a la ubicacion del proveedor.
    elResult.addEventListener('click', function(e){
      var td = e.target.closest && e.target.closest('td.stk-cell');
      if(!td || !provSel || !window.GP2Composicion) return;
      var x = (provSel.partes||[]).filter(function(y){
        return String(y.comp_id) === String(td.dataset.cid); })[0] || {};
      window.GP2Composicion.abrir({
        SB: SB, comp_id: td.dataset.cid,
        ubic_tipo: 'proveedor_servicio', ref_id: provSel.ps_id,
        cod: x.codigo, desc: x.descripcion
      });
    });

    // ---- impresion ----
    function construirPrint(){
      if(!provSel) return;
      var partes = partesFiltradas(elFiltro.value);
      var tEnv=0, tEnt=0, tSal=0;
      partes.forEach(function(x){
        tEnv += Number(x.enviado)||0; tEnt += Number(x.entregado)||0; tSal += Number(x.saldo)||0;
      });
      var fecha = new Date().toLocaleString('es-AR');
      var h = '<div class="print-header">' +
                '<div><div class="print-doc">Control Prov. Servicios (GP2)</div>' +
                '<h2 class="print-title">'+esc(provSel.nombre)+'</h2></div>' +
                '<div class="print-head-right">'+esc(provSel.proceso||'')+'<br>'+
                'Cod. Prov. '+esc(provSel.cod_prov||'?')+'<br>'+
                '<span class="print-count">'+partes.length+' partes &middot; '+esc(fecha)+'</span></div>' +
              '</div>';
      h += '<table class="print-table"><thead><tr>' +
           '<th class="p-num">#</th><th>Codigo</th><th>Descripcion</th><th>Sector</th>' +
           '<th class="p-caj">Enviado</th><th class="p-caj">Entregado</th><th class="p-cjn">Saldo en PS</th>' +
           '</tr></thead><tbody>';
      partes.forEach(function(x,i){
        h += '<tr'+(i%2?' class="zebra"':'')+'>' +
             '<td class="p-num">'+(i+1)+'</td>' +
             '<td>'+esc(x.codigo)+'</td><td>'+esc(x.descripcion)+'</td><td>'+esc(x.sector||'')+'</td>' +
             '<td class="p-caj">'+fmt(x.enviado)+'</td>' +
             '<td class="p-caj">'+fmt(x.entregado)+'</td>' +
             '<td class="p-cjn">'+fmt(x.saldo)+'</td>' +
             '</tr>';
      });
      h += '</tbody><tfoot><tr class="print-total">' +
           '<td colspan="4" style="text-align:right">TOTALES</td>' +
           '<td class="p-caj">'+fmt(tEnv)+'</td><td class="p-caj">'+fmt(tEnt)+'</td>' +
           '<td class="p-cjn">'+fmt(tSal)+'</td></tr></tfoot></table>' +
           '<div style="margin-top:10px;font-size:11px;color:#666">Datos parciales (schema GP2). '+
           'Saldos en unidades canonicas. Ledger historico incompleto.</div>';
      printArea.innerHTML = h;
    }

    // ---- eventos ----
    btnVolver.addEventListener('click', function(){
      provSel = null;
      btnVolver.classList.add('hidden');
      elFiltro.classList.add('hidden');
      btnImpr.classList.add('hidden');
      elGrid.classList.remove('hidden');
      Array.prototype.forEach.call(elGrid.querySelectorAll('.tallerista-btn'), function(x){ x.classList.remove('active'); });
      elResult.innerHTML = '';
      elStatus.textContent = '';
    });
    elFiltro.addEventListener('input', function(){ renderTabla(elFiltro.value); });
    btnImpr.addEventListener('click', function(){ construirPrint(); window.print(); });
    btnIndex.addEventListener('click', function(){ window.location.href = '../../Inicio/index.html'; });

    function pintarProveedores(){
      var gen = D && D.generado_en ? (' · generado ' + new Date(D.generado_en).toLocaleString('es-AR')) : '';
      elStatus.textContent = provs.length + ' proveedores con datos GP2' + gen;
    }

    renderGrid();
    pintarProveedores();

    // Hook para recargar la grilla tras cargar un movimiento (sin re-enganchar listeners).
    window.__gp2rerender = function(){
      provs = (D && D.proveedores) ? D.proveedores : [];
      provSel = null;
      btnVolver.classList.add('hidden');
      elFiltro.classList.add('hidden');
      btnImpr.classList.add('hidden');
      elGrid.classList.remove('hidden');
      elFiltro.value = '';
      elResult.innerHTML = '';
      renderGrid();
      pintarProveedores();
    };
  }

  // ================= Carga de movimientos PS =================
  // Recarga el bundle y re-renderiza la grilla existente.
  async function reloadBundle(){
    var r = await SB.rpc('control_ps_bundle');
    if(r.error) throw r.error;
    D = r.data || {};
    if(window.__gp2rerender) window.__gp2rerender();
  }

  // Buscador de componentes: input + lista filtrable. Guarda el comp_id elegido.
  function makePicker(host, items){
    var input = document.createElement('input');
    input.type = 'text';
    input.setAttribute('autocomplete','off');
    input.placeholder = 'Buscar codigo o descripcion...';
    var list = document.createElement('div');
    list.className = 'gp2-picker-list';
    host.appendChild(input);
    host.appendChild(list);

    var selId = null;
    var vis = [];

    function esc2(t){
      return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function render(txt){
      txt = (txt||'').trim().toLowerCase();
      vis = items.filter(function(it){
        if(!txt) return true;
        return (String(it.codigo||'').toLowerCase().indexOf(txt) >= 0) ||
               (String(it.descripcion||'').toLowerCase().indexOf(txt) >= 0);
      }).slice(0, 60);
      if(!vis.length){
        list.innerHTML = '<div class="gp2-picker-empty">Sin coincidencias.</div>';
      } else {
        var h = '';
        vis.forEach(function(it){
          h += '<div class="gp2-picker-item" data-id="'+it.id+'">' +
               '<span class="cod">'+esc2(it.codigo)+'</span> ' +
               '<span class="desc">'+esc2(it.descripcion)+'</span>' +
               (it.sector ? ' <span class="sec">['+esc2(it.sector)+']</span>' : '') +
               '</div>';
        });
        list.innerHTML = h;
      }
    }
    function open(){ render(input.value); list.classList.add('open'); }
    function close(){ list.classList.remove('open'); }

    input.addEventListener('focus', open);
    input.addEventListener('input', function(){ selId = null; open(); });
    list.addEventListener('mousedown', function(ev){
      var el = ev.target;
      while(el && el !== list && !el.classList.contains('gp2-picker-item')) el = el.parentNode;
      if(!el || el === list) return;
      ev.preventDefault();
      var id = Number(el.getAttribute('data-id'));
      var it = items.filter(function(x){ return x.id === id; })[0];
      if(it){
        selId = it.id;
        input.value = it.codigo + ' - ' + it.descripcion + (it.sector ? ' ['+it.sector+']' : '');
      }
      close();
    });
    input.addEventListener('blur', function(){ setTimeout(close, 150); });

    return {
      getId: function(){ return selId; },
      clear: function(){ selId = null; input.value = ''; },
      disable: function(d){ input.disabled = !!d; },
      setItems: function(newItems){ items = newItems || []; selId = null; input.value = ''; close(); }
    };
  }

  async function initCarga(){
    var elProv   = document.getElementById('mvProv');
    var elFecha  = document.getElementById('mvFecha');
    var elCant   = document.getElementById('mvCant');
    var elUnidad = document.getElementById('mvUnidad');
    var elKg     = document.getElementById('mvKg');
    var elMsg    = document.getElementById('mvMsg');
    var elGuardar= document.getElementById('mvGuardar');
    var modoRadios = document.getElementsByName('mvModo');

    // fecha default = hoy (yyyy-mm-dd local)
    var hoy = new Date();
    var off = hoy.getTimezoneOffset();
    elFecha.value = new Date(hoy.getTime() - off*60000).toISOString().slice(0,10);

    function setMsg(txt, cls){
      elMsg.textContent = txt || '';
      elMsg.className = 'gp2-msg' + (cls ? ' ' + cls : '');
    }

    // Cargar selectores en paralelo
    var provRes, compRes, secRes;
    try{
      var res = await Promise.all([
        SB.from('proveedor_servicio').select('id,cod_prov,nombre,proceso').order('nombre'),
        SB.from('componente').select('id,codigo,descripcion,sector_id').order('codigo'),
        SB.from('sector').select('id,nombre')
      ]);
      provRes = res[0]; compRes = res[1]; secRes = res[2];
      if(provRes.error) throw provRes.error;
      if(compRes.error) throw compRes.error;
      if(secRes.error)  throw secRes.error;
    }catch(e){
      setMsg('No se pudieron cargar los selectores: ' + (e && (e.message||e.hint) || e), 'err');
      elProv.innerHTML = '<option value="">(error)</option>';
      return;
    }

    // Proveedores
    var opts = '<option value="">-- Elegir proveedor --</option>';
    (provRes.data||[]).forEach(function(p){
      var meta = [p.proceso, p.cod_prov].filter(Boolean).join(' · ');
      opts += '<option value="'+p.id+'">'+ String(p.nombre||('#'+p.id))
            + (meta ? ' ('+meta+')' : '') + '</option>';
    });
    elProv.innerHTML = opts;

    // Componentes con sector resuelto
    var secMap = {};
    (secRes.data||[]).forEach(function(s){ secMap[s.id] = s.nombre; });
    var comps = (compRes.data||[]).map(function(c){
      return { id:c.id, codigo:c.codigo, descripcion:c.descripcion, sector: secMap[c.sector_id] || '' };
    });

    // Pickers (arrancan vacios: se llenan con las partes del proveedor elegido)
    var pkEnvioSC = makePicker(document.getElementById('mvEnvioSC'), []);
    var pkEntSC   = makePicker(document.getElementById('mvEntSC'),   []);
    var pkEntSP   = makePicker(document.getElementById('mvEntSP'),   []);

    // Partes por proveedor (las que realmente se le llevan / recibe, segun rutas)
    var PARTES_PS = {};
    try{ var _rp = await SB.rpc('partes_por_ps'); if(!_rp.error) PARTES_PS = _rp.data || {}; }catch(e){}
    function aplicarProvPartes(){
      var pid = String(elProv.value||'');
      var d = (pid && PARTES_PS[pid]) ? PARTES_PS[pid] : {sc:[],sp:[]};
      pkEnvioSC.setItems(d.sc || []);
      pkEntSC.setItems(d.sc || []);
      pkEntSP.setItems(d.sp || []);
    }
    elProv.addEventListener('change', aplicarProvPartes);
    aplicarProvPartes();

    function modo(){
      var m = 'envio';
      Array.prototype.forEach.call(modoRadios, function(r){ if(r.checked) m = r.value; });
      return m;
    }
    function aplicarModo(){
      var m = modo();
      Array.prototype.forEach.call(document.querySelectorAll('.mv-only-envio'), function(el){
        el.classList.toggle('mv-hidden', m !== 'envio');
      });
      Array.prototype.forEach.call(document.querySelectorAll('.mv-only-entrega'), function(el){
        el.classList.toggle('mv-hidden', m !== 'entrega');
      });
      setMsg('');
    }
    Array.prototype.forEach.call(modoRadios, function(r){ r.addEventListener('change', aplicarModo); });
    aplicarModo();

    async function guardar(){
      setMsg('');
      var psId = Number(elProv.value);
      if(!psId){ setMsg('Elegi un proveedor.', 'err'); return; }
      var fechaTs = elFecha.value ? new Date(elFecha.value + 'T12:00:00').toISOString() : null;

      var payload, rpcName;
      if(modo() === 'envio'){
        var scId = pkEnvioSC.getId();
        var cant = Number(elCant.value);
        if(!scId){ setMsg('Elegi la parte SC a enviar.', 'err'); return; }
        if(!(cant > 0)){ setMsg('La cantidad debe ser mayor a 0.', 'err'); return; }
        rpcName = 'crear_envio_ps';
        payload = { p_ps_id:psId, p_comp_sc_id:scId, p_cantidad:cant, p_unidad:elUnidad.value, p_fecha:fechaTs };
      } else {
        var scId2 = pkEntSC.getId();
        var spId  = pkEntSP.getId();
        var kg    = Number(elKg.value);
        if(!scId2){ setMsg('Elegi la parte SC que se consume.', 'err'); return; }
        if(!spId){ setMsg('Elegi la parte SP que se recibe.', 'err'); return; }
        if(!(kg > 0)){ setMsg('Los kg deben ser mayores a 0.', 'err'); return; }
        rpcName = 'crear_entrega_ps';
        payload = { p_ps_id:psId, p_comp_sc_id:scId2, p_comp_sp_id:spId, p_kg:kg, p_fecha:fechaTs };
      }

      elGuardar.disabled = true;
      setMsg('Guardando...', '');
      try{
        var r = await SB.rpc(rpcName, payload);
        if(r.error) throw r.error;
        var d = r.data || {};
        var id = d.id != null ? d.id : '?';
        var det;
        if(rpcName === 'crear_envio_ps'){
          det = 'Envio guardado (id ' + id + '): ' + (d.parte||'') +
                ' · ' + (d.cantidad!=null?d.cantidad:'') + ' ' + (d.unidad||'');
        } else {
          det = 'Entrega guardada (id ' + id + '): ' + (d.sc||'') + ' -> ' + (d.sp||'') +
                ' · ' + (d.kg!=null?d.kg:'') + ' kg';
        }
        setMsg(det, 'ok');
        // limpiar form
        elCant.value = ''; elKg.value = '';
        pkEnvioSC.clear(); pkEntSC.clear(); pkEntSP.clear();
        // recargar pantalla
        await reloadBundle();
      }catch(e){
        setMsg('Error: ' + (e && (e.message||e.hint||e.details) || e), 'err');
      }finally{
        elGuardar.disabled = false;
      }
    }
    elGuardar.addEventListener('click', guardar);
  }

  async function __boot(){
    try{
      document.body.style.cursor = 'progress';
      var r = await SB.rpc('control_ps_bundle');
      if(r.error) throw r.error;
      D = r.data || {};
      __run();
      initCarga();
    }catch(e){
      document.body.innerHTML =
        '<p style="padding:24px;font-family:system-ui;color:#b3402f">' +
        'Error cargando datos de Supabase (GP2): ' + (e && (e.message||e.hint||e.details) || e) + '</p>';
      console.error(e);
    }finally{
      document.body.style.cursor = '';
    }
  }
  __boot();
  </script>

</body>
</html>
