<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<!-- Anti-cache: la logica es JS INLINE; sin esto la tablet se queda con el HTML viejo. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Control Partes Inyectores · GP2</title>
<script src="../../auth-guard.js?v=20261006a"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase-config.js?v=20260929a"></script>
<script src="../../gp2-ui.js?v=20260930a"></script>
<script src="../../gp2-numero.js?v=20260911o"></script>
<script src="../../gp2-composicion.js?v=20260911p"></script>
<script src="../../gp2-envios-common.js?v=20260924b"></script>
<link rel="stylesheet" href="../../gp2-modulo.css?v=20260912c"/>
<link rel="icon" type="image/png" href="../../GP2_favicon.png">
<link rel="apple-touch-icon" href="../../GP2_favicon.png">
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Control Partes Inyectores</h1>
    <div class="hbtns">
      <button class="hlink hidden" id="btnVolver" type="button">← Cambiar inyector</button>
      <button class="hlink hidden" id="btnCSV" type="button">⬇ Exportar CSV</button>
      <button class="hlink hidden" id="btnImprimir" type="button">🖨 Imprimir</button>
      <a href="../Inyectores_GP2.html">Quién hace cada parte</a>
      <a href="../../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">

    <!-- FASE 0 — elegir inyector -->
    <div id="fase0">
      <div class="row"><label class="lbl">Inyector</label></div>
      <div class="provs-grid" id="provGrid"></div>
      <div id="status" class="status">Cargando…</div>
    </div>

    <!-- FASE 1 — control -->
    <div id="fase1" class="hidden">
      <div class="row"><label class="lbl" id="fase1Title">Inyector</label></div>

      <!-- El inyector no guarda piezas: guarda RESINA (kg). Enviado = bolsa que se le
           mando, Consumido = kg gastado al entregar piezas, Saldo = kg que le quedan. -->

      <div class="search-box no-print">
        <input type="text" id="q" placeholder="Buscar por resina, descripción o código…">
      </div>

      <div class="table-wrap">
        <table class="t">
          <thead>
            <tr>
              <th id="colProv" class="hidden">Inyector</th>
              <th>Sector</th>
              <th>Código</th>
              <th>Resina</th>
              <th class="num sep">Enviado (kg)</th>
              <th class="num">Consumido (kg)</th>
              <th class="num">Saldo en inyector (kg)</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
      </div>
      <div id="tblEmpty" class="empty hidden">Este inyector no tiene resinas configuradas.</div>
    </div>

  </div>
</div>

<script>
"use strict";

/* Pantalla de SOLO CONSULTA, igual que Control Partes P.S. / Tallerista.
   Las contrapartes son TODOS los proveedores con ubicacion de inyector, tengan o no
   piezas hoy (Kollplast con 0, 2026-10-01: las matrices cambian de inyector). OJO:
   la tablet "Enviar > Inyectores" todavia lista solo a los que tienen piezas.
   El dato sale del mismo ledger GP2:
   movimiento 'envio_inyector' (enviado) / 'consumo_inyector' (consumido) e
   inventario en la ubicacion del inyector (saldo). Todo en kg de resina. */

var SB = GP2EE.sb();

var $ = GP2UI.$, esc = GP2UI.esc, fmt = GP2EE.fmt, clsSaldo = GP2UI.cls;
var D = { inyectores: [] };
var selP = null;   /* null en fase1 => modo "Todos" */

function provs(){ return D.inyectores || []; }
function partesDe(p){ return (p && p.partes) ? p.partes : []; }

async function cargar(){
  var r = await SB.rpc("control_inyector_bundle");
  if (r.error){ $("status").textContent = "Error: " + r.error.message; return; }
  D = r.data || { inyectores: [] };
  renderProv();
  var gen = D.generado_en ? (" · generado " + new Date(D.generado_en).toLocaleString("es-AR")) : "";
  $("status").textContent = provs().length + " inyectores." + gen;
}

function renderProv(){
  var g = GP2EE.gridContrapartes("provGrid", provs(), {
    vacio: "Sin inyectores con datos GP2.",
    meta: function(p){ return partesDe(p).length + " resinas"; },
    onPick: elegir
  });
  if (!provs().length) return;

  // "Todos" — las resinas de todos los inyectores juntas, con el inyector como columna
  var bt = document.createElement("button");
  bt.type = "button"; bt.className = "prov-btn";
  var totPartes = provs().reduce(function(s,p){ return s + partesDe(p).length; }, 0);
  bt.innerHTML = "<b>Todos</b>" + '<span class="meta">' + provs().length + " inyectores · " + totPartes + " resinas</span>";
  bt.addEventListener("click", function(){ elegir(null); });
  g.insertBefore(bt, g.firstChild);
}

function elegir(p){
  selP = p;
  $("fase1Title").textContent = p ? p.nombre : "Todos los inyectores";
  $("colProv").classList.toggle("hidden", !!p);
  $("fase0").classList.add("hidden");
  $("fase1").classList.remove("hidden");
  $("btnVolver").classList.remove("hidden");
  $("btnImprimir").classList.remove("hidden");
  $("btnCSV").classList.remove("hidden");
  $("q").value = "";
  render();
}

function volver(){
  selP = null;
  $("fase1").classList.add("hidden");
  $("fase0").classList.remove("hidden");
  $("btnVolver").classList.add("hidden");
  $("btnImprimir").classList.add("hidden");
  $("btnCSV").classList.add("hidden");
  renderProv();
}

/* Cada fila lleva su inyector para poder mostrarlo y exportarlo en modo Todos */
function filasBase(){
  var out = [];
  (selP ? [selP] : provs()).forEach(function(p){
    partesDe(p).forEach(function(x){
      out.push(Object.assign({}, x, { _prov: p.nombre, _pid: p.iny_id }));
    });
  });
  return out.sort(function(a,b){
    return (selP ? 0 : String(a._prov).localeCompare(String(b._prov))) ||
           (GP2EE.rubroSector(a.sector) - GP2EE.rubroSector(b.sector)) ||
           String(a.codigo||"").localeCompare(String(b.codigo||""), "es", { numeric:true });
  });
}

function filtradas(){
  return GP2EE.filtrar(filasBase(), $("q").value, function(x){
    return String(x.codigo||"") + " " + String(x.descripcion||"") + " " +
           String(x.sector||"") + " " + String(x._prov||"");
  });
}

function render(){
  var arr = filtradas(), tb = $("tbody");
  tb.innerHTML = "";
  $("tblEmpty").classList.toggle("hidden", arr.length > 0);

  var totEnv = 0, totCon = 0, totSal = 0;

  arr.forEach(function(x){
    totEnv += Number(x.enviado||0);
    totCon += Number(x.consumido||0);
    totSal += Number(x.saldo||0);

    var tr = document.createElement("tr");
    tr.innerHTML =
      (selP ? "" : '<td>'+esc(x._prov||"")+'</td>')+
      '<td>'+esc(x.sector||"—")+'</td>'+
      '<td><span class="cod">'+esc(x.codigo)+'</span></td>'+
      '<td>'+esc(x.descripcion||"")+'</td>'+
      '<td class="num sep">'+fmt(x.enviado,2)+'</td>'+
      '<td class="num">'+fmt(x.consumido,2)+'</td>'+
      '<td class="num stk-cell '+clsSaldo(x.saldo)+'" data-cid="'+x.comp_id+'" data-pid="'+x._pid+'"'+
        ' title="Ver cómo se compone">'+fmt(x.saldo,2)+'</td>';
    tb.appendChild(tr);
  });

  $("tfoot").innerHTML = arr.length ? ('<tr>'+
    '<td colspan="'+(selP?3:4)+'">'+arr.length+' resinas</td>'+
    '<td class="num sep">'+fmt(totEnv,2)+'</td>'+
    '<td class="num">'+fmt(totCon,2)+'</td>'+
    '<td class="num '+clsSaldo(totSal)+'">'+fmt(totSal,2)+'</td></tr>') : "";
}

/* CSV para Excel es-AR: armado de la casa (GP2UI.exportarCSV). */
function exportarCSV(){
  var arr = filtradas();
  if (!arr.length){ alert("No hay filas para exportar."); return; }
  var filas = [(selP ? [] : ["Inyector"]).concat(
    ["Sector","Codigo","Resina","Enviado kg","Consumido kg","Saldo en inyector kg"])];

  arr.forEach(function(x){
    filas.push((selP ? [] : [x._prov||""]).concat([
      x.sector||"", x.codigo||"", x.descripcion||"",
      Number(x.enviado||0), Number(x.consumido||0), Number(x.saldo||0)
    ]));
  });

  GP2UI.exportarCSV("control_inyectores_" + (selP ? String(selP.nombre).replace(/\s+/g,"_") : "todos"), filas);
}

/* El saldo sale del mismo ledger que el resto del stock GP2: la celda abre la
   composicion apuntando a la ubicacion de ese inyector. */
$("tbody").addEventListener("click", function(e){
  var td = e.target.closest && e.target.closest("td.stk-cell");
  if (!td || !window.GP2Composicion) return;
  var x = filasBase().filter(function(y){
    return String(y.comp_id) === String(td.dataset.cid) &&
           String(y._pid)    === String(td.dataset.pid); })[0] || {};
  window.GP2Composicion.abrir({
    SB: SB, comp_id: td.dataset.cid,
    ubic_tipo: "inyector", ref_id: td.dataset.pid,
    cod: x.codigo, desc: x.descripcion
  });
});

$("q").addEventListener("input", render);
$("btnVolver").addEventListener("click", volver);
$("btnCSV").addEventListener("click", exportarCSV);
$("btnImprimir").addEventListener("click", function(){ window.print(); });

cargar().catch(function(e){ $("status").textContent = "Error: "+(e&&e.message?e.message:e); });
</script>
</body>
</html>
