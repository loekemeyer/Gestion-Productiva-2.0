<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Proporciones · GP2</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#ebeff4;color:#385475;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
 .top{background:#e7f0f8;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
 .top h1{margin:0;font-size:16px}
 .top .sel{display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}
 select,input,button{background:#eaeff6;color:#385475;border:1px solid #cddaea;border-radius:6px;padding:6px 10px;font-size:18px;font-family:inherit}
 button{cursor:pointer}
 button:hover{background:#e8eef7}
 /* El contenido manda el ancho: no se estira la tabla para llenar la pantalla. */
 .canvas{padding:14px;max-width:1080px;margin:0 auto}
 .note{background:#f5eeea;border:1px solid #eadbcd;color:#8e4c20;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px}
 .kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
 .kpi{border:1px solid #d1dae6;border-radius:8px;padding:6px 12px;font-size:14px;color:#475569}
 .kpi b{color:#166398;font-size:16px;margin-right:4px}
 /* inline-block: el recuadro se ajusta a la tabla y no deja aire muerto a la derecha */
 .tbl-wrap{display:inline-block;max-width:100%;overflow-x:auto;border:1px solid #d1dae6;border-radius:10px;vertical-align:top}
 table{border-collapse:collapse;font-size:14px}
 th,td{padding:7px 12px;text-align:center;vertical-align:middle;border-bottom:1px solid #d0dae7;white-space:nowrap}
 th{color:#475569;font-size:14px;font-weight:700}
 tr.ini td,tr.ini th{border-top:2px solid #b9c8dc}
 td.cod{font-family:ui-monospace,SF Mono,monospace;color:#165d98;font-weight:700}
 td.fam{color:#475569}
 td.partes{color:#385775;white-space:normal;max-width:360px}
 .tag{display:inline-block;border:1px solid #cddcea;border-radius:5px;padding:1px 7px;margin:1px 3px;font-size:14px}
 .tag .pc{color:#165d98;font-family:ui-monospace,monospace}
 input.pct{width:92px;text-align:center;font-size:19px;font-weight:700;color:#8e4c20}
 .sup{display:block;font-size:14px;color:#8e4c20}
 .suma{font-size:14px;font-weight:700}
 .suma.ok{color:#258858}
 .suma.mal{color:#982e16}
 .msg{font-size:14px;margin-top:6px}
 .msg.ok{color:#258858}
 .msg.mal{color:#982e16}
 .empty{padding:30px;text-align:center;color:#475569;font-size:14px}
 /* En el celular la tabla entra entera: menos aire y los nombres largos cortan en dos lineas.
    La letra NO baja de 14 (regla de la casa: que se lea). */
 @media (max-width:520px){
  th,td{padding:6px 3px;white-space:normal}
  .tag{margin:0;padding:1px 4px}
  input.pct{width:74px}
 }
</style><link rel="icon" type="image/png" href="../../GP2_favicon.png">
<link rel="apple-touch-icon" href="../../GP2_favicon.png">
<link rel="stylesheet" href="../../gp2-claro.css?v=20260903b">
</head>
<body>
<div id="gp2-logobar" style="position:relative;background:#e8edf7;text-align:center;padding:6px 0;border-bottom:1px solid #d0dae7"><a href="../../GP2_MODULOS.html" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#385475;text-decoration:none;font-weight:700;font-size:15px;padding:5px 10px;border:1px solid #d1d9e5;border-radius:8px;background:#e9eef7">← Atrás</a><a href="../../GP2_MODULOS.html" style="text-decoration:none"><img src="../../GP2_logo.png" alt="GP2 · Gestión Productiva" style="height:40px;vertical-align:middle"></a></div>

<div class="top">
 <h1>📊 Proporciones <span style="font-size:14px;color:#2a5783;font-weight:400">· pasos que hacen dos o más talleristas</span></h1>
 <div class="sel">
  <button id="btnCsv">⬇ Exportar CSV</button>
 </div>
</div>
<div class="canvas" id="canvas"><div class="empty">Cargando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase-config.js?v=20260905k"></script>
<script src="../../gp2-ui.js?v=20260913e"></script>
<script src="../../gp2-numero.js?v=20260911o"></script>
<script>var D={};
var SB=GP2_SB();

var esc = GP2UI.esc;   /* helpers de la casa (gp2-ui.js / gp2-numero.js) */

/* La pantalla muestra UNA cosa: los PASOS que hacen dos o mas talleristas, y el % de cada uno.
   [usuario 2026-09-14/15: "que aparezcan solo los articulos compartidos", "que me aparezcan nada
   mas los que hacen el mismo paso", "elimina la columna de situacion", y despues los porcentajes:
   505 Danica 40 / Lucho 60, 506 Alex 70 / Martin 30.]

   POR QUE EL CORTE ES EL PASO Y NO EL ARTICULO: que dos talleristas toquen el mismo articulo NO
   es un reparto de volumen. Si cada uno hace un PASO DISTINTO de la ruta (uno el mango, el otro
   el armado) van en cadena y cada uno hace el 100 % de lo suyo. El reparto existe solo cuando
   dos talleristas producen EL MISMO comp_salida, o sea la ruta duplicada por tallerista.

   EL % NO ES DECORATIVO: reparto_guardar lo escribe y recalcula los MAXIMOS de esos talleristas
   (v_consumo_tallerista -> v_nivel_stock_tallerista -> recalcular_maximos_talleristas). Antes
   Danica y Lucho tenian 15.000 de carton 505 CADA UNO para una demanda de 28.108; ahora 11.243
   y 16.865. La logica de "mismo paso" vive en proporciones_bundle, no aca. */

/* fmt sin "fijo" ya come los decimales de mas: 40 -> "40", 33.3333 -> "33,33" */
function pctTxt(p){ return GP2N.fmt(Number(p), 2, ""); }

function sumaDe(paso){
 var s=0;
 (paso.talleristas||[]).forEach(function(t){
  var el=document.querySelector('input.pct[data-k="'+paso.articulo_id+'_'+paso.comp_salida_id+'_'+t.tall_id+'"]');
  s += el ? GP2N.num(el.value) : Number(t.pct||0);
 });
 return Math.round(s*100)/100;
}

function pintarSuma(paso){
 var el=document.getElementById("suma_"+paso.articulo_id+"_"+paso.comp_salida_id);
 if(!el)return;
 var s=sumaDe(paso), ok=Math.abs(s-100)<0.01;
 el.className="suma "+(ok?"ok":"mal");
 el.textContent="suma "+pctTxt(s);
 var b=document.getElementById("btn_"+paso.articulo_id+"_"+paso.comp_salida_id);
 if(b)b.disabled=!ok;
}

async function guardar(paso){
 var msg=document.getElementById("msg_"+paso.articulo_id+"_"+paso.comp_salida_id);
 var filas=(paso.talleristas||[]).map(function(t){
  var el=document.querySelector('input.pct[data-k="'+paso.articulo_id+'_'+paso.comp_salida_id+'_'+t.tall_id+'"]');
  return {tallerista_id:t.tall_id, pct:el?GP2N.num(el.value):Number(t.pct||0)};
 });
 msg.className="msg"; msg.textContent="Guardando…";
 var r=await SB.rpc("reparto_guardar",{p_articulo_id:paso.articulo_id,p_comp_salida_id:paso.comp_salida_id,p_filas:filas});
 if(r.error){ msg.className="msg mal"; msg.textContent=r.error.message||"No se pudo guardar"; return; }
 var n=(r.data&&r.data.maximos&&r.data.maximos.actualizados)||0;
 var txt="Guardado · "+n+" máximo"+(n===1?"":"s")+" recalculado"+(n===1?"":"s");
 /* el render de recargar() vuelve a dibujar la tabla, asi que el cartel se pone DESPUES,
    sobre el nodo nuevo (el id es el mismo) */
 await recargar();
 var msg2=document.getElementById("msg_"+paso.articulo_id+"_"+paso.comp_salida_id);
 if(msg2){ msg2.className="msg ok"; msg2.textContent=txt; }
}

async function recargar(){
 var r=await SB.rpc("proporciones_bundle");
 if(r.error)throw r.error;
 D=r.data||{};
 render();
}

function render(){
 var canvas=document.getElementById("canvas");
 var pasos=(D.pasos||[]);
 var nSup=pasos.filter(function(p){return (p.talleristas||[]).some(function(t){return t.es_supuesto;});}).length;

 var note='<div class="note">Los pasos que <b>hacen dos o más talleristas</b> (la misma pieza, la ruta '+
   'duplicada): ahí y sólo ahí se reparte el volumen. El % <b>manda sobre el máximo de cada tallerista</b>: '+
   'al guardarlo se recalcula lo que cada uno tiene que tener en su casa. Los talleristas que hacen '+
   '<b>otro</b> paso del mismo artículo no aparecen: van en cadena, cada uno hace el 100 % de lo suyo.</div>';
 var kpi='<div class="kpis">'+
   '<div class="kpi"><b>'+pasos.length+'</b>pasos compartidos</div>'+
   (nSup?'<div class="kpi"><b>'+nSup+'</b>sin definir (va mitad y mitad)</div>':'')+
 '</div>';

 if(!pasos.length){canvas.innerHTML=note+kpi+'<div class="empty">Hoy ningún paso lo hacen dos talleristas.</div>';return;}

 var filas="";
 pasos.forEach(function(p){
  var talls=(p.talleristas||[]), k=p.articulo_id+"_"+p.comp_salida_id;
  talls.forEach(function(t,i){
   filas+='<tr'+(i===0?' class="ini"':'')+'>'+
    (i===0?'<td class="cod" rowspan="'+talls.length+'">'+esc(p.art_codigo)+'</td>'+
           '<td class="fam" rowspan="'+talls.length+'">'+esc(p.familia||"")+'</td>'+
           '<td class="partes" rowspan="'+talls.length+'">'+
             '<span class="tag"><span class="pc">'+esc(p.paso_cod)+'</span> '+esc(p.paso_desc||"")+'</span></td>':'')+
    '<td><b>'+esc(t.tallerista)+'</b></td>'+
    '<td><input class="pct" type="text" inputmode="decimal" aria-label="Proporción de '+esc(t.tallerista)+'"'+
       ' data-k="'+k+"_"+t.tall_id+'" value="'+esc(pctTxt(t.pct))+'">'+
       (t.es_supuesto?'<span class="sup">sin definir</span>':'')+'</td>'+
    (i===0?'<td rowspan="'+talls.length+'">'+
       '<button id="btn_'+k+'">Guardar</button>'+
       '<div id="suma_'+k+'" class="suma"></div>'+
       '<div id="msg_'+k+'" class="msg"></div></td>':'')+
   '</tr>';
  });
 });

 canvas.innerHTML=note+kpi+'<div class="tbl-wrap"><table><thead><tr>'+
   '<th>Código</th><th>Familia</th><th>Paso compartido</th><th>Tallerista</th><th>Proporción %</th><th></th>'+
   '</tr></thead><tbody>'+filas+'</tbody></table></div>';

 pasos.forEach(function(p){
  var k=p.articulo_id+"_"+p.comp_salida_id;
  (p.talleristas||[]).forEach(function(t){
   var el=document.querySelector('input.pct[data-k="'+k+"_"+t.tall_id+'"]');
   if(el)el.addEventListener("input",function(){pintarSuma(p);});
  });
  var b=document.getElementById("btn_"+k);
  if(b)b.addEventListener("click",function(){guardar(p);});
  pintarSuma(p);
 });
}

function __run(){
 document.getElementById("btnCsv").addEventListener("click",function(){
  var out=[["Art_Codigo","Familia","Paso_cod","Paso_desc","Tallerista","Proporcion_pct","Definido"]];
  (D.pasos||[]).forEach(function(p){
   (p.talleristas||[]).forEach(function(t){
    out.push([p.art_codigo,p.familia||"",p.paso_cod,p.paso_desc||"",t.tallerista,t.pct,t.es_supuesto?"NO":"SI"]);
   });
  });
  GP2UI.exportarCSV("proporciones_"+GP2UI.hoyAR(),out);
 });
}

async function __boot(){
 try{
  document.body.style.cursor="progress";
  __run();          /* engancha el CSV una sola vez */
  await recargar(); /* trae el bundle y dibuja */
 }catch(e){
  document.getElementById("canvas").innerHTML='<div class="empty" style="color:#982e16">Error cargando datos de Supabase: '+esc(e.message||e)+'</div>';
  console.error(e);
 }finally{document.body.style.cursor="";}
}
__boot();
</script>
</body></html>
