<title>Proporciones · GP2</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#ebeff4;color:#385475;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
 .top{background:#e7f0f8;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
 .top h1{margin:0;font-size:16px}
 .top .sel{display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}
 select,input,button{background:#eaeff6;color:#385475;border:1px solid #cddaea;border-radius:6px;padding:6px 10px;font-size:18px;font-family:inherit}
 input{width:230px}
 button{cursor:pointer}
 button:hover{background:#e8eef7}
 /* El contenido manda el ancho: no se estira la tabla para llenar la pantalla. */
 .canvas{padding:14px;max-width:1080px;margin:0 auto}
 .note{background:#f5eeea;border:1px solid #eadbcd;color:#8e4c20;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px}
 .kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
 .kpi{border:1px solid #d1dae6;border-radius:8px;padding:6px 12px;font-size:14px;color:#475569}
 .kpi b{color:#166398;font-size:16px;margin-right:4px}
 .tbl-wrap{overflow-x:auto;border:1px solid #d1dae6;border-radius:10px}
 table{border-collapse:collapse;font-size:14px}
 th,td{padding:7px 12px;text-align:center;vertical-align:middle;border-bottom:1px solid #d0dae7;white-space:nowrap}
 th{color:#475569;font-size:14px;font-weight:700}
 tr.ini td,tr.ini th{border-top:2px solid #b9c8dc}
 td.cod{font-family:ui-monospace,SF Mono,monospace;color:#165d98;font-weight:700}
 td.fam{color:#475569}
 td.partes{color:#385775;white-space:normal;max-width:360px}
 .tag{display:inline-block;border:1px solid #cddcea;border-radius:5px;padding:1px 7px;margin:1px 3px;font-size:14px}
 .tag .pc{color:#165d98;font-family:ui-monospace,monospace}
 .badge{font-size:14px;font-weight:700;padding:1px 8px;border-radius:8px;border:1px solid}
 .badge.sh{color:#8e4c20;border-color:#eadbcd}
 .badge.own{color:#258858;border-color:#bfe0cd}
 .prop{color:#8e4c20;font-weight:700;font-size:14px}
 .prop.na{color:#8494a8;font-weight:400}
 .empty{padding:30px;text-align:center;color:#475569;font-size:14px}
</style><link rel="icon" type="image/png" href="../../GP2_favicon.png">

</head>
<body>
<div id="gp2-logobar" style="position:relative;background:#e8edf7;text-align:center;padding:6px 0;border-bottom:1px solid #d0dae7"><a href="../../GP2_MODULOS.html" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#385475;text-decoration:none;font-weight:700;font-size:15px;padding:5px 10px;border:1px solid #d1d9e5;border-radius:8px;background:#e9eef7">← Atrás</a><a href="../../GP2_MODULOS.html" style="text-decoration:none"><img src="../../GP2_logo.png" alt="GP2 · Gestión Productiva" style="height:40px;vertical-align:middle"></a></div>

<div class="top">
 <h1>📊 Proporciones <span style="font-size:14px;color:#2a5783;font-weight:400">· artículos compartidos</span></h1>
 <div class="sel">
  Tallerista <select id="fTall"><option value="">Todos</option></select>
  <input id="fBuscar" type="text" placeholder="Buscar código, familia, parte, tallerista…">
  <button id="btnCsv">⬇ Exportar CSV</button>
 </div>
</div>
<div class="canvas" id="canvas"><div class="empty">Cargando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase-config.js?v=20260905k"></script>
<script src="../../gp2-ui.js?v=20260913e"></script>
<script>var D={};
var SB=GP2_SB();

var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}

/* La pantalla muestra UNA cosa: los articulos que, segun ruta_paso, tocan 2 o mas talleristas.
   La vista "por tallerista" (que listaba tambien los exclusivos) se borro el 2026-09-14 por
   pedido del usuario: "borres lo que hay y que aparezcan solo los articulos compartidos".

   DISTINCION QUE IMPORTA para cuando se carguen los porcentajes: que dos talleristas toquen el
   mismo articulo NO siempre es un reparto de volumen. Si cada uno hace un PASO DISTINTO de la
   ruta (uno el mango, el otro el armado) van en cadena y cada uno hace el 100 % de lo suyo.
   El reparto existe solo cuando dos talleristas hacen EL MISMO paso (el mismo comp_salida),
   que es la ruta duplicada por tallerista. Por eso cada fila dice cual de los dos casos es y
   la columna Proporcion queda PENDIENTE solo donde hay reparto de verdad. */
function mapaPasos(a){
 /* cod de parte -> cuantos talleristas la hacen, dentro de ESTE articulo */
 var m={};
 (a.talleristas||[]).forEach(function(t){
  (t.partes||[]).forEach(function(p){ if(p&&p.cod) m[p.cod]=(m[p.cod]||0)+1; });
 });
 return m;
}
function repartido(t,m){
 return (t.partes||[]).some(function(p){return p&&p.cod&&m[p.cod]>=2;});
}
function artRepartido(a){
 var m=mapaPasos(a);
 return (a.talleristas||[]).some(function(t){return repartido(t,m);});
}

function partesTxt(partes){
 return (partes||[]).map(function(p){return (p.cod||"")+" "+(p.desc||"");}).join(" ");
}
function partesHtml(partes){
 if(!partes||!partes.length)return '<span class="prop na">(sin parte registrada)</span>';
 return partes.map(function(p){
  return '<span class="tag"><span class="pc">'+esc(p.cod)+'</span> '+esc(p.desc||"")+'</span>';
 }).join("");
}

function artMatch(a,q){
 if(!q)return true;
 if(norm(a.art_codigo).indexOf(q)>=0||norm(a.familia).indexOf(q)>=0)return true;
 return (a.talleristas||[]).some(function(t){
  return norm(t.tallerista).indexOf(q)>=0||norm(partesTxt(t.partes)).indexOf(q)>=0;
 });
}

function filtrar(tallSel,q){
 var arts=(D.articulos_compartidos||[]).slice();
 if(tallSel)arts=arts.filter(function(a){return (a.talleristas||[]).some(function(t){return String(t.tall_id)===tallSel;});});
 arts=arts.filter(function(a){return artMatch(a,q);});
 /* primero lo que espera un porcentaje, despues los que van en cadena (regla: por gravedad) */
 arts.sort(function(x,y){
  var rx=artRepartido(x)?0:1, ry=artRepartido(y)?0:1;
  if(rx!==ry)return rx-ry;
  if(y.num_talleristas!==x.num_talleristas)return y.num_talleristas-x.num_talleristas;
  return String(x.art_codigo).localeCompare(String(y.art_codigo));
 });
 return arts;
}

function render(){
 var canvas=document.getElementById("canvas");
 var tallSel=document.getElementById("fTall").value;
 var q=norm(document.getElementById("fBuscar").value.trim());
 var arts=filtrar(tallSel,q);

 var nRep=arts.filter(artRepartido).length;
 var kpi='<div class="kpis">'+
   '<div class="kpi"><b>'+arts.length+'</b>artículos compartidos (≥2 talleristas)</div>'+
   '<div class="kpi"><b>'+nRep+'</b>con un paso que hacen dos (ahí va el %)</div>'+
 '</div>';
 var note='<div class="note">Artículos que, según las rutas, se lleva más de un tallerista. '+
   'La <b>proporción de volumen todavía no está cargada en GP2</b>: queda <b>PENDIENTE</b> en las filas '+
   'donde dos talleristas hacen <b>el mismo paso</b>. Donde cada uno hace un paso distinto van en cadena '+
   'y no hay porcentaje que repartir. No se inventan valores.</div>';

 if(!arts.length){canvas.innerHTML=note+kpi+'<div class="empty">Sin resultados para el filtro.</div>';return;}

 var filas="";
 arts.forEach(function(a){
  var m=mapaPasos(a);
  var talls=(a.talleristas||[]);
  talls.forEach(function(t,i){
   var rep=repartido(t,m);
   filas+='<tr'+(i===0?' class="ini"':'')+'>'+
    (i===0?'<td class="cod" rowspan="'+talls.length+'">'+esc(a.art_codigo)+'</td>'+
           '<td class="fam" rowspan="'+talls.length+'">'+esc(a.familia||"")+'</td>'+
           '<td rowspan="'+talls.length+'">'+a.num_talleristas+'</td>':'')+
    '<td><b>'+esc(t.tallerista)+'</b></td>'+
    '<td class="partes">'+partesHtml(t.partes)+'</td>'+
    '<td>'+(rep?'<span class="badge sh">Mismo paso</span>':'<span class="badge own">Paso propio</span>')+'</td>'+
    '<td class="prop'+(rep?'':' na')+'">'+(rep?"PENDIENTE":"—")+'</td>'+
   '</tr>';
  });
 });

 canvas.innerHTML=note+kpi+'<div class="tbl-wrap"><table><thead><tr>'+
   '<th>Código</th><th>Familia</th><th>Talleristas</th><th>Tallerista</th>'+
   '<th>Paso que hace</th><th>Situación</th><th>Proporción %</th>'+
   '</tr></thead><tbody>'+filas+'</tbody></table></div>';
}

function __run(){
 var fTall=document.getElementById("fTall");
 var fBuscar=document.getElementById("fBuscar");

 /* el filtro ofrece SOLO los talleristas que aparecen en algun articulo compartido */
 var vistos={};
 (D.articulos_compartidos||[]).forEach(function(a){
  (a.talleristas||[]).forEach(function(t){vistos[String(t.tall_id)]=t.tallerista;});
 });
 Object.keys(vistos).sort(function(x,y){return String(vistos[x]).localeCompare(String(vistos[y]));})
  .forEach(function(id){
   var o=document.createElement("option");o.value=id;o.textContent=vistos[id];fTall.appendChild(o);
  });

 fTall.addEventListener("change",render);
 fBuscar.addEventListener("input",render);

 document.getElementById("btnCsv").addEventListener("click",function(){
  var arts=filtrar(fTall.value,norm(fBuscar.value.trim()));
  var out=[["Art_Codigo","Familia","Num_Talleristas","Tallerista","Paso_que_hace","Situacion","Proporcion_pct"]];
  arts.forEach(function(a){
   var m=mapaPasos(a);
   (a.talleristas||[]).forEach(function(t){
    var rep=repartido(t,m);
    out.push([a.art_codigo,a.familia||"",a.num_talleristas,t.tallerista,partesTxt(t.partes).trim(),
      rep?"Mismo paso":"Paso propio",rep?"PENDIENTE":""]);
   });
  });
  GP2UI.exportarCSV("proporciones_compartidos_"+GP2UI.hoyAR(),out);
 });

 render();
}

async function __boot(){
 try{
  document.body.style.cursor="progress";
  var r=await SB.rpc("proporciones_bundle");
  if(r.error)throw r.error;
  Object.assign(D,r.data);
  __run();
 }catch(e){
  document.getElementById("canvas").innerHTML='<div class="empty" style="color:#982e16">Error cargando datos de Supabase: '+esc(e.message||e)+'</div>';
  console.error(e);
 }finally{document.body.style.cursor="";}
}
__boot();
</script>
</body></html>
