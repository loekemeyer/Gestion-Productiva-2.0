<style>
 *{box-sizing:border-box}
 body{margin:0;background:#ebeff4;color:#385475;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
 .top{background:#e7f0f8;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
 .top h1{margin:0;font-size:16px}
 .top .sel{display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}
 select,input,button{background:#eaeff6;color:#385475;border:1px solid #cddaea;border-radius:6px;padding:6px 10px;font-size:18px;font-family:inherit;min-height:44px}
 button{cursor:pointer}
 button:hover{background:#e8eef7}
 button:disabled{opacity:.45;cursor:not-allowed}
 /* El contenido manda el ancho: no se estira nada para llenar la pantalla. */
 .canvas{padding:14px;max-width:1080px;margin:0 auto}
 .note{background:#f5eeea;border:1px solid #eadbcd;color:#8e4c20;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px}
 .kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
 .kpi{border:1px solid #d1dae6;border-radius:8px;padding:6px 12px;font-size:14px;color:#475569}
 .kpi b{color:#166398;font-size:16px;margin-right:4px}
 .aviso{font-size:14px;color:#1d6b3a;font-weight:700}
 /* Una caja debajo de la otra, cada una del ancho de su tabla. */
 .paso{border:1px solid #d1dae6;border-radius:10px;margin-bottom:14px;padding:10px 12px;width:fit-content;max-width:100%}
 .paso-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
 .paso-head .cod{font-family:ui-monospace,SF Mono,monospace;color:#165d98;font-weight:700;font-size:16px}

 .sup{display:block;color:#8e4c20;font-weight:700;font-size:14px}

 table{border-collapse:collapse;font-size:14px}
 th,td{padding:6px 12px;text-align:center;vertical-align:middle;border-bottom:1px solid #d0dae7;white-space:nowrap}

 td .casa{display:block;color:#8494a8;font-weight:400;font-size:14px}

 .pie .suma{font-size:14px;color:#475569}

 @media (max-width:520px){
  th,td{padding:6px 5px}

<div class="top">
 <h1>📊 Proporciones <span style="font-size:14px;color:#2a5783;font-weight:400">· pasos que hacen dos o más talleristas</span></h1>
 <div class="sel">
  <button id="btnCsv">⬇ Exportar CSV</button>
 </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>var D={};
var SB=GP2_SB();

var esc = GP2UI.esc;   /* helpers de la casa (gp2-ui.js / gp2-numero.js) */

/* Los PASOS que hacen dos o mas talleristas, el % de cada uno y lo que necesita cada uno de cada
   parte que recibe. [usuario 2026-09-14/15: "que me aparezcan nada mas los que hacen el mismo
   paso" + "quiero que me pongas los maximos de cada parte del articulo que se esta
   proporcionando"; 2026-09-30: "la proporcion en porcentaje la puedo cambiar escribiendo" (-> "Si,
   con Guardar"), "una box debajo de otra" y "no entiendo los numeros".]

   CADA NUMERO ES DE ESTE ARTICULO: demanda del articulo para esa parte (dem_mes) x el % del
   tallerista x los meses de stock de su casa. Hasta el 30-09 la celda era inventario.maximo, que es
   el TOTAL de la parte en la casa del tallerista sumando TODOS sus articulos: en el 123 al 50/50,
   A11 decia 1.224 / 1.508 cuando del 123 les toca 96 a cada uno. Ese total va abajo en gris
   ("casa") solo cuando es distinto, y la columna Total suma las de los talleristas.

   EL % SE EDITA, PERO UN DEFAULT NUNCA SE GRABA SOLO. El 15-09 se habia cerrado la edicion porque
   un Guardar grabo el 50/50 que la pantalla mostraba de default (CONOCIMIENTO 4dw). Por eso:
   Guardar arranca apagado en cada paso, se prende recien cuando alguien ESCRIBIO un % y la suma da
   100, y pide confirmacion. Con dos talleristas el otro se completa solo (100 - x).
   reparto_guardar valida en la base (todos los del paso, ninguno en 0, suman 100) y recalcula los
   maximos; exige usuario habilitado.

   POR QUE EL CORTE ES EL PASO Y NO EL ARTICULO: que dos talleristas toquen el mismo articulo NO
   es un reparto de volumen. Si cada uno hace un PASO DISTINTO de la ruta (uno el mango, el otro
   el armado) van en cadena y cada uno hace el 100 % de lo suyo. El reparto existe solo cuando
   dos talleristas producen EL MISMO comp_salida, o sea la ruta duplicada por tallerista. */

var ED={};          /* clave del paso -> {pct:{tall_id:n}, dirty:true} mientras se edita */
var AVISO="";       /* lo que quedo del ultimo Guardar */

function clave(p){ return p.articulo_id+":"+p.comp_salida_id; }
function pctFmt(n){ return GP2N.fmt(Number(n), 2, ""); }
function uni(n){ return GP2N.fmt(n, 0, "—"); }
function pctDe(p,t){ var e=ED[clave(p)]; return e ? e.pct[t.tall_id] : Number(t.pct); }
/* lo que le toca a un tallerista de ESTE articulo, con el % que se le pase */
function paraArt(pa,t,pct){ return Math.round(Number(pa.dem_mes||0) * pct / 100 * Number(t.meses==null?1:t.meses)); }
function xDe(pa,t){ return (pa.por_tall||[]).filter(function(y){return y.tall_id===t.tall_id;})[0]; }

function mesesTxt(pasos){
 var ms={};
 pasos.forEach(function(p){ (p.talleristas||[]).forEach(function(t){ ms[t.meses==null?1:Number(t.meses)]=1; }); });
 var k=Object.keys(ms);
 if(k.length!==1) return "los meses de stock de su casa";
 var m=Number(k[0]); return GP2N.fmt(m, 1, "")+(m===1?" mes":" meses")+" de stock";
}

function celdas(p){
 var talls=(p.talleristas||[]);
 return (p.partes||[]).map(function(pa){
  var tot=0, alguna=false;
  var tds=talls.map(function(t){
   var x=xDe(pa,t);
   if(!x) return '<td class="sinmax" title="Este tallerista no recibe esta parte en este paso">—</td>';
   var v=paraArt(pa,t,pctDe(p,t)); tot+=v; alguna=true;
   /* el total de su casa se mueve con lo que se esta escribiendo: lo de los otros articulos queda */
   var casa=(x.maximo==null)?null:Number(x.maximo)-paraArt(pa,t,Number(t.pct))+v;
   var extra=(casa!=null && Math.abs(casa-v)>1)?'<span class="casa" title="Máximo de esa parte en su casa, sumando todos sus artículos">casa '+uni(casa)+'</span>':'';
   return '<td class="max">'+uni(v)+extra+'</td>';
  }).join("");
  return '<tr><td class="parte"><span class="pc">'+esc(pa.cod)+'</span>'+esc(pa.desc||"")+'</td>'+tds+
         '<td class="tot">'+(alguna?uni(tot):'—')+'</td></tr>';
 }).join("") || '<tr><td class="parte" colspan="'+(talls.length+2)+'">(sin partes registradas)</td></tr>';
}

function estado(p){
 var e=ED[clave(p)], talls=(p.talleristas||[]);
 var suma=talls.reduce(function(a,t){return a+pctDe(p,t);},0);
 var cero=talls.some(function(t){return !(pctDe(p,t)>0);});
 return { dirty:!!(e&&e.dirty), suma:suma, ok:Math.abs(suma-100)<=0.01 && !cero, cero:cero };
}

function pie(p){
 var s=estado(p);
 var txt=s.cero ? 'Un % en 0 es que no hace el paso: eso se cambia en la ruta'
        : (s.ok ? 'Suma '+pctFmt(s.suma)+' %' : 'Suman '+pctFmt(s.suma)+' %: tiene que dar 100');
 return '<span class="suma'+(s.ok?'':' mal')+'">'+txt+'</span>'+
   (s.dirty?'<button type="button" data-cancelar="'+clave(p)+'">Cancelar</button>':'')+
   '<button type="button" data-guardar="'+clave(p)+'"'+(s.dirty&&s.ok?'':' disabled')+'>Guardar</button>';
}

function render(){
 var canvas=document.getElementById("canvas");
 var pasos=(D.pasos||[]);
 var nSup=pasos.filter(function(p){return (p.talleristas||[]).some(function(t){return t.es_supuesto;});}).length;

 var note='<div class="note">Pasos que hacen <b>dos o más talleristas</b> (la misma pieza, con la ruta '+
   'duplicada). Cada número es lo que ese tallerista necesita <b>por este artículo</b>, en unidades para '+
   esc(mesesTxt(pasos))+': demanda del artículo × su %. <b>Total</b> es lo que pide el artículo. '+
   'En gris, el máximo de <b>su casa</b> cuando usa la misma parte en otros artículos. '+
   'El % se cambia escribiendo y se graba con <b>Guardar</b>, que recalcula los máximos.</div>';
 var kpi='<div class="kpis">'+
   '<div class="kpi"><b>'+pasos.length+'</b>pasos compartidos</div>'+
   (nSup?'<div class="kpi"><b>'+nSup+'</b>sin definir (va mitad y mitad)</div>':'')+
   (AVISO?'<span class="aviso">'+esc(AVISO)+'</span>':'')+
 '</div>';

 if(!pasos.length){canvas.innerHTML=note+kpi+'<div class="empty">Hoy ningún paso lo hacen dos talleristas.</div>';return;}

 var H="";
 pasos.forEach(function(p){
  var talls=(p.talleristas||[]), k=clave(p);
  var cab=talls.map(function(t){
   return '<th>'+esc(t.tallerista)+'<span class="pct"><input class="pct-in" type="text" inputmode="decimal" '+
     'data-paso="'+k+'" data-tall="'+t.tall_id+'" value="'+esc(pctFmt(pctDe(p,t)))+'" '+
     'aria-label="% de '+esc(t.tallerista)+'"> %</span>'+
     (t.es_supuesto?'<span class="sup">(sin definir)</span>':'')+'</th>';
  }).join("");
  /* el paso solo se nombra cuando NO es el mismo articulo (hoy los 5 son el terminado) */
  var tag=(String(p.paso_cod||"").trim()!==String(p.art_codigo||"").trim())
    ?'<span class="tag"><span class="pc">'+esc(p.paso_cod)+'</span> '+esc(p.paso_desc||"")+'</span>':'';
  H+='<div class="paso" data-caja="'+k+'"><div class="paso-head">'+
      '<span class="cod">'+esc(p.art_codigo)+'</span>'+
      '<span class="fam">'+esc(p.familia||"")+'</span>'+tag+
     '</div><div class="tbl-wrap"><table><thead><tr><th>Parte que recibe</th>'+cab+'<th class="tot">Total</th></tr></thead>'+
     '<tbody>'+celdas(p)+'</tbody></table></div><div class="pie">'+pie(p)+'</div></div>';
 });

 canvas.innerHTML=note+kpi+H;
}

function pasoDe(k){ return (D.pasos||[]).filter(function(p){return clave(p)===k;})[0]; }

/* repinta el cuerpo y el pie de UNA caja, sin tocar los campos (no se pierde el foco) */
function refrescar(p){
 var caja=document.querySelector('.paso[data-caja="'+clave(p)+'"]');
 if(!caja) return;
 caja.querySelector("tbody").innerHTML=celdas(p);
 caja.querySelector(".pie").innerHTML=pie(p);
}

function alEscribir(inp){
 var p=pasoDe(inp.dataset.paso); if(!p) return;
 var k=clave(p), talls=(p.talleristas||[]);
 if(!ED[k]){ ED[k]={pct:{},dirty:true}; talls.forEach(function(t){ ED[k].pct[t.tall_id]=Number(t.pct); }); }
 var tid=Number(inp.dataset.tall), v=GP2N.num(inp.value);
 ED[k].pct[tid]=v; ED[k].dirty=true;
 if(talls.length===2){
  var otro=talls.filter(function(t){return t.tall_id!==tid;})[0];
  var r=Math.round((100-v)*100)/100; if(r<0) r=0;
  ED[k].pct[otro.tall_id]=r;
  var oi=document.querySelector('input.pct-in[data-paso="'+k+'"][data-tall="'+otro.tall_id+'"]');
  if(oi) oi.value=pctFmt(r);
 }
 AVISO="";
 refrescar(p);
}

async function guardar(k){
 var p=pasoDe(k), s=p&&estado(p);
 if(!p || !s.dirty || !s.ok) return;
 var talls=(p.talleristas||[]);
 var txt=talls.map(function(t){return t.tallerista+" "+pctFmt(pctDe(p,t))+" %";}).join(" · ");
 if(!confirm("¿Grabar el reparto del "+p.art_codigo+"?\n\n"+txt+"\n\nSe recalculan los máximos de los talleristas.")) return;
 var filas=talls.map(function(t){return {tallerista_id:t.tall_id, pct:pctDe(p,t)};});
 var btn=document.querySelector('button[data-guardar="'+k+'"]'); if(btn) btn.disabled=true;
 var r=await SB.rpc("reparto_guardar",{p_articulo_id:p.articulo_id, p_comp_salida_id:p.comp_salida_id, p_filas:filas});
 if(r.error){ alert("No se grabó: "+(r.error.message||r.error)); if(btn) btn.disabled=false; return; }
 var n=(r.data&&r.data.maximos&&r.data.maximos.actualizados)||0;
 delete ED[k];
 AVISO="✓ "+p.art_codigo+" guardado ("+txt+"): "+n+(n===1?" máximo recalculado":" máximos recalculados");
 try{ await cargar(); }
 catch(e){ alert("Se grabó, pero no se pudo volver a leer: "+(e.message||e)+". Recargá la página."); }
}

function __run(){
 var canvas=document.getElementById("canvas");
 canvas.addEventListener("input",function(ev){ if(ev.target.classList.contains("pct-in")) alEscribir(ev.target); });
 canvas.addEventListener("click",function(ev){
  var b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.guardar) guardar(b.dataset.guardar);
  if(b.dataset.cancelar){ delete ED[b.dataset.cancelar]; render(); }
 });
 window.addEventListener("beforeunload",function(ev){
  if(Object.keys(ED).length){ ev.preventDefault(); ev.returnValue=""; }
 });
 document.getElementById("btnCsv").addEventListener("click",function(){
  var out=[["Art_Codigo","Familia","Paso_cod","Paso_desc","Tallerista","Proporcion_pct","Parte_cod","Parte_desc",
            "Demanda_articulo_mes","Maximo_este_articulo","Maximo_total_casa","En_su_stock"]];
  (D.pasos||[]).forEach(function(p){
   (p.talleristas||[]).forEach(function(t){
    (p.partes||[]).forEach(function(pa){
     var x=xDe(pa,t);
     if(!x) return;
     out.push([p.art_codigo,p.familia||"",p.paso_cod,p.paso_desc||"",t.tallerista,t.pct,
               pa.cod,pa.desc||"",pa.dem_mes==null?"":pa.dem_mes,paraArt(pa,t,Number(t.pct)),
               x.maximo!=null?x.maximo:"",x.tiene_fila?"si":"no"]);
    });
   });
  });
  GP2UI.exportarCSV("proporciones_"+GP2UI.hoyAR(),out);
 });
}

async function cargar(){
 var r=await SB.rpc("proporciones_bundle");
 if(r.error)throw r.error;
 D=r.data||{};
 render();
}

async function __boot(){
 try{
  document.body.style.cursor="progress";
  __run();
  await cargar();
 }catch(e){
  document.getElementById("canvas").innerHTML='<div class="empty" style="color:#982e16">Error cargando datos de Supabase: '+esc(e.message||e)+'</div>';
  console.error(e);
 }finally{document.body.style.cursor="";}
}
__boot();
</script>
