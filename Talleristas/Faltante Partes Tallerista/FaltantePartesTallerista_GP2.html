<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<script src="../../auth-guard.js?v=20261006b"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faltante Partes Tallerista · GP2</title>
<link rel="stylesheet" href="../../gp2-modulo.css?v=20261008ds">
<style>
 /* Sistema de diseño v2 (gp2-modulo.css): barra, chips, campos, tablas, kpis y avisos los da el
    sistema. Aca queda solo lo propio: la tarjeta de cada tallerista. */
 .toolbar{margin-top:0}
 .toolbar #fBuscar{flex:1 1 320px;min-width:220px;width:auto}
 .toolbar .chk{align-self:center}
 /* una tarjeta por tallerista; su encabezado queda pegado bajo la barra mientras se recorre su tabla */
 .tall-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--s3)}
 .tall-head{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:8px var(--s4);min-height:52px;
   background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r-md) var(--r-md) 0 0;box-shadow:none}
 .tall-head .nm{font-size:var(--fs-lg);font-weight:700;color:var(--ink)}
 .tall-head .cod{font-size:var(--fs-sm);color:var(--ink-3);font-weight:500;margin-left:6px}
 .tall-head .tot{display:flex;gap:6px;flex-wrap:wrap}
 .tall-head .pill{height:26px;padding:0 10px;font-size:var(--fs-sm)}
 .tall-card .table-wrap{border:0;border-radius:0 0 var(--r-md) var(--r-md)}
 .tall-card table.t td{white-space:nowrap}
 td.desc{max-width:320px;overflow:hidden;text-overflow:ellipsis}
 .tall-card table.t td.sec{color:var(--ink-3)}
 td.saldo{font-weight:750}
 .tall-card table.t td.saldo.pos{color:var(--warn)}
 .tall-card table.t td.saldo.neg{color:var(--err)}
 .tall-card table.t tr.neg-row>td{background:var(--err-soft)}
 .tall-card table.t td.kg{font-size:var(--fs-sm)}
 .flag{color:var(--warn);font-size:var(--fs-sm)}
 /* en pantalla ancha la tabla entra sin scroll de costado: el encabezado de columnas tambien queda
    pegado, justo debajo del nombre del tallerista (52px) */
 @media (min-width:1200px){
  .tall-card .table-wrap{overflow:visible}
  .tall-head{height:52px;flex-wrap:nowrap}
  .tall-card table.t>thead{top:calc(var(--bar-h) + 52px)}
 }
</style><link rel="icon" type="image/png" href="../../GP2_favicon.png">
<link rel="apple-touch-icon" href="../../GP2_favicon.png">
</head>
<body>
<div class="card">
<div class="header">
 <h1>Faltante Partes Tallerista<small>Saldo pendiente en poder del tallerista · GP2</small></h1>
 <div class="hbtns">
  <button class="hlink" type="button" id="btnCsv">⬇ Exportar CSV</button>
  <a href="../../GP2_MODULOS.html">Atrás</a>
 </div>
</div>
<div class="steps">
<div class="toolbar sel">
 <select id="fTall" style="display:none"><option value="">Todos</option></select>
 <input id="fBuscar" class="search" type="text" placeholder="Buscar código, descripción, sector…" aria-label="Buscar código, descripción o sector">
 <label class="chk"><input id="fSoloPos" type="checkbox"> Solo pendiente (saldo &gt; 0)</label>
</div>
<div id="tallChips" class="provs-grid"></div>
<div class="canvas" id="canvas"><div class="empty">Cargando…</div></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase-config.js?v=20260929a"></script>
<script src="../../gp2-ui.js?v=20260930a"></script>
<script src="../../gp2-numero.js?v=20260911o"></script>
<script>var D={};
var SB=GP2_SB();

var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function fmt(n){ return GP2N.fmt(n, 2); }   /* la regla de numero de la casa (gp2-numero.js) */
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}

function partesFiltradas(t,q,soloPos){
 var arr=t.partes||[];
 if(soloPos)arr=arr.filter(function(p){return Number(p.saldo||0)>0;});
 if(!q)return arr;
 return arr.filter(function(p){
  return norm(p.cod).indexOf(q)>=0||norm(p.desc).indexOf(q)>=0||norm(p.sector).indexOf(q)>=0;
 });
}

function __run(){
 var canvas=document.getElementById("canvas");
 var fTall=document.getElementById("fTall");
 var fBuscar=document.getElementById("fBuscar");
 var fSoloPos=document.getElementById("fSoloPos");

 // poblar dropdown de talleristas
 (D.talleristas||[]).forEach(function(t){
  var o=document.createElement("option");o.value=String(t.id);o.textContent=t.nombre;fTall.appendChild(o);
 });

 // chips de tallerista (estilo GP viejo)
 (function(){
  var cg=document.getElementById("tallChips"); if(!cg)return;
  function chip(val,label){
   var b=document.createElement("button"); b.className="prov-btn"+(fTall.value===val?" active":""); b.type="button";
   b.textContent=label;
   b.addEventListener("click",function(){
    fTall.value=val;
    cg.querySelectorAll(".prov-btn").forEach(function(x){x.classList.remove("active");});
    b.classList.add("active");
    fTall.dispatchEvent(new Event("change"));
   });
   cg.appendChild(b);
  }
  cg.innerHTML="";
  chip("","Todos");
  (D.talleristas||[]).forEach(function(t){ chip(String(t.id), t.nombre+(t.cod_prov?(" ("+t.cod_prov+")"):"")); });
 })();

 function render(){
  var tallSel=fTall.value;
  var q=norm(fBuscar.value.trim());
  var soloPos=fSoloPos.checked;
  var lista=(D.talleristas||[]).filter(function(t){return !tallSel||String(t.id)===tallSel;});

  var totPend=0,totNeg=0,totPares=0,hayFlag=false,vistos=0;
  var H="";

  lista.forEach(function(t){
   var partes=partesFiltradas(t,q,soloPos);
   if(!partes.length)return;
   vistos++;
   var sPend=0,sNeg=0;
   partes.forEach(function(p){
    var sal=Number(p.saldo||0);
    if(sal>0)sPend+=sal;else if(sal<0)sNeg+=sal;
    totPares++;
    if(p.kg_sin_factor)hayFlag=true;
   });
   totPend+=sPend;totNeg+=sNeg;

   var rows="";
   partes.forEach(function(p){
    var saldo=Number(p.saldo||0);
    var neg=saldo<0;
    var kgTxt=(p.enviado_kg&&Number(p.enviado_kg)>0)?(fmt(p.enviado_kg)+" kg"):"";
    rows+='<tr'+(neg?' class="neg-row"':'')+">"+
      '<td class="l cod">'+esc(p.cod)+(p.kg_sin_factor?' <span class="flag" title="envío en kg sin factor kg_x_uni">⚠</span>':'')+"</td>"+
      '<td class="l desc" title="'+esc(p.desc)+'">'+esc(p.desc)+"</td>"+
      '<td class="l sec">'+esc(p.sector)+"</td>"+
      '<td class="num env">'+fmt(p.enviado)+"</td>"+
      '<td class="num ent">'+fmt(p.entregado)+"</td>"+
      '<td class="num ent">'+fmt(p.devuelto)+"</td>"+
      '<td class="num saldo '+(neg?"neg":"pos")+'">'+fmt(saldo)+"</td>"+
      '<td class="num sec kg">'+kgTxt+"</td>"+
    "</tr>";
   });

   H+='<div class="tall-card">'+
     '<div class="tall-head sticky-sec">'+
       '<div><span class="nm">'+esc(t.nombre)+'</span>'+(t.cod_prov?'<span class="cod">'+esc(t.cod_prov)+'</span>':'')+' <span class="cod">· '+partes.length+' partes</span></div>'+
       '<div class="tot">'+
         '<span class="pill pend warn">Pendiente '+fmt(sPend)+'</span>'+
         '<span class="pill neg err">Negativo '+fmt(sNeg)+'</span>'+
         '<span class="pill '+((sPend+sNeg)<0?"neg err":"pos ok")+'">Saldo neto '+fmt(sPend+sNeg)+'</span>'+
       '</div>'+
     '</div>'+
     '<div class="tbl-wrap table-wrap libre"><table class="t"><thead><tr>'+
       '<th class="l">Código</th><th class="l">Descripción</th><th class="l">Sector</th>'+
       '<th class="num">Enviado (uni)</th><th class="num">Entregado (uni)</th><th class="num">Devuelto (uni)</th><th class="num">Saldo (uni)</th><th class="num">Env (kg)</th>'+
     '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '</div>';
  });

  var kpi='<div class="kpis">'+
    '<div class="kpi"><span class="k">talleristas</span><span class="v">'+vistos+'</span></div>'+
    '<div class="kpi"><span class="k">partes</span><span class="v">'+totPares+'</span></div>'+
    '<div class="kpi warn"><span class="k">pendiente en poder (uni)</span><span class="v">'+fmt(totPend)+'</span></div>'+
    '<div class="kpi err"><span class="k">saldo negativo (uni)</span><span class="v">'+fmt(totNeg)+'</span></div>'+
    '<div class="kpi"><span class="k">saldo neto (uni)</span><span class="v">'+fmt(totPend+totNeg)+'</span></div>'+
  '</div>';

  var note='<div class="aviso">📦 <b>Faltante = saldo pendiente en poder del tallerista</b> (enviado − entregado − devuelto). Positivo = todavía no lo devolvió; negativo = devolvió más de lo que figura enviado. ⚠ El ledger GP2 es <b>parcial</b>: falta cargar producción / stock inicial, por eso muchos saldos dan <b>negativos</b>. Es lo esperado en esta etapa — los datos se muestran tal cual, sin corregir. Enviado normalizado a unidades vía <code>kg_x_uni</code> (envíos originales mayormente en kg); entregas siempre en unidades.'+(hayFlag?' <b>⚠ Hay componentes con envío en kg sin factor de conversión</b> (marcados con ⚠, no sumados en unidades).':'')+'</div>';

  canvas.innerHTML=note+kpi+(H||'<div class="empty">Sin resultados para el filtro.</div>');
 }

 fTall.addEventListener("change",render);
 fBuscar.addEventListener("input",render);
 fSoloPos.addEventListener("change",render);

 document.getElementById("btnCsv").addEventListener("click",function(){
  var tallSel=fTall.value;
  var q=norm(fBuscar.value.trim());
  var soloPos=fSoloPos.checked;
  var lista=(D.talleristas||[]).filter(function(t){return !tallSel||String(t.id)===tallSel;});
  var out=[["Tallerista","Cod_Prov","Codigo","Descripcion","Sector","Enviado_uni","Entregado_uni","Devuelto_uni","Saldo_uni","Enviado_kg","kg_sin_factor"]];
  lista.forEach(function(t){
   partesFiltradas(t,q,soloPos).forEach(function(p){
    out.push([t.nombre,t.cod_prov||"",p.cod,p.desc,p.sector,p.enviado,p.entregado,p.devuelto,p.saldo,p.enviado_kg,p.kg_sin_factor?"SI":""]);
   });
  });
  var csv=out.map(function(r){return r.map(function(c){var s=String(c==null?"":c);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(";");}).join("\r\n");
  var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="faltante_partes_tallerista_"+GP2UI.hoyAR()+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
 });

 render();
}

async function __boot(){
 try{
  document.body.style.cursor="progress";
  var r=await SB.rpc("faltante_partes_tallerista_bundle");
  if(r.error)throw r.error;
  Object.assign(D,r.data);
  __run();
 }catch(e){
  document.getElementById("canvas").innerHTML='<div class="aviso err">Error cargando datos de Supabase: '+esc(e.message||e)+'</div>';
  console.error(e);
 }finally{document.body.style.cursor="";}
}
__boot();
</script>
<script src="../../gp2-menu.js?v=20261008ds"></script>
<script src="../../gp2-nav.js?v=20261008ds"></script>
</body></html>
