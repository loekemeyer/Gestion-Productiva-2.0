<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Control Partes Tallerista · GP2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../../gp2-modulo.css"/>
<link rel="icon" type="image/png" href="../../GP2_favicon.png">
<link rel="apple-touch-icon" href="../../GP2_favicon.png">
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Control Partes Tallerista</h1>
    <div class="hbtns">
      <button class="hlink hidden" id="btnVolver" type="button">← Cambiar tallerista</button>
      <button class="hlink hidden" id="btnImprimir" type="button">🖨 Imprimir</button>
      <a href="../Envios/EnviosTalleristas_GP2.html">Envío</a>
      <a href="../Recepcion/EntregasTalleristas_GP2.html">Entrega</a>
      <a href="../../GP2_MODULOS.html">Atrás</a>
    </div>
  </div>

  <div class="steps">

    <!-- FASE 0 — elegir tallerista -->
    <div id="fase0">
      <div class="row"><label class="lbl">Tallerista</label></div>
      <div class="provs-grid" id="tallGrid"></div>
      <div id="status" class="status">Cargando…</div>
    </div>

    <!-- FASE 1 — control -->
    <div id="fase1" class="hidden">
      <div class="row"><label class="lbl" id="fase1Title">Tallerista</label></div>

      <div class="kpis" id="kpis"></div>

      <div class="search-box no-print">
        <input type="text" id="q" placeholder="Buscar por sector, descripción o código…">
      </div>

      <div class="table-wrap">
        <table class="t">
          <thead>
            <tr>
              <th colspan="3">Base</th>
              <th colspan="3" class="num sep">Online</th>
              <th colspan="3" class="num sep">Movimientos (Uni)</th>
            </tr>
            <tr>
              <th>Sector</th>
              <th>Código</th>
              <th>Descripción</th>
              <th class="num sep">Kg</th>
              <th class="num">Caj</th>
              <th class="num">Uni</th>
              <th class="num sep">Envíos</th>
              <th class="num">Entregas</th>
              <th class="num">Saldo</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
      </div>
      <div id="tblEmpty" class="empty hidden">Este tallerista no tiene partes configuradas en ruta_paso.</div>
    </div>

  </div>
</div>

<script>
"use strict";

var SB = supabase.createClient(
  "https://hrxfctzncixxqmpfhskv.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs",
  { db:{ schema:"GP2" }, auth:{ persistSession:false } }
);

var $ = function(id){ return document.getElementById(id); };
var D = { tall:[], partes:{} };
var selT = null;

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmt(n,d){ d=(d==null?1:d);
  return Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:d}); }
function clsSaldo(n){ n=Number(n||0); return n>0?"pos":(n<0?"neg":"cero"); }

/* El control mira lo que el tallerista tiene EN SU PODER: las partes que
   se le mandan (lado entrada) mas las que devuelve (lado salida). */
function partesDe(tid){
  var o = (D.partes||{})[tid] || { entrada:[], salida:[] };
  var vistos = {}, out = [];
  (o.entrada||[]).concat(o.salida||[]).forEach(function(x){
    if (vistos[x.comp_id]) return;
    vistos[x.comp_id] = 1;
    out.push(x);
  });
  return out.sort(function(a,b){ return String(a.cod||"").localeCompare(String(b.cod||"")); });
}

async function cargar(){
  var r = await SB.rpc("talleristas_bundle");
  if (r.error){ $("status").textContent = "Error: "+r.error.message; return; }
  D = r.data || { tall:[], partes:{} };
  renderTall();
  $("status").textContent = (D.tall||[]).length + " talleristas.";
}

function renderTall(){
  var g = $("tallGrid"); g.innerHTML = "";
  (D.tall||[]).forEach(function(t){
    var n = partesDe(t.id).length;
    var b = document.createElement("button");
    b.type = "button"; b.className = "prov-btn";
    b.innerHTML = esc(t.nombre) + '<span class="meta">' + esc(t.cod_prov||"—") + " · " + n + " partes</span>";
    b.addEventListener("click", function(){ elegir(t); });
    g.appendChild(b);
  });
  if (!(D.tall||[]).length) g.innerHTML = '<div class="empty">Sin talleristas.</div>';
}

function elegir(t){
  selT = t;
  $("fase1Title").textContent = t.nombre + (t.cod_prov ? (" · cod " + t.cod_prov) : "");
  $("fase0").classList.add("hidden");
  $("fase1").classList.remove("hidden");
  $("btnVolver").classList.remove("hidden");
  $("btnImprimir").classList.remove("hidden");
  $("q").value = "";
  render();
}

function volver(){
  selT = null;
  $("fase1").classList.add("hidden");
  $("fase0").classList.remove("hidden");
  $("btnVolver").classList.add("hidden");
  $("btnImprimir").classList.add("hidden");
  renderTall();
}

function filtradas(){
  var arr = partesDe(selT.id);
  var q = String($("q").value||"").trim().toLowerCase();
  if (!q) return arr;
  return arr.filter(function(x){
    return (String(x.cod||"")+" "+String(x["desc"]||"")+" "+String(x.sector||"")).toLowerCase().indexOf(q) >= 0;
  });
}

function render(){
  var arr = filtradas(), tb = $("tbody");
  tb.innerHTML = "";
  $("tblEmpty").classList.toggle("hidden", arr.length>0);

  var totEnv=0, totEnt=0, totSal=0, totUni=0, totKg=0;

  arr.forEach(function(x){
    // online_tall viene en la unidad canonica del componente (uni para piezas)
    var uni = Number(x.online_tall||0);
    var kg  = x.kg_x_uni ? uni*Number(x.kg_x_uni) : null;
    var caj = x.uni_x_cajon ? uni/Number(x.uni_x_cajon) : null;

    totUni += uni; totKg += (kg||0);
    totEnv += Number(x.enviado||0);
    totEnt += Number(x.entregado||0);
    totSal += Number(x.saldo||0);

    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td>'+esc(x.sector||"—")+'</td>'+
      '<td><span class="cod">'+esc(x.cod)+'</span></td>'+
      '<td>'+esc(x["desc"]||"")+'</td>'+
      '<td class="num sep">'+(kg==null?"—":fmt(kg,2))+'</td>'+
      '<td class="num">'+(caj==null?"—":fmt(caj,2))+'</td>'+
      '<td class="num">'+fmt(uni,0)+'</td>'+
      '<td class="num sep">'+fmt(x.enviado,0)+'</td>'+
      '<td class="num">'+fmt(x.entregado,0)+'</td>'+
      '<td class="num '+clsSaldo(x.saldo)+'">'+fmt(x.saldo,0)+'</td>';
    tb.appendChild(tr);
  });

  $("tfoot").innerHTML = arr.length ? ('<tr>'+
    '<td colspan="3">'+arr.length+' partes</td>'+
    '<td class="num sep">'+fmt(totKg,2)+'</td><td class="num">—</td><td class="num">'+fmt(totUni,0)+'</td>'+
    '<td class="num sep">'+fmt(totEnv,0)+'</td><td class="num">'+fmt(totEnt,0)+'</td>'+
    '<td class="num '+clsSaldo(totSal)+'">'+fmt(totSal,0)+'</td></tr>') : "";

  $("kpis").innerHTML =
    '<div class="kpi"><div class="k">Partes</div><div class="v">'+arr.length+'</div></div>'+
    '<div class="kpi"><div class="k">Enviado</div><div class="v">'+fmt(totEnv,0)+'</div></div>'+
    '<div class="kpi"><div class="k">Entregado</div><div class="v">'+fmt(totEnt,0)+'</div></div>'+
    '<div class="kpi"><div class="k">Saldo</div><div class="v '+clsSaldo(totSal)+'">'+fmt(totSal,0)+'</div></div>';
}

$("q").addEventListener("input", render);
$("btnVolver").addEventListener("click", volver);
$("btnImprimir").addEventListener("click", function(){ window.print(); });

cargar().catch(function(e){ $("status").textContent = "Error: "+(e&&e.message?e.message:e); });
</script>
</body>
</html>
