<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Talleristas · GP2</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#0a0e13;color:#e6ecf3;font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
 .top{background:linear-gradient(90deg,#0f3d6b,#1a5a94);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
 .top h1{margin:0;font-size:16px}
 .top .sel{display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap}
 select,input,button{background:#0b1119;color:#e6ecf3;border:1px solid #2a4a6e;border-radius:6px;padding:6px 10px;font:13px inherit}
 input{width:200px}
 button{cursor:pointer}
 button:hover{background:#13233a}
 .canvas{padding:14px;min-height:calc(100vh - 50px)}
 .note{background:#2a1c14;border:1px solid #8a5a2f;color:#e0a075;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px}
 .kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
 .kpi{background:#101820;border:1px solid #1e2a38;border-radius:8px;padding:6px 12px;font-size:11px;color:#8fa2b6}
 .kpi b{color:#5fb0e8;font-size:15px;margin-right:4px}
 .tall-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:12px;overflow:hidden}
 .tall-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#eef4fb;border-bottom:1px solid #e2e8f0;cursor:pointer}
 .tall-head .nm{font-size:14px;font-weight:800;color:#1e293b}
 .tall-head .cod{font-size:11px;color:#64748b;font-weight:400;margin-left:6px}
 .tall-head .tot{display:flex;gap:6px;flex-wrap:wrap}
 .pill{padding:2px 10px;border-radius:10px;font-weight:700;font-size:12px;background:#f1f5f9;border:1px solid #e2e8f0}
 .pill.env{color:#15803d}
 .pill.ent{color:#1d6fb8}
 .pill.pos{color:#15803d;background:#dcfce7;border-color:#bbf7d0}
 .pill.neg{color:#dc2626;background:#fee2e2;border-color:#fecaca}
 .tbl-wrap{overflow-x:auto}
 table{width:100%;border-collapse:collapse;font-size:12px}
 th,td{padding:6px 10px;text-align:right;border-bottom:1px solid #1a2532;white-space:nowrap}
 th{background:#f1f5f9;color:#475569;text-transform:uppercase;font-size:10px;letter-spacing:.4px}
 th.l,td.l{text-align:left}
 td.cod{font-family:ui-monospace,SF Mono,monospace;color:#1d4ed8 !important;font-weight:600}
 td.desc{color:#1e293b !important;max-width:320px;overflow:hidden;text-overflow:ellipsis}
 td.sec{color:#64748b !important}
 td.env{color:#15803d !important}
 td.ent{color:#1d6fb8 !important}
 td.saldo{font-weight:700}
 td.saldo.pos{color:#15803d !important}
 td.saldo.neg{color:#dc2626 !important}
 .flag{color:#b45309;font-size:10px}
 .empty{padding:30px;text-align:center;color:#7a92a8}
 .hidden{display:none}
</style><link rel="icon" type="image/png" href="../../GP2_favicon.png">
<link rel="apple-touch-icon" href="../../GP2_favicon.png">
<link rel="stylesheet" href="../../gp2-claro.css">
</head>
<body>
<div id="gp2-logobar" style="background:#0b1220;text-align:center;padding:6px 0;border-bottom:1px solid #1c2836"><a href="../../GP2_MODULOS.html" style="text-decoration:none"><img src="../../GP2_logo.png" alt="GP2 · Gestión Productiva" style="height:40px;vertical-align:middle"></a></div>

<div class="top">
 <h1>🧵 Control Talleristas <span style="font-size:11px;color:#9fc0e0;font-weight:400">· GP2</span></h1>
 <div class="sel">
  <select id="fTall" style="display:none"><option value="">Todos</option></select>
  <input id="fBuscar" type="text" placeholder="Buscar código, descripción, sector…">
  <button id="btnCsv">⬇ Exportar CSV</button>
 </div>
</div>
<div id="tallChips" class="provs-grid" style="display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 0"></div>
<div class="canvas" id="canvas"><div class="empty">Cargando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>var D={};
var SB=window.supabase.createClient('https://hrxfctzncixxqmpfhskv.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs',{db:{schema:'GP2'}});

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(n){n=Number(n||0);return n.toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:2});}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}

function partesFiltradas(t,q){
 if(!q)return t.partes;
 return t.partes.filter(function(p){
  return norm(p.cod).indexOf(q)>=0||norm(p.desc).indexOf(q)>=0||norm(p.sector).indexOf(q)>=0;
 });
}

function __run(){
 var canvas=document.getElementById("canvas");
 var fTall=document.getElementById("fTall");
 var fBuscar=document.getElementById("fBuscar");

 // poblar dropdown de talleristas
 (D.talleristas||[]).forEach(function(t){
  var o=document.createElement("option");o.value=String(t.id);o.textContent=t.nombre;fTall.appendChild(o);
 });

 // chips de tallerista (estilo GP viejo)
 (function(){
  var cg=document.getElementById("tallChips"); if(!cg)return;
  function chip(val,label){
   var b=document.createElement("button"); b.className="prov-btn"+(fTall.value===val?" active":""); b.type="button";
   b.textContent=label;
   b.addEventListener("click",function(){
    fTall.value=val;
    cg.querySelectorAll(".prov-btn").forEach(function(x){x.classList.remove("active");});
    b.classList.add("active");
    fTall.dispatchEvent(new Event("change"));
   });
   cg.appendChild(b);
  }
  cg.innerHTML="";
  chip("","Todos");
  (D.talleristas||[]).forEach(function(t){ chip(String(t.id), t.nombre+(t.cod_prov?(" ("+t.cod_prov+")"):"")); });
 })();

 function render(){
  var tallSel=fTall.value;
  var q=norm(fBuscar.value.trim());
  var lista=(D.talleristas||[]).filter(function(t){return !tallSel||String(t.id)===tallSel;});

  var totEnv=0,totEnt=0,totPares=0,hayFlag=false;
  var H="";
  var vistos=0;

  lista.forEach(function(t){
   var partes=partesFiltradas(t,q);
   if(!partes.length)return;
   vistos++;
   var sEnv=0,sEnt=0;
   partes.forEach(function(p){sEnv+=Number(p.enviado||0);sEnt+=Number(p.entregado||0);totPares++;if(p.kg_sin_factor)hayFlag=true;});
   var sSaldo=sEnv-sEnt;
   totEnv+=sEnv;totEnt+=sEnt;

   var rows="";
   partes.forEach(function(p){
    var saldo=Number(p.saldo||0);
    var kgTxt=(p.enviado_kg&&Number(p.enviado_kg)>0)?(fmt(p.enviado_kg)+" kg"):"";
    rows+="<tr>"+
      '<td class="l cod">'+esc(p.cod)+(p.kg_sin_factor?' <span class="flag" title="envío en kg sin factor kg_x_uni">⚠</span>':'')+"</td>"+
      '<td class="l desc" title="'+esc(p.desc)+'">'+esc(p.desc)+"</td>"+
      '<td class="l sec">'+esc(p.sector)+"</td>"+
      '<td class="env">'+fmt(p.enviado)+"</td>"+
      '<td class="ent">'+fmt(p.entregado)+"</td>"+
      '<td class="saldo '+(saldo<0?"neg":"pos")+'">'+fmt(saldo)+"</td>"+
      '<td class="sec" style="font-size:11px">'+kgTxt+"</td>"+
    "</tr>";
   });

   H+='<div class="tall-card">'+
     '<div class="tall-head">'+
       '<div><span class="nm">'+esc(t.nombre)+'</span>'+(t.cod_prov?'<span class="cod">'+esc(t.cod_prov)+'</span>':'')+' <span class="cod">· '+partes.length+' partes</span></div>'+
       '<div class="tot">'+
         '<span class="pill env">Env '+fmt(sEnv)+'</span>'+
         '<span class="pill ent">Ent '+fmt(sEnt)+'</span>'+
         '<span class="pill '+(sSaldo<0?"neg":"pos")+'">Saldo '+fmt(sSaldo)+'</span>'+
       '</div>'+
     '</div>'+
     '<div class="tbl-wrap"><table><thead><tr>'+
       '<th class="l">Código</th><th class="l">Descripción</th><th class="l">Sector</th>'+
       '<th>Enviado (uni)</th><th>Entregado (uni)</th><th>Saldo (uni)</th><th>Env (kg)</th>'+
     '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '</div>';
  });

  var kpi='<div class="kpis">'+
    '<div class="kpi"><b>'+vistos+'</b>talleristas</div>'+
    '<div class="kpi"><b>'+totPares+'</b>partes</div>'+
    '<div class="kpi"><b>'+fmt(totEnv)+'</b>enviado (uni)</div>'+
    '<div class="kpi"><b>'+fmt(totEnt)+'</b>entregado (uni)</div>'+
    '<div class="kpi"><b>'+fmt(totEnv-totEnt)+'</b>saldo (uni)</div>'+
  '</div>';

  var note='<div class="note">⚠ El ledger GP2 es <b>parcial</b>: falta cargar producción / stock inicial, por eso muchos saldos dan <b>negativos</b> (se entregó más de lo que figura enviado). Es lo esperado en esta etapa — los datos se muestran tal cual, sin corregir. Enviado normalizado a unidades vía <code>kg_x_uni</code> (envíos originales mayormente en kg); entregas siempre en unidades.'+(hayFlag?' <b>⚠ Hay componentes con envío en kg sin factor de conversión</b> (marcados con ⚠, no sumados en unidades).':'')+'</div>';

  canvas.innerHTML=note+kpi+(H||'<div class="empty">Sin resultados para el filtro.</div>');
 }

 fTall.addEventListener("change",render);
 fBuscar.addEventListener("input",render);

 document.getElementById("btnCsv").addEventListener("click",function(){
  var tallSel=fTall.value;
  var q=norm(fBuscar.value.trim());
  var lista=(D.talleristas||[]).filter(function(t){return !tallSel||String(t.id)===tallSel;});
  var out=[["Tallerista","Cod_Prov","Codigo","Descripcion","Sector","Enviado_uni","Entregado_uni","Saldo_uni","Enviado_kg","kg_sin_factor"]];
  lista.forEach(function(t){
   partesFiltradas(t,q).forEach(function(p){
    out.push([t.nombre,t.cod_prov||"",p.cod,p.desc,p.sector,p.enviado,p.entregado,p.saldo,p.enviado_kg,p.kg_sin_factor?"SI":""]);
   });
  });
  var csv=out.map(function(r){return r.map(function(c){var s=String(c==null?"":c);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(";");}).join("\r\n");
  var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="control_talleristas_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
 });

 render();
}

async function __boot(){
 try{
  document.body.style.cursor="progress";
  var r=await SB.rpc("control_talleristas_bundle");
  if(r.error)throw r.error;
  Object.assign(D,r.data);
  __run();
 }catch(e){
  document.getElementById("canvas").innerHTML='<div class="empty" style="color:#f0846b">Error cargando datos de Supabase: '+esc(e.message||e)+'</div>';
  console.error(e);
 }finally{document.body.style.cursor="";}
}
__boot();
</script>
</body></html>
