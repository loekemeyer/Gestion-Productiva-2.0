<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Trazado de Rutas (GP2)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      *{box-sizing:border-box}
      body{margin:0;background:#f1f5f9;color:#0f172a;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
      .verif-page{padding:20px;max-width:1200px;margin:0 auto}
      .verif-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 24px}
      h1{margin:0 0 4px;font-size:22px}
      .subtitulo{color:#475569;font-size:13px;margin:4px 0 14px}
      .toolbar{display:flex;gap:12px;margin:14px 0;align-items:center;flex-wrap:wrap}
      .toolbar input[type=text],.toolbar select{padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
      .toolbar input[type=text]{flex:1;min-width:220px}
      .toolbar label{font-size:13px;color:#334155;display:flex;gap:6px;align-items:center}
      .btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
      .btn-csv{background:#fff;color:#334155;border:1px solid #cbd5e1}
      .status{color:#475569;font-size:13px;margin:6px 0}
      .ruta-card{margin:10px 0;padding:12px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:10px}
      .ruta-card.incompleta{border-left:4px solid #fbbf24}
      .rc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
      .rc-head b{font-size:14px}
      .rc-head .fam{color:#2563eb;font-size:12px;margin-left:6px}
      .rc-head .desc{color:#64748b;font-size:12px;margin-left:6px}
      .badge{padding:2px 8px;border-radius:10px;font-size:11px;margin-left:8px}
      .badge.ok{background:#dcfce7;color:#166534}
      .badge.inc{background:#fee2e2;color:#b42318}
      .ruta-flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;overflow-x:auto;padding-bottom:2px}
      .node{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;color:#fff;padding:4px 10px;border-radius:6px;line-height:1.2;flex-shrink:0}
      .node .nm{font-size:12px;font-weight:600;white-space:nowrap}
      .node .sub{font-size:10px;opacity:.92;font-weight:400;white-space:nowrap}
      .sep{color:#64748b;margin:0 3px;align-self:center}
      details.mov{margin-top:10px;padding:8px 10px;background:#f8fafc;border-radius:6px;border:1px dashed #cbd5e1;font-size:12px;color:#334155}
      details.mov summary{cursor:pointer;font-weight:600;color:#475569}
      .empty{color:#64748b;padding:20px;text-align:center}
      /* tabs */
      .tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid #e2e8f0;padding-bottom:0}
      .tab-btn{padding:8px 16px;border:none;border-radius:8px 8px 0 0;background:#f1f5f9;color:#334155;cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
      .tab-btn.active{background:#fff;border:2px solid #e2e8f0;border-bottom-color:#fff;color:#0f172a}
      .rc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
      .btn-conf{padding:4px 12px;border-radius:6px;border:1px solid #cbd5e1;font-size:12px;cursor:pointer;font-weight:600}
      .btn-conf.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}
      .btn-conf.pin{background:#fef3c7;color:#92400e;border-color:#fde68a}
      .btn-conf.warn{background:#fee2e2;color:#b42318;border-color:#fecaca}
      .btn-conf.resolve{background:#f0f9ff;color:#0369a1;border-color:#bae6fd}
      .badge.conf{background:#dcfce7;color:#166534}
      .badge.pin{background:#fef3c7;color:#92400e}
      .badge.warn{background:#fee2e2;color:#b42318}
      .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200}
      .modal-bg.on{display:flex}
      .modal-box{background:#fff;border-radius:12px;padding:24px;max-width:420px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.2)}
      .modal-box h3{margin:0 0 12px;font-size:16px}
      .modal-box textarea{width:100%;height:80px;border:1.5px solid #cbd5e1;border-radius:8px;padding:8px;font-size:14px;resize:vertical}
      .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
      .modal-actions button{padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer}
      .modal-ok{background:#111;color:#fff} .modal-cancel{background:#f1f5f9;color:#334155}
      .usuario-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
      .usuario-row input{padding:5px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;width:160px}
      .prob-item{margin-top:8px;padding:8px 10px;background:#fef2f2;border-radius:6px;border:1px solid #fecaca;font-size:12px;color:#991b1b}
      .prob-item .prob-meta{color:#64748b;font-size:11px;margin-top:4px}
    </style>
  <link rel="icon" type="image/png" href="../GP2_favicon.png">
<link rel="apple-touch-icon" href="../GP2_favicon.png">
<link rel="stylesheet" href="../gp2-claro.css">
</head>
  <body>
<div id="gp2-logobar" style="background:#0b1220;text-align:center;padding:6px 0;border-bottom:1px solid #1c2836"><a href="../GP2_MODULOS.html" style="text-decoration:none"><img src="../GP2_logo.png" alt="GP2 · Gestión Productiva" style="height:40px;vertical-align:middle"></a></div>

    <div class="verif-page">
      <div class="verif-card">
        <h1>Verificación · Trazado de Rutas <span style="font-size:12px;color:#2563eb;font-weight:600">GP2</span></h1>
        <p class="subtitulo">
          Cada ruta va del <b>Fleje</b> al <b>Artículo terminado</b> siguiendo la secuencia normalizada de pasos
          (ingreso → matriz → proveedor de servicio / insumo → tallerista → Virgilio).
        </p>

        <div class="usuario-row">
          <span>Usuario:</span>
          <input id="inpUsuario" type="text" placeholder="tu nombre">
        </div>
        <div class="tabs" id="tabs">
          <button class="tab-btn active" data-tab="trazar" onclick="setTab('trazar')">Trazar Rutas</button>
          <button class="tab-btn" data-tab="confirmadas" onclick="setTab('confirmadas')">✅ Confirmadas <span id="cntConf">(0)</span></button>
          <button class="tab-btn" data-tab="revisar" onclick="setTab('revisar')">📌 Revisar <span id="cntRev">(0)</span></button>
          <button class="tab-btn" data-tab="problemas" onclick="setTab('problemas')">⚠ Problemas <span id="cntProb">(0)</span></button>
        </div>

        <div class="toolbar">
          <input id="buscar" type="text" placeholder="Buscar artículo, fleje, matriz, proveedor, tallerista, sector..." oninput="filtrar()" />
          <select id="famFilter" onchange="filtrar()"><option value="">Todas las familias</option></select>
          <label><input id="soloIncompletas" type="checkbox" onchange="filtrar()" /> Solo rutas incompletas</label>
          <button class="btn btn-csv" onclick="exportarCSV()">📥 CSV</button>
        </div>

        <div id="status" class="status">Cargando rutas...</div>
        <div id="lista"></div>
      </div>
    </div>

    <div class="modal-bg" id="modalBg">
      <div class="modal-box">
        <h3>Reportar problema en esta ruta</h3>
        <textarea id="modalTxt" placeholder="Describí el problema que encontraste…"></textarea>
        <div class="modal-actions">
          <button class="modal-cancel" onclick="cerrarModal()">Cancelar</button>
          <button class="modal-ok" onclick="enviarReporte()">Reportar</button>
        </div>
      </div>
    </div>

    <script>var D={};var TAB='trazar';var MODAL_IDX=-1;

var SB=window.supabase.createClient(
  'https://hrxfctzncixxqmpfhskv.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs',
  {db:{schema:'GP2'}}
);

function __run(){
  function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}
  function norm(s){return String(s==null?"":s).trim().toUpperCase();}

  var CONFIRMADAS=new Set();
  var PROBLEMAS_MAP={};
  (D.confirmadas||[]).forEach(function(c){CONFIRMADAS.add(c.firma);});
  (D.problemas||[]).forEach(function(p){
    if(!PROBLEMAS_MAP[p.firma])PROBLEMAS_MAP[p.firma]=[];
    PROBLEMAS_MAP[p.firma].push(p);
  });

  function makeFirma(r,pasos){
    var parts=['F:'+(r.fleje||'?')];
    pasos.forEach(function(p){parts.push((p.tp||'?')+':'+(p.actor||p.cs||p.ce||''));});
    return parts.join('|');
  }

  var RUTAS=(D.rutas||[]).map(function(r,idx){
    var pasos=r.pasos||[];
    var completa=pasos.some(function(p){return p.tp==="virgilio"||p.tp==="tallerista";});
    var firma=makeFirma(r,pasos);
    var txt=norm([r.art,r.fam,r.fleje,r.fleje_desc,r.nom].concat(
      pasos.map(function(p){return [p.actor,p.actor_desc,p.ce,p.ce_d,p.cs,p.cs_d,p.ce_sect,p.cs_sect,p.tp].join(" ");})
    ).join(" "));
    return {r:r,pasos:pasos,completa:completa,firma:firma,txt:txt,idx:idx};
  });

  var fams={};
  RUTAS.forEach(function(x){if(x.r.fam)fams[x.r.fam]=1;});
  var sel=document.getElementById("famFilter");
  Object.keys(fams).sort().forEach(function(f){
    var o=document.createElement("option");o.value=f;o.textContent=f;sel.appendChild(o);
  });

  var c=(D.counts||{});
  document.getElementById("status").textContent=(c.rutas||RUTAS.length)+" rutas · "+(c.arts||"?")+" artículos · "+(c.pasos||"?")+" pasos trazados.";

  var COLORES={
    ingreso:{bg:"#6366f1",icon:"🔩",tp:"Ingreso"},
    matriz:{bg:"#f59e0b",icon:"⚙️",tp:"Matriz"},
    insumo:{bg:"#b45309",icon:"🧩",tp:"Insumo"},
    proveedor_servicio:{bg:"#f43f5e",icon:"🏭",tp:"Proveedor"},
    tallerista:{bg:"#8b5cf6",icon:"👷",tp:"Tallerista"},
    virgilio:{bg:"#10b981",icon:"✅",tp:"Virgilio"},
    otro:{bg:"#64748b",icon:"•",tp:""}
  };

  function nodo(p){
    var col=COLORES[p.tp]||COLORES.otro;
    var label;
    if(p.actor) label=col.icon+" "+p.actor;
    else if(p.tp==="virgilio") label=col.icon+" Art "+(p.art||p.ce||"");
    else if(p.tp==="ingreso") label=col.icon+" "+(p.ce||"");
    else label=col.icon+" "+(p.cs||p.ce||"");
    var subParts=[];
    if(p.cs&&p.tp!=="ingreso") subParts.push(p.cs);
    var d=p.cs_d||p.actor_desc||p.ce_d||"";
    if(d) subParts.push(d);
    var sub=subParts.join(" · ");
    return '<span class="node" style="background:'+col.bg+'">'+
      '<span class="nm">'+esc(label)+'</span>'+
      (sub?'<span class="sub">'+esc(sub)+'</span>':'')+
      '</span>';
  }

  function renderFlow(pasos){
    return '<div class="ruta-flow">'+pasos.map(nodo).join('<span class="sep">›</span>')+'</div>';
  }

  function renderMov(pasos){
    var mov=[];
    pasos.forEach(function(p){
      if(p.tp==="proveedor_servicio"){
        mov.push('🏭 <b>Envío a '+esc(p.actor||"PS")+'</b> ('+esc(p.actor_desc||"")+'): descuenta <b>'+esc(p.ce||"?")+'</b> → suma stock del proveedor.'+
          '<br>&nbsp;&nbsp;&nbsp;<b>Entrega</b>: descuenta stock del proveedor → suma <b>'+esc(p.cs||"?")+'</b>.');
      } else if(p.tp==="tallerista"){
        mov.push('👷 <b>Envío a '+esc(p.actor||"tallerista")+'</b>: descuenta <b>'+esc(p.ce||"?")+'</b> → suma stock del tallerista.'+
          '<br>&nbsp;&nbsp;&nbsp;<b>Entrega</b>: descuenta stock del tallerista → suma <b>'+esc(p.cs||"?")+'</b>.');
      } else if(p.tp==="matriz"){
        mov.push('⚙️ <b>Matriz '+esc(p.actor||"?")+'</b> ('+esc(p.actor_desc||"")+'): transforma <b>'+esc(p.ce||"?")+'</b> → <b>'+esc(p.cs||"?")+'</b>.');
      }
    });
    if(!mov.length) return "";
    return '<details class="mov"><summary>Ver movimientos de stock que implica esta ruta</summary>'+
      '<div style="margin-top:6px;line-height:1.6">'+mov.join("<br>")+'</div></details>';
  }

  function rutaEstado(firma){
    if(CONFIRMADAS.has(firma)) return 'conf';
    var probs=PROBLEMAS_MAP[firma]||[];
    var pendientes=probs.filter(function(p){return p.estado==='pendiente';});
    if(pendientes.length) return 'warn';
    var resueltos=probs.filter(function(p){return p.estado==='resuelto';});
    if(resueltos.length) return 'pin';
    return '';
  }

  function updateCounts(){
    var nConf=RUTAS.filter(function(x){return rutaEstado(x.firma)==='conf';}).length;
    var nWarn=RUTAS.filter(function(x){return rutaEstado(x.firma)==='warn';}).length;
    var nPin=RUTAS.filter(function(x){return rutaEstado(x.firma)==='pin';}).length;
    var el;
    el=document.getElementById("cntConf");if(el)el.textContent='('+nConf+')';
    el=document.getElementById("cntRev");if(el)el.textContent='('+nPin+')';
    el=document.getElementById("cntProb");if(el)el.textContent='('+nWarn+')';
  }

  function renderProbs(firma){
    var probs=PROBLEMAS_MAP[firma]||[];
    if(!probs.length) return '';
    return probs.map(function(p){
      var res=p.estado==='resuelto'?'<span style="color:#166534">✅ Resuelto</span> · ':'';
      var btnRes=p.estado==='pendiente'?'<button class="btn-conf resolve" data-resolver="'+p.id+'">Marcar resuelto</button>':'';
      return '<div class="prob-item">'+res+esc(p.problema)+
        '<div class="prob-meta">Reportado por '+esc(p.reportado_por)+' · '+new Date(p.reportado_en).toLocaleDateString('es-AR')+'</div>'+
        (btnRes?'<div style="margin-top:4px">'+btnRes+'</div>':'')+
        '</div>';
    }).join('');
  }

  function renderCard(x){
    var r=x.r;
    var estado=rutaEstado(x.firma);
    var badgeInc=x.completa?'<span class="badge ok">OK</span>':'<span class="badge inc">Incompleta</span>';
    var badgeEst='';
    if(estado==='conf') badgeEst='<span class="badge conf">✅ Confirmada</span>';
    else if(estado==='warn') badgeEst='<span class="badge warn">⚠ Problema</span>';
    else if(estado==='pin') badgeEst='<span class="badge pin">📌 Revisar</span>';
    var actions='<div class="rc-actions">'+
      '<button class="btn-conf ok" data-ridx="'+x.idx+'" data-act="conf">✅ Confirmar</button>'+
      '<button class="btn-conf pin" data-ridx="'+x.idx+'" data-act="pin">📌 Revisar después</button>'+
      '<button class="btn-conf warn" data-ridx="'+x.idx+'" data-act="warn">⚠ Reportar problema</button>'+
      '</div>';
    return '<div class="ruta-card'+(x.completa?'':' incompleta')+'">'+
      '<div class="rc-head"><div>'+
        '<b>Art '+esc(r.art||"?")+'</b>'+
        (r.fam?'<span class="fam">'+esc(r.fam)+'</span>':'')+
        '<span class="desc">Fleje '+esc(r.fleje||"?")+(r.fleje_desc?' · '+esc(r.fleje_desc):'')+'</span>'+
        badgeInc+badgeEst+
      '</div></div>'+
      renderFlow(x.pasos)+
      renderMov(x.pasos)+
      actions+
      renderProbs(x.firma)+
    '</div>';
  }

  function reattach(){
    var lista=document.getElementById('lista');
    lista.addEventListener('click',function handler(e){
      lista.removeEventListener('click',handler);
      var btn=e.target.closest('[data-act]');
      if(btn){
        var idx=parseInt(btn.getAttribute('data-ridx'),10);
        var act=btn.getAttribute('data-act');
        var x=RUTAS[idx];
        if(!x) return;
        if(act==='conf') window.confirmarRuta(x);
        else if(act==='pin') window.marcarRevisar(x);
        else if(act==='warn') window.abrirReporte(x);
        return;
      }
      var res=e.target.closest('[data-resolver]');
      if(res){
        var id=parseInt(res.getAttribute('data-resolver'),10);
        window.resolverProblema(id);
      }
    });
  }

  function getUsuario(){
    var inp=document.getElementById('inpUsuario');
    var u=(inp&&inp.value.trim())||localStorage.getItem('gp2_usuario')||'';
    if(u&&inp) try{localStorage.setItem('gp2_usuario',u);}catch(e){}
    return u||'(sin nombre)';
  }

  window.setTab=function(tab){
    TAB=tab;
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.classList.toggle('active',b.getAttribute('data-tab')===tab);
    });
    var si=document.getElementById('soloIncompletas');
    var showExtra=(tab==='trazar');
    if(si) si.parentElement.style.display=showExtra?'':'none';
    window.filtrar();
  };

  var VISIBLES=[];
  window.filtrar=function(){
    var q=norm((document.getElementById('buscar')||{}).value||"");
    var fam=(document.getElementById('famFilter')||{}).value||"";
    var soloInc=(document.getElementById('soloIncompletas')||{}).checked;
    VISIBLES=RUTAS.filter(function(x){
      var estado=rutaEstado(x.firma);
      if(TAB==='confirmadas') return estado==='conf';
      if(TAB==='revisar') return estado==='pin';
      if(TAB==='problemas') return estado==='warn';
      if(soloInc&&x.completa) return false;
      if(fam&&x.r.fam!==fam) return false;
      if(q&&x.txt.indexOf(q)<0) return false;
      return true;
    });
    var cont=document.getElementById('lista');
    cont.innerHTML=VISIBLES.length?VISIBLES.map(renderCard).join(""):'<p class="empty">Sin resultados.</p>';
    var stEl=document.getElementById('status');
    if(TAB==='trazar'){
      stEl.textContent=VISIBLES.length+" de "+RUTAS.length+" rutas mostradas.";
    } else {
      stEl.textContent=VISIBLES.length+" ruta(s) en esta pestaña.";
    }
    reattach();
    updateCounts();
  };

  window.exportarCSV=function(){
    if(!VISIBLES.length){alert("No hay datos para exportar.");return;}
    var filas=[["Articulo","Familia","Fleje","Descripcion Fleje","Pasos","Completa","Estado"]];
    VISIBLES.forEach(function(x){
      var r=x.r;
      var pasosTxt=x.pasos.map(function(p){
        var who=p.actor||p.cs||p.ce||"";
        return (COLORES[p.tp]||COLORES.otro).tp+":"+who;
      }).join(" -> ");
      filas.push([r.art||"",r.fam||"",r.fleje||"",r.fleje_desc||"",pasosTxt,x.completa?"Si":"No",rutaEstado(x.firma)||"pendiente"]);
    });
    var csv=filas.map(function(row){
      return row.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(",");
    }).join("\r\n");
    var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download="rutas_gp2_"+new Date().toISOString().slice(0,10)+".csv";a.click();
    URL.revokeObjectURL(url);
  };

  window.confirmarRuta=async function(x){
    var u=getUsuario();
    var r=await SB.rpc('ruta_confirmar',{p_firma:x.firma,p_articulo:x.r.art||'',p_fleje:x.r.fleje||'',p_usuario:u});
    if(r.error){alert('Error: '+r.error.message);return;}
    CONFIRMADAS.add(x.firma);
    delete PROBLEMAS_MAP[x.firma];
    window.filtrar();
  };

  window.marcarRevisar=async function(x){
    var u=getUsuario();
    var r=await SB.rpc('ruta_reportar',{p_firma:x.firma,p_articulo:x.r.art||'',p_fleje:x.r.fleje||'',p_problema:'(pendiente de revisar)',p_usuario:u});
    if(r.error){alert('Error: '+r.error.message);return;}
    CONFIRMADAS.delete(x.firma);
    if(!PROBLEMAS_MAP[x.firma])PROBLEMAS_MAP[x.firma]=[];
    PROBLEMAS_MAP[x.firma].push({id:r.data,firma:x.firma,problema:'(pendiente de revisar)',estado:'pendiente',reportado_por:u,reportado_en:new Date().toISOString()});
    window.filtrar();
  };

  window.abrirReporte=function(x){
    MODAL_IDX=x.idx;
    document.getElementById('modalBg').classList.add('on');
    document.getElementById('modalTxt').value='';
    setTimeout(function(){document.getElementById('modalTxt').focus();},50);
  };

  window.cerrarModal=function(){
    document.getElementById('modalBg').classList.remove('on');
    MODAL_IDX=-1;
  };

  window.enviarReporte=async function(){
    var x=RUTAS[MODAL_IDX];
    if(!x){window.cerrarModal();return;}
    var prob=document.getElementById('modalTxt').value.trim();
    if(!prob){alert('Describí el problema.');return;}
    var u=getUsuario();
    window.cerrarModal();
    var r=await SB.rpc('ruta_reportar',{p_firma:x.firma,p_articulo:x.r.art||'',p_fleje:x.r.fleje||'',p_problema:prob,p_usuario:u});
    if(r.error){alert('Error: '+r.error.message);return;}
    CONFIRMADAS.delete(x.firma);
    if(!PROBLEMAS_MAP[x.firma])PROBLEMAS_MAP[x.firma]=[];
    PROBLEMAS_MAP[x.firma].push({id:r.data,firma:x.firma,problema:prob,estado:'pendiente',reportado_por:u,reportado_en:new Date().toISOString()});
    window.filtrar();
  };

  window.resolverProblema=async function(id){
    var r=await SB.rpc('ruta_resolver',{p_id:id});
    if(r.error){alert('Error: '+r.error.message);return;}
    Object.keys(PROBLEMAS_MAP).forEach(function(firma){
      PROBLEMAS_MAP[firma].forEach(function(p){if(p.id===id)p.estado='resuelto';});
    });
    window.filtrar();
  };

  var savedU=localStorage.getItem('gp2_usuario');
  if(savedU){var inp=document.getElementById('inpUsuario');if(inp)inp.value=savedU;}

  updateCounts();
  window.filtrar();
}

async function __boot(){
  try{
    var r=await SB.rpc('verificacion_bundle');
    if(r.error) throw r.error;
    Object.assign(D,r.data||{});
    __run();
  }catch(e){
    console.error(e);
    var s=document.getElementById("status");
    if(s) s.textContent="Error cargando rutas: "+(e.message||e);
  }
}
__boot();
    </script>
  </body>
</html>
