    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 21px 18px;
      min-height: 100vh;
      color: #1e293b;
    }

    .page-layout {
      position: relative;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      flex: 1 1 390px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 23px;
      padding: 24px 21px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f1f5f9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    h2::after {
      content: '▲';
      font-size: 12px;
      color: #94a3b8;
      transition: transform 0.3s;
      position: absolute;
      right: 4px;
    }
    h2.collapsed::after {
      transform: rotate(180deg);
    }

    .card-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .botones {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: center;
      overflow: hidden;
      max-height: 500px;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      opacity: 1;
    }
    .botones.collapsed {
      max-height: 0;
      opacity: 0;
    }

    .btn-opcion {
      width: 100%;
      max-width: 312px;
      height: 47px;
      border-radius: 14px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #1e293b;
    }

    .btn-opcion:hover {
      border-color: #111;
      background: #111;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(17, 17, 17, 0.15);
    }

  <script>

  <script src="../version.js?v=20260828h"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.querySelectorAll(".btn-opcion").forEach(btn => {
      btn.addEventListener("click", () => {
        window.location.href = btn.dataset.link;
      });
    });

    // MIGRADO a schema GP2: la data viva del dashboard sale del RPC "GP2".inicio_bundle()
    // (deriva de "GP2".produccion y "GP2".matriz, espejo de la produccion vieja).
    // Devuelve: dia {uni,registros,empleados,matrices}, mes {...}, alertas {disruptivas_mes, matrices_sin_tiempo}.
    const sb = supabase.createClient(
      "https://hrxfctzncixxqmpfhskv.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs",
      { db: { schema: 'GP2' } }
    );


    // Un solo RPC trae toda la data viva del dashboard (KPIs dia/mes + alertas).
    (async () => {
      try {
        const { data: bundle, error } = await sb.rpc("inicio_bundle");
        if (error) { console.error(error); return; }
        if (!bundle) return;

        // --- Badge disruptivas pendientes del mes ---
        const nDisrup = Number(bundle.alertas && bundle.alertas.disruptivas_mes) || 0;
        const btn = document.getElementById("btnDisruptivas");
        if (btn && nDisrup > 0) btn.textContent = `Producciones Disruptivas (${nDisrup})`;

        // --- KPIs resumen (dia/mes) inyectados en la barra de version ---
        const d = bundle.dia || {}, m = bundle.mes || {};
        const kpi = document.getElementById("kpiResumen");
        if (kpi) {
          const fmt = (v) => Number(v || 0).toLocaleString("es-AR");
          kpi.innerHTML =
            `Hoy: <strong>${fmt(d.uni)}</strong> uni · ${fmt(d.registros)} reg · ${fmt(d.empleados)} oper` +
            ` &nbsp;|&nbsp; Mes: <strong>${fmt(m.uni)}</strong> uni · ${fmt(m.registros)} reg · ${fmt(m.empleados)} oper`;
        }
      } catch (e) { console.error(e); }
    })();

  </script>

  <script>
    // Toggle desplegable de modulos - colapsados por default, click en toda la card
    document.querySelectorAll('.card').forEach(card => {
      const h2 = card.querySelector('h2');
      const botones = card.querySelector('.botones');
      if (!h2 || !botones) return;
      h2.classList.add('collapsed');
      botones.classList.add('collapsed');
      card.style.cursor = 'pointer';
      card.addEventListener('click', (e) => {
        if (e.target.closest('.btn-opcion')) return;
        h2.classList.toggle('collapsed');
        botones.classList.toggle('collapsed');
      });
    });
  </script>
